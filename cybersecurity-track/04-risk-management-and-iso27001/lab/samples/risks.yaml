    vulnerability: No security review of the supplier
    likelihood: 3
    impact: 4
    owner: procurement
    treatment: transfer
    last_review: 2026-11-01
    review_days: 90
    controls:
      - {name: Cyber insurance and contract clause, impact_reduction: 1}
  - id: R-006
    asset: Admin accounts
