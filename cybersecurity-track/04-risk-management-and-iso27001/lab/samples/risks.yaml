# Synthetic risk register for a fictional company (Northwind Retail). Scales are 1-5.
risks:
  - id: R-001
    asset: Customer database (Oracle)
    threat: SQL injection from the public web app
    vulnerability: Legacy form builds SQL by string concatenation
    likelihood: 4
    impact: 5
    owner: db-lead
    treatment: mitigate
    last_review: 2026-10-20
    review_days: 90
    controls:
      - {name: Parameterized queries in code, likelihood_reduction: 2}
      - {name: Database activity monitoring, impact_reduction: 1}
  - id: R-002
    asset: Employee laptops
    threat: Ransomware via phishing email
    vulnerability: Users can run unsigned macros
    likelihood: 4
    impact: 4
    owner: it-ops
    treatment: mitigate
    last_review: 2026-05-02
    review_days: 90
    controls:
      - {name: Email filtering, likelihood_reduction: 1}
      - {name: Offline backups tested quarterly, impact_reduction: 1}
  - id: R-003
    asset: Cloud storage bucket
    threat: Public exposure of backups
    vulnerability: No policy blocking public access
    likelihood: 3
    impact: 5
    owner: ""
    treatment: mitigate
    last_review: 2026-09-01
    review_days: 90
    controls: []
  - id: R-004
    asset: Office Wi-Fi
    threat: Guest user reaches internal network
    vulnerability: Flat network, no segmentation
    likelihood: 3
    impact: 3
    owner: net-lead
    treatment: accept
    last_review: 2026-08-15
    review_days: 180
    controls: []
  - id: R-005
    asset: Payroll supplier
