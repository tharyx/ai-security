title: Member added to a privileged group
id: cyb06-0004
status: stable
description: A user was added to Domain Admins, Enterprise Admins, Schema Admins or Administrators (Windows 4728/4732/4756).
author: ai-security lab
tags: [attack.persistence, attack.privilege_escalation, attack.t1098]
level: high
logsource:
  product: windows
  service: security
detection:
  selection:
    action: group_add
    group:
      - Domain Admins
      - Enterprise Admins
      - Schema Admins
      - Administrators
  filter:
    user: svc-provisioning
  condition: selection and not filter
falsepositives:
  - The approved provisioning service account (filtered out). Keep this filter small and reviewed.
