title: Password spray - one source fails against many accounts
id: cyb06-0002
status: stable
description: One IP fails to sign in to at least 8 different accounts within 10 minutes (Entra ID).
author: ai-security lab
tags: [attack.credential_access, attack.t1110.003]
level: high
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    action: logon_failure
    source: entra
  condition: selection
aggregation:
  type: distinct_count
  field: user
  group_by: [src_ip]
  threshold: 8
  timeframe_minutes: 10
falsepositives:
  - Shared office NAT address where a few users mistype the password (usually fewer than 8 accounts)
