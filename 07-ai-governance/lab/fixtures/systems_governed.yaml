- id: AI-001
  name: InboxBot email summarizer
  business_owner: Head of Customer Support
  technical_owner: Support Platform team
  intended_use: Summarize inbound customer emails for support agents and draft replies to the original sender only.
  prohibited_uses: [sending to new recipients, bulk export of customer data]
  status: production
  declared_tier: high
  provider: LLM Vendor A
  model: vendor-a-chat-2025-06
  data_classes: [personal, internal]
  affected_people: [customers, support agents]
  use_domains: [customer_support]
  decision_impact: none
  tools:
    - {name: send_reply, side_effects: true}
  human_oversight: approve_each
  controls: [CTL-REG, CTL-AUP, CTL-TM, CTL-EVAL, CTL-LOG, CTL-PRIV, CTL-VEND, CTL-HO, CTL-MON, CTL-IR]
  last_review: 2026-09-15
  egress_domains: [api.llm-vendor-a.example]
  exceptions:
    - finding: GOV-05:CTL-RT
      reason: Red team booked for 2026-12-10; tool policy already tested in CI
      approved_by: CISO
      expires: 2027-01-31

