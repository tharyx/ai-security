# Secure reference deployment of the "ops assistant" AI platform on Google Cloud.
# Synthetic example for the lab. Service names: verify against current Google Cloud docs.
name: ops-assistant-gcp
cloud: gcp
environment: prod
data_classification: confidential
multi_tenant: true

components:
  - id: web
    type: frontend
    zone: public
    service: External Application Load Balancer + Cloud Armor + Cloud CDN
    public_network_access: true

  - id: ai-gateway
    type: ai_gateway
    zone: app
    service: Apigee (JWT verification, quotas) + gateway on Cloud Run
    identity: sa-gateway
    user_auth: oidc                   # Identity-Aware Proxy / workforce identity
    rate_limits: true
    token_budget: true
    guardrails:
      input: [prompt_attack, pii]     # Model Armor template
      output: [pii, secrets, url_allowlist]
    egress: deny_by_default

  - id: model
    type: model_endpoint
    zone: model
    service: Vertex AI (Gemini) via Private Service Connect, inside a VPC-SC perimeter
    public_network_access: false
    private_endpoint: true
    data_use:
      training_opt_out: true
      retention_reviewed: true        # data caching decision recorded

  - id: rag
    type: rag_service
    zone: app
    service: retrieval service on Cloud Run (internal ingress only)
    identity: sa-rag
    retrieval_authz: server_side

  - id: vectors
    type: vector_store
    zone: data
    service: Vertex AI Vector Search (PSC endpoint, namespace restricts per tenant)
    public_network_access: false
    private_endpoint: true
    encryption_key: kms-ai-data
    tenant_isolation: server_side_filter

  - id: docs
    type: object_store
    zone: data
    service: Cloud Storage (public access prevention, CMEK)
    public_network_access: false
    private_endpoint: true
    encryption_key: kms-ai-data

  - id: agent
    type: agent_runtime
    zone: app
    service: orchestrator on Cloud Run (ADK-based)
    identity: sa-agent
    approval_required_for: [write]
    limits: {max_steps: 8, max_cost_usd: 2.0}
    kill_switch: true
    egress: deny_by_default           # VPC egress deny + Secure Web Proxy allowlist

  - id: mcp-gateway
    type: mcp_gateway
    zone: tools
    service: tool broker on Cloud Run behind internal load balancer
    identity: sa-mcp
    tool_registry: allowlist
    egress: deny_by_default

  - id: tool-metrics
    type: tool
    zone: tools
    service: read-only Cloud Monitoring tool
    identity: sa-tool-metrics
    side_effects: read
    egress: deny_by_default

  - id: tool-change
    type: tool
    zone: tools
    service: change-request tool (creates a ticket only)
    identity: sa-tool-change
    side_effects: write
    egress: deny_by_default

  - id: audit-logs
    type: log_store
    zone: security
    service: Cloud Logging bucket with locked retention + sink to SIEM
    public_network_access: false
    encryption_key: kms-logs
    immutable: true
    retention_days: 400
    exports_to_siem: true             # Google SecOps or another SIEM

identities:
  - {id: sa-gateway, credential: short_lived, permissions: ["modelarmor.templates.useToSanitize"]}
  - {id: sa-rag, credential: short_lived, permissions: ["roles/aiplatform.user on vector index"]}
  - {id: sa-agent, credential: short_lived, permissions: ["roles/aiplatform.user on approved endpoint"]}
  - {id: sa-mcp, credential: short_lived, permissions: ["roles/datastore.viewer on tool-registry"]}
  - {id: sa-tool-metrics, credential: short_lived, permissions: ["roles/monitoring.viewer"]}
  - {id: sa-tool-change, credential: short_lived, permissions: ["ticketing.create_change"]}
  - {id: wif-github-deploy, kind: ci, credential: short_lived, permissions: ["roles/run.developer on ops-assistant"]}

keys:
  - {id: kms-ai-data, managed_by: customer, rotation: true}
  - {id: kms-logs, managed_by: customer, rotation: true}

secrets:
  store: gcp-secret-manager
  inline: []

logging:
  control_plane_audit: true           # Admin Activity (always on)
  model_invocation_logs: true         # Data Access audit logs enabled for aiplatform.googleapis.com
  prompt_redaction: true
  sink: audit-logs

flows:
  - {from: internet, to: web}
  - {from: web, to: ai-gateway}
  - {from: ai-gateway, to: rag}
  - {from: rag, to: vectors}
  - {from: rag, to: docs}
  - {from: ai-gateway, to: agent}
  - {from: agent, to: model}
  - {from: agent, to: mcp-gateway}
  - {from: mcp-gateway, to: tool-metrics}
  - {from: mcp-gateway, to: tool-change}
  - {from: ai-gateway, to: audit-logs}
  - {from: mcp-gateway, to: audit-logs}

exceptions: []
