[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisec-lab"
version = "0.1.0"
description = "Shared helpers for the AI security engineering roadmap labs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pip-audit>=2.7"]

[tool.setuptools]
packages = ["aisec_lab"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["aisec_lab", "01-ai-security-fundamentals", "02-llm-security", "03-rag-security", "04-mcp-security", "05-agent-security", "06-ai-devsecops", "07-ai-governance", "08-ai-compliance", "09-enterprise-architecture", "10-capstone-project", "cybersecurity-track", "caisp-course"]
