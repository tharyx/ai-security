# SECURE release workflow for the model-serving image.
#
# The 40-character commit SHAs below are PLACEHOLDERS (obviously fake). Pin each action to the
# real commit of the release you reviewed, keep the tag in a comment, and let Dependabot or
# Renovate propose updates. Example to look one up:
#   gh api repos/actions/checkout/commits/v4 --jq .sha
name: release-model-server

on:
  push:
    branches: [main]

# FIX (GHA-002): read-only by default; each job asks only for what it needs.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------ 1. verify: no secrets here at all
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111 # v4
        with:
          persist-credentials: false            # FIX (GHA-008)
      - uses: actions/setup-python@2222222222222222222222222222222222222222 # v5
        with:
          python-version: "3.11"

      - name: Secret scan
        uses: gitleaks/gitleaks-action@3333333333333333333333333333333333333333 # v2

      - name: Install pinned dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements.lock

      - name: SAST
        run: bandit -r src -ll

      - name: Dependency audit
        run: pip-audit -r requirements.lock --strict

      - name: Model file scan (no pickle, no unknown globals)
        run: python 06-ai-devsecops/docker/lab/pickle_scan.py model/support-llm-v3.safetensors

      # FIX (GHA-006): the AI eval is blocking. A failure stops the release.
      - name: AI security eval (prompt-injection regression suite)
        run: python -m pytest 02-llm-security/prompt-injection --junitxml=reports/prompt_injection.xml

      - name: AI release gate (AI-BOM + eval evidence)
        run: >-
          python 06-ai-devsecops/cicd/lab/release_gate.py
          --bom model/ai-bom.json --eval reports/eval-report.json
          --junit reports/prompt_injection.xml --suite prompt_injection
          --model-file model/support-llm-v3.safetensors

  # ------------------------------------------------------------ 2. build, SBOM, sign, attest
  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # keyless signing (Sigstore) and provenance
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@4444444444444444444444444444444444444444 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@5555555555555555555555555555555555555555 # v6
        with:
          push: true
          tags: ghcr.io/acme/support-llm:${{ github.sha }}
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@6666666666666666666666666666666666666666 # v0
        with:
          image: ghcr.io/acme/support-llm@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
      - uses: sigstore/cosign-installer@7777777777777777777777777777777777777777 # v3
      - name: Sign the image by digest (keyless, OIDC identity of this workflow)
        run: cosign sign --yes "ghcr.io/acme/support-llm@${{ steps.build.outputs.digest }}"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@8888888888888888888888888888888888888888 # v1
        with:
          subject-name: ghcr.io/acme/support-llm
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ------------------------------------------------------------ 3. deploy: approval + OIDC
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production     # FIX (GHA-010): required reviewers + branch rules live here
    permissions:
      contents: read
      id-token: write           # FIX (GHA-005): short-lived AWS credentials through OIDC
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111 # v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@9999999999999999999999999999999999999999 # v4
        with:
          role-to-assume: arn:aws:iam::111122223333:role/ci-oidc-deployer
          aws-region: eu-west-1
      - uses: sigstore/cosign-installer@7777777777777777777777777777777777777777 # v3
      - name: Verify signature before deploying
        run: >-
          cosign verify "ghcr.io/acme/support-llm@${{ needs.build.outputs.digest }}"
          --certificate-identity-regexp "^https://github.com/acme/support-llm/.github/workflows/release.yml@refs/heads/main$"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Deploy by digest
        run: ./scripts/deploy.sh "${{ needs.build.outputs.digest }}"
