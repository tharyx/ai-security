apiVersion: v1
kind: Pod
metadata:
  name: app-env
  namespace: shop
spec:
  containers:
    - name: app
      image: registry.corp.example/shop/app:1.0
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: db-credentials, key: password}
      envFrom:
        - secretRef: {name: db-credentials}
---
apiVersion: v1
kind: Pod
metadata:
  name: app-volume
  namespace: shop
spec:
  containers:
    - name: app
      image: registry.corp.example/shop/app:1.0
      volumeMounts:
        - name: creds
          mountPath: /etc/creds
          readOnly: true
  volumes:
    - name: creds
      secret:
        secretName: db-credentials
        defaultMode: 0400
