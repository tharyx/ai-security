# Break-build thresholds: the maximum number of findings allowed per severity (after dedup and waivers).
break_build:
  critical: 0
  high: 0
  medium: 5
  low: 50
# Create a ticket for every NEW finding at or above this severity.
ticket_min_severity: medium
# Days to fix, by severity (an SLA you agree with the teams).
sla_days: {critical: 7, high: 30, medium: 90, low: 180}
# Accepted risks. A waiver stops a finding from counting, but ONLY until it expires.
waivers:
  - rule: js-weak-random
    location: src/reset.js
    reason: "Replaced by a library call in sprint 24; code is behind a feature flag meanwhile"
    expires: 2026-12-31
  - rule: "10036"
    location: /
    reason: "Banner removed at the load balancer in Q1"
    expires: 2026-01-31
