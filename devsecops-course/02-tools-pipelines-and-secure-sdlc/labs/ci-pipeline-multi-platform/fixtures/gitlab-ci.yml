# .gitlab-ci.yml (fixture). The SAME secure pipeline as the other four files, GitLab syntax.
# Image tags are examples: pin the versions you really use (digests are even better).
stages: [secrets, sca, sast, build, image-scan, dast, deploy]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  image: node:20.11.1-alpine3.19
  interruptible: true

secrets-scan:
  stage: secrets
  image: zricethezav/gitleaks:v8.18.2
  script:
    - gitleaks detect --source . --no-banner --redact

sca:
  stage: sca
  script:
    - npm ci --ignore-scripts
    - npm audit --audit-level=high

sast:
  stage: sast
  image: semgrep/semgrep:1.56.0
  script:
    - semgrep scan --config p/owasp-top-ten --error --sarif -o semgrep.sarif
  artifacts:
    when: always
    paths: [semgrep.sarif]

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.19.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

image-scan:
  stage: image-scan
  image:
    name: aquasec/trivy:0.49.1
    entrypoint: [""]
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

dast:
  stage: dast
  image: ghcr.io/zaproxy/zaproxy:2.14.0
  services:
    - name: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      alias: app
  script:
    - zap-baseline.py -t http://app:3000 -I

deploy:
  stage: deploy
  image: bitnami/kubectl:1.29.1
  environment: staging
  id_tokens:
    CLOUD_ID_TOKEN:
      aud: https://cloud.example
  script:
    - ./deploy.sh staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
