<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Where a secret can leak depending on how it is delivered: baked in image, environment variable, mounted file, fetched at runtime</title>
  <rect width="1200" height="540" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a">Four ways to deliver a secret to a container, and who can see it</text>
  <text x="40" y="70" font-size="15" fill="#475569">Pick the delivery that shrinks the audience and the lifetime. Teaching summary; real exposure depends on your setup.</text>

  <rect x="40" y="96" width="270" height="64" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="175" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Delivery</text>
  <rect x="310" y="96" width="560" height="64" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="590" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Where it leaks</text>
  <rect x="870" y="96" width="290" height="64" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1015" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Verdict</text>

  <rect x="40" y="160" width="270" height="80" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="175" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">1. Baked into the image</text>
  <text x="175" y="214" text-anchor="middle" font-size="12" fill="#0f172a">ENV, ARG, COPY .env, RUN echo</text>
  <rect x="310" y="160" width="560" height="80" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="325" y="192" font-size="13" fill="#0f172a">image config and history, every layer, registry readers, caches,</text>
  <text x="325" y="214" font-size="13" fill="#0f172a">mirrors, forever. Deleting in a later layer does not remove it.</text>
  <rect x="870" y="160" width="290" height="80" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1015" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Never. Rotate if it happened.</text>

  <rect x="40" y="240" width="270" height="80" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="175" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">2. Environment variable</text>
  <text x="175" y="294" text-anchor="middle" font-size="12" fill="#0f172a">docker run -e, compose environment</text>
  <rect x="310" y="240" width="560" height="80" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="325" y="272" font-size="13" fill="#0f172a">docker inspect, /proc/PID/environ, child processes, crash dumps,</text>
  <text x="325" y="294" font-size="13" fill="#0f172a">debug endpoints, startup logs, orchestrator manifests and UIs.</text>
  <rect x="870" y="240" width="290" height="80" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="1015" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Avoid for real secrets.</text>

  <rect x="40" y="320" width="270" height="80" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="175" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">3. File on tmpfs</text>
  <text x="175" y="374" text-anchor="middle" font-size="12" fill="#0f172a">Docker secret, K8s Secret volume, CSI</text>
  <rect x="310" y="320" width="560" height="80" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="325" y="352" font-size="13" fill="#0f172a">only the container's own file system view (mode 0400), not in the</text>
  <text x="325" y="374" font-size="13" fill="#0f172a">image, not in inspect output; still readable by the app and by root on the host.</text>
  <rect x="870" y="320" width="290" height="80" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1015" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Good default. App reads NAME_FILE.</text>

  <rect x="40" y="400" width="270" height="80" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="175" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">4. Fetch at runtime</text>
  <text x="175" y="454" text-anchor="middle" font-size="12" fill="#0f172a">Vault/OpenBao, cloud secret manager</text>
  <rect x="310" y="400" width="560" height="80" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="325" y="432" font-size="13" fill="#0f172a">only memory of the app; a short-lived identity authenticates; dynamic</text>
  <text x="325" y="454" font-size="13" fill="#0f172a">credentials expire on their own; every read is audited centrally.</text>
  <rect x="870" y="400" width="290" height="80" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1015" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Best for scale and rotation.</text>

  <text x="40" y="515" font-size="13" fill="#475569">Whatever you choose: scan images and compose files, keep secrets out of logs, and rotate every secret that ever leaked.</text>
</svg>
