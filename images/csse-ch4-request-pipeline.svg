<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The Kubernetes API request pipeline and where it is attacked</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">Every API request walks the same pipeline</text>
  <text x="40" y="74" font-size="16" fill="#475569">kubectl, controllers, kubelets and pods all call the kube-apiserver. Each gate can be strong or weak.</text>

  <rect x="40" y="110" width="170" height="120" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="60" y="142" font-size="17" font-weight="700" fill="#0f172a">Client</text>
  <text x="60" y="168" font-size="14" fill="#334155">user, SA token,</text>
  <text x="60" y="188" font-size="14" fill="#334155">kubelet, CI, pod</text>

  <rect x="250" y="110" width="170" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="270" y="142" font-size="17" font-weight="700" fill="#1e3a8a">1 Authn</text>
  <text x="270" y="168" font-size="14" fill="#1e3a8a">Who are you?</text>
  <text x="270" y="188" font-size="14" fill="#1e3a8a">certs, OIDC, tokens</text>
  <text x="270" y="208" font-size="14" fill="#1e3a8a">anonymous?</text>

  <rect x="460" y="110" width="170" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="480" y="142" font-size="17" font-weight="700" fill="#1e3a8a">2 Authz</text>
  <text x="480" y="168" font-size="14" fill="#1e3a8a">May you do this?</text>
  <text x="480" y="188" font-size="14" fill="#1e3a8a">RBAC (Node,</text>
  <text x="480" y="208" font-size="14" fill="#1e3a8a">Webhook, ABAC)</text>

  <rect x="670" y="110" width="170" height="120" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="690" y="142" font-size="17" font-weight="700" fill="#92400e">3 Mutating</text>
  <text x="690" y="168" font-size="14" fill="#92400e">admission</text>
  <text x="690" y="188" font-size="14" fill="#92400e">defaults, sidecars,</text>
  <text x="690" y="208" font-size="14" fill="#92400e">webhooks</text>

  <rect x="880" y="110" width="140" height="120" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="898" y="142" font-size="17" font-weight="700" fill="#0f172a">Schema</text>
  <text x="898" y="168" font-size="14" fill="#334155">object validation</text>

  <rect x="1050" y="110" width="120" height="120" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="1064" y="142" font-size="17" font-weight="700" fill="#92400e">4 Validating</text>
  <text x="1064" y="168" font-size="14" fill="#92400e">PSA, VAP,</text>
  <text x="1064" y="188" font-size="14" fill="#92400e">Kyverno,</text>
  <text x="1064" y="208" font-size="14" fill="#92400e">Gatekeeper</text>

  <path d="M210 170 L246 170" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M420 170 L456 170" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M630 170 L666 170" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M840 170 L876 170" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1020 170 L1046 170" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <text x="600" y="265" font-size="15" fill="#334155" text-anchor="middle">then persisted in etcd (encrypt Secrets at rest) and acted on by controllers and kubelets</text>

  <rect x="40" y="300" width="1120" height="230" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="332" font-size="18" font-weight="700" fill="#991b1b">Typical weaknesses at each gate</text>
  <g font-size="15" fill="#7f1d1d">
    <text x="60" y="364">Authn: anonymous-auth on; leaked kubeconfig or long-lived SA token; kubelet 10250 open</text>
    <text x="60" y="390">Authz: wildcard verbs, secrets list, pods/exec, nodes/proxy, escalate / bind / impersonate, cluster-admin to apps</text>
    <text x="60" y="416">Mutating: a malicious or compromised webhook rewrites objects (adds a container, env, hostPath) before validation</text>
    <text x="60" y="442">Validating: failurePolicy Ignore (an outage bypasses the check), namespace exemptions, plain-HTTP webhook URLs, wide timeouts</text>
    <text x="60" y="468">Policy engines: PodSecurityPolicy was removed in 1.25. Use Pod Security Admission, ValidatingAdmissionPolicy (CEL), Kyverno or Gatekeeper</text>
    <text x="60" y="504">Defender view: audit logs record who did what; admission blocks bad objects before they exist.</text>
  </g>
</svg>
