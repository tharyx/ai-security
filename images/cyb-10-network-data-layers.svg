<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Layers around cloud data</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1200" height="520" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Layers around cloud data</text>
<text x="40" y="80" font-size="16" fill="#475569">Internet-facing edge, private application tier, private endpoint to data, encrypted with keys you control.</text>
<rect x="40" y="150" width="170" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="125.0" y="195.0" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Internet</text>
<text x="125.0" y="215.0" text-anchor="middle" font-size="13" fill="#475569">users and</text>
<text x="125.0" y="233.0" text-anchor="middle" font-size="13" fill="#475569">attackers</text>
<rect x="260" y="150" width="190" height="120" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="355.0" y="195.0" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Public subnet</text>
<text x="355.0" y="215.0" text-anchor="middle" font-size="13" fill="#475569">WAF + load balancer</text>
<text x="355.0" y="233.0" text-anchor="middle" font-size="13" fill="#475569">only 443 open</text>
<rect x="500" y="150" width="190" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="595.0" y="195.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Private subnet</text>
<text x="595.0" y="215.0" text-anchor="middle" font-size="13" fill="#475569">app servers</text>
<text x="595.0" y="233.0" text-anchor="middle" font-size="13" fill="#475569">SG: only from LB</text>
<rect x="740" y="150" width="190" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="835.0" y="195.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Private endpoint</text>
<text x="835.0" y="215.0" text-anchor="middle" font-size="13" fill="#475569">no public route</text>
<text x="835.0" y="233.0" text-anchor="middle" font-size="13" fill="#475569">to the data service</text>
<rect x="980" y="150" width="180" height="120" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1070.0" y="195.0" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Data store</text>
<text x="1070.0" y="215.0" text-anchor="middle" font-size="13" fill="#475569">S3 / SQL / DB</text>
<text x="1070.0" y="233.0" text-anchor="middle" font-size="13" fill="#475569">block public access</text>
<line x1="210" y1="210" x2="260" y2="210" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="450" y1="210" x2="500" y2="210" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="690" y1="210" x2="740" y2="210" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="930" y1="210" x2="980" y2="210" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="500" y="340" width="190" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="595.0" y="374.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">KMS / Key Vault</text>
<text x="595.0" y="394.0" text-anchor="middle" font-size="13" fill="#475569">keys, rotation, audit</text>
<line x1="595" y1="340" x2="1000" y2="275" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<text x="797.5" y="299.5" text-anchor="middle" font-size="12" fill="#475569">encrypt at rest</text>
<text x="40" y="330" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">Security group / NSG = stateful allow list</text>
<text x="40" y="352" text-anchor="start" font-size="14" fill="#475569">NACL = stateless subnet filter</text>
<text x="40" y="374" text-anchor="start" font-size="14" fill="#475569">Flow logs record accepted and rejected traffic</text>
<text x="40" y="470" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">Default rule: nothing public unless a named owner asked for it.</text>
</svg>