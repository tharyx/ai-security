<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>AI application security architecture (Domain A reference)</title>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">AI application security architecture (Domain A reference)</text>
  <text x="40" y="80" font-size="16" fill="#475569">IAM, secrets, network isolation, logging, encryption and runtime protection around one LLM application.</text>
  <rect x="40" y="210" width="150" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="54" y="234" font-size="15" font-weight="700" fill="#991b1b">Users</text>
  <text x="54" y="254" font-size="12" fill="#991b1b">browser, mobile,</text>
  <text x="54" y="271" font-size="12" fill="#991b1b">partner APIs</text>
  <rect x="230" y="130" width="200" height="230" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="244" y="154" font-size="15" font-weight="700" fill="#166534">AI gateway + WAF</text>
  <text x="244" y="174" font-size="12" fill="#166534">SSO + MFA (OIDC)</text>
  <text x="244" y="191" font-size="12" fill="#166534">rate limits, quotas</text>
  <text x="244" y="208" font-size="12" fill="#166534">token budgets</text>
  <text x="244" y="225" font-size="12" fill="#166534">DLP and redaction</text>
  <text x="244" y="242" font-size="12" fill="#166534">injection detector</text>
  <text x="244" y="259" font-size="12" fill="#166534">(soft, alerts only)</text>
  <text x="244" y="276" font-size="12" fill="#166534">kill switch per tenant</text>
  <line x1="190" y1="255" x2="228" y2="255" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="110" width="590" height="400" rx="12" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="485" y="132" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Private network (VPC / VNet): no public IPs, deny-by-default</text>
  <rect x="490" y="150" width="170" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="504" y="174" font-size="15" font-weight="700" fill="#92400e">Orchestrator</text>
  <text x="504" y="194" font-size="12" fill="#92400e">builds prompts,</text>
  <text x="504" y="211" font-size="12" fill="#92400e">runs the tool loop</text>
  <rect x="690" y="150" width="350" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="704" y="174" font-size="15" font-weight="700" fill="#1e3a8a">Model endpoint</text>
  <text x="704" y="194" font-size="12" fill="#1e3a8a">private endpoint to a cloud AI service,</text>
  <text x="704" y="211" font-size="12" fill="#1e3a8a">or a self-hosted GPU pool on Kubernetes</text>
  <rect x="490" y="270" width="170" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="504" y="294" font-size="13" font-weight="700" fill="#334155">Retriever + vector DB</text>
  <text x="504" y="314" font-size="12" fill="#334155">tenant + ACL filter,</text>
  <text x="504" y="331" font-size="12" fill="#334155">encrypted at rest</text>
  <rect x="690" y="270" width="160" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="704" y="294" font-size="15" font-weight="700" fill="#166534">Tool broker</text>
  <text x="704" y="314" font-size="12" fill="#166534">schema, authz as user,</text>
  <text x="704" y="331" font-size="12" fill="#166534">approval for actions</text>
  <rect x="870" y="270" width="170" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="884" y="294" font-size="15" font-weight="700" fill="#166534">Egress proxy</text>
  <text x="884" y="314" font-size="12" fill="#166534">allowlisted domains,</text>
  <text x="884" y="331" font-size="12" fill="#166534">no metadata IPs</text>
  <rect x="490" y="400" width="170" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="504" y="424" font-size="15" font-weight="700" fill="#334155">Model registry</text>
  <text x="504" y="444" font-size="12" fill="#334155">signed, scanned,</text>
  <text x="504" y="461" font-size="12" fill="#334155">safe formats only</text>
  <rect x="690" y="400" width="160" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="704" y="424" font-size="15" font-weight="700" fill="#334155">Internal APIs</text>
  <text x="704" y="444" font-size="12" fill="#334155">CRM, tickets, called</text>
  <text x="704" y="461" font-size="12" fill="#334155">with user tokens</text>
  <rect x="870" y="400" width="170" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="884" y="424" font-size="15" font-weight="700" fill="#334155">Audit logs</text>
  <text x="884" y="444" font-size="12" fill="#334155">redacted, to SIEM,</text>
  <text x="884" y="461" font-size="12" fill="#334155">access restricted</text>
  <rect x="1075" y="270" width="100" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1089" y="294" font-size="14" font-weight="700" fill="#991b1b">Internet</text>
  <text x="1089" y="314" font-size="12" fill="#991b1b">third-party</text>
  <text x="1089" y="331" font-size="12" fill="#991b1b">APIs, web</text>
  <line x1="430" y1="190" x2="488" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="660" y1="190" x2="688" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="575" y1="230" x2="575" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="770" y1="230" x2="770" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="850" y1="310" x2="868" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1040" y1="310" x2="1073" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="770" y1="350" x2="770" y2="398" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="575" y1="398" x2="575" y2="352" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="585" y="383" font-size="12" font-weight="400" fill="#475569" text-anchor="start">load</text>
  <line x1="955" y1="350" x2="955" y2="398" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <rect x="40" y="545" width="270" height="105" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="54" y="569" font-size="15" font-weight="700" fill="#166534">IAM</text>
  <text x="54" y="589" font-size="13" fill="#166534">workload identity per service;</text>
  <text x="54" y="606" font-size="13" fill="#166534">delegated, scoped user tokens</text>
  <rect x="325" y="545" width="270" height="105" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="339" y="569" font-size="15" font-weight="700" fill="#166534">Secrets</text>
  <text x="339" y="589" font-size="13" fill="#166534">vault / secrets manager, short-</text>
  <text x="339" y="606" font-size="13" fill="#166534">lived creds, none in prompts</text>
  <rect x="610" y="545" width="270" height="105" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="624" y="569" font-size="15" font-weight="700" fill="#166534">Encryption</text>
  <text x="624" y="589" font-size="13" fill="#166534">TLS on every hop; KMS keys for</text>
  <text x="624" y="606" font-size="13" fill="#166534">vector DB, logs and models</text>
  <rect x="895" y="545" width="270" height="105" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="909" y="569" font-size="15" font-weight="700" fill="#166534">Runtime protection</text>
  <text x="909" y="589" font-size="13" fill="#166534">anomaly alerts on tokens and</text>
  <text x="909" y="606" font-size="13" fill="#166534">tool calls; abuse detection</text>
  <text x="40" y="533" font-size="14" font-weight="700" fill="#166534" text-anchor="start">Cross-cutting controls (apply to every box above):</text>
</svg>
