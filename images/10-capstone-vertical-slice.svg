<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Capstone lab: one request through every layer</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Capstone lab: one request through every layer</text>
  <text x="40" y="80" font-size="16" fill="#475569" text-anchor="start">lab/ops_assistant.py composes the patterns from Modules 02-06. Each attack is stopped by deterministic code.</text>
  <rect x="40" y="250" width="128" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="104.0" y="290.0" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">1 Identity</text>
  <text x="104.0" y="307.0" font-size="12" fill="#166534" text-anchor="middle">verify HMAC</text>
  <text x="104.0" y="324.0" font-size="12" fill="#166534" text-anchor="middle">+ expiry</text>
  <rect x="182" y="250" width="128" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="246.0" y="290.0" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">2 Rate limit</text>
  <text x="246.0" y="307.0" font-size="12" fill="#166534" text-anchor="middle">per user</text>
  <text x="246.0" y="324.0" font-size="12" fill="#166534" text-anchor="middle">per minute</text>
  <path d="M168 302 L180 302" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="324" y="250" width="128" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="388.0" y="290.0" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">3 Retrieval</text>
  <text x="388.0" y="307.0" font-size="12" fill="#166534" text-anchor="middle">ACL filter</text>
  <text x="388.0" y="324.0" font-size="12" fill="#166534" text-anchor="middle">then rank</text>
  <path d="M310 302 L322 302" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="466" y="250" width="128" height="104" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="530.0" y="290.0" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">4 Spotlight</text>
  <text x="530.0" y="307.0" font-size="12" fill="#92400e" text-anchor="middle">datamark +</text>
  <text x="530.0" y="324.0" font-size="12" fill="#92400e" text-anchor="middle">detect (soft)</text>
  <path d="M452 302 L464 302" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="608" y="250" width="128" height="104" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="672.0" y="290.0" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">LLM</text>
  <text x="672.0" y="307.0" font-size="12" fill="#1e3a8a" text-anchor="middle">MockLLM:</text>
  <text x="672.0" y="324.0" font-size="12" fill="#1e3a8a" text-anchor="middle">assume fooled</text>
  <path d="M594 302 L606 302" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="750" y="250" width="128" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="814.0" y="281.5" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">5 Tool broker</text>
  <text x="814.0" y="298.5" font-size="12" fill="#166534" text-anchor="middle">registry · schema</text>
  <text x="814.0" y="315.5" font-size="12" fill="#166534" text-anchor="middle">role · tenant</text>
  <text x="814.0" y="332.5" font-size="12" fill="#166534" text-anchor="middle">approval · kill</text>
  <path d="M736 302 L748 302" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="892" y="250" width="128" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="956.0" y="290.0" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">6 Loop guard</text>
  <text x="956.0" y="307.0" font-size="12" fill="#166534" text-anchor="middle">repeat stop</text>
  <text x="956.0" y="324.0" font-size="12" fill="#166534" text-anchor="middle">max steps</text>
  <path d="M878 302 L890 302" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="1034" y="250" width="128" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1098.0" y="290.0" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">7 Output DLP</text>
  <text x="1098.0" y="307.0" font-size="12" fill="#166534" text-anchor="middle">redact</text>
  <text x="1098.0" y="324.0" font-size="12" fill="#166534" text-anchor="middle">secrets</text>
  <path d="M1020 302 L1032 302" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="146" width="128" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="104.0" y="166.0" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Attack</text>
  <text x="104.0" y="182.5" font-size="11.5" fill="#991b1b" text-anchor="middle">forged token</text>
  <text x="104.0" y="199.0" font-size="11.5" fill="#991b1b" text-anchor="middle">expired token</text>
  <path d="M104.0 210 L104.0 248" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <rect x="182" y="146" width="128" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="246.0" y="166.0" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Attack</text>
  <text x="246.0" y="182.5" font-size="11.5" fill="#991b1b" text-anchor="middle">request flood</text>
  <text x="246.0" y="199.0" font-size="11.5" fill="#991b1b" text-anchor="middle">(30 / minute)</text>
  <path d="M246.0 210 L246.0 248" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <rect x="324" y="146" width="128" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="388.0" y="166.0" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Attack</text>
  <text x="388.0" y="182.5" font-size="11.5" fill="#991b1b" text-anchor="middle">cross-tenant doc</text>
  <text x="388.0" y="199.0" font-size="11.5" fill="#991b1b" text-anchor="middle">HR-only doc</text>
  <path d="M388.0 210 L388.0 248" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <rect x="466" y="146" width="128" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="530.0" y="166.0" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Attack</text>
  <text x="530.0" y="182.5" font-size="11.5" fill="#991b1b" text-anchor="middle">indirect injection</text>
  <text x="530.0" y="199.0" font-size="11.5" fill="#991b1b" text-anchor="middle">in a wiki page</text>
  <path d="M530.0 210 L530.0 248" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <rect x="750" y="112" width="128" height="98" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="814.0" y="132.5" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Attack</text>
  <text x="814.0" y="149.0" font-size="11.5" fill="#991b1b" text-anchor="middle">unregistered tool</text>
  <text x="814.0" y="165.5" font-size="11.5" fill="#991b1b" text-anchor="middle">viewer writes</text>
  <text x="814.0" y="182.0" font-size="11.5" fill="#991b1b" text-anchor="middle">other tenant's svc</text>
  <text x="814.0" y="198.5" font-size="11.5" fill="#991b1b" text-anchor="middle">injected rollback</text>
  <path d="M814.0 210 L814.0 248" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <rect x="892" y="146" width="128" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="956.0" y="166.0" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Attack</text>
  <text x="956.0" y="182.5" font-size="11.5" fill="#991b1b" text-anchor="middle">agent loop</text>
  <text x="956.0" y="199.0" font-size="11.5" fill="#991b1b" text-anchor="middle">(runaway cost)</text>
  <path d="M956.0 210 L956.0 248" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <rect x="1034" y="163" width="128" height="47" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1098.0" y="182.75" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Attack</text>
  <text x="1098.0" y="199.25" font-size="11.5" fill="#991b1b" text-anchor="middle">pasted API key</text>
  <path d="M1098.0 210 L1098.0 248" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <rect x="40" y="390" width="1120" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="600.0" y="413.0" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">8 Audit log (every step, one correlation ID)</text>
  <text x="600.0" y="430.5" font-size="12.5" fill="#334155" text-anchor="middle">request · retrieval (docs, untrusted, acl_filtered) · possible_injection · tool_denied / tool_executed · loop_stopped · response</text>
  <text x="600.0" y="448.0" font-size="12.5" fill="#334155" text-anchor="middle">values redacted BEFORE writing · each entry stores the hash of the previous one, so edits are detectable</text>
  <path d="M104.0 354 L104.0 388" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <path d="M246.0 354 L246.0 388" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <path d="M388.0 354 L388.0 388" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <path d="M530.0 354 L530.0 388" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <path d="M672.0 354 L672.0 388" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <path d="M814.0 354 L814.0 388" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <path d="M956.0 354 L956.0 388" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <path d="M1098.0 354 L1098.0 388" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <rect x="40" y="480" width="540" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="310.0" y="514.75" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">HARD layers (tests run with soft layers OFF)</text>
  <text x="310.0" y="532.25" font-size="12.5" fill="#166534" text-anchor="middle">identity · rate limit · retrieval ACL · broker · loop guard · DLP · audit</text>
  <rect x="620" y="480" width="540" height="76" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="890.0" y="514.75" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">SOFT layers (lower the odds, never trusted)</text>
  <text x="890.0" y="532.25" font-size="12.5" fill="#92400e" text-anchor="middle">spotlighting (datamarking) · injection heuristics</text>
  <text x="40" y="585" font-size="13" fill="#475569" text-anchor="start">Run: python 10-capstone-project/lab/demo.py   Tests: python -m pytest 10-capstone-project</text>
</svg>
