<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The LLM red-team loop: scope, threat-led plan, attack library, N runs, measure, fix, regression in CI</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="580" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">The LLM red-team loop</text>
  <text x="40" y="80" font-size="16" fill="#475569">Red teaming is not a one-off pen test. Every change to the model, prompt, tools or guardrails goes around the loop again.</text>

  <!-- top row -->
  <rect x="60" y="115" width="300" height="115" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="210" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">1. Scope + rules</text>
  <text x="210" y="172" text-anchor="middle" font-size="13" fill="#475569">system, versions, environments</text>
  <text x="210" y="192" text-anchor="middle" font-size="13" fill="#475569">in/out of scope, data handling,</text>
  <text x="210" y="212" text-anchor="middle" font-size="13" fill="#475569">stop conditions, sign-off</text>

  <rect x="450" y="115" width="300" height="115" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">2. Threat-led test plan</text>
  <text x="600" y="172" text-anchor="middle" font-size="13" fill="#475569">from the threat model: assets,</text>
  <text x="600" y="192" text-anchor="middle" font-size="13" fill="#475569">attackers, OWASP/ATLAS mapping,</text>
  <text x="600" y="212" text-anchor="middle" font-size="13" fill="#475569">impact-based success criteria</text>

  <rect x="840" y="115" width="300" height="115" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="990" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">3. Attack library</text>
  <text x="990" y="172" text-anchor="middle" font-size="13" fill="#991b1b">YAML cases: payload, objective,</text>
  <text x="990" y="192" text-anchor="middle" font-size="13" fill="#991b1b">severity, detector; variants;</text>
  <text x="990" y="212" text-anchor="middle" font-size="13" fill="#991b1b">tools: garak, PyRIT, promptfoo</text>

  <!-- bottom row -->
  <rect x="840" y="330" width="300" height="115" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="990" y="363" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">4. Run N times</text>
  <text x="990" y="387" text-anchor="middle" font-size="13" fill="#1e3a8a">fresh target per run, seeded,</text>
  <text x="990" y="407" text-anchor="middle" font-size="13" fill="#1e3a8a">plus benign cases for utility;</text>
  <text x="990" y="427" text-anchor="middle" font-size="13" fill="#1e3a8a">automated + human creativity</text>

  <rect x="450" y="330" width="300" height="115" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="363" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">5. Measure</text>
  <text x="600" y="387" text-anchor="middle" font-size="13" fill="#1e3a8a">attack success rate per category</text>
  <text x="600" y="407" text-anchor="middle" font-size="13" fill="#1e3a8a">+ 95% upper bound,</text>
  <text x="600" y="427" text-anchor="middle" font-size="13" fill="#1e3a8a">false-refusal rate, cost</text>

  <rect x="60" y="330" width="300" height="115" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="210" y="363" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">6. Fix + regression gate</text>
  <text x="210" y="387" text-anchor="middle" font-size="13" fill="#166534">fix the hard layer first;</text>
  <text x="210" y="407" text-anchor="middle" font-size="13" fill="#166534">every finding becomes a test;</text>
  <text x="210" y="427" text-anchor="middle" font-size="13" fill="#166534">CI fails if ASR &gt; threshold</text>

  <!-- arrows -->
  <path d="M360 172 L444 172" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M750 172 L834 172" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M990 230 L990 324" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M840 387 L756 387" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M450 387 L366 387" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M210 330 L210 236" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <text x="600" y="275" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Grade by impact, not by refusal</text>
  <text x="600" y="298" text-anchor="middle" font-size="13" fill="#475569">"no canary leaked, no tool ran, no tokens burned" beats "the model said no"</text>

  <!-- triggers -->
  <rect x="60" y="475" width="1080" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="503" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Re-enter the loop when:</text>
  <text x="600" y="527" text-anchor="middle" font-size="14" fill="#92400e">the model or provider changes · a prompt changes · a tool is added · a new attack is published · an incident happens</text>
</svg>
