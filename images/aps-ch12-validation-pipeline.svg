<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Injection defences along the request path</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="520" fill="#ffffff"/>
<text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Injection defences along the request path</text>
<text x="40" y="74" font-size="15" fill="#475569">Validate at the door, parameterize at every interpreter, encode at every output. No single layer is enough.</text>
<rect x="40" y="120" width="160" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="120" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Untrusted input</text>
<text x="120" y="178" text-anchor="middle" font-size="12" fill="#7f1d1d">path, query, headers,</text>
<text x="120" y="195" text-anchor="middle" font-size="12" fill="#7f1d1d">JSON, files, 3rd-party APIs</text>
<line x1="200" y1="165" x2="238" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="240" y="120" width="210" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="345" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">1 Validate (server)</text>
<text x="345" y="172" text-anchor="middle" font-size="12" fill="#1e3a8a">schema, type, length, range</text>
<text x="345" y="190" text-anchor="middle" font-size="12" fill="#1e3a8a">allowlist, fullmatch, reject 422</text>
<line x1="450" y1="165" x2="488" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="490" y="120" width="210" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="595" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">2 Sanitize (if needed)</text>
<text x="595" y="172" text-anchor="middle" font-size="12" fill="#334155">NFKC, strip control chars,</text>
<text x="595" y="190" text-anchor="middle" font-size="12" fill="#334155">HTML allowlist sanitizer</text>
<line x1="700" y1="165" x2="738" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="740" y="120" width="200" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="840" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Business logic</text>
<text x="840" y="178" text-anchor="middle" font-size="12" fill="#334155">authorization, limits,</text>
<text x="840" y="195" text-anchor="middle" font-size="12" fill="#334155">server-owned fields</text>
<line x1="840" y1="210" x2="840" y2="258" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="940" y1="165" x2="978" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="980" y="120" width="180" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1070" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">4 Encode output</text>
<text x="1070" y="172" text-anchor="middle" font-size="12" fill="#065f46">per context: HTML, attr,</text>
<text x="1070" y="190" text-anchor="middle" font-size="12" fill="#065f46">JS, CSS, URL</text>
<rect x="420" y="260" width="740" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="790" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">3 Parameterize at every interpreter</text>
<text x="440" y="320" font-size="13" fill="#7c2d12">SQL: bind variables / prepared statements</text>
<text x="440" y="344" font-size="13" fill="#7c2d12">ORM: no raw fragments, allowlist ORDER BY</text>
<text x="440" y="368" font-size="13" fill="#7c2d12">NoSQL: strings only, no $ operators from clients</text>
<text x="440" y="392" font-size="13" fill="#7c2d12">Objects: JSON + schema, never native deserialization</text>
<text x="800" y="320" font-size="13" fill="#7c2d12">OS: argument arrays, no shell</text>
<text x="800" y="344" font-size="13" fill="#7c2d12">URLs (SSRF): allowlist + resolved-IP check</text>
<text x="800" y="368" font-size="13" fill="#7c2d12">XML: DTDs and external entities off</text>
<text x="800" y="392" font-size="13" fill="#7c2d12">Templates: no user-built templates</text>
<rect x="40" y="260" width="350" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="215" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">5 Contain the impact</text>
<text x="60" y="320" font-size="13" fill="#4c1d95">browser: CSP, Trusted Types, HttpOnly</text>
<text x="60" y="344" font-size="13" fill="#4c1d95">runtime: least-privilege DB user</text>
<text x="60" y="368" font-size="13" fill="#4c1d95">network: default-deny egress</text>
<text x="60" y="392" font-size="13" fill="#4c1d95">images: no shell, non-root</text>
<text x="40" y="460" font-size="13" fill="#475569">Client-side checks are UX only. Find what slips through with SAST, code review, fuzzing and DAST.</text>
<text x="40" y="484" font-size="13" fill="#475569">DBA view: CHECK constraints = validation; bind variables = parameterization; VPD = authorization.</text>
</svg>
