<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="100%" height="100%" fill="#f8fafc"/><text x="45" y="55" font-family="Arial" font-size="30" font-weight="bold" fill="#0f172a">Secure LLM Application</text><text x="45" y="85" font-family="Arial" font-size="16" fill="#475569">User → gateway → context builder → model → output validation → controlled tools</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect x="40" y="210" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="122" y="259" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">User/API</text><path d="M205 253 L252 253" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="260" y="210" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="342" y="259" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">LLM Gateway</text><path d="M425 253 L472 143" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="480" y="100" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="562" y="149" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Context Builder</text><path d="M645 143 L752 253" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="760" y="210" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="842" y="259" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Model Endpoint</text><path d="M842 296 L554 390" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="480" y="390" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="562" y="439" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Output Validator</text><path d="M645 433 L752 433" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="760" y="390" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="842" y="439" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Tool Broker</text><text x="45" y="585" font-family="Arial" font-size="13" fill="#64748b">Enforce identity, authorization and validation in deterministic services, not prompt instructions alone.</text></svg>