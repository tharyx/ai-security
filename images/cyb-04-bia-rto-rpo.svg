<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>BIA, RTO and RPO on a timeline</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#475569"/></marker></defs>
<rect width="1200" height="440" fill="#ffffff"/>
<text x="60" y="52" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">BIA, RTO and RPO on a timeline</text>
<text x="60" y="82" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">How much downtime and data loss can the business accept?</text>
<line x1="80" y1="220" x2="1120" y2="220" stroke="#0f172a" stroke-width="3"/>
<circle cx="200" cy="220" r="10" fill="#16a34a"/>
<text x="200" y="255" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Last good backup</text>
<circle cx="600" cy="220" r="10" fill="#dc2626"/>
<text x="600" y="255" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Disaster</text>
<circle cx="980" cy="220" r="10" fill="#2563eb"/>
<text x="980" y="255" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Service restored</text>
<line x1="205" y1="170" x2="595" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="400.0" y="162.0" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">RPO: data you can afford to lose</text>
<line x1="605" y1="170" x2="975" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="790.0" y="162.0" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">RTO: time to be back up</text>
<rect x="60" y="300" width="330" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="225.0" y="328" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">MTD (max tolerable downtime)</text>
<text x="225.0" y="352" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">RTO must be shorter than MTD</text>
<rect x="435" y="300" width="330" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="328" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">BIA</text>
<text x="600.0" y="352" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">finds critical processes,</text>
<text x="600.0" y="372" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">then sets RTO and RPO</text>
<rect x="810" y="300" width="330" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="975.0" y="328" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">DR plan + tests</text>
<text x="975.0" y="352" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">backups, replicas, runbooks,</text>
<text x="975.0" y="372" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">tested restores</text>
</svg>
