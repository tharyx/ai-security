<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Image signing: Docker Content Trust (legacy) versus cosign and Notation</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">Image signing: sign the digest, verify before you run</text>
  <text x="40" y="74" font-size="16" fill="#475569">Docker Content Trust (Notary v1) is retired: the service shuts down on 8 Dec 2026 (verify at source).</text>

  <rect x="40" y="100" width="1120" height="70" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="130" font-size="17" font-weight="700" fill="#991b1b">LEGACY: Docker Content Trust (DOCKER_CONTENT_TRUST=1, Notary v1, notary.docker.io)</text>
  <text x="60" y="154" font-size="14" fill="#991b1b">Root key + targets key + snapshot/timestamp keys. Only signs tags on Docker Hub style registries. Learn it for the exam; do not build on it.</text>

  <rect x="40" y="200" width="250" height="130" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="60" y="232" font-size="17" font-weight="700" fill="#92400e">CI build</text>
  <text x="60" y="258" font-size="14" fill="#92400e">docker build + push</text>
  <text x="60" y="280" font-size="14" fill="#92400e">gets image DIGEST</text>
  <text x="60" y="302" font-size="14" fill="#92400e">sbom + scan</text>

  <rect x="340" y="200" width="270" height="130" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="232" font-size="17" font-weight="700" fill="#1e3a8a">Sign (current tools)</text>
  <text x="360" y="258" font-size="14" fill="#1e3a8a">cosign sign image@sha256</text>
  <text x="360" y="280" font-size="14" fill="#1e3a8a">  keyless (OIDC) or KMS key</text>
  <text x="360" y="302" font-size="14" fill="#1e3a8a">notation sign (X.509 cert)</text>

  <rect x="660" y="200" width="230" height="130" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="680" y="232" font-size="17" font-weight="700" fill="#0f172a">Registry (OCI)</text>
  <text x="680" y="258" font-size="14" fill="#334155">image manifest</text>
  <text x="680" y="280" font-size="14" fill="#334155">signature stored as an</text>
  <text x="680" y="302" font-size="14" fill="#334155">OCI artifact beside it</text>

  <rect x="940" y="200" width="220" height="130" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="960" y="232" font-size="17" font-weight="700" fill="#14532d">Verify at deploy</text>
  <text x="960" y="258" font-size="14" fill="#14532d">cosign verify / notation</text>
  <text x="960" y="280" font-size="14" fill="#14532d">  verify, or an admission</text>
  <text x="960" y="302" font-size="14" fill="#14532d">  policy (Kyverno etc.)</text>

  <path d="M290 265 L336 265" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M610 265 L656 265" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M890 265 L936 265" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <rect x="40" y="370" width="1120" height="120" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <g font-size="15" fill="#334155">
    <text x="60" y="402">A signature binds an identity to a digest. A tag is only a label, so sign and verify by digest.</text>
    <text x="60" y="428">Signing proves WHO built it and that it was not changed. It does not prove the image is free of vulnerabilities.</text>
    <text x="60" y="454">Verify identity (who may sign), not just "some signature exists". Keep the policy in the cluster so nobody can skip it.</text>
  </g>
</svg>
