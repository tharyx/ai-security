<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Oracle defense in layers</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Oracle defense in layers</text>
<text x="40" y="80" font-size="16" fill="#475569">Each layer assumes the one above can fail. Names are Oracle features you already know or can learn.</text>
<rect x="40" y="110" width="220" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="150.0" y="147.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Network</text>
<rect x="280" y="110" width="880" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="147.0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Firewall, listener hardening, valid-node checking, TLS / native network encryption</text>
<rect x="40" y="188" width="220" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="150.0" y="225.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Authentication</text>
<rect x="280" y="188" width="880" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="225.0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Password profiles, lockout, no default passwords, MFA / Kerberos / external auth</text>
<rect x="40" y="266" width="220" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="150.0" y="303.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Authorization</text>
<rect x="280" y="266" width="880" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="303.0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Least privilege, roles, no PUBLIC grants, Database Vault, Label Security, VPD</text>
<rect x="40" y="344" width="220" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="150.0" y="381.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Data protection</text>
<rect x="280" y="344" width="880" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="381.0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">TDE for stored data, Data Redaction for display, Data Masking for test copies</text>
<rect x="40" y="422" width="220" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="150.0" y="459.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Audit and detection</text>
<rect x="280" y="422" width="880" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="459.0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Unified Auditing policies, audit trail to SIEM, alerts on privileged actions</text>
<rect x="40" y="500" width="220" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="150.0" y="537.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Resilience</text>
<rect x="280" y="500" width="880" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="537.0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Critical Patch Updates, RMAN backups, immutable copy, restore tests</text>
</svg>