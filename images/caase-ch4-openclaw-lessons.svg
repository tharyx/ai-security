<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>OpenClaw case study: three failure paths (exposed gateway, web-page token theft, malicious skills) and the controls that map to each</title>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">OpenClaw 2026: three failure paths, one lesson</text>
  <text x="40" y="76" font-size="16" fill="#475569">Numbers are as reported by third parties and change; verify at source. Conceptual only.</text>
  <rect x="40" y="100" width="350" height="360" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="58" y="130" font-size="18" font-weight="700" fill="#0f172a">1. Exposed gateways</text>
  <text x="58" y="158" font-size="14" fill="#0f172a">Insecure defaults: broad bind,</text>
  <text x="58" y="178" font-size="14" fill="#0f172a">weak or no auth. Researchers</text>
  <text x="58" y="198" font-size="14" fill="#0f172a">reported about 135,000 instances</text>
  <text x="58" y="218" font-size="14" fill="#0f172a">visible on the internet.</text>
  <text x="58" y="252" font-size="14" font-weight="700" fill="#991b1b">What an attacker gets</text>
  <text x="58" y="274" font-size="14" fill="#0f172a">The agent tools: shell, files,</text>
  <text x="58" y="294" font-size="14" fill="#0f172a">messaging, stored API keys.</text>
  <text x="58" y="328" font-size="14" font-weight="700" fill="#166534">Controls</text>
  <text x="58" y="350" font-size="14" fill="#0f172a">Bind loopback. Require auth.</text>
  <text x="58" y="370" font-size="14" fill="#0f172a">Reach it only through a VPN or</text>
  <text x="58" y="390" font-size="14" fill="#0f172a">authenticated proxy. Audit config.</text>
  <text x="58" y="430" font-size="13" fill="#475569">OWASP ASI03, ASI05 | Lab: openclaw-misconfiguration</text>
  <rect x="425" y="100" width="350" height="360" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="443" y="130" font-size="18" font-weight="700" fill="#0f172a">2. CVE-2026-25253</text>
  <text x="443" y="158" font-size="14" fill="#0f172a">A malicious web page could get a</text>
  <text x="443" y="178" font-size="14" fill="#0f172a">user gateway token (CVSS about</text>
  <text x="443" y="198" font-size="14" fill="#0f172a">8.8, reported; patched). Idea: the</text>
  <text x="443" y="218" font-size="14" fill="#0f172a">local service trusted a request</text>
  <text x="443" y="238" font-size="14" fill="#0f172a">that a web page could cause.</text>
  <text x="443" y="272" font-size="14" font-weight="700" fill="#92400e">Why "localhost only" is not enough</text>
  <text x="443" y="294" font-size="14" fill="#0f172a">Your own browser reaches it.</text>
  <text x="443" y="328" font-size="14" font-weight="700" fill="#166534">Controls</text>
  <text x="443" y="350" font-size="14" fill="#0f172a">Update. Check Origin. Never hand</text>
  <text x="443" y="370" font-size="14" fill="#0f172a">tokens to web pages. Short-lived,</text>
  <text x="443" y="390" font-size="14" fill="#0f172a">scoped tokens. Approval for tools.</text>
  <text x="443" y="430" font-size="13" fill="#475569">OWASP ASI03, ASI06 | Lab: openclaw-misconfiguration</text>
  <rect x="810" y="100" width="350" height="360" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="828" y="130" font-size="18" font-weight="700" fill="#0f172a">3. ClawHavoc skills</text>
  <text x="828" y="158" font-size="14" fill="#0f172a">Malicious skills on the ClawHub</text>
  <text x="828" y="178" font-size="14" fill="#0f172a">marketplace. An early audit</text>
  <text x="828" y="198" font-size="14" fill="#0f172a">flagged 341 of about 2,857; later</text>
  <text x="828" y="218" font-size="14" fill="#0f172a">counts were higher. Mostly</text>
  <text x="828" y="238" font-size="14" fill="#0f172a">infostealers behind fake setup.</text>
  <text x="828" y="272" font-size="14" font-weight="700" fill="#5b21b6">A skill is instructions plus code</text>
  <text x="828" y="294" font-size="14" fill="#0f172a">that the agent and you both trust.</text>
  <text x="828" y="328" font-size="14" font-weight="700" fill="#166534">Controls</text>
  <text x="828" y="350" font-size="14" fill="#0f172a">Vet before install. Pin and sign.</text>
  <text x="828" y="370" font-size="14" fill="#0f172a">Sandbox, egress allowlist,</text>
  <text x="828" y="390" font-size="14" fill="#0f172a">no secrets in the environment.</text>
  <text x="828" y="430" font-size="13" fill="#475569">OWASP ASI04, ASI05 | Lab: skill-vetting</text>
  <rect x="40" y="490" width="1120" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="520" font-size="16" font-weight="700" fill="#0f172a">Lesson</text>
  <text x="60" y="545" font-size="14" fill="#0f172a">A powerful personal agent is a high-value target. Safe defaults, containment (sandbox + egress) and supply-chain checks matter more than</text>
  <text x="60" y="563" font-size="14" fill="#0f172a">the model. Typosquat domains also appeared during the renames (Clawdbot, Moltbot, OpenClaw): confirm the official source.</text>
</svg>
