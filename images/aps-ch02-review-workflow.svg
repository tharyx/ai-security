<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Secure code review workflow and source-to-sink tracing</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Secure code review: risk-first steps, then trace data from source to sink</text>

<text x="40" y="92" font-size="17" font-weight="700" fill="#1e3a8a">The steps</text>
<rect x="40" y="105" width="170" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="125" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">1. Scope</text>
<text x="125" y="160" text-anchor="middle" font-size="13" fill="#1e293b">what changed, why</text>
<rect x="232" y="105" width="170" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="317" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">2. Context</text>
<text x="317" y="160" text-anchor="middle" font-size="13" fill="#1e293b">threat model, data</text>
<rect x="424" y="105" width="170" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="509" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">3. Tools first</text>
<text x="509" y="160" text-anchor="middle" font-size="13" fill="#1e293b">SAST, SCA, secrets</text>
<rect x="616" y="105" width="170" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="701" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">4. Manual review</text>
<text x="701" y="160" text-anchor="middle" font-size="13" fill="#1e293b">hotspots + checklist</text>
<rect x="808" y="105" width="170" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="893" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">5. Confirm</text>
<text x="893" y="160" text-anchor="middle" font-size="13" fill="#1e293b">test or PoC, triage</text>
<rect x="1000" y="105" width="160" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1080" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">6. Report + fix</text>
<text x="1080" y="160" text-anchor="middle" font-size="13" fill="#1e293b">ASVS id, regression test</text>
<line x1="210" y1="145" x2="228" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="402" y1="145" x2="420" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="594" y1="145" x2="612" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="786" y1="145" x2="804" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="978" y1="145" x2="996" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

<text x="40" y="250" font-size="17" font-weight="700" fill="#991b1b">Source to sink: where each defence belongs</text>
<rect x="40" y="270" width="200" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="140" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Sources</text>
<text x="140" y="324" text-anchor="middle" font-size="13" fill="#1e293b">query, body, headers,</text>
<text x="140" y="344" text-anchor="middle" font-size="13" fill="#1e293b">cookies, files, queues,</text>
<text x="140" y="364" text-anchor="middle" font-size="13" fill="#1e293b">third-party APIs</text>
<rect x="300" y="270" width="200" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="400" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Input validation</text>
<text x="400" y="324" text-anchor="middle" font-size="13" fill="#1e293b">allowlist type, length,</text>
<text x="400" y="344" text-anchor="middle" font-size="13" fill="#1e293b">range, format (fullmatch)</text>
<rect x="560" y="270" width="200" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="660" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">AuthN + AuthZ</text>
<text x="660" y="324" text-anchor="middle" font-size="13" fill="#1e293b">who is it? may they</text>
<text x="660" y="344" text-anchor="middle" font-size="13" fill="#1e293b">touch THIS object?</text>
<rect x="820" y="270" width="340" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="990" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Sinks and their defence</text>
<text x="840" y="326" font-size="13" fill="#1e293b">SQL: bind parameters    HTML: context encoding</text>
<text x="840" y="348" font-size="13" fill="#1e293b">shell: argv, no shell    URL fetch: host allowlist</text>
<text x="840" y="370" font-size="13" fill="#1e293b">redirect: local paths    logs: strip CR/LF, no secrets</text>
<line x1="240" y1="325" x2="296" y2="325" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="500" y1="325" x2="556" y2="325" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="760" y1="325" x2="816" y2="325" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

<rect x="40" y="420" width="1120" height="150" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="60" y="450" font-size="16" font-weight="700" fill="#0f172a">Reviewer habits</text>
<text x="60" y="478" font-size="14" fill="#1e293b">- Validation is at the edge; encoding and parameterization are at the sink. You need both, and the sink defence is the one that must never be missing.</text>
<text x="60" y="504" font-size="14" fill="#1e293b">- Read the diff, then follow each new input to every place it is used. Configuration files and templates count as code.</text>
<text x="60" y="530" font-size="14" fill="#1e293b">- Tools find patterns; people find missing checks (an authorization test that is not there produces no warning).</text>
<text x="60" y="556" font-size="14" fill="#1e293b">- Every confirmed finding gets a fix, a regression test and a checklist (ASVS) reference.</text>
</svg>
