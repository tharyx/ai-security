<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title id="t">Effective privilege is the closure of chained tools</title>
  <desc id="d">The agent is granted read files, read tickets and write tickets. The read files tool can read a secret, which gives the capability admin token. The update role tool needs that token and gives admin. So the effective privilege includes admin.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Granted: three small capabilities. Reachable: admin.</text>

  <rect x="20" y="70" width="190" height="110" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="115" y="96" text-anchor="middle" font-weight="600" fill="#14532d">Granted capabilities</text>
  <text x="115" y="122" text-anchor="middle" fill="#14532d" font-size="12">fs:read</text>
  <text x="115" y="142" text-anchor="middle" fill="#14532d" font-size="12">tickets:read</text>
  <text x="115" y="162" text-anchor="middle" fill="#14532d" font-size="12">tickets:write</text>

  <rect x="270" y="70" width="170" height="110" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="355" y="96" text-anchor="middle" font-weight="600" fill="#312e81">Tool: read_file</text>
  <text x="355" y="122" text-anchor="middle" fill="#312e81" font-size="12">needs: fs:read</text>
  <text x="355" y="142" text-anchor="middle" fill="#b91c1c" font-size="12">yields: credential:admin-token</text>
  <text x="355" y="162" text-anchor="middle" fill="#312e81" font-size="12">(the file store holds a secret)</text>

  <rect x="500" y="70" width="170" height="110" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="585" y="96" text-anchor="middle" font-weight="600" fill="#312e81">Tool: update_role</text>
  <text x="585" y="122" text-anchor="middle" fill="#312e81" font-size="12">needs: admin-token</text>
  <text x="585" y="142" text-anchor="middle" fill="#b91c1c" font-size="12">yields: iam:admin</text>

  <rect x="730" y="70" width="210" height="110" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="835" y="96" text-anchor="middle" font-weight="600" fill="#7f1d1d">Effective privilege</text>
  <text x="835" y="122" text-anchor="middle" fill="#7f1d1d" font-size="12">granted + credential:admin-token</text>
  <text x="835" y="142" text-anchor="middle" fill="#7f1d1d" font-size="12">+ iam:admin</text>

  <path d="M210,125 L270,125" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M440,125 L500,125" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <path d="M670,125 L730,125" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#r)"/>

  <text x="30" y="230" font-weight="600" fill="#0f172a">Break the chain at any link</text>
  <rect x="30" y="246" width="210" height="110" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="135" y="272" text-anchor="middle" font-weight="600" fill="#78350f">Before the read</text>
  <text x="135" y="294" text-anchor="middle" fill="#78350f" font-size="12">path allowlist (no .env)</text>
  <text x="135" y="312" text-anchor="middle" fill="#78350f" font-size="12">secrets out of the file store</text>
  <rect x="270" y="246" width="210" height="110" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="375" y="272" text-anchor="middle" font-weight="600" fill="#78350f">Between the tools</text>
  <text x="375" y="294" text-anchor="middle" fill="#78350f" font-size="12">redact credentials in output</text>
  <text x="375" y="312" text-anchor="middle" fill="#78350f" font-size="12">chain gate after exposure</text>
  <rect x="510" y="246" width="210" height="110" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="615" y="272" text-anchor="middle" font-weight="600" fill="#78350f">At the admin tool</text>
  <text x="615" y="294" text-anchor="middle" fill="#78350f" font-size="12">authorize by caller identity,</text>
  <text x="615" y="312" text-anchor="middle" fill="#78350f" font-size="12">not by a token argument</text>
  <rect x="750" y="246" width="180" height="110" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="840" y="272" text-anchor="middle" font-weight="600" fill="#78350f">At review time</text>
  <text x="840" y="294" text-anchor="middle" fill="#78350f" font-size="12">compute the closure,</text>
  <text x="840" y="312" text-anchor="middle" fill="#78350f" font-size="12">compare with a ceiling</text>
</svg>
