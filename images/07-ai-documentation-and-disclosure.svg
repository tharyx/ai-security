<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>AI documentation stack: datasheets describe data, model cards describe models, system cards describe the whole system, and each audience gets a different disclosure</title>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">AI documentation: from data to the person affected</text>
  <text x="40" y="76" font-size="16" fill="#475569">Each layer links to the one below it (lineage). Each audience needs a different level of detail.</text>

  <g>
    <rect x="40" y="110" width="250" height="170" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="60" y="140" font-size="17" font-weight="700" fill="#0f172a">Datasheet / data card</text>
    <g font-size="13" fill="#0f172a">
      <text x="60" y="166">source, licence, collection</text>
      <text x="60" y="188">classification, personal data</text>
      <text x="60" y="210">lawful basis, DPIA, retention</text>
      <text x="60" y="232">known gaps and biases</text>
      <text x="60" y="254">derived artifacts + labels</text>
    </g>
  </g>
  <path d="M 290 195 L 330 195" stroke="#334155" stroke-width="3"/>
  <path d="M 330 195 L 320 188 L 320 202 Z" fill="#334155"/>
  <g>
    <rect x="340" y="110" width="250" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="360" y="140" font-size="17" font-weight="700" fill="#1e3a8a">Model card</text>
    <g font-size="13" fill="#0f172a">
      <text x="360" y="166">version + artifact hash</text>
      <text x="360" y="188">intended and out-of-scope use</text>
      <text x="360" y="210">evals with datasets: quality,</text>
      <text x="360" y="232">security, fairness</text>
      <text x="360" y="254">limitations, training data IDs</text>
    </g>
  </g>
  <path d="M 590 195 L 630 195" stroke="#334155" stroke-width="3"/>
  <path d="M 630 195 L 620 188 L 620 202 Z" fill="#334155"/>
  <g>
    <rect x="640" y="110" width="250" height="170" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="660" y="140" font-size="17" font-weight="700" fill="#92400e">System card</text>
    <g font-size="13" fill="#0f172a">
      <text x="660" y="166">owners, intended use, tier</text>
      <text x="660" y="188">models + data + tools</text>
      <text x="660" y="210">human oversight, controls</text>
      <text x="660" y="232">affected people, regions</text>
      <text x="660" y="254">(Lesson 01 register)</text>
    </g>
  </g>
  <path d="M 890 195 L 930 195" stroke="#334155" stroke-width="3"/>
  <path d="M 930 195 L 920 188 L 920 202 Z" fill="#334155"/>
  <g>
    <rect x="940" y="110" width="220" height="170" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="960" y="140" font-size="17" font-weight="700" fill="#166534">Disclosure</text>
    <g font-size="13" fill="#0f172a">
      <text x="960" y="166">"you are talking to AI"</text>
      <text x="960" y="188">AI-generated label</text>
      <text x="960" y="210">decision notice: main</text>
      <text x="960" y="232">reasons + human review</text>
      <text x="960" y="254">route</text>
    </g>
  </g>

  <text x="40" y="324" font-size="17" font-weight="700" fill="#0f172a">Who needs what (transparency is audience-specific)</text>
  <g font-size="13">
    <rect x="40" y="340" width="212" height="116" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="54" y="364" font-weight="700" fill="#991b1b">Affected person</text>
    <text x="54" y="386" fill="#0f172a">that AI is used, main</text>
    <text x="54" y="406" fill="#0f172a">reasons, how to contest</text>
    <rect x="266" y="340" width="212" height="116" rx="10" fill="#fffbeb" stroke="#d97706"/>
    <text x="280" y="364" font-weight="700" fill="#92400e">User / operator</text>
    <text x="280" y="386" fill="#0f172a">limits, when not to trust,</text>
    <text x="280" y="406" fill="#0f172a">how to override</text>
    <rect x="492" y="340" width="212" height="116" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="506" y="364" font-weight="700" fill="#1e3a8a">Developer / validator</text>
    <text x="506" y="386" fill="#0f172a">full cards, eval data,</text>
    <text x="506" y="406" fill="#0f172a">lineage, explanations</text>
    <rect x="718" y="340" width="212" height="116" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="732" y="364" font-weight="700" fill="#0f172a">Auditor / regulator</text>
    <text x="732" y="386" fill="#0f172a">technical file, logs,</text>
    <text x="732" y="406" fill="#0f172a">evidence with dates</text>
    <rect x="944" y="340" width="216" height="116" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="958" y="364" font-weight="700" fill="#166534">Board</text>
    <text x="958" y="386" fill="#0f172a">inventory by tier, top</text>
    <text x="958" y="406" fill="#0f172a">risks, incidents, trends</text>
  </g>

  <rect x="40" y="478" width="1120" height="62" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="504" font-size="15" font-weight="700" fill="#166534">Check documents like code (doc_validator.py)</text>
  <text x="60" y="526" font-size="13" fill="#0f172a">Missing fields, "TBD", no security eval, failed thresholds, no hash, "no known limitations", stale card, broken lineage, labels not propagated.</text>
</svg>
