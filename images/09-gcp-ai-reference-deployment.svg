  <text x="195.0" y="328.25" font-size="12.5" fill="#166534" text-anchor="middle">Model Armor calls</text>
  <text x="195.0" y="345.75" font-size="12.5" fill="#166534" text-anchor="middle">own service account</text>
  <rect x="340" y="268" width="250" height="92" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="465.0" y="293.25" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Agent + RAG services</text>
  <text x="465.0" y="310.75" font-size="12.5" fill="#92400e" text-anchor="middle">one service account</text>
  <text x="465.0" y="328.25" font-size="12.5" fill="#92400e" text-anchor="middle">step / cost limits</text>
  <text x="465.0" y="345.75" font-size="12.5" fill="#92400e" text-anchor="middle">feature-flag kill switch</text>
