  <rect x="650" y="268" width="230" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="765.0" y="293.25" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Vertex AI (Gemini)</text>
  <text x="765.0" y="310.75" font-size="12.5" fill="#1e3a8a" text-anchor="middle">PSC endpoint</text>
  <text x="765.0" y="328.25" font-size="12.5" fill="#1e3a8a" text-anchor="middle">inside VPC-SC perimeter</text>
  <text x="765.0" y="345.75" font-size="12.5" fill="#1e3a8a" text-anchor="middle">roles/aiplatform.user</text>
