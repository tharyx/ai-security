  <text x="1015.0" y="293.25" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Model Armor</text>
  <text x="1015.0" y="310.75" font-size="12.5" fill="#166534" text-anchor="middle">prompt injection filter</text>
  <text x="1015.0" y="328.25" font-size="12.5" fill="#166534" text-anchor="middle">sensitive data filter</text>
  <text x="1015.0" y="345.75" font-size="12.5" fill="#166534" text-anchor="middle">malicious URL filter</text>
  <rect x="70" y="395" width="250" height="120" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="195.0" y="434.25" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Vertex AI Vector Search</text>
  <text x="195.0" y="451.75" font-size="12.5" fill="#334155" text-anchor="middle">PSC endpoint</text>
  <text x="195.0" y="469.25" font-size="12.5" fill="#334155" text-anchor="middle">namespace restricts</text>
  <text x="195.0" y="486.75" font-size="12.5" fill="#334155" text-anchor="middle">CMEK (Cloud KMS)</text>
  <rect x="340" y="395" width="250" height="120" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="465.0" y="434.25" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Cloud Storage</text>
  <text x="465.0" y="451.75" font-size="12.5" fill="#334155" text-anchor="middle">public access prevention</text>
  <text x="465.0" y="469.25" font-size="12.5" fill="#334155" text-anchor="middle">uniform access</text>
  <text x="465.0" y="486.75" font-size="12.5" fill="#334155" text-anchor="middle">CMEK (Cloud KMS)</text>
  <rect x="650" y="395" width="230" height="120" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="765.0" y="434.25" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Tool broker + tools</text>
  <text x="765.0" y="451.75" font-size="12.5" fill="#92400e" text-anchor="middle">registry allowlist</text>
  <text x="765.0" y="469.25" font-size="12.5" fill="#92400e" text-anchor="middle">own service accounts</text>
  <text x="765.0" y="486.75" font-size="12.5" fill="#92400e" text-anchor="middle">approval for writes</text>
  <rect x="900" y="395" width="230" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1015.0" y="434.25" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Egress controls</text>
  <text x="1015.0" y="451.75" font-size="12.5" fill="#166534" text-anchor="middle">firewall deny egress</text>
  <text x="1015.0" y="469.25" font-size="12.5" fill="#166534" text-anchor="middle">Secure Web Proxy</text>
  <text x="1015.0" y="486.75" font-size="12.5" fill="#166534" text-anchor="middle">VPC-SC blocks exfil</text>
  <rect x="30" y="550" width="1140" height="130" rx="14" fill="#fbfcfd" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="570" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Shared security services</text>
  <rect x="50" y="580" width="210" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="155.0" y="610.0" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Service accounts</text>
  <text x="155.0" y="627.5" font-size="12.5" fill="#166534" text-anchor="middle">Workload Identity Fed.</text>
  <text x="155.0" y="645.0" font-size="12.5" fill="#166534" text-anchor="middle">no SA keys (org policy)</text>
  <rect x="275" y="580" width="210" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
