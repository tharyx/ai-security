  <text x="380.0" y="627.5" font-size="12.5" fill="#166534" text-anchor="middle">CMEK keys</text>
  <text x="380.0" y="645.0" font-size="12.5" fill="#166534" text-anchor="middle">rotation period</text>
  <rect x="500" y="580" width="200" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600.0" y="610.0" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Secret Manager</text>
  <text x="600.0" y="627.5" font-size="12.5" fill="#166534" text-anchor="middle">IAM per secret</text>
  <text x="600.0" y="645.0" font-size="12.5" fill="#166534" text-anchor="middle">rotation schedule</text>
  <rect x="715" y="580" width="210" height="84" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="820.0" y="610.0" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Cloud Audit Logs</text>
  <text x="820.0" y="627.5" font-size="12.5" fill="#334155" text-anchor="middle">Admin Activity (on)</text>
  <text x="820.0" y="645.0" font-size="12.5" fill="#334155" text-anchor="middle">Data Access (enable!)</text>
  <rect x="940" y="580" width="210" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1045.0" y="610.0" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">SIEM (e.g. SecOps)</text>
  <text x="1045.0" y="627.5" font-size="12.5" fill="#166534" text-anchor="middle">Security Command Center</text>
  <text x="1045.0" y="645.0" font-size="12.5" fill="#166534" text-anchor="middle">locked log buckets</text>
