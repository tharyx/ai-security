<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Delegated identity: every hop narrows authority</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1200" height="670" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Delegated identity: every hop narrows authority</text>
<text x="40" y="80" font-size="16" fill="#475569">The user stays the subject; each agent is added to the act chain; scope and lifetime can only shrink</text>
<rect x="40" y="120" width="150" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="115.0" y="156" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">alice</text>
<text x="115.0" y="178" font-size="13" text-anchor="middle" fill="#1e3a8a">the human (subject)</text>
<rect x="222" y="120" width="196" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="320.0" y="156" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">Identity provider</text>
<text x="320.0" y="178" font-size="13" text-anchor="middle" fill="#166534">mints token A</text>
<rect x="450" y="120" width="170" height="80" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="535.0" y="156" font-size="16" font-weight="700" text-anchor="middle" fill="#92400e">Planner agent</text>
<text x="535.0" y="178" font-size="13" text-anchor="middle" fill="#92400e">holds token A</text>
<rect x="660" y="120" width="170" height="80" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="745.0" y="156" font-size="16" font-weight="700" text-anchor="middle" fill="#92400e">ticket-bot</text>
<text x="745.0" y="178" font-size="13" text-anchor="middle" fill="#92400e">sub-agent, token B</text>
<rect x="870" y="120" width="290" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1015.0" y="156" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">Resource server</text>
<text x="1015.0" y="178" font-size="13" text-anchor="middle" fill="#166534">trusts only verified claims</text>
<polyline points="190,160 222,160" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="418,160 450,160" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="620,160 660,160" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="830,160 870,160" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<text x="640" y="112" font-size="12" text-anchor="middle" fill="#166534">token exchange</text>
<rect x="240" y="250" width="300" height="170" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="254" y="294" font-size="16" font-weight="700" fill="#334155">Token A (planner)</text>
<text x="254" y="316" font-size="13" fill="#334155">sub: alice</text>
<text x="254" y="334" font-size="13" fill="#334155">act: planner</text>
<text x="254" y="354" font-size="13" fill="#334155">scope: reports:read tickets:write</text>
<text x="254" y="372" font-size="13" fill="#334155">exp: now + 5 min    sid: sess-0001</text>
<text x="254" y="392" font-size="13" fill="#334155">signed by the identity provider</text>
<rect x="560" y="250" width="300" height="170" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="574" y="294" font-size="16" font-weight="700" fill="#334155">Token B (ticket-bot)</text>
<text x="574" y="316" font-size="13" fill="#334155">sub: alice   (unchanged)</text>
<text x="574" y="334" font-size="13" fill="#334155">act: ticket-bot, act: planner</text>
<text x="574" y="354" font-size="13" fill="#334155">scope: tickets:write   (a subset)</text>
<text x="574" y="372" font-size="13" fill="#334155">exp: never later than token A</text>
<text x="574" y="392" font-size="13" fill="#334155">new jti, same session</text>
<rect x="880" y="250" width="280" height="170" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="894" y="294" font-size="16" font-weight="700" fill="#166534">Checks on every call</text>
<text x="894" y="316" font-size="13" fill="#166534">1. signature, audience</text>
<text x="894" y="334" font-size="13" fill="#166534">2. expiry and revocation</text>
<text x="894" y="354" font-size="13" fill="#166534">3. token has the scope</text>
<text x="894" y="372" font-size="13" fill="#166534">4. alice STILL has it (live)</text>
<text x="894" y="392" font-size="13" fill="#166534">5. log user + agent chain</text>
<polyline points="540,335 560,335" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<text x="700" y="440" font-size="13" text-anchor="middle" fill="#166534">Asking for storage:admin here is refused: B can only narrow A.</text>
<rect x="40" y="480" width="1120" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="600.0" y="517" font-size="16" font-weight="700" text-anchor="middle" fill="#991b1b">Anti-pattern: one static admin key shared by all agents</text>
<text x="600.0" y="539" font-size="13" text-anchor="middle" fill="#991b1b">never expires, has every scope, carries no user and no agent name</text>
<text x="600.0" y="558" font-size="13" text-anchor="middle" fill="#991b1b">a stolen key works forever; the log can only say key=...5521; revoking it breaks every agent</text>
<text x="40" y="620" font-size="14" fill="#475569">Real systems: OAuth 2.0 Token Exchange (RFC 8693) with nested act claims, workload identity (SPIFFE, cloud IAM roles),</text>
<text x="40" y="642" font-size="14" fill="#475569">short-lived credentials from a secrets broker. This lab uses a tiny HMAC token to show the same ideas.</text>
</svg>
