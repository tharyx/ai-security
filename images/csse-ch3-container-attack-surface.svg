<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Attack surface of the container ecosystem</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="580" fill="#ffffff"/>
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">Where attackers can touch the container supply chain</text>
  <text x="40" y="74" font-size="16" fill="#475569">Left to right is the life of an image: build, store, pull, run. Numbers match the lesson.</text>

  <rect x="40" y="110" width="250" height="260" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="60" y="142" font-size="18" font-weight="700" fill="#92400e">1 Build</text>
  <g font-size="14" fill="#92400e">
    <text x="60" y="172">Dockerfile and base image</text>
    <text x="60" y="196">Typosquatted / unpinned FROM</text>
    <text x="60" y="220">Secrets in ENV, ARG, layers</text>
    <text x="60" y="244">curl | sh in RUN</text>
    <text x="60" y="268">Poisoned dependencies</text>
    <text x="60" y="292">Compromised CI builder</text>
  </g>

  <rect x="330" y="110" width="250" height="260" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="350" y="142" font-size="18" font-weight="700" fill="#991b1b">2 Registry</text>
  <g font-size="14" fill="#991b1b">
    <text x="350" y="172">No auth: catalog and pulls</text>
    <text x="350" y="196">Writable tags: overwrite 1.0</text>
    <text x="350" y="220">Plain HTTP / no TLS</text>
    <text x="350" y="244">Stolen push token</text>
    <text x="350" y="268">Public image with a backdoor</text>
    <text x="350" y="292">Namespace squatting</text>
  </g>

  <rect x="620" y="110" width="250" height="260" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="640" y="142" font-size="18" font-weight="700" fill="#1e3a8a">3 Pull and deploy</text>
  <g font-size="14" fill="#1e3a8a">
    <text x="640" y="172">Tag instead of digest</text>
    <text x="640" y="196">No signature check</text>
    <text x="640" y="220">Mirror or proxy tampering</text>
    <text x="640" y="244">Exposed Docker daemon API</text>
    <text x="640" y="268">Image never scanned</text>
  </g>

  <rect x="910" y="110" width="250" height="260" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="930" y="142" font-size="18" font-weight="700" fill="#14532d">4 Runtime</text>
  <g font-size="14" fill="#14532d">
    <text x="930" y="172">--privileged, docker.sock mount</text>
    <text x="930" y="196">Host mounts, SYS_ADMIN</text>
    <text x="930" y="220">Root user, writable rootfs</text>
    <text x="930" y="244">Kernel vulnerability (shared)</text>
    <text x="930" y="268">No limits: resource abuse</text>
    <text x="930" y="292">Secrets in env</text>
  </g>

  <path d="M290 240 L326 240" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M580 240 L616 240" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M870 240 L906 240" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <rect x="40" y="410" width="1120" height="130" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="442" font-size="17" font-weight="700" fill="#0f172a">Controls that map to each stage</text>
  <g font-size="15" fill="#334155">
    <text x="60" y="472">1: digest-pinned bases, multi-stage builds, BuildKit secrets, Dockerfile lint, SBOM</text>
    <text x="60" y="496">2: auth + TLS, immutable tags, scoped tokens, audit log, private mirror</text>
    <text x="60" y="520">3: verify cosign / Notation signatures, admission policy, scan before deploy   4: non-root, cap-drop ALL, seccomp, AppArmor, read-only, limits</text>
  </g>
</svg>
