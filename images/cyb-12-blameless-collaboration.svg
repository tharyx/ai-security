<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Working with IT and DevOps without blame</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#475569"/></marker></defs>
<rect width="1200" height="460" fill="#ffffff"/>
<text x="60" y="52" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">Working with IT and DevOps without blame</text>
<text x="60" y="82" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">Same goal: a service that is safe and stays up. Bring a fix, not just a finding</text>
<rect x="60.0" y="120" width="240" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="180.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Finding</text>
<text x="180.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">facts, evidence,</text>
<text x="180.0" y="192" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">no names</text>
<rect x="340.0" y="120" width="240" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="460.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Impact</text>
<text x="460.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">why they care:</text>
<text x="460.0" y="192" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">outage, audit, customers</text>
<rect x="620.0" y="120" width="240" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="740.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Options</text>
<text x="740.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">2 ways to fix,</text>
<text x="740.0" y="192" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">one easy first step</text>
<rect x="900.0" y="120" width="240" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1020.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Agree</text>
<text x="1020.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">owner, date,</text>
<text x="1020.0" y="192" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">follow-up</text>
<line x1="304.0" y1="170.0" x2="336.0" y2="170.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="584.0" y1="170.0" x2="616.0" y2="170.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="864.0" y1="170.0" x2="896.0" y2="170.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="60" y="280" width="1080" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="600.0" y="308" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Influence without authority</text>
<text x="600.0" y="332" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Listen first  |  use their words  |  show the risk in their terms  |  make the secure way the easy way  |  thank publicly</text>
<text x="60" y="410" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Ask "what would make this easy for you?" Sometimes the fix is a pull request you write yourself.</text>
</svg>
