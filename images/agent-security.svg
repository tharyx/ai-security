<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="100%" height="100%" fill="#f8fafc"/><text x="45" y="55" font-family="Arial" font-size="30" font-weight="bold" fill="#0f172a">Secure Agent Execution</text><text x="45" y="85" font-family="Arial" font-size="16" fill="#475569">Policy and human approval sit outside the model reasoning loop</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect x="40" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="122" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">User</text><path d="M205 273 L232 273" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="240" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="322" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Agent Planner</text><path d="M405 273 L462 273" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="470" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="552" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Policy Engine</text><rect x="730" y="100" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="812" y="149" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Human Approval</text><rect x="730" y="390" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="812" y="439" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Tool Broker</text><rect x="990" y="390" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="1072" y="439" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Sandboxed Tools</text><rect x="470" y="450" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="552" y="499" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Audit</text><text x="45" y="585" font-family="Arial" font-size="13" fill="#64748b">Enforce identity, authorization and validation in deterministic services, not prompt instructions alone.</text></svg>