<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>garak-shaped scanner and PyRIT-shaped orchestrator feeding a CI gate</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Two shapes of automated LLM red teaming</text>
  <text x="40" y="76" font-size="15" fill="#475569">Scanner = wide and repeatable (many probes, one turn). Orchestrator = deep (converters, scorers, multi-turn, memory).</text>

  <text x="40" y="118" font-size="18" font-weight="700" fill="#1e3a8a">garak shape (scanner.py)</text>
  <rect x="40" y="135" width="180" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Probes</text>
  <text x="130" y="187" text-anchor="middle" font-size="12" fill="#1e3a8a">inject, sysprompt leak,</text>
  <text x="130" y="205" text-anchor="middle" font-size="12" fill="#1e3a8a">data leak, jailbreak</text>
  <rect x="260" y="135" width="160" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Buffs</text>
  <text x="340" y="187" text-anchor="middle" font-size="12" fill="#1e3a8a">base64, rot13,</text>
  <text x="340" y="205" text-anchor="middle" font-size="12" fill="#1e3a8a">leetspeak</text>
  <rect x="460" y="135" width="180" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="550" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Generator</text>
  <text x="550" y="187" text-anchor="middle" font-size="12" fill="#991b1b">naive app / guarded app</text>
  <text x="550" y="205" text-anchor="middle" font-size="12" fill="#991b1b">(MockLLM inside)</text>
  <rect x="680" y="135" width="180" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="770" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Detectors</text>
  <text x="770" y="187" text-anchor="middle" font-size="12" fill="#1e3a8a">string marker,</text>
  <text x="770" y="205" text-anchor="middle" font-size="12" fill="#1e3a8a">planted canary</text>
  <rect x="900" y="135" width="260" height="90" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1030" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">report.jsonl + hitlog.jsonl</text>
  <text x="1030" y="187" text-anchor="middle" font-size="12" fill="#475569">attempts, evals, pass rates,</text>
  <text x="1030" y="205" text-anchor="middle" font-size="12" fill="#475569">ATLAS + OWASP tags</text>
  <line x1="220" y1="180" x2="252" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="180" x2="452" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="180" x2="672" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="180" x2="892" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <text x="40" y="290" font-size="18" font-weight="700" fill="#7c2d12">PyRIT shape (orchestrator.py)</text>
  <rect x="40" y="305" width="200" height="110" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="140" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Orchestrator</text>
  <text x="140" y="357" text-anchor="middle" font-size="12" fill="#9a3412">prompt sending, or</text>
  <text x="140" y="375" text-anchor="middle" font-size="12" fill="#9a3412">Crescendo-style multi-turn</text>
  <text x="140" y="393" text-anchor="middle" font-size="12" fill="#9a3412">max turns, backtracking</text>
  <rect x="280" y="305" width="160" height="110" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Converters</text>
  <text x="360" y="357" text-anchor="middle" font-size="12" fill="#9a3412">chainable prompt</text>
  <text x="360" y="375" text-anchor="middle" font-size="12" fill="#9a3412">transforms</text>
  <rect x="480" y="305" width="160" height="110" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Target</text>
  <text x="560" y="357" text-anchor="middle" font-size="12" fill="#991b1b">gets the whole</text>
  <text x="560" y="375" text-anchor="middle" font-size="12" fill="#991b1b">live conversation</text>
  <rect x="680" y="305" width="180" height="110" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="770" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Scorers</text>
  <text x="770" y="357" text-anchor="middle" font-size="12" fill="#9a3412">substring true/false,</text>
  <text x="770" y="375" text-anchor="middle" font-size="12" fill="#9a3412">refusal, rule judge 1-5</text>
  <rect x="900" y="305" width="260" height="110" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1030" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Memory (SQLite)</text>
  <text x="1030" y="357" text-anchor="middle" font-size="12" fill="#475569">messages + scores tables;</text>
  <text x="1030" y="375" text-anchor="middle" font-size="12" fill="#475569">backtracked turns kept=0</text>
  <text x="1030" y="393" text-anchor="middle" font-size="12" fill="#475569">query it with SQL</text>
  <line x1="240" y1="360" x2="272" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="360" x2="472" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="360" x2="672" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="360" x2="892" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M770,415 L770,440 L140,440 L140,423" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="455" y="458" text-anchor="middle" font-size="12" fill="#475569">refused? drop the turn, try the next phrasing (budget: max turns)</text>

  <rect x="900" y="480" width="260" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1030" y="510" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">CI gate (ci_gate.py)</text>
  <text x="1030" y="532" text-anchor="middle" font-size="12" fill="#065f46">hits &gt; 0 -&gt; exit 1 (build fails)</text>
  <text x="1030" y="550" text-anchor="middle" font-size="12" fill="#065f46">no eval entries -&gt; exit 2 (fail closed)</text>
  <path d="M1160,180 L1180,180 L1180,525 L1168,525" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="40" y="510" font-size="14" fill="#0f172a">Lab result: naive app 25 hits (FAIL), guarded app 0 hits (PASS).</text>
  <text x="40" y="534" font-size="14" fill="#0f172a">Buffs/converters beat a per-message keyword rule; Crescendo beats per-message checks.</text>
  <text x="40" y="558" font-size="13" fill="#475569">ATLAS IDs and names in tags: verify at atlas.mitre.org. Only test systems you own or have written permission to test.</text>
</svg>
