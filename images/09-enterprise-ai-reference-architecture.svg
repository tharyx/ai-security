<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Enterprise AI reference architecture</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="960" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Enterprise AI reference architecture</text>
  <text x="40" y="80" font-size="16" fill="#475569" text-anchor="start">Every request crosses identity, policy and guardrail checkpoints. The model is never the security boundary.</text>
  <rect x="30" y="100" width="1140" height="100" rx="14" fill="#fff7f7" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="120" font-size="13" font-weight="700" fill="#991b1b" text-anchor="start">Outside the trust boundary</text>
  <rect x="60" y="125" width="280" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="200.0" y="154.25" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">External content</text>
  <text x="200.0" y="171.75" font-size="12.5" fill="#991b1b" text-anchor="middle">web pages · email · tickets · wikis</text>
  <rect x="460" y="125" width="280" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600.0" y="154.25" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">Users and tenants</text>
  <text x="600.0" y="171.75" font-size="12.5" fill="#991b1b" text-anchor="middle">browser · chat · IDE · API clients</text>
  <rect x="860" y="125" width="280" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1000.0" y="154.25" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">Attackers</text>
  <text x="1000.0" y="171.75" font-size="12.5" fill="#991b1b" text-anchor="middle">injection · abuse · data theft</text>
  <rect x="30" y="222" width="1140" height="122" rx="14" fill="#f8fdf9" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="242" font-size="13" font-weight="700" fill="#166534" text-anchor="start">Edge and control plane</text>
  <rect x="60" y="252" width="200" height="74" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="160.0" y="286.25" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Identity provider</text>
  <text x="160.0" y="303.75" font-size="12.5" fill="#166534" text-anchor="middle">SSO · MFA · OIDC tokens</text>
  <rect x="290" y="252" width="150" height="74" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="365.0" y="277.5" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">WAF / CDN</text>
  <text x="365.0" y="295.0" font-size="12.5" fill="#166534" text-anchor="middle">L7 filtering</text>
  <text x="365.0" y="312.5" font-size="12.5" fill="#166534" text-anchor="middle">DDoS</text>
  <rect x="470" y="247" width="380" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="660.0" y="278.0" font-size="17" font-weight="700" fill="#166534" text-anchor="middle">AI gateway</text>
  <text x="660.0" y="295.5" font-size="12.5" fill="#166534" text-anchor="middle">authN · quotas · token budgets · routing</text>
  <text x="660.0" y="313.0" font-size="12.5" fill="#166534" text-anchor="middle">input + output guardrails · logging</text>
  <rect x="880" y="252" width="260" height="74" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1010.0" y="286.25" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Policy decision point</text>
  <text x="1010.0" y="303.75" font-size="12.5" fill="#166534" text-anchor="middle">RBAC/ABAC · tenant · tool rules</text>
  <rect x="30" y="366" width="1140" height="128" rx="14" fill="#fffdf6" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="386" font-size="13" font-weight="700" fill="#92400e" text-anchor="start">Application zone</text>
  <rect x="60" y="396" width="260" height="82" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="190.0" y="425.5" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">RAG platform</text>
  <text x="190.0" y="443.0" font-size="12.5" fill="#92400e" text-anchor="middle">ingest · sanitize · chunk · embed</text>
  <text x="190.0" y="460.5" font-size="12.5" fill="#92400e" text-anchor="middle">authZ-filtered retrieval</text>
  <rect x="345" y="396" width="250" height="82" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="470.0" y="425.5" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">Agent runtime</text>
  <text x="470.0" y="443.0" font-size="12.5" fill="#92400e" text-anchor="middle">planner · step + cost limits</text>
  <text x="470.0" y="460.5" font-size="12.5" fill="#92400e" text-anchor="middle">kill switch · own identity</text>
  <rect x="620" y="396" width="250" height="82" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="745.0" y="425.5" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">MCP / tool gateway</text>
  <text x="745.0" y="443.0" font-size="12.5" fill="#166534" text-anchor="middle">registry · schema · authZ</text>
  <text x="745.0" y="460.5" font-size="12.5" fill="#166534" text-anchor="middle">one choke point for tools</text>
  <rect x="895" y="396" width="245" height="82" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1017.5" y="425.5" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Human approval</text>
  <text x="1017.5" y="443.0" font-size="12.5" fill="#166534" text-anchor="middle">shows exact action + args</text>
  <text x="1017.5" y="460.5" font-size="12.5" fill="#166534" text-anchor="middle">required for writes</text>
  <rect x="30" y="514" width="375" height="160" rx="14" fill="#fbfcfd" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="666" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Data zones (classified)</text>
  <rect x="45" y="534" width="110" height="108" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="100.0" y="576.0" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Vectors</text>
  <text x="100.0" y="593.5" font-size="12.5" fill="#334155" text-anchor="middle">per-tenant</text>
  <text x="100.0" y="611.0" font-size="12.5" fill="#334155" text-anchor="middle">index · CMK</text>
  <rect x="165" y="534" width="110" height="108" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="220.0" y="576.0" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Documents</text>
  <text x="220.0" y="593.5" font-size="12.5" fill="#334155" text-anchor="middle">ACL</text>
  <text x="220.0" y="611.0" font-size="12.5" fill="#334155" text-anchor="middle">metadata</text>
  <rect x="285" y="534" width="105" height="108" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="337.5" y="576.0" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Memory</text>
  <text x="337.5" y="593.5" font-size="12.5" fill="#334155" text-anchor="middle">scoped</text>
  <text x="337.5" y="611.0" font-size="12.5" fill="#334155" text-anchor="middle">TTL</text>
  <rect x="420" y="514" width="380" height="160" rx="14" fill="#f7faff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="434" y="666" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start">Model zone (private)</text>
  <rect x="435" y="534" width="180" height="108" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="525.0" y="567.75" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Model endpoints</text>
  <text x="525.0" y="585.25" font-size="12.5" fill="#1e3a8a" text-anchor="middle">private endpoint</text>
  <text x="525.0" y="602.75" font-size="12.5" fill="#1e3a8a" text-anchor="middle">approved models only</text>
  <text x="525.0" y="620.25" font-size="12.5" fill="#1e3a8a" text-anchor="middle">no training on data</text>
  <rect x="625" y="534" width="160" height="108" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="705.0" y="575.5" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Guardrail service</text>
  <text x="705.0" y="593.0" font-size="12.5" fill="#166534" text-anchor="middle">prompt attacks</text>
  <text x="705.0" y="610.5" font-size="12.5" fill="#166534" text-anchor="middle">PII · content</text>
  <rect x="815" y="514" width="355" height="160" rx="14" fill="#fffdf6" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="829" y="666" font-size="13" font-weight="700" fill="#92400e" text-anchor="start">Tool zone</text>
  <rect x="830" y="534" width="160" height="108" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="910.0" y="576.0" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Tool servers</text>
  <text x="910.0" y="593.5" font-size="12.5" fill="#92400e" text-anchor="middle">read-only first</text>
  <text x="910.0" y="611.0" font-size="12.5" fill="#92400e" text-anchor="middle">own identities</text>
  <rect x="1005" y="534" width="150" height="108" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1080.0" y="576.0" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Egress proxy</text>
  <text x="1080.0" y="593.5" font-size="12.5" fill="#166534" text-anchor="middle">allowlist only</text>
  <text x="1080.0" y="611.0" font-size="12.5" fill="#166534" text-anchor="middle">deny by default</text>
  <rect x="30" y="684" width="1140" height="124" rx="14" fill="#fbfcfd" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="704" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Shared security platform</text>
  <rect x="60" y="714" width="195" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="157.5" y="740.5" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Key management</text>
  <text x="157.5" y="758.0" font-size="12.5" fill="#166534" text-anchor="middle">KMS / HSM · CMK</text>
  <text x="157.5" y="775.5" font-size="12.5" fill="#166534" text-anchor="middle">rotation · owners</text>
  <rect x="270" y="714" width="180" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="360.0" y="740.5" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Secrets manager</text>
  <text x="360.0" y="758.0" font-size="12.5" fill="#166534" text-anchor="middle">fetched by workload</text>
  <text x="360.0" y="775.5" font-size="12.5" fill="#166534" text-anchor="middle">identity, rotated</text>
  <rect x="465" y="714" width="215" height="76" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="572.5" y="740.5" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Audit and telemetry</text>
  <text x="572.5" y="758.0" font-size="12.5" fill="#334155" text-anchor="middle">immutable · redacted</text>
  <text x="572.5" y="775.5" font-size="12.5" fill="#334155" text-anchor="middle">correlation IDs</text>
  <rect x="695" y="714" width="200" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="795.0" y="740.5" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">SIEM / SOAR</text>
  <text x="795.0" y="758.0" font-size="12.5" fill="#166534" text-anchor="middle">detections</text>
  <text x="795.0" y="775.5" font-size="12.5" fill="#166534" text-anchor="middle">playbooks · kill switch</text>
  <rect x="910" y="714" width="230" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1025.0" y="740.5" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Policy as code / CI</text>
  <text x="1025.0" y="758.0" font-size="12.5" fill="#166534" text-anchor="middle">IaC scans · arch review</text>
  <text x="1025.0" y="775.5" font-size="12.5" fill="#166534" text-anchor="middle">eval + red-team gates</text>
  <path d="M600 189 L600 211 L365 211 L365 250" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M440 289 L468 289" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
