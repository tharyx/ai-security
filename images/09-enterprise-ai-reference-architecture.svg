  <path d="M520 331 L520 352 L160 352 L160 328" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="300" y="345" font-size="11" fill="#475569" text-anchor="start">verify token (OIDC / JWKS)</text>
  <path d="M700 331 L700 362 L470 362 L470 394" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M345 437 L322 437" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M595 437 L618 437" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M870 437 L893 437" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M100 478 L100 532" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M220 478 L220 532" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M375 478 L375 504 L337 504 L337 532" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M470 478 L470 532" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M745 478 L745 504 L910 504 L910 532" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M990 588 L1003 588" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M680 752 L693 752" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M60 157 L42 157 L42 437 L58 437" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <circle cx="612" cy="200" r="11" fill="#0f172a"/>
  <text x="612" y="204.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="275" cy="352" r="11" fill="#0f172a"/>
  <text x="275" y="356.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="835" cy="262" r="11" fill="#0f172a"/>
  <text x="835" y="266.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="582" cy="410" r="11" fill="#0f172a"/>
  <text x="582" y="414.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="307" cy="410" r="11" fill="#0f172a"/>
  <text x="307" y="414.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <circle cx="600" cy="546" r="11" fill="#0f172a"/>
  <text x="600" y="550.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <circle cx="857" cy="410" r="11" fill="#0f172a"/>
  <text x="857" y="414.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <circle cx="1127" cy="410" r="11" fill="#0f172a"/>
  <text x="1127" y="414.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
  <rect x="40" y="826" width="16" height="16" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="62" y="839" font-size="13" fill="#475569" text-anchor="start">Untrusted / attacker</text>
  <rect x="227.0" y="826" width="16" height="16" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="249.0" y="839" font-size="13" fill="#475569" text-anchor="start">Application / semi-trusted</text>
  <rect x="456.9" y="826" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="478.9" y="839" font-size="13" fill="#475569" text-anchor="start">Trusted core / model</text>
  <rect x="643.9" y="826" width="16" height="16" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="665.9" y="839" font-size="13" fill="#475569" text-anchor="start">Security control (hard)</text>
  <rect x="852.35" y="826" width="16" height="16" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="874.35" y="839" font-size="13" fill="#475569" text-anchor="start">Neutral / data store</text>
  <text x="40" y="868" font-size="13" fill="#475569" text-anchor="start">Request flow: 1 SSO user reaches the gateway · 2 token verified, PDP decides · 3 quotas + input guardrail · 4 agent plans</text>
  <text x="40" y="890" font-size="13" fill="#475569" text-anchor="start">5 retrieval filtered by tenant + groups before ranking · 6 model via private endpoint · 7 tool call checked at one choke point · 8 human approves writes</text>
  <text x="40" y="918" font-size="13" fill="#991b1b" text-anchor="start">Red dashed line: untrusted content enters through ingestion. Every box sends events with a correlation ID to Audit and telemetry.</text>
</svg>
