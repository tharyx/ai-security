<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Defense in depth around a coding or computer-use agent: approval, policy, sandbox, workspace, egress and audit</title>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Layers around the agent</text>
  <text x="40" y="76" font-size="16" fill="#475569">Assume the model WILL be fooled. Each layer is code or a person, not a prompt.</text>
  <rect x="40" y="100" width="760" height="420" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="58" y="126" font-size="15" font-weight="700" fill="#166534">Container or kernel sandbox (no secrets, non-root, resource limits)</text>
  <rect x="70" y="146" width="700" height="350" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="88" y="172" font-size="15" font-weight="700" fill="#1e40af">Workspace scope (only the project directory is mounted, symlinks resolved)</text>
  <rect x="100" y="192" width="300" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="118" y="220" font-size="16" font-weight="700" fill="#0f172a">Agent harness</text>
  <text x="118" y="244" font-size="14" fill="#0f172a">LLM (untrusted proposals)</text>
  <text x="118" y="264" font-size="14" fill="#0f172a">reads repo, pages, skills</text>
  <text x="118" y="284" font-size="14" fill="#991b1b">= attacker-controlled text</text>
  <text x="118" y="318" font-size="13" fill="#475569">proposes tool calls</text>
  <line x1="400" y1="267" x2="470" y2="267" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="192" width="270" height="150" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="488" y="220" font-size="16" font-weight="700" fill="#0f172a">Policy layer (out of process)</text>
  <text x="488" y="244" font-size="14" fill="#0f172a">schema check, allowlist,</text>
  <text x="488" y="264" font-size="14" fill="#0f172a">path rules, taint rules</text>
  <text x="488" y="288" font-size="14" fill="#0f172a">decision: allow / deny /</text>
  <text x="488" y="308" font-size="14" fill="#0f172a">ask a human (hash-bound)</text>
  <line x1="605" y1="342" x2="605" y2="380" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="380" width="270" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="488" y="408" font-size="15" font-weight="700" fill="#0f172a">Egress allowlist</text>
  <text x="488" y="432" font-size="14" fill="#0f172a">only named hosts; everything</text>
  <text x="488" y="452" font-size="14" fill="#0f172a">else is dropped</text>
  <rect x="100" y="380" width="300" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="118" y="408" font-size="15" font-weight="700" fill="#0f172a">Audit log (outside the sandbox)</text>
  <text x="118" y="432" font-size="14" fill="#0f172a">every proposal and decision,</text>
  <text x="118" y="452" font-size="14" fill="#0f172a">tamper-evident, with approver</text>
  <line x1="800" y1="445" x2="880" y2="445" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="880" y="400" width="280" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="898" y="430" font-size="15" font-weight="700" fill="#0f172a">Internet: allowed hosts only</text>
  <text x="898" y="454" font-size="14" fill="#0f172a">model API, package index</text>
  <rect x="880" y="130" width="280" height="130" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="898" y="158" font-size="16" font-weight="700" fill="#0f172a">Human approval</text>
  <text x="898" y="182" font-size="14" fill="#0f172a">Shows the exact action.</text>
  <text x="898" y="202" font-size="14" fill="#0f172a">No answer in time = deny.</text>
  <text x="898" y="222" font-size="14" fill="#0f172a">Approval bound to the hash.</text>
  <line x1="740" y1="230" x2="880" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="880" y="300" font-size="14" fill="#0f172a">Secrets stay outside:</text>
  <text x="880" y="322" font-size="14" fill="#0f172a">a broker adds short-lived</text>
  <text x="880" y="342" font-size="14" fill="#0f172a">credentials per call.</text>
</svg>
