<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>AI security engineering roadmap: 10 modules over 36 weeks</title>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">AI Security Engineering Roadmap</text>
  <text x="40" y="80" font-size="16" fill="#475569">36 weeks · each layer builds on the one below · every module ends with a lab you can run and a phase gate</text>

  <!-- Layer: prove -->
  <rect x="40" y="110" width="1120" height="70" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="60" y="140" font-size="13" font-weight="700" fill="#4338ca">PROVE</text>
  <text x="600" y="143" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">10 · Capstone: secure AI operations assistant + architecture defense</text>
  <text x="600" y="166" text-anchor="middle" font-size="13" fill="#4338ca">weeks 33–36</text>

  <!-- Layer: govern -->
  <rect x="40" y="195" width="550" height="70" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="60" y="225" font-size="13" font-weight="700" fill="#7e22ce">GOVERN</text>
  <text x="315" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#581c87">07 · AI Governance</text>
  <text x="315" y="250" text-anchor="middle" font-size="13" fill="#7e22ce">inventory · NIST AI RMF · ISO 42001 · wk 29–30</text>
  <rect x="610" y="195" width="550" height="70" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="885" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#581c87">08 · AI Compliance</text>
  <text x="885" y="250" text-anchor="middle" font-size="13" fill="#7e22ce">EU AI Act · GDPR / DPDP · evidence · wk 31–32</text>

  <!-- Layer: operate -->
  <rect x="40" y="280" width="550" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="310" font-size="13" font-weight="700" fill="#15803d">OPERATE</text>
  <text x="315" y="313" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">06 · AI DevSecOps</text>
  <text x="315" y="335" text-anchor="middle" font-size="13" fill="#15803d">Terraform · Docker · Kubernetes · CI/CD · wk 21–24</text>
  <rect x="610" y="280" width="550" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="885" y="313" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">09 · Enterprise Architecture</text>
  <text x="885" y="335" text-anchor="middle" font-size="13" fill="#15803d">reference arch · AWS · Azure · GCP · wk 25–28</text>

  <!-- Layer: build secure (four pillars) -->
  <text x="60" y="390" font-size="13" font-weight="700" fill="#b45309">BUILD SECURE</text>
  <rect x="40" y="400" width="265" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="172" y="435" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">02 · LLM Security</text>
  <text x="172" y="460" text-anchor="middle" font-size="13" fill="#92400e">injection · jailbreak</text>
  <text x="172" y="480" text-anchor="middle" font-size="13" fill="#92400e">leakage · red-team testing</text>
  <text x="172" y="500" text-anchor="middle" font-size="12" fill="#b45309">wk 5–8</text>

  <rect x="325" y="400" width="265" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="457" y="435" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">03 · RAG Security</text>
  <text x="457" y="460" text-anchor="middle" font-size="13" fill="#92400e">documents · vector DB</text>
  <text x="457" y="480" text-anchor="middle" font-size="13" fill="#92400e">access control</text>
  <text x="457" y="500" text-anchor="middle" font-size="12" fill="#b45309">wk 9–12</text>

  <rect x="610" y="400" width="265" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="742" y="435" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">04 · MCP Security</text>
  <text x="742" y="460" text-anchor="middle" font-size="13" fill="#92400e">servers · authentication</text>
  <text x="742" y="480" text-anchor="middle" font-size="13" fill="#92400e">tool security</text>
  <text x="742" y="500" text-anchor="middle" font-size="12" fill="#b45309">wk 13–16</text>

  <rect x="895" y="400" width="265" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1027" y="435" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">05 · Agent Security</text>
  <text x="1027" y="460" text-anchor="middle" font-size="13" fill="#92400e">identity · permissions</text>
  <text x="1027" y="480" text-anchor="middle" font-size="13" fill="#92400e">sandboxing</text>
  <text x="1027" y="500" text-anchor="middle" font-size="12" fill="#b45309">wk 17–20</text>

  <!-- Foundation -->
  <rect x="40" y="525" width="1120" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="555" font-size="13" font-weight="700" fill="#1d4ed8">FOUNDATION</text>
  <text x="600" y="558" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">01 · AI Security Fundamentals: how AI systems work, trust boundaries, threat modeling</text>
  <text x="600" y="581" text-anchor="middle" font-size="13" fill="#1d4ed8">weeks 1–4</text>

  <text x="40" y="625" font-size="14" fill="#475569">Study loop for every topic: Understand → Draw → Threat-model → Build → Attack (lab) → Defend → Test → Document</text>
</svg>
