<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Pyramid of Pain</title>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">Pyramid of Pain</text>
  <text x="40" y="78" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">The higher you detect, the more it hurts the attacker to change.</text>
  <rect x="505.0" y="105" width="190" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600.0" y="131" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">TTPs</text>
  <text x="1060" y="142" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="start">Tough!</text>
  <rect x="435.0" y="175" width="330" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600.0" y="201" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Tools</text>
  <text x="1060" y="212" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="start">Challenging</text>
  <rect x="365.0" y="245" width="470" height="62" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600.0" y="271" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Network/host artifacts</text>
  <text x="1060" y="282" font-size="15" font-weight="bold" fill="#d97706" text-anchor="start">Annoying</text>
  <rect x="295.0" y="315" width="610" height="62" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600.0" y="341" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Domain names</text>
  <text x="1060" y="352" font-size="15" font-weight="bold" fill="#d97706" text-anchor="start">Simple</text>
  <rect x="225.0" y="385" width="750" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="600.0" y="411" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">IP addresses</text>
  <text x="1060" y="422" font-size="15" font-weight="bold" fill="#64748b" text-anchor="start">Easy</text>
  <rect x="155.0" y="455" width="890" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="600.0" y="481" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Hash values</text>
  <text x="1060" y="492" font-size="15" font-weight="bold" fill="#64748b" text-anchor="start">Trivial</text>
  <text x="40" y="540" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">Hashes and IPs are IOCs: easy to match, easy to change. TTPs are behaviors (IOAs): the attacker must change how they work.</text>
</svg>
