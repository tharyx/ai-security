<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Observability for agent decisions</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect width="1200" height="470" fill="#ffffff"/>
<text x="40" y="48" font-size="28" font-weight="bold" fill="#0f172a">Observability for agent decisions</text>
<text x="40" y="76" font-size="16" fill="#475569">Trace plan, tool and decision steps; compare with a baseline; treat trace text as untrusted</text>
<rect x="40" y="140" width="200" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="140.0" y="169.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Agent runtime</text>
<text x="140.0" y="187.0" text-anchor="middle" font-size="12" fill="#475569">spans: plan, llm,</text>
<text x="140.0" y="203.0" text-anchor="middle" font-size="12" fill="#475569">tool, decision</text>
<rect x="300" y="140" width="200" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="400.0" y="169.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Trace store</text>
<text x="400.0" y="187.0" text-anchor="middle" font-size="12" fill="#475569">JSON / OTel-like</text>
<text x="400.0" y="203.0" text-anchor="middle" font-size="12" fill="#475569">redact secrets</text>
<rect x="560" y="140" width="220" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="670.0" y="169.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Baseline profile</text>
<text x="670.0" y="187.0" text-anchor="middle" font-size="12" fill="#475569">tool mix, step count,</text>
<text x="670.0" y="203.0" text-anchor="middle" font-size="12" fill="#475569">known decisions</text>
<rect x="840" y="140" width="240" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="960.0" y="169.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Drift detector</text>
<text x="960.0" y="187.0" text-anchor="middle" font-size="12" fill="#475569">new tool, TVD, z-score,</text>
<text x="960.0" y="203.0" text-anchor="middle" font-size="12" fill="#475569">new decision</text>
<line x1="240" y1="180" x2="300" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="500" y1="180" x2="560" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="780" y1="180" x2="840" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="300" y="300" width="260" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="430.0" y="337.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Dashboard (static HTML)</text>
<text x="430.0" y="355.0" text-anchor="middle" font-size="12" fill="#475569">html.escape everything</text>
<rect x="640" y="300" width="260" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="770.0" y="337.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Alert + response</text>
<text x="770.0" y="355.0" text-anchor="middle" font-size="12" fill="#475569">pause, revoke, review</text>
<line x1="960" y1="220" x2="900" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="340" x2="640" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="430" text-anchor="start" font-size="13" fill="#475569">See labs/agent-observability-dashboard.</text>
</svg>
