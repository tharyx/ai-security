<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>From threat to requirement to test to evidence</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">From threat to evidence: make every risk testable</text>
  <text x="40" y="80" font-size="16" fill="#475569">A threat model is only useful when each high risk ends in a requirement, a test and proof that the test keeps passing.</text>

  <!-- headers -->
  <rect x="37" y="105" width="206" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">1 Threat</text>
  <rect x="267" y="105" width="206" height="54" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="370" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">2 Requirement</text>
  <rect x="497" y="105" width="206" height="54" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">3 Control + test</text>
  <rect x="727" y="105" width="206" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="830" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">4 Evidence</text>
  <rect x="957" y="105" width="206" height="54" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1060" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">5 Monitor</text>
  <path d="M243 132 L261 132" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M473 132 L491 132" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M703 132 L721 132" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M933 132 L951 132" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- example column cards -->
  <g font-size="12" fill="#0f172a">
    <rect x="37" y="175" width="206" height="210" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="50" y="200">A user of tenant A can read</text>
    <text x="50" y="218">tenant B's documents through</text>
    <text x="50" y="236">the shared vector index,</text>
    <text x="50" y="254">because retrieval has no</text>
    <text x="50" y="272">tenant filter. Impact: data</text>
    <text x="50" y="290">breach, contract breach.</text>
    <text x="50" y="320" font-weight="700" fill="#991b1b">STRIDE: I · OWASP LLM08</text>
    <text x="50" y="340" font-weight="700" fill="#991b1b">Risk: 4 x 5 = 20 critical</text>

    <rect x="267" y="175" width="206" height="210" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="280" y="200" font-weight="700">REQ-RAG-01</text>
    <text x="280" y="222">Retrieval MUST filter by</text>
    <text x="280" y="240">tenant_id taken from the</text>
    <text x="280" y="258">verified session, inside the</text>
    <text x="280" y="276">query, before ranking.</text>
    <text x="280" y="306">Owner: Platform team</text>
    <text x="280" y="324">Due: before launch</text>

    <rect x="497" y="175" width="206" height="210" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="510" y="200">Control: tenant filter in</text>
    <text x="510" y="218">the vector DB query.</text>
    <text x="510" y="248" font-weight="700">Test (CI):</text>
    <text x="510" y="266">user A runs 50 queries that</text>
    <text x="510" y="284">match B's canary docs;</text>
    <text x="510" y="302">assert 0 chunks from B.</text>
    <text x="510" y="332">Negative test: filter off</text>
    <text x="510" y="350">-&gt; test must fail.</text>

    <rect x="727" y="175" width="206" height="210" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="740" y="200">CI run history, kept with</text>
    <text x="740" y="218">the release.</text>
    <text x="740" y="248">Config snapshot of the</text>
    <text x="740" y="266">index and filter.</text>
    <text x="740" y="296">Risk register row updated</text>
    <text x="740" y="314">with the test link.</text>

    <rect x="957" y="175" width="206" height="210" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="970" y="200">Alert if an answer cites a</text>
    <text x="970" y="218">chunk whose tenant_id is</text>
    <text x="970" y="236">not the caller's.</text>
    <text x="970" y="266">Canary documents per</text>
    <text x="970" y="284">tenant; alert on any hit.</text>
    <text x="970" y="314">Re-test on every index or</text>
    <text x="970" y="332">model change.</text>
  </g>

  <rect x="37" y="405" width="1126" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="57" y="434" font-size="14" fill="#0f172a"><tspan font-weight="700">A good requirement</tspan> is specific, uses MUST, names the enforcing component, is testable by code, has an owner,</text>
  <text x="57" y="458" font-size="14" fill="#0f172a">and traces back to a threat. "The model should not leak data" fails all of these.</text>
</svg>
