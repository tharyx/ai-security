<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Container image pipeline with security gates</title><desc>Seven-stage container pipeline with lint, scan, sign, registry, admission and runtime controls.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1200" height="400" fill="#ffffff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Container image pipeline with security gates</text><rect x="40" y="130" width="140" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="110.0" y="170.66666666666666" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Dockerfile</text><text x="110.0" y="188.66666666666666" font-size="14" fill="#475569" text-anchor="middle">Hadolint</text><line x1="180" y1="175" x2="200" y2="175" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="200" y="130" width="140" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="270.0" y="170.66666666666666" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Build</text><text x="270.0" y="188.66666666666666" font-size="14" fill="#475569" text-anchor="middle">BuildKit / kaniko</text><line x1="340" y1="175" x2="360" y2="175" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="360" y="130" width="140" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="430.0" y="170.66666666666666" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Scan</text><text x="430.0" y="188.66666666666666" font-size="14" fill="#475569" text-anchor="middle">SBOM + Trivy gate</text><line x1="500" y1="175" x2="520" y2="175" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="520" y="130" width="140" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="590.0" y="170.66666666666666" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Sign</text><text x="590.0" y="188.66666666666666" font-size="14" fill="#475569" text-anchor="middle">cosign / Notation</text><line x1="660" y1="175" x2="680" y2="175" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="680" y="130" width="140" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="750.0" y="170.66666666666666" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Registry</text><text x="750.0" y="188.66666666666666" font-size="14" fill="#475569" text-anchor="middle">RBAC, scan, policy</text><line x1="820" y1="175" x2="840" y2="175" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="840" y="130" width="140" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="910.0" y="170.66666666666666" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Admit</text><text x="910.0" y="188.66666666666666" font-size="14" fill="#475569" text-anchor="middle">verify signature</text><line x1="980" y1="175" x2="1000" y2="175" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="1000" y="130" width="140" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1070.0" y="170.66666666666666" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Run</text><text x="1070.0" y="188.66666666666666" font-size="14" fill="#475569" text-anchor="middle">seccomp, Falco</text><text x="40" y="280" font-size="16" fill="#0f172a" text-anchor="start">Gates fail the build or block the deploy; every artefact (report, SBOM, signature) is kept.</text><text x="40" y="310" font-size="16" fill="#475569" text-anchor="start">Rescan running inventory daily: new CVEs appear after release. Rebuild base images on a schedule.</text><text x="40" y="340" font-size="16" fill="#475569" text-anchor="start">Never build by mounting docker.sock into the CI job: use a rootless or daemonless builder.</text></svg>