<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Agentic pipeline map with trust boundaries and threat points</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">The agentic pipeline and its trust boundaries</text>
  <text x="40" y="74" font-size="16" fill="#475569">Red dashed lines are trust boundaries. Numbers are the threat points explained in lesson 03.</text>

  <!-- zone 1: untrusted inputs -->
  <rect x="30" y="100" width="230" height="500" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="50" y="128" font-size="15" font-weight="700" fill="#991b1b">ZONE A: untrusted content</text>
  <rect x="50" y="150" width="190" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="145" y="175" text-anchor="middle" font-size="14" fill="#991b1b">Web pages, email,</text>
  <text x="145" y="194" text-anchor="middle" font-size="14" fill="#991b1b">tickets, documents</text>
  <rect x="50" y="230" width="190" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="145" y="255" text-anchor="middle" font-size="14" fill="#991b1b">Skill / plugin hubs,</text>
  <text x="145" y="274" text-anchor="middle" font-size="14" fill="#991b1b">package registries</text>
  <rect x="50" y="310" width="190" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="145" y="335" text-anchor="middle" font-size="14" fill="#991b1b">Other agents' messages</text>
  <text x="145" y="354" text-anchor="middle" font-size="14" fill="#991b1b">(A2A, chat bridges)</text>
  <rect x="50" y="390" width="190" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="145" y="415" text-anchor="middle" font-size="14" fill="#991b1b">Local network and</text>
  <text x="145" y="434" text-anchor="middle" font-size="14" fill="#991b1b">internet scanners</text>
  <text x="50" y="480" font-size="12" fill="#991b1b">1 Indirect injection</text>
  <text x="50" y="500" font-size="12" fill="#991b1b">2 Malicious skills (supply chain)</text>
  <text x="50" y="520" font-size="12" fill="#991b1b">3 Forged peer messages</text>
  <text x="50" y="540" font-size="12" fill="#991b1b">4 Exposed gateway or port</text>

  <!-- zone 2: harness -->
  <rect x="300" y="100" width="420" height="500" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="320" y="128" font-size="15" font-weight="700" fill="#92400e">ZONE B: your harness (trusted code)</text>
  <rect x="325" y="150" width="170" height="60" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Gateway / UI</text>
  <text x="410" y="196" text-anchor="middle" font-size="12" fill="#92400e">auth, pairing, tokens</text>
  <rect x="525" y="150" width="170" height="60" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="610" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Loop + policy</text>
  <text x="610" y="196" text-anchor="middle" font-size="12" fill="#92400e">budgets, approvals</text>
  <rect x="325" y="240" width="170" height="60" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Memory + config</text>
  <text x="410" y="286" text-anchor="middle" font-size="12" fill="#92400e">notes, keys on disk</text>
  <rect x="525" y="240" width="170" height="60" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="610" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Tool registry</text>
  <text x="610" y="286" text-anchor="middle" font-size="12" fill="#92400e">skills, MCP client</text>
  <rect x="325" y="330" width="370" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="510" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Model (local or routed): treat its OUTPUT as untrusted</text>
  <text x="510" y="376" text-anchor="middle" font-size="12" fill="#1e3a8a">it reads attacker text and proposes actions</text>
  <text x="325" y="430" font-size="12" fill="#92400e">5 Goal hijack: injected text changes the plan</text>
  <text x="325" y="450" font-size="12" fill="#92400e">6 Memory poisoning: bad notes persist</text>
  <text x="325" y="470" font-size="12" fill="#92400e">7 Runaway loop: cost and repeated side effects</text>
  <text x="325" y="490" font-size="12" fill="#92400e">8 Plain-text secrets, over-broad config</text>
  <text x="325" y="510" font-size="12" fill="#92400e">9 Prompts leave the boundary to a routed model</text>

  <!-- zone 3: tools and world -->
  <rect x="760" y="100" width="410" height="500" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="780" y="128" font-size="15" font-weight="700" fill="#166534">ZONE C: tools and the world (real effects)</text>
  <rect x="785" y="150" width="170" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="870" y="175" text-anchor="middle" font-size="14" fill="#166534">MCP servers</text>
  <text x="870" y="194" text-anchor="middle" font-size="12" fill="#166534">third-party code</text>
  <rect x="975" y="150" width="170" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1060" y="175" text-anchor="middle" font-size="14" fill="#166534">Shell / code runner</text>
  <text x="1060" y="194" text-anchor="middle" font-size="12" fill="#166534">sandbox or host?</text>
  <rect x="785" y="230" width="170" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="870" y="255" text-anchor="middle" font-size="14" fill="#166534">Mail, chat, calendar</text>
  <text x="870" y="274" text-anchor="middle" font-size="12" fill="#166534">irreversible sends</text>
  <rect x="975" y="230" width="170" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1060" y="255" text-anchor="middle" font-size="14" fill="#166534">Cloud / SaaS APIs</text>
  <text x="1060" y="274" text-anchor="middle" font-size="12" fill="#166534">agent's own credentials</text>
  <rect x="785" y="310" width="360" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="965" y="335" text-anchor="middle" font-size="14" fill="#166534">Files, databases, browser sessions</text>
  <text x="965" y="354" text-anchor="middle" font-size="12" fill="#166534">private data the agent can read</text>
  <text x="785" y="410" font-size="12" fill="#166534">10 Tool misuse: right tool, wrong target</text>
  <text x="785" y="430" font-size="12" fill="#166534">11 Privilege abuse: shared or broad tokens</text>
  <text x="785" y="450" font-size="12" fill="#166534">12 Code execution with the agent's secrets</text>
  <text x="785" y="470" font-size="12" fill="#166534">13 Exfiltration over any allowed channel</text>

  <line x1="260" y1="180" x2="323" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="260" y1="340" x2="323" y2="340" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="250" x2="783" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="280" y="170" text-anchor="middle" font-size="12" fill="#991b1b">B1</text>
  <text x="750" y="240" text-anchor="middle" font-size="12" fill="#991b1b">B2</text>

  <text x="40" y="636" font-size="14" fill="#475569">B1: untrusted content crosses into the context. B2: model proposals cross into real effects. Both crossings need deterministic checks.</text>
  <text x="40" y="660" font-size="14" fill="#475569">Break the trifecta where you can: private data + untrusted content + an outbound channel in one session is the dangerous mix.</text>
</svg>
