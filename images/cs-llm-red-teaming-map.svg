<text x="790" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">Scoring</text>
<text x="658" y="136" font-size="13.5" fill="#111827">• Benchmarks + own test set</text>
<text x="658" y="160" font-size="13.5" fill="#111827">• Severity Low→Critical</text>
<text x="658" y="184" font-size="13.5" fill="#111827">• ASR · coverage · false refusals</text>
