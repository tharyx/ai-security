<text x="170" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#db2777">What to test</text>
<text x="38" y="124" font-size="13.5" fill="#111827">• Harmful content</text>
<text x="38" y="148" font-size="13.5" fill="#111827">• Bias &amp; toxicity</text>
<text x="38" y="172" font-size="13.5" fill="#111827">• Hallucination</text>
<text x="38" y="196" font-size="13.5" fill="#111827">• PII &amp; leaks</text>
<rect x="20" y="332" width="300" height="136" rx="12" fill="#f9fafb" stroke="#7c3aed" stroke-width="2"/>
<text x="170" y="358" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c3aed">Methods</text>
<text x="38" y="384" font-size="13.5" fill="#111827">• Manual probing</text>
<text x="38" y="408" font-size="13.5" fill="#111827">• Attack tools (PyRIT, garak, promptfoo)</text>
<text x="38" y="432" font-size="13.5" fill="#111827">• Multi-turn</text>
<text x="38" y="456" font-size="13.5" fill="#111827">• Personas</text>
