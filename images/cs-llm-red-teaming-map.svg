<text x="790" y="370" text-anchor="middle" font-size="17" font-weight="bold" fill="#ea580c">Fixes</text>
<text x="658" y="396" font-size="13.5" fill="#111827">• Guardrails · filters · system prompts</text>
<text x="658" y="420" font-size="13.5" fill="#111827">• Fine-tuning (model owner)</text>
<text x="658" y="444" font-size="13.5" fill="#111827">• Retest loop · bug bounty · playbook</text>
<text x="480" y="502" text-anchor="middle" font-size="14" fill="#374151">Map findings to: OWASP LLM Top 10 · MITRE ATLAS · NIST AI 600-1 · EU AI Act</text>
