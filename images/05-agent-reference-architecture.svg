<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Secure agent reference architecture</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Secure agent reference architecture</text>
<text x="40" y="80" font-size="16" fill="#475569">Planner and executor inside a box of hard controls: identity, policy, approval, tool broker, sandbox, memory, audit</text>
<rect x="40" y="150" width="170" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="125.0" y="186" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">User</text>
<text x="125.0" y="208" font-size="13" text-anchor="middle" fill="#1e3a8a">the principal</text>
<rect x="40" y="400" width="170" height="130" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="125.0" y="442" font-size="16" font-weight="700" text-anchor="middle" fill="#991b1b">Untrusted input</text>
<text x="125.0" y="464" font-size="13" text-anchor="middle" fill="#991b1b">web pages, email,</text>
<text x="125.0" y="484" font-size="13" text-anchor="middle" fill="#991b1b">documents, tool</text>
<text x="125.0" y="502" font-size="13" text-anchor="middle" fill="#991b1b">output, other agents</text>
<rect x="250" y="115" width="350" height="470" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="10 6"/>
<text x="270" y="142" font-size="15" font-weight="700" fill="#92400e">Agent runtime (semi-trusted)</text>
<rect x="275" y="160" width="300" height="95" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
<text x="425.0" y="194" font-size="16" font-weight="700" text-anchor="middle" fill="#334155">Planner (LLM)</text>
<text x="425.0" y="216" font-size="13" text-anchor="middle" fill="#334155">proposes the next action</text>
<text x="425.0" y="236" font-size="13" text-anchor="middle" fill="#334155">assume it can be fooled</text>
<rect x="275" y="290" width="300" height="95" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="425.0" y="324" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">Executor loop</text>
<text x="425.0" y="346" font-size="13" text-anchor="middle" fill="#166534">step, time, cost budgets</text>
<text x="425.0" y="366" font-size="13" text-anchor="middle" fill="#166534">loop detection, taint tracking</text>
<rect x="275" y="420" width="300" height="140" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="425.0" y="458" font-size="16" font-weight="700" text-anchor="middle" fill="#334155">Memory</text>
<text x="425.0" y="480" font-size="13" text-anchor="middle" fill="#334155">provenance on every note</text>
<text x="425.0" y="499" font-size="13" text-anchor="middle" fill="#334155">scoped per user and tenant</text>
<text x="425.0" y="518" font-size="13" text-anchor="middle" fill="#334155">untrusted text never becomes</text>
<text x="425.0" y="537" font-size="13" text-anchor="middle" fill="#334155">instructions</text>
<rect x="650" y="120" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="765.0" y="152" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">Identity service</text>
<text x="765.0" y="174" font-size="13" text-anchor="middle" fill="#166534">short-lived token per</text>
<text x="765.0" y="193" font-size="13" text-anchor="middle" fill="#166534">agent + session + user</text>
<rect x="650" y="240" width="230" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="765.0" y="272" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">Policy engine</text>
<text x="765.0" y="294" font-size="13" text-anchor="middle" fill="#166534">allow / deny / approval</text>
<text x="765.0" y="314" font-size="13" text-anchor="middle" fill="#166534">ABAC, risk tiers,</text>
<text x="765.0" y="332" font-size="13" text-anchor="middle" fill="#166534">default deny</text>
<rect x="650" y="380" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="765.0" y="412" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">Human approval</text>
<text x="765.0" y="434" font-size="13" text-anchor="middle" fill="#166534">shows the exact action</text>
<text x="765.0" y="453" font-size="13" text-anchor="middle" fill="#166534">bound to its hash</text>
<rect x="650" y="500" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="765.0" y="532" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">Tool broker</text>
<text x="765.0" y="554" font-size="13" text-anchor="middle" fill="#166534">schema check, credential</text>
<text x="765.0" y="573" font-size="13" text-anchor="middle" fill="#166534">injection, egress allowlist</text>
<rect x="930" y="120" width="230" height="100" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1045.0" y="157" font-size="16" font-weight="700" text-anchor="middle" fill="#334155">Audit log</text>
<text x="1045.0" y="179" font-size="13" text-anchor="middle" fill="#334155">user + agent chain +</text>
<text x="1045.0" y="198" font-size="13" text-anchor="middle" fill="#334155">decision, hash-chained</text>
<rect x="930" y="250" width="230" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="1045.0" y="287" font-size="16" font-weight="700" text-anchor="middle" fill="#991b1b">Kill switch</text>
<text x="1045.0" y="309" font-size="13" text-anchor="middle" fill="#991b1b">stop runs, revoke tokens,</text>
<text x="1045.0" y="328" font-size="13" text-anchor="middle" fill="#991b1b">disable an agent</text>
<rect x="930" y="400" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1045.0" y="432" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">Sandbox</text>
<text x="1045.0" y="454" font-size="13" text-anchor="middle" fill="#166534">process, container, gVisor,</text>
<text x="1045.0" y="473" font-size="13" text-anchor="middle" fill="#166534">microVM: no secrets inside</text>
<rect x="930" y="520" width="230" height="80" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1045.0" y="556" font-size="16" font-weight="700" text-anchor="middle" fill="#334155">Tools and APIs</text>
<text x="1045.0" y="578" font-size="13" text-anchor="middle" fill="#334155">re-check the user&#x27;s rights</text>
<polyline points="210,190 275,200" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="210,465 240,465 240,230 275,230" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#r)"/>
<text x="110" y="555" font-size="12" text-anchor="middle" fill="#991b1b">data, never commands</text>
<polyline points="425,255 425,290" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="575,330 650,300" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="765,350 765,380" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="765,470 765,500" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="880,280 905,280 905,545 880,545" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<text x="912" y="500" font-size="12" fill="#166534">allow</text>
<polyline points="650,190 625,190 625,560 650,560" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#g)"/>
<text x="606" y="215" font-size="12" fill="#166534">token</text>
<polyline points="880,530 930,450" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="880,560 930,560" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="425,385 425,420" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="40" y="650" font-size="14" fill="#475569">The model only proposes. Identity, policy, approval, budgets, sandbox and audit are deterministic services outside it.</text>
<text x="40" y="675" font-size="14" fill="#475569">Every action carries the human AND the agent chain, and every service can be stopped from one kill switch.</text>
</svg>
