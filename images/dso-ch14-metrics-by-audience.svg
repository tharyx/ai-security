<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Same data, three views</title><desc>Three columns of metrics for executives, developers and the security team built from the same data.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1200" height="560" fill="#ffffff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Same data, three views</text><rect x="40" y="80" width="360" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="220.0" y="110.16666666666667" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">CXO</text><text x="220.0" y="131.16666666666669" font-size="17" fill="#475569" text-anchor="middle">Are we getting safer?</text><rect x="40" y="170" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="220.0" y="198.0" font-size="15" fill="#0f172a" text-anchor="middle">risk trend (months)</text><rect x="40" y="228" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="220.0" y="256.0" font-size="15" fill="#0f172a" text-anchor="middle">open critical / high</text><rect x="40" y="286" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="220.0" y="314.0" font-size="15" fill="#0f172a" text-anchor="middle">SLA compliance</text><rect x="40" y="344" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="220.0" y="372.0" font-size="15" fill="#0f172a" text-anchor="middle">breaches now</text><rect x="40" y="402" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="220.0" y="430.0" font-size="15" fill="#0f172a" text-anchor="middle">the ask: people or money</text><rect x="425" y="80" width="360" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="605.0" y="110.16666666666667" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Developers</text><text x="605.0" y="131.16666666666669" font-size="17" fill="#475569" text-anchor="middle">What do I fix first?</text><rect x="425" y="170" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="605.0" y="198.0" font-size="15" fill="#0f172a" text-anchor="middle">findings by repo and owner</text><rect x="425" y="228" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="605.0" y="256.0" font-size="15" fill="#0f172a" text-anchor="middle">exact fix and version</text><rect x="425" y="286" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="605.0" y="314.0" font-size="15" fill="#0f172a" text-anchor="middle">due date and SLA state</text><rect x="425" y="344" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="605.0" y="372.0" font-size="15" fill="#0f172a" text-anchor="middle">link in their tracker</text><rect x="425" y="402" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="605.0" y="430.0" font-size="15" fill="#0f172a" text-anchor="middle">their own MTTR trend</text><rect x="810" y="80" width="360" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="990.0" y="110.16666666666667" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Security team</text><text x="990.0" y="131.16666666666669" font-size="17" fill="#475569" text-anchor="middle">Is the process working?</text><rect x="810" y="170" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="990.0" y="198.0" font-size="15" fill="#0f172a" text-anchor="middle">open by severity and age</text><rect x="810" y="228" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="990.0" y="256.0" font-size="15" fill="#0f172a" text-anchor="middle">false-positive rate per tool</text><rect x="810" y="286" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="990.0" y="314.0" font-size="15" fill="#0f172a" text-anchor="middle">MTTR by severity</text><rect x="810" y="344" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="990.0" y="372.0" font-size="15" fill="#0f172a" text-anchor="middle">coverage (repos scanned)</text><rect x="810" y="402" width="360" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="990.0" y="430.0" font-size="15" fill="#0f172a" text-anchor="middle">exceptions and expiry</text><rect x="40" y="480" width="1120" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="600.0" y="510.0" font-size="15" fill="#0f172a" text-anchor="middle">One source of truth, defined once: every dashboard agrees. Never rank individuals by open findings.</text></svg>