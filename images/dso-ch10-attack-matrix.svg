<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Container Attack Matrix: tactics from Initial Access to Impact</title>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a">Container Attack Matrix (teaching summary)</text>
  <text x="40" y="70" font-size="15" fill="#475569">In the style of the Microsoft Threat Matrix for Kubernetes and the MITRE ATT&amp;CK Containers matrix. Verify the current versions at source.</text>
  <g font-size="12">
    <g transform="translate(40,96)"><rect width="118" height="40" rx="6" fill="#1e3a8a"/><text x="59" y="25" text-anchor="middle" fill="#ffffff" font-weight="700">Initial Access</text>
      <rect y="48" width="118" height="62" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="6" y="66" fill="#1e3a8a">Exposed API / UI</text><text x="6" y="82" fill="#1e3a8a">Vulnerable app</text><text x="6" y="98" fill="#1e3a8a">Bad image</text>
      <rect y="118" width="118" height="62" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="6" y="136" fill="#1e3a8a">Open registry</text><text x="6" y="152" fill="#1e3a8a">Typosquat image</text></g>
    <g transform="translate(168,96)"><rect width="118" height="40" rx="6" fill="#0f766e"/><text x="59" y="25" text-anchor="middle" fill="#ffffff" font-weight="700">Execution</text>
      <rect y="48" width="118" height="62" rx="6" fill="#f0fdfa" stroke="#0d9488"/><text x="6" y="66" fill="#134e4a">Exec into container</text><text x="6" y="82" fill="#134e4a">New container</text><text x="6" y="98" fill="#134e4a">App RCE</text></g>
    <g transform="translate(296,96)"><rect width="118" height="40" rx="6" fill="#7c3aed"/><text x="59" y="25" text-anchor="middle" fill="#ffffff" font-weight="700">Persistence</text>
      <rect y="48" width="118" height="62" rx="6" fill="#f5f3ff" stroke="#7c3aed"/><text x="6" y="66" fill="#4c1d95">Backdoored tag</text><text x="6" y="82" fill="#4c1d95">Restart policy</text><text x="6" y="98" fill="#4c1d95">Writable host mount</text></g>
    <g transform="translate(424,96)"><rect width="118" height="40" rx="6" fill="#b91c1c"/><text x="59" y="25" text-anchor="middle" fill="#ffffff" font-weight="700">Priv. Escalation</text>
      <rect y="48" width="118" height="132" rx="6" fill="#fef2f2" stroke="#dc2626"/><text x="6" y="66" fill="#7f1d1d">Privileged mode</text><text x="6" y="82" fill="#7f1d1d">docker.sock / mounts</text><text x="6" y="98" fill="#7f1d1d">Dangerous caps</text><text x="6" y="114" fill="#7f1d1d">SetUID binary</text><text x="6" y="130" fill="#7f1d1d">Kernel exploit</text><text x="6" y="146" fill="#7f1d1d">docker group</text></g>
    <g transform="translate(552,96)"><rect width="118" height="40" rx="6" fill="#475569"/><text x="59" y="25" text-anchor="middle" fill="#ffffff" font-weight="700">Defense Evasion</text>
      <rect y="48" width="118" height="62" rx="6" fill="#f1f5f9" stroke="#475569"/><text x="6" y="66" fill="#0f172a">Delete logs</text><text x="6" y="82" fill="#0f172a">Look-alike names</text><text x="6" y="98" fill="#0f172a">Disable seccomp</text></g>
    <g transform="translate(680,96)"><rect width="118" height="40" rx="6" fill="#b45309"/><text x="59" y="25" text-anchor="middle" fill="#ffffff" font-weight="700">Credential Access</text>
      <rect y="48" width="118" height="62" rx="6" fill="#fffbeb" stroke="#d97706"/><text x="6" y="66" fill="#78350f">Env, files, layers</text><text x="6" y="82" fill="#78350f">Metadata (SSRF)</text><text x="6" y="98" fill="#78350f">UI session</text></g>
    <g transform="translate(808,96)"><rect width="118" height="40" rx="6" fill="#0369a1"/><text x="59" y="25" text-anchor="middle" fill="#ffffff" font-weight="700">Discovery</text>
      <rect y="48" width="118" height="62" rx="6" fill="#f0f9ff" stroke="#0284c7"/><text x="6" y="66" fill="#0c4a6e">ps / inspect / info</text><text x="6" y="82" fill="#0c4a6e">Network scan</text><text x="6" y="98" fill="#0c4a6e">Registry catalog</text></g>
    <g transform="translate(936,96)"><rect width="118" height="40" rx="6" fill="#4d7c0f"/><text x="59" y="25" text-anchor="middle" fill="#ffffff" font-weight="700">Lateral Move</text>
      <rect y="48" width="118" height="62" rx="6" fill="#f7fee7" stroke="#65a30d"/><text x="6" y="66" fill="#365314">Flat bridge</text><text x="6" y="82" fill="#365314">Host net / PID</text><text x="6" y="98" fill="#365314">Agents</text></g>
    <g transform="translate(1064,96)"><rect width="96" height="40" rx="6" fill="#9f1239"/><text x="48" y="25" text-anchor="middle" fill="#ffffff" font-weight="700">Impact</text>
      <rect y="48" width="96" height="76" rx="6" fill="#fff1f2" stroke="#e11d48"/><text x="6" y="66" fill="#881337">Mining</text><text x="6" y="82" fill="#881337">DoS, no limits</text><text x="6" y="98" fill="#881337">Data wipe</text><text x="6" y="114" fill="#881337">Tag poisoning</text></g>
  </g>
  <rect x="40" y="330" width="1120" height="190" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="360" font-size="16" font-weight="700" fill="#0f172a">How the CCSE 3 topics land on the matrix</text>
  <g font-size="13" fill="#1e293b">
    <text x="60" y="388">Image-based attacks (malicious image, secrets, vulnerable components) -> Initial Access, Credential Access</text>
    <text x="60" y="410">Registry-based attacks (open registry, no RBAC) -> Initial Access, Persistence, Impact</text>
    <text x="60" y="432">Container-based attacks (privileged, mounts, SetUID, shared namespaces, capabilities) -> Privilege Escalation, Lateral Movement</text>
    <text x="60" y="454">Daemon and kernel attacks (unauthenticated API, flat network, DoS, kernel exploits) -> Initial Access, Lateral Movement, Impact</text>
    <text x="60" y="476">Privilege escalation and misconfigurations, management tools (Portainer), OWASP Top 10 in containers -> Privilege Escalation, Credential Access</text>
    <text x="60" y="504" font-weight="700">Lab: container-attack-matrix maps every CCSE 3 topic to a tactic and a lab folder (checked by a test).</text>
  </g>
</svg>
