<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>One control mapped to five frameworks, proved by evidence that a checker validates</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Test once, comply many: control-to-evidence mapping</text>
  <text x="40" y="76" font-size="16" fill="#475569">Requirements map to one control. The control is proved by evidence. The checker decides if the evidence counts.</text>

  <!-- framework requirements -->
  <text x="40" y="112" font-size="15" font-weight="700" fill="#0f172a">Framework requirements</text>
  <g font-size="13">
    <rect x="40" y="124" width="300" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="56" y="146" font-weight="700" fill="#991b1b">EU AI Act</text>
    <text x="56" y="165" fill="#991b1b">Art 12 record-keeping; Art 19 / 26(6)</text>
    <rect x="40" y="186" width="300" height="52" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="56" y="208" font-weight="700" fill="#92400e">ISO/IEC 42001</text>
    <text x="56" y="227" fill="#92400e">Annex A.6 AI system life cycle</text>
    <rect x="40" y="248" width="300" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="56" y="270" font-weight="700" fill="#0f172a">NIST AI RMF</text>
    <text x="56" y="289" fill="#475569">MANAGE 4 post-deployment monitoring</text>
    <rect x="40" y="310" width="300" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="56" y="332" font-weight="700" fill="#0f172a">SOC 2</text>
    <text x="56" y="351" fill="#475569">CC7.2 monitoring for anomalies</text>
    <rect x="40" y="372" width="300" height="52" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="56" y="394" font-weight="700" fill="#92400e">ISO/IEC 27001:2022</text>
    <text x="56" y="413" fill="#92400e">A.8.15 logging; A.8.16 monitoring</text>
  </g>
  <path d="M340 150 L436 262" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M340 212 L436 268" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M340 274 L436 274" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M340 336 L436 280" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M340 398 L436 286" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- control -->
  <rect x="442" y="200" width="290" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="587" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">CTL-LOG</text>
  <text x="587" y="258" text-anchor="middle" font-size="13" fill="#166534">AI event logging (prompts,</text>
  <text x="587" y="277" text-anchor="middle" font-size="13" fill="#166534">tool calls, decisions) with</text>
  <text x="587" y="296" text-anchor="middle" font-size="13" fill="#166534">redaction and retention</text>
  <text x="587" y="330" text-anchor="middle" font-size="12" fill="#475569">owner: Platform Security</text>

  <!-- evidence -->
  <text x="790" y="112" font-size="15" font-weight="700" fill="#0f172a">Evidence required</text>
  <rect x="790" y="124" width="370" height="76" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="806" y="148" font-size="14" font-weight="700" fill="#0f172a">logging config export</text>
  <text x="806" y="168" font-size="13" fill="#475569">max age 31 days · automated (pipeline)</text>
  <text x="806" y="188" font-size="12" fill="#475569">SHA-256 recorded in the evidence index</text>
  <rect x="790" y="212" width="370" height="76" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="806" y="236" font-size="14" font-weight="700" fill="#0f172a">retention test result</text>
  <text x="806" y="256" font-size="13" fill="#475569">max age 365 days · automated (scheduler)</text>
  <text x="806" y="276" font-size="12" fill="#475569">proves logs exist and PII is redacted</text>
  <path d="M732 262 L784 166" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M732 274 L784 250" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- checker -->
  <rect x="790" y="310" width="370" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="806" y="336" font-size="15" font-weight="700" fill="#1e3a8a">Evidence checker verdicts</text>
  <g font-size="13">
    <text x="806" y="362" font-weight="700" fill="#166534">OK</text><text x="920" y="362" fill="#334155">fresh, intact, automated</text>
    <text x="806" y="386" font-weight="700" fill="#991b1b">MISSING</text><text x="920" y="386" fill="#334155">nothing in the index</text>
    <text x="806" y="410" font-weight="700" fill="#991b1b">STALE</text><text x="920" y="410" fill="#334155">older than max age</text>
    <text x="806" y="434" font-weight="700" fill="#991b1b">FILE_MISSING</text><text x="920" y="434" fill="#334155">index points to nothing</text>
    <text x="806" y="458" font-weight="700" fill="#991b1b">TAMPERED</text><text x="920" y="458" fill="#334155">hash changed after approval</text>
    <text x="806" y="482" font-weight="700" fill="#991b1b">MANUAL_ONLY</text><text x="920" y="482" fill="#334155">screenshot where export needed</text>
  </g>
  <path d="M975 288 L975 304" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- result -->
  <rect x="40" y="450" width="692" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="478" font-size="15" font-weight="700" fill="#991b1b">One stale export = a gap in five frameworks at once</text>
  <text x="60" y="502" font-size="13" fill="#991b1b">Because every requirement on the left depends on CTL-LOG, one failing</text>
  <text x="60" y="522" font-size="13" fill="#991b1b">evidence item shows up in the EU AI Act, ISO 42001, NIST, SOC 2 and</text>
  <text x="60" y="542" font-size="13" fill="#991b1b">ISO 27001 coverage reports. Fix it once and all five turn green.</text>
  <text x="790" y="540" font-size="12" fill="#475569">Mappings are simplified; verify against official texts.</text>
</svg>
