<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="100%" height="100%" fill="#f8fafc"/><text x="45" y="55" font-family="Arial" font-size="30" font-weight="bold" fill="#0f172a">AI Governance Lifecycle</text><text x="45" y="85" font-family="Arial" font-size="16" fill="#475569">Intake, risk, design, release, operations and retirement</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect x="40" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="122" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Intake</text><path d="M205 273 L242 273" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="250" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="332" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Risk Review</text><path d="M415 273 L452 273" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="460" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="542" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Design/Build</text><rect x="670" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="752" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Release Gate</text><rect x="880" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="962" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Operate</text><rect x="880" y="420" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="962" y="469" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Retire</text><text x="45" y="585" font-family="Arial" font-size="13" fill="#64748b">Enforce identity, authorization and validation in deterministic services, not prompt instructions alone.</text></svg>