<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Isolating a model server in Kubernetes: default deny, allowed flows, workload identity</title>
  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Isolating a model server in Kubernetes</text>
  <text x="40" y="76" font-size="16" fill="#475569">Default deny, then allow only the flows the service needs. Identity comes from the platform, never from a stored key.</text>

  <!-- admission control -->
  <rect x="40" y="95" width="1120" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="126" font-size="15" font-weight="700" fill="#166534">API server admission:</text>
  <text x="232" y="126" font-size="14" fill="#166534">Pod Security "restricted" · ValidatingAdmissionPolicy / Kyverno: digest-pinned images, limits, no hostNetwork</text>

  <!-- cluster -->
  <rect x="40" y="160" width="820" height="400" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="60" y="186" font-size="15" font-weight="700" fill="#334155">Cluster</text>

  <!-- ai-gateway ns -->
  <rect x="60" y="205" width="200" height="130" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="160" y="232" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">ns: ai-gateway</text>
  <text x="160" y="258" font-size="13" fill="#92400e" text-anchor="middle">gateway pod</text>
  <text x="160" y="280" font-size="13" fill="#92400e" text-anchor="middle">authn · quotas</text>
  <text x="160" y="302" font-size="13" fill="#92400e" text-anchor="middle">guardrails · logs</text>

  <!-- ml-serving ns on GPU pool -->
  <rect x="300" y="200" width="320" height="250" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="460" y="226" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">ns: ml-serving (PSS restricted)</text>
  <text x="460" y="246" font-size="12" fill="#1e3a8a" text-anchor="middle">tainted GPU node pool · nodeSelector + toleration</text>
  <rect x="325" y="260" width="270" height="175" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="460" y="284" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">llm-server pod</text>
  <g font-size="12" fill="#1e3a8a">
    <text x="340" y="306">runAsNonRoot · UID 65532</text>
    <text x="340" y="325">readOnlyRootFilesystem · drop ALL</text>
    <text x="340" y="344">no privilege escalation · seccomp</text>
    <text x="340" y="363">image @sha256 · CPU/mem/GPU limits</text>
    <text x="340" y="382">no API token (automount false)</text>
    <text x="340" y="401">secrets by reference, never inline</text>
    <text x="340" y="420">ServiceAccount → cloud role</text>
  </g>

  <!-- vector-db ns -->
  <rect x="660" y="205" width="180" height="100" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="750" y="232" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">ns: vector-db</text>
  <text x="750" y="258" font-size="13" fill="#334155" text-anchor="middle">qdrant :6333</text>
  <text x="750" y="280" font-size="12" fill="#334155" text-anchor="middle">own default deny</text>

  <!-- kube-system -->
  <rect x="660" y="330" width="180" height="80" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="750" y="360" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">ns: kube-system</text>
  <text x="750" y="384" font-size="13" fill="#334155" text-anchor="middle">kube-dns :53</text>

  <!-- allowed flows -->
  <path d="M260 270 L319 300" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="70" y="358" font-size="12" font-weight="700" fill="#166534">allow :8080</text>
  <text x="70" y="374" font-size="12" fill="#166534">from gateway only</text>
  <path d="M595 300 L654 262" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M595 370 L654 370" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- default deny note -->
  <rect x="60" y="470" width="780" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="498" font-size="14" font-weight="700" fill="#166534">NetworkPolicy default-deny-all (Ingress + Egress), then 3 allow rules.</text>
  <text x="80" y="522" font-size="13" fill="#166534">Needs a CNI that enforces NetworkPolicy (e.g. Calico, Cilium). Otherwise the YAML does nothing.</text>

  <!-- outside -->
  <rect x="900" y="170" width="260" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1030" y="200" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">Internet</text>
  <text x="1030" y="224" font-size="13" fill="#991b1b" text-anchor="middle">attacker C2, paste sites,</text>
  <text x="1030" y="243" font-size="13" fill="#991b1b" text-anchor="middle">"download this tool"</text>

  <rect x="900" y="290" width="260" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1030" y="320" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">Cloud metadata</text>
  <text x="1030" y="344" font-size="13" fill="#991b1b" text-anchor="middle">169.254.169.254</text>
  <text x="1030" y="363" font-size="13" fill="#991b1b" text-anchor="middle">(node credentials)</text>

  <path d="M620 228 C 720 160, 820 170, 894 205" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <path d="M862 214 L878 230 M878 214 L862 230" stroke="#dc2626" stroke-width="3"/>
  <path d="M620 430 C 760 470, 860 420, 894 345" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <path d="M868 420 L884 436 M884 420 L868 436" stroke="#dc2626" stroke-width="3"/>

  <rect x="900" y="420" width="260" height="122" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1030" y="448" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Workload identity</text>
  <text x="1030" y="472" font-size="13" fill="#1e3a8a" text-anchor="middle">IRSA / EKS Pod Identity</text>
  <text x="1030" y="492" font-size="13" fill="#1e3a8a" text-anchor="middle">GKE / AKS Workload Identity</text>
  <text x="1030" y="514" font-size="13" fill="#1e3a8a" text-anchor="middle">short-lived, one role per app</text>

  <text x="40" y="590" font-size="14" fill="#475569">Red dashed = blocked by default deny. Green = explicitly allowed. Rules: 06-ai-devsecops/kubernetes/lab/k8s_policy.py (K8S-001 … K8S-017).</text>
  <text x="40" y="614" font-size="14" fill="#475569">Model-to-cloud traffic (for example, reading the model bucket) goes through a private endpoint you allow by name, not "the internet".</text>
</svg>
