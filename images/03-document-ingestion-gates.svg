<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Secure ingestion: seven gates before the index</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Secure ingestion: seven gates before the index</text>
  <text x="40" y="80" font-size="16" fill="#475569">Stop bad data before it is embedded. After that, it is copied into vectors, caches and backups.</text>
  <rect x="40" y="100" width="560" height="44" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="320.0" y="126.0" font-size="13.5" fill="#991b1b" text-anchor="middle">Incoming file from a connector: upload · wiki · HR system · SharePoint</text>
  <rect x="40" y="180" width="140" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="110.0" y="212.6" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">L1 Validate</text>
  <text x="110.0" y="231.3" font-size="12" fill="#166534" text-anchor="middle">size limit</text>
  <text x="110.0" y="248.8" font-size="12" fill="#166534" text-anchor="middle">magic bytes</text>
  <text x="110.0" y="266.2" font-size="12" fill="#166534" text-anchor="middle">type allowlist</text>
  <rect x="203" y="180" width="140" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="273.0" y="212.6" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">L2 Archives</text>
  <text x="273.0" y="231.3" font-size="12" fill="#166534" text-anchor="middle">member count</text>
  <text x="273.0" y="248.8" font-size="12" fill="#166534" text-anchor="middle">real size, ratio</text>
  <text x="273.0" y="266.2" font-size="12" fill="#166534" text-anchor="middle">no ../ paths</text>
  <path d="M180 235 L200 235" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="366" y="180" width="140" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="436.0" y="212.6" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">L3 Source trust</text>
  <text x="436.0" y="231.3" font-size="12" fill="#166534" text-anchor="middle">registry sets</text>
  <text x="436.0" y="248.8" font-size="12" fill="#166534" text-anchor="middle">tenant + trust</text>
  <text x="436.0" y="266.2" font-size="12" fill="#166534" text-anchor="middle">uploads -&gt; review</text>
  <path d="M343 235 L363 235" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="529" y="180" width="140" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="599.0" y="212.6" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">L4 Sanitize</text>
  <text x="599.0" y="231.3" font-size="12" fill="#166534" text-anchor="middle">drop hidden HTML</text>
  <text x="599.0" y="248.8" font-size="12" fill="#166534" text-anchor="middle">strip zero-width</text>
  <text x="599.0" y="266.2" font-size="12" fill="#166534" text-anchor="middle">NFKC normalize</text>
  <path d="M506 235 L526 235" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="692" y="180" width="140" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="762.0" y="212.6" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">L5 Scan (soft)</text>
  <text x="762.0" y="231.3" font-size="12" fill="#92400e" text-anchor="middle">instruction-like</text>
  <text x="762.0" y="248.8" font-size="12" fill="#92400e" text-anchor="middle">text -&gt; review</text>
  <text x="762.0" y="266.2" font-size="12" fill="#92400e" text-anchor="middle">bypassable</text>
  <path d="M669 235 L689 235" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="855" y="180" width="140" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="925.0" y="212.6" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">L6 Redact PII</text>
  <text x="925.0" y="231.3" font-size="12" fill="#166534" text-anchor="middle">email · phone · ID</text>
  <text x="925.0" y="248.8" font-size="12" fill="#166534" text-anchor="middle">before embedding</text>
  <text x="925.0" y="266.2" font-size="12" fill="#166534" text-anchor="middle">known formats</text>
  <path d="M832 235 L852 235" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="1018" y="180" width="140" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1088.0" y="212.6" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">L7 Provenance</text>
  <text x="1088.0" y="231.3" font-size="12" fill="#166534" text-anchor="middle">sha256 · source</text>
  <text x="1088.0" y="248.8" font-size="12" fill="#166534" text-anchor="middle">parser version</text>
  <text x="1088.0" y="266.2" font-size="12" fill="#166534" text-anchor="middle">audit each step</text>
  <path d="M995 235 L1015 235" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M110 144 L110 176" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="40" y="340" width="300" height="64" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="190.0" y="366.9" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">REJECTED</text>
  <text x="190.0" y="386.6" font-size="12.5" fill="#991b1b" text-anchor="middle">unsafe file, never parsed further</text>
  <rect x="366" y="340" width="460" height="64" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="596.0" y="366.9" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">QUARANTINE</text>
  <text x="596.0" y="386.6" font-size="12.5" fill="#334155" text-anchor="middle">kept with its hash for human review (not deleted)</text>
  <rect x="852" y="340" width="306" height="64" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1005.0" y="366.9" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">INDEXED</text>
  <text x="1005.0" y="386.6" font-size="12.5" fill="#166534" text-anchor="middle">clean text + provenance labels</text>
  <path d="M110 290 L110 336" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#ar)"/>
  <path d="M273 290 L273 336" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#ar)"/>
  <path d="M436 290 L436 336" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M762 290 L762 336" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M1088 290 L1088 336" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ag)"/>
  <text x="40" y="440" font-size="13" fill="#475569" text-anchor="start">Green = deterministic (hard) control. Amber = probabilistic (soft): it raises alerts and catches the easy cases only.</text>
</svg>
