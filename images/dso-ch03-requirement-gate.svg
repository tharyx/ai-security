<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Requirement gate</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="420" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">From threat to requirement to test to a gate</text>
<text x="40" y="76" font-size="15" fill="#475569">The build is green only when every in-scope requirement has a check and the check passes.</text>
<rect x="40" y="120" width="230" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="155.0" y="154.0" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Threat</text>
<text x="155.0" y="174.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">T-01 credential</text>
<text x="155.0" y="194.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">guessing</text>
<rect x="330" y="120" width="230" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="445.0" y="154.0" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Requirement (YAML)</text>
<text x="445.0" y="174.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">REQ-AUTH-01</text>
<text x="445.0" y="194.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">min length 12</text>
<line x1="270" y1="170" x2="330" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="620" y="120" width="230" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="735.0" y="154.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Check (code)</text>
<text x="735.0" y="174.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">password_min_length</text>
<text x="735.0" y="194.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">reads the config</text>
<line x1="560" y1="170" x2="620" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="910" y="120" width="230" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1025.0" y="154.0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Result</text>
<text x="1025.0" y="174.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">PASS / FAIL /</text>
<text x="1025.0" y="194.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">NO_TEST</text>
<line x1="850" y1="170" x2="910" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="270" width="360" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="220.0" y="309.0" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">PASS</text>
<text x="220.0" y="329.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">counts as evidence</text>
<rect x="420" y="270" width="360" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="600.0" y="309.0" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">FAIL</text>
<text x="600.0" y="329.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">build fails: fix the control</text>
<rect x="800" y="270" width="360" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="980.0" y="309.0" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">NO_TEST</text>
<text x="980.0" y="329.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">build fails: write the check</text>
<line x1="1000" y1="220" x2="1000" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="600" y1="220" x2="600" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="220" y1="220" x2="220" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="395" text-anchor="start" font-size="13" font-weight="400" fill="#475569">ASVS 5.0 (released May 2025, verify) gives you the catalog to start from; level 1, 2 or 3 sets the scope.</text>
</svg>
