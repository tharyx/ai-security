<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Capstone milestones: weeks 33-36</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="540" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Capstone milestones: weeks 33-36</text>
  <text x="40" y="80" font-size="16" fill="#475569" text-anchor="start">Each week ends with evidence a reviewer can check. Earlier modules feed each milestone.</text>
  <rect x="40" y="110" width="265" height="50" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="172.5" y="139.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">01 fundamentals · 09 architecture</text>
