  <rect x="40" y="190" width="265" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="172.5" y="244.0" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Week 33: Design + review</text>
  <text x="172.5" y="262.5" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• context + data flows</text>
  <text x="172.5" y="281.0" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• threat model</text>
  <text x="172.5" y="299.5" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• security requirements</text>
  <text x="172.5" y="318.0" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• ADRs + control matrix</text>
  <rect x="40" y="380" width="265" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="172.5" y="413.5" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Gate: design approved</text>
  <path d="M305 275 L323 275" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="325" y="110" width="265" height="50" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="457.5" y="139.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">02 LLM · 03 RAG · 04 MCP · 05</text>
  <path d="M457 160 L457 188" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="325" y="190" width="265" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="457.5" y="244.0" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Week 34: Build the slice</text>
  <text x="457.5" y="262.5" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• identity + RAG ACL</text>
  <text x="457.5" y="281.0" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• tool broker + approval</text>
  <text x="457.5" y="299.5" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• audit log + limits</text>
  <text x="457.5" y="318.0" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• acceptance tests green</text>
  <rect x="325" y="380" width="265" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="457.5" y="413.5" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Gate: tests pass in CI</text>
  <path d="M590 275 L608 275" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="610" y="110" width="265" height="50" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
