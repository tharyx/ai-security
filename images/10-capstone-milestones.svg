  <path d="M742 160 L742 188" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="610" y="190" width="265" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="742.5" y="244.0" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Week 35: Attack + operate</text>
  <text x="742.5" y="262.5" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• red-team suite</text>
  <text x="742.5" y="281.0" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• monitoring + alerts</text>
  <text x="742.5" y="299.5" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• incident exercise</text>
  <text x="742.5" y="318.0" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• runbooks + kill switch</text>
  <rect x="610" y="380" width="265" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="742.5" y="413.5" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Gate: test report</text>
  <path d="M875 275 L893 275" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="895" y="110" width="265" height="50" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1027.5" y="139.0" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">07 governance · 08 compliance</text>
  <path d="M1027 160 L1027 188" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="895" y="190" width="265" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1027.5" y="244.0" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Week 36: Govern + defend</text>
  <text x="1027.5" y="262.5" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• AI inventory entry</text>
  <text x="1027.5" y="281.0" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• risk acceptance</text>
  <text x="1027.5" y="299.5" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• residual-risk statement</text>
  <text x="1027.5" y="318.0" font-size="13.5" fill="#1e3a8a" text-anchor="middle">• architecture defense</text>
  <rect x="895" y="380" width="265" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1027.5" y="413.5" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Gate: panel sign-off</text>
  <text x="40" y="475" font-size="13" fill="#475569" text-anchor="start">Top row: which earlier modules each week builds on. Middle: the work. Bottom: the evidence gate.</text>
  <text x="40" y="500" font-size="13" fill="#475569" text-anchor="start">Slip rule: never skip a gate. Cut scope (fewer tools, one cloud) instead of cutting tests or the threat model.</text>
