<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>API security in the CI/CD pipeline</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="500" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">API security, the DevSecOps way</text>
<text x="40" y="76" font-size="15" fill="#475569">Build once, gate on what matters, promote the same signed digest, roll back automatically, feed evidence into the ASVS checklist.</text>
<rect x="30" y="120" width="130" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="95" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Commit / MR</text>
<text x="95" y="176" text-anchor="middle" font-size="12" fill="#475569">secrets scan</text>
<text x="95" y="194" text-anchor="middle" font-size="12" fill="#475569">CODEOWNERS</text>
<rect x="185" y="120" width="130" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="250" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Build + test</text>
<text x="250" y="176" text-anchor="middle" font-size="12" fill="#475569">artifact digest</text>
<text x="250" y="194" text-anchor="middle" font-size="12" fill="#475569">authz tests (BOLA)</text>
<rect x="340" y="120" width="150" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="415" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">SCA + SAST</text>
<text x="415" y="176" text-anchor="middle" font-size="12" fill="#475569">OSV JSON, SARIF</text>
<text x="415" y="194" text-anchor="middle" font-size="12" fill="#475569">KEV / fixable gate</text>
<rect x="515" y="120" width="150" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="590" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Package</text>
<text x="590" y="176" text-anchor="middle" font-size="12" fill="#475569">image@sha256</text>
<text x="590" y="194" text-anchor="middle" font-size="12" fill="#475569">SBOM + signature</text>
<rect x="690" y="120" width="150" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="765" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Staging + DAST</text>
<text x="765" y="176" text-anchor="middle" font-size="12" fill="#475569">ZAP API scan</text>
<text x="765" y="194" text-anchor="middle" font-size="12" fill="#475569">with OpenAPI</text>
<rect x="865" y="120" width="150" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="940" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Prod deploy</text>
<text x="940" y="176" text-anchor="middle" font-size="12" fill="#475569">admission policy</text>
<text x="940" y="194" text-anchor="middle" font-size="12" fill="#475569">canary + rollback</text>
<rect x="1040" y="120" width="130" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="1105" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Operate</text>
<text x="1105" y="176" text-anchor="middle" font-size="12" fill="#475569">logs, metrics</text>
<text x="1105" y="194" text-anchor="middle" font-size="12" fill="#475569">daily SCA rescan</text>
<line x1="160" y1="165" x2="181" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="315" y1="165" x2="336" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="490" y1="165" x2="511" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="665" y1="165" x2="686" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="840" y1="165" x2="861" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="1015" y1="165" x2="1036" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="250" y="270" width="700" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="600" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Evidence store: ASVS checklist per API</text>
<text x="600" y="328" text-anchor="middle" font-size="13" fill="#475569">each requirement verified by sast:, sca:, dast:, test: or manual evidence; untested L1 fails the gate</text>
<line x1="415" y1="212" x2="440" y2="266" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<line x1="765" y1="212" x2="740" y2="266" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<line x1="250" y1="212" x2="330" y2="266" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="40" y="400" font-size="14" fill="#1e293b">At scale: inventory (owner, contract, gateway), paved-road templates, central gateway policies, champions per team, portfolio metrics.</text>
<text x="40" y="428" font-size="14" fill="#1e293b">Labs: simple-cicd-pipeline, sca-sast-dast-gates, microservice-continuous-deployment, api-asvs-at-scale.</text>
<text x="40" y="456" font-size="13" fill="#475569">Pipeline itself: protected branches and variables, masked logs, pinned images, OIDC to clouds, reviewed pipeline files.</text>
</svg>
