<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Trust boundaries versus attack surface</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="40" y="44" font-size="25" font-weight="700" fill="#0f172a">Multi-tier app: trust boundaries (dashed) vs attack surface (red entry points)</text>
<text x="40" y="70" font-size="15" fill="#475569">Every zone change is a trust boundary. The attack surface is what an outsider can reach directly (F1, F7, F8).</text>

<rect x="30" y="100" width="190" height="420" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/>
<text x="125" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Internet / partners</text>
<rect x="250" y="100" width="190" height="420" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="8 6"/>
<text x="345" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">DMZ</text>
<rect x="470" y="100" width="420" height="420" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/>
<text x="680" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">App zone</text>
<rect x="920" y="100" width="250" height="420" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1045" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Data zone</text>

<rect x="50" y="160" width="150" height="50" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="125" y="190" text-anchor="middle" font-size="14" fill="#0f172a">Customer</text>
<rect x="50" y="300" width="150" height="50" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="125" y="330" text-anchor="middle" font-size="14" fill="#0f172a">Payment provider</text>
<rect x="50" y="430" width="150" height="50" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="125" y="452" text-anchor="middle" font-size="14" fill="#0f172a">Support admin</text>
<text x="125" y="470" text-anchor="middle" font-size="12" fill="#475569">(corp VPN)</text>

<circle cx="345" cy="185" r="45" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="345" y="190" text-anchor="middle" font-size="14" fill="#0f172a">Web tier</text>
<circle cx="560" cy="185" r="45" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="560" y="190" text-anchor="middle" font-size="14" fill="#0f172a">Orders API</text>
<circle cx="800" cy="330" r="45" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="800" y="335" text-anchor="middle" font-size="14" fill="#0f172a">Worker</text>
<line x1="610" y1="300" x2="740" y2="300" stroke="#334155" stroke-width="2"/>
<line x1="610" y1="340" x2="740" y2="340" stroke="#334155" stroke-width="2"/>
<text x="675" y="326" text-anchor="middle" font-size="14" fill="#0f172a">Order queue</text>
<line x1="960" y1="170" x2="1130" y2="170" stroke="#334155" stroke-width="2"/>
<line x1="960" y1="210" x2="1130" y2="210" stroke="#334155" stroke-width="2"/>
<text x="1045" y="196" text-anchor="middle" font-size="14" fill="#0f172a">Orders DB</text>
<line x1="960" y1="300" x2="1130" y2="300" stroke="#334155" stroke-width="2"/>
<line x1="960" y1="340" x2="1130" y2="340" stroke="#334155" stroke-width="2"/>
<text x="1045" y="326" text-anchor="middle" font-size="14" fill="#0f172a">Audit log</text>

<line x1="200" y1="185" x2="296" y2="185" stroke="#dc2626" stroke-width="3" marker-end="url(#a)"/>
<text x="248" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">F1</text>
<line x1="390" y1="185" x2="511" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="176" text-anchor="middle" font-size="13" fill="#0f172a">F2</text>
<line x1="605" y1="185" x2="956" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="780" y="178" text-anchor="middle" font-size="13" fill="#0f172a">F3 SQL</text>
<line x1="575" y1="228" x2="640" y2="296" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="590" y="270" font-size="13" fill="#0f172a">F4</text>
<line x1="742" y1="320" x2="752" y2="322" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="742" y="290" font-size="13" fill="#0f172a">F5</text>
<line x1="840" y1="310" x2="1000" y2="214" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="900" y="250" font-size="13" fill="#0f172a">F6</text>
<line x1="200" y1="325" x2="530" y2="220" stroke="#dc2626" stroke-width="3" marker-end="url(#a)"/>
<text x="300" y="285" font-size="13" font-weight="700" fill="#dc2626">F7 webhook</text>
<line x1="200" y1="455" x2="548" y2="231" stroke="#dc2626" stroke-width="3" marker-end="url(#a)"/>
<text x="300" y="420" font-size="13" font-weight="700" fill="#dc2626">F8 admin console</text>
<path d="M590,225 C700,420 900,420 956,330" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="760" y="425" font-size="13" fill="#0f172a">F9 audit events</text>

<rect x="30" y="540" width="1140" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="50" y="566" font-size="14" fill="#0f172a">Trust boundaries crossed: F1, F2, F3, F6, F7, F8, F9 (and F10 outbound to the provider, not drawn). F4/F5 stay inside the app zone,</text>
<text x="50" y="588" font-size="14" fill="#0f172a">but the queue still needs producer authentication: "inside the zone" is not "trusted". Lab: multi-tier-breakout.</text>
</svg>
