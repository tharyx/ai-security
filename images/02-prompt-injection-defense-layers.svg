<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Layered defenses against prompt injection</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Defense in depth: assume the model will be fooled</text>
  <text x="40" y="80" font-size="16" fill="#475569">Soft layers lower the odds. Hard layers are deterministic code that limits the damage when the odds lose.</text>

  <!-- L1 banner -->
  <rect x="40" y="105" width="1120" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="137" font-size="16" font-weight="700" fill="#166534">L1 · Nothing to steal:</text>
  <text x="250" y="137" font-size="15" fill="#166534">no secrets, keys or other users' data in the prompt · least-privilege context · minimal tools per task</text>

  <!-- pipeline -->
  <rect x="40" y="210" width="150" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Untrusted</text>
  <text x="115" y="270" text-anchor="middle" font-size="13" fill="#991b1b">email · doc · web</text>

  <rect x="230" y="210" width="150" height="90" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="305" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">L3 Detect</text>
  <text x="305" y="263" text-anchor="middle" font-size="13" fill="#92400e">classifier / rules</text>
  <text x="305" y="283" text-anchor="middle" font-size="12" fill="#92400e">alert, don't trust</text>

  <rect x="420" y="210" width="150" height="90" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="495" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">L2 Spotlight</text>
  <text x="495" y="263" text-anchor="middle" font-size="13" fill="#92400e">fence + datamark</text>
  <text x="495" y="283" text-anchor="middle" font-size="12" fill="#92400e">"this is data"</text>

  <rect x="610" y="200" width="160" height="110" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="690" y="245" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">LLM</text>
  <text x="690" y="268" text-anchor="middle" font-size="13" fill="#334155">assume</text>
  <text x="690" y="286" text-anchor="middle" font-size="13" fill="#334155">compromised</text>

  <rect x="810" y="210" width="160" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="890" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">L4 Tool policy</text>
  <text x="890" y="263" text-anchor="middle" font-size="12" fill="#166534">schema · allowlist · authz</text>
  <text x="890" y="282" text-anchor="middle" font-size="12" fill="#166534">human approval</text>

  <rect x="1010" y="210" width="150" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1085" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">L5 Output</text>
  <text x="1085" y="263" text-anchor="middle" font-size="12" fill="#166534">secret / canary scan</text>
  <text x="1085" y="282" text-anchor="middle" font-size="12" fill="#166534">encode, strip URLs</text>

  <path d="M190 255 L224 255" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M380 255 L414 255" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M570 255 L604 255" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M770 255 L804 255" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M970 255 L1004 255" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- soft / hard bands -->
  <rect x="230" y="330" width="340" height="34" rx="8" fill="#fef3c7"/>
  <text x="400" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">SOFT — probabilistic, bypassable</text>
  <rect x="810" y="330" width="350" height="34" rx="8" fill="#dcfce7"/>
  <text x="985" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">HARD — deterministic, testable</text>

  <!-- L6 -->
  <rect x="40" y="400" width="1120" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="432" font-size="16" font-weight="700" fill="#1e3a8a">L6 · Observe and test:</text>
  <text x="255" y="432" font-size="15" fill="#1e3a8a">log prompts/tool calls (redacted) · alert on L3/L4/L5 events · regression-test every payload on every model change</text>

  <text x="40" y="500" font-size="15" fill="#0f172a"><tspan font-weight="700">Rule of thumb:</tspan> if an attack only fails because the model "decided" not to comply, you have not fixed it.</text>
  <text x="40" y="525" font-size="15" fill="#0f172a">Ask instead: <tspan font-style="italic">"If the model does exactly what the attacker says, what is the worst it can do?"</tspan> — then shrink that.</text>
</svg>
