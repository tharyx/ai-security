<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Policy as code on a Terraform plan</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Policy as code: check the plan before apply</text>
  <text x="40" y="76" font-size="16" fill="#475569">The plan JSON has final values (variables, modules and jsonencode() resolved). Rules run on that, in CI, on every pull request.</text>

  <rect x="40" y="120" width="170" height="90" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="125" y="155" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">.tf code</text>
  <text x="125" y="178" font-size="13" fill="#92400e" text-anchor="middle">pull request</text>

  <rect x="250" y="120" width="190" height="90" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="345" y="155" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">terraform plan</text>
  <text x="345" y="178" font-size="13" fill="#334155" text-anchor="middle">-out tfplan</text>

  <rect x="480" y="120" width="210" height="90" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="585" y="152" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">terraform show -json</text>
  <text x="585" y="174" font-size="13" fill="#334155" text-anchor="middle">resource_changes[].after</text>
  <text x="585" y="193" font-size="13" fill="#334155" text-anchor="middle">+ configuration refs</text>

  <rect x="730" y="110" width="220" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="840" y="142" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Policy checker</text>
  <text x="840" y="165" font-size="13" fill="#166534" text-anchor="middle">rules TF-AI-001 … 060</text>
  <text x="840" y="184" font-size="13" fill="#166534" text-anchor="middle">severity · fail-on level</text>
  <text x="840" y="203" font-size="12" fill="#166534" text-anchor="middle">(Checkov · Trivy · OPA)</text>

  <rect x="990" y="105" width="170" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1075" y="137" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">PASS → apply</text>
  <rect x="990" y="175" width="170" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1075" y="207" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">FAIL → PR blocked</text>

  <path d="M210 165 L244 165" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M440 165 L474 165" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M690 165 L724 165" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M950 150 L984 134" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M950 182 L984 198" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>

  <!-- waivers -->
  <rect x="730" y="270" width="220" height="100" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="840" y="298" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">waivers.json</text>
  <text x="840" y="320" font-size="13" fill="#92400e" text-anchor="middle">rule + resource + reason</text>
  <text x="840" y="338" font-size="13" fill="#92400e" text-anchor="middle">approver + ticket</text>
  <text x="840" y="356" font-size="13" fill="#92400e" text-anchor="middle">EXPIRY date (then it fails)</text>
  <path d="M840 270 L840 226" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- what this does not catch -->
  <rect x="40" y="270" width="650" height="160" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="298" font-size="15" font-weight="700" fill="#334155">A plan check is one layer. Also needed:</text>
  <text x="60" y="324" font-size="14" fill="#334155">• Runtime guardrails (AWS SCP, Azure Policy, GCP Org Policy) still block it</text>
  <text x="60" y="348" font-size="14" fill="#334155">• Drift detection: someone changes the console after apply (CSPM, AWS Config)</text>
  <text x="60" y="372" font-size="14" fill="#334155">• Values known only after apply (ARNs, IDs): use after_unknown + references</text>
  <text x="60" y="396" font-size="14" fill="#334155">• Plan with a read-only role; apply with a separate, protected role</text>
  <text x="60" y="418" font-size="13" fill="#475569">Rule IDs: 06-ai-devsecops/terraform/lab/policy_check.py</text>
</svg>
