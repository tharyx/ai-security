<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Deployment approval bound to the release evidence</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Deployment approval bound to the release evidence</text>
  <text x="40" y="76" font-size="16" fill="#475569">A human approves a specific digest, after the gate passed, and cannot approve their own release.</text>

  <g font-size="13" fill="#334155">
    <rect x="40" y="110" width="230" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="58" y="138" font-size="16" font-weight="700" fill="#92400e">1 Developer</text>
    <text x="58" y="164" fill="#92400e">merges to main</text>
    <text x="58" y="184" fill="#92400e">triggers the release run</text>
    <text x="58" y="204" fill="#92400e">is a commit author</text>
    <text x="58" y="234" fill="#92400e">may NOT approve</text>

    <rect x="310" y="110" width="250" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="328" y="138" font-size="16" font-weight="700" fill="#166534">2 Release gate</text>
    <text x="328" y="164" fill="#14532d">AI-BOM + eval evidence</text>
    <text x="328" y="184" fill="#14532d">decision: APPROVED</text>
    <text x="328" y="204" fill="#14532d">time: 09:10</text>
    <text x="328" y="234" fill="#14532d">image digest sha256:4f9c…</text>

    <rect x="600" y="110" width="250" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="618" y="138" font-size="16" font-weight="700" fill="#166534">3 Reviewer approves</text>
    <text x="618" y="164" fill="#14532d">member of approver group</text>
    <text x="618" y="184" fill="#14532d">not the starter or author</text>
    <text x="618" y="204" fill="#14532d">time: 09:40 (after gate)</text>
    <text x="618" y="234" fill="#14532d">digest sha256:4f9c…</text>

    <rect x="890" y="110" width="270" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="908" y="138" font-size="16" font-weight="700" fill="#1e3a8a">4 Deploy job</text>
    <text x="908" y="164" fill="#1e3a8a">environment: production</text>
    <text x="908" y="184" fill="#1e3a8a">OIDC credentials</text>
    <text x="908" y="204" fill="#1e3a8a">verify signature</text>
    <text x="908" y="234" fill="#1e3a8a">deploy sha256:4f9c… by digest</text>
  </g>
  <path d="M270 185 L308 185" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M560 185 L598 185" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M850 185 L888 185" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="40" y="290" width="540" height="200" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="58" y="318" font-size="16" font-weight="700" fill="#334155">Environment protection (ENV-001 … 005)</text>
  <g font-size="13" fill="#334155">
    <text x="58" y="346">ENV-001  required reviewers on production</text>
    <text x="58" y="370">ENV-002  prevent self-review</text>
    <text x="58" y="394">ENV-003  only protected branches may deploy</text>
    <text x="58" y="418">ENV-004  administrators cannot bypass</text>
    <text x="58" y="442">ENV-005  no long-lived cloud keys as environment secrets</text>
    <text x="58" y="472" fill="#475569">Settings that make step 3 mandatory, not optional.</text>
  </g>

  <rect x="620" y="290" width="540" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="638" y="318" font-size="16" font-weight="700" fill="#166534">Approval record checks (APR-001 … 006)</text>
  <g font-size="13" fill="#14532d">
    <text x="638" y="346">APR-001  an approved review exists</text>
    <text x="638" y="370">APR-002  approver ≠ starter, ≠ commit author</text>
    <text x="638" y="394">APR-003  approver in the approver group</text>
    <text x="638" y="418">APR-004  same digest: gate = approval = deploy</text>
    <text x="638" y="442">APR-005  gate passed before the approval</text>
    <text x="638" y="466">APR-006  approval not older than 24 hours</text>
  </g>
</svg>
