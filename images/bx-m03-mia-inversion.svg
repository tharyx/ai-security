<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Membership inference and model inversion through a prediction API, and the hardened API that drops them to chance</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Privacy attacks through a prediction API</text>
  <text x="40" y="76" font-size="15" fill="#475569">The attacker never sees the training table. Confidence scores from an overfit model are enough to leak it.</text>

  <rect x="40" y="110" width="250" height="150" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="165" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Training table</text>
  <text x="165" y="166" text-anchor="middle" font-size="13" fill="#475569">fake HR rows: dept, years,</text>
  <text x="165" y="186" text-anchor="middle" font-size="13" fill="#475569">grade, remote,</text>
  <text x="165" y="206" text-anchor="middle" font-size="13" fill="#b91c1c">health_flag (SENSITIVE)</text>
  <text x="165" y="232" text-anchor="middle" font-size="13" fill="#475569">label: flight_risk</text>

  <rect x="360" y="110" width="250" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="485" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Overfit model</text>
  <text x="485" y="166" text-anchor="middle" font-size="13" fill="#991b1b">tiny bandwidth: memorises rows</text>
  <text x="485" y="186" text-anchor="middle" font-size="13" fill="#991b1b">train acc 0.99, test acc 0.58</text>
  <text x="485" y="206" text-anchor="middle" font-size="13" fill="#991b1b">members get ~0.95 confidence,</text>
  <text x="485" y="226" text-anchor="middle" font-size="13" fill="#991b1b">non-members much less</text>

  <rect x="680" y="110" width="220" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="790" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Naive API</text>
  <text x="790" y="170" text-anchor="middle" font-size="13" fill="#991b1b">returns full probabilities</text>
  <text x="790" y="190" text-anchor="middle" font-size="13" fill="#991b1b">no query limit</text>
  <text x="790" y="210" text-anchor="middle" font-size="13" fill="#991b1b">no monitoring</text>

  <rect x="960" y="100" width="200" height="80" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1060" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Membership inference</text>
  <text x="1060" y="152" text-anchor="middle" font-size="13" fill="#9a3412">"was Asha in the data?"</text>
  <text x="1060" y="170" text-anchor="middle" font-size="12" fill="#9a3412">conf &gt;= t on true label</text>

  <rect x="960" y="195" width="200" height="80" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1060" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Model inversion</text>
  <text x="1060" y="247" text-anchor="middle" font-size="13" fill="#9a3412">try each health_flag,</text>
  <text x="1060" y="265" text-anchor="middle" font-size="12" fill="#9a3412">keep the most confident one</text>

  <line x1="290" y1="185" x2="352" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="185" x2="672" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="900" y1="160" x2="952" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="900" y1="210" x2="952" y2="232" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <text x="40" y="320" font-size="19" font-weight="700" fill="#0f172a">Hardened API: layers, and what each one alone does (lab numbers)</text>
  <rect x="40" y="340" width="260" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">1. Less overfitting</text>
  <text x="170" y="392" text-anchor="middle" font-size="13" fill="#1e3a8a">wider bandwidth / regularise</text>
  <text x="170" y="412" text-anchor="middle" font-size="13" fill="#1e3a8a">(real world: DP-SGD, dedup)</text>
  <text x="170" y="440" text-anchor="middle" font-size="13" fill="#1e3a8a">MIA advantage 0.83 -&gt; ~0.03</text>

  <rect x="320" y="340" width="260" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">2. Output hardening</text>
  <text x="450" y="392" text-anchor="middle" font-size="13" fill="#1e3a8a">round, or top-1 label only</text>
  <text x="450" y="412" text-anchor="middle" font-size="13" fill="#1e3a8a">alone NOT enough on an</text>
  <text x="450" y="440" text-anchor="middle" font-size="13" fill="#1e3a8a">overfit model (label-only: 0.40)</text>

  <rect x="600" y="340" width="260" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">3. Laplace noise</text>
  <text x="730" y="392" text-anchor="middle" font-size="13" fill="#1e3a8a">"DP-style" output noise</text>
  <text x="730" y="412" text-anchor="middle" font-size="13" fill="#1e3a8a">not a real DP guarantee:</text>
  <text x="730" y="440" text-anchor="middle" font-size="13" fill="#1e3a8a">that needs DP training</text>

  <rect x="880" y="340" width="280" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1020" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">4. Query budget + monitor</text>
  <text x="1020" y="392" text-anchor="middle" font-size="13" fill="#065f46">per-key limit; alert on</text>
  <text x="1020" y="412" text-anchor="middle" font-size="13" fill="#065f46">"same person, sensitive value</text>
  <text x="1020" y="440" text-anchor="middle" font-size="13" fill="#065f46">swept" (SOC detection)</text>

  <text x="40" y="510" font-size="15" fill="#0f172a">All layers together: membership advantage +0.000, inversion 0.350 vs 0.360 by guessing the most common value = chance.</text>
  <text x="40" y="535" font-size="13" fill="#475569">DBA analogy: the model is a materialised view of the training table. An overfit model is a view you can query row by row.</text>
</svg>
