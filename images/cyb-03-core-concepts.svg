<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Core concepts: CIA, AAA and control types</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#475569"/></marker></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="60" y="52" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">Core concepts: CIA, AAA and control types</text>
<text x="60" y="82" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">Three goals, three steps to prove who you are, and the types of control that protect them</text>
<rect x="60.0" y="120" width="300" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="210.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Confidentiality</text>
<text x="210.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Only the right people</text>
<text x="210.0" y="192" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">can read the data</text>
<rect x="450.0" y="120" width="300" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="600.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Integrity</text>
<text x="600.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Data is not changed</text>
<text x="600.0" y="192" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">without permission</text>
<rect x="840.0" y="120" width="300" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="990.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Availability</text>
<text x="990.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Systems work when</text>
<text x="990.0" y="192" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">the business needs them</text>
<text x="60" y="232" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">CIA triad: every security control protects at least one of these three goals.</text>
<rect x="60.0" y="260" width="220" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="170.0" y="288" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Identification</text>
<text x="170.0" y="312" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Who do you claim to be?</text>
<text x="170.0" y="332" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">(username)</text>
<rect x="346.6666666666667" y="260" width="220" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="456.6666666666667" y="288" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Authentication</text>
<text x="456.6666666666667" y="312" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Prove it</text>
<text x="456.6666666666667" y="332" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">(password, MFA, key)</text>
<rect x="633.3333333333334" y="260" width="220" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="743.3333333333334" y="288" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Authorization</text>
<text x="743.3333333333334" y="312" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">What may you do?</text>
<text x="743.3333333333334" y="332" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">(roles, permissions)</text>
<rect x="920.0" y="260" width="220" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1030.0" y="288" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Accounting</text>
<text x="1030.0" y="312" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Record what you did</text>
<text x="1030.0" y="332" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">(logs, audit trail)</text>
<line x1="284.0" y1="305.0" x2="342.6666666666667" y2="305.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="570.6666666666667" y1="305.0" x2="629.3333333333334" y2="305.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="857.3333333333334" y1="305.0" x2="916.0" y2="305.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="60" y="372" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">AAA plus non-repudiation: logs and signatures mean a person cannot honestly deny an action.</text>
<rect x="60.0" y="400" width="240" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="180.0" y="428" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Preventive</text>
<text x="180.0" y="452" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Stops it: firewall, MFA</text>
<rect x="340.0" y="400" width="240" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="460.0" y="428" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Detective</text>
<text x="460.0" y="452" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Finds it: SIEM, IDS</text>
<rect x="620.0" y="400" width="240" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="740.0" y="428" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Corrective</text>
<text x="740.0" y="452" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Fixes it: restore, patch</text>
<rect x="900.0" y="400" width="240" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1020.0" y="428" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Deterrent / Compensating</text>
<text x="1020.0" y="452" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Warn or substitute</text>
<text x="60" y="520" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Categories: technical, managerial, operational, physical. Types: preventive, detective, corrective, deterrent, compensating, directive.</text>
</svg>
