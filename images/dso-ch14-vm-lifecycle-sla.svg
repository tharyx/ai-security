<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Vulnerability lifecycle and example SLA</title><desc>Eight-step vulnerability management lifecycle with bars for SLA days by severity.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1200" height="520" fill="#ffffff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Vulnerability lifecycle and example SLA</text><rect x="40" y="90" width="125" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="102.5" y="125.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Discover</text><line x1="165" y1="120" x2="182" y2="120" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="182" y="90" width="125" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="244.5" y="125.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Dedupe</text><line x1="307" y1="120" x2="324" y2="120" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="324" y="90" width="125" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="386.5" y="125.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Triage</text><line x1="449" y1="120" x2="466" y2="120" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="466" y="90" width="125" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="528.5" y="125.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Prioritise</text><line x1="591" y1="120" x2="608" y2="120" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="608" y="90" width="125" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="670.5" y="125.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Assign</text><line x1="733" y1="120" x2="750" y2="120" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="750" y="90" width="125" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="812.5" y="125.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Fix</text><line x1="875" y1="120" x2="892" y2="120" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="892" y="90" width="125" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="954.5" y="125.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Verify</text><line x1="1017" y1="120" x2="1034" y2="120" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="1034" y="90" width="125" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1096.5" y="125.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Report</text><text x="40" y="200" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Example SLA (a policy, not a standard): the clock starts at first_seen</text><text x="40" y="253" font-size="16" fill="#0f172a" text-anchor="start">critical</text><rect x="160" y="225" width="89.4" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="263.4" y="251" font-size="15" fill="#475569" text-anchor="start">7 days</text><text x="40" y="308" font-size="16" fill="#0f172a" text-anchor="start">high</text><rect x="160" y="280" width="186.0" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="360.0" y="306" font-size="15" fill="#475569" text-anchor="start">30 days</text><text x="40" y="363" font-size="16" fill="#0f172a" text-anchor="start">medium</text><rect x="160" y="335" width="438.0" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="612.0" y="361" font-size="15" fill="#475569" text-anchor="start">90 days</text><text x="40" y="418" font-size="16" fill="#0f172a" text-anchor="start">low</text><rect x="160" y="390" width="816.0" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="990.0" y="416" font-size="15" fill="#475569" text-anchor="start">180 days</text><text x="40" y="490" font-size="15" fill="#475569" text-anchor="start">Rescan closes what that tool no longer reports; triage states (false positive, accepted) survive.</text></svg>