<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title id="t">Fail-safe states for an agent run</title>
  <desc id="d">A run moves from plan to validated to executing to committed. Any validation error, guard timeout, drift detection or crash moves it to a halted safe state, where staged side effects are discarded, evidence is saved and a human is notified.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">When in doubt, stop with nothing committed</text>

  <rect x="30" y="80" width="150" height="70" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="105" y="110" text-anchor="middle" font-weight="600" fill="#312e81">PLAN</text>
  <text x="105" y="130" text-anchor="middle" fill="#312e81" font-size="12">structured, from the model</text>

  <rect x="250" y="80" width="150" height="70" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="325" y="110" text-anchor="middle" font-weight="600" fill="#312e81">VALIDATED</text>
  <text x="325" y="130" text-anchor="middle" fill="#312e81" font-size="12">schema + goal integrity</text>

  <rect x="470" y="80" width="150" height="70" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="545" y="110" text-anchor="middle" font-weight="600" fill="#312e81">EXECUTING</text>
  <text x="545" y="130" text-anchor="middle" fill="#312e81" font-size="12">effects are staged</text>

  <rect x="740" y="80" width="190" height="70" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="835" y="110" text-anchor="middle" font-weight="600" fill="#14532d">COMMITTED</text>
  <text x="835" y="130" text-anchor="middle" fill="#14532d" font-size="12">all steps validated</text>

  <path d="M180,115 L250,115" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M400,115 L470,115" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M620,115 L740,115" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="250" y="270" width="460" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="480" y="298" text-anchor="middle" font-weight="600" fill="#7f1d1d">HALTED_SAFE</text>
  <text x="480" y="320" text-anchor="middle" fill="#7f1d1d" font-size="12">staged effects discarded, credentials revoked for this task,</text>
  <text x="480" y="338" text-anchor="middle" fill="#7f1d1d" font-size="12">evidence saved (plan, steps, validator reasons), human notified</text>

  <path d="M105,150 L105,240 L250,290" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <path d="M325,150 L325,270" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <path d="M545,150 L545,270" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <text x="120" y="215" fill="#991b1b" font-size="12">unparseable</text>
  <text x="335" y="222" fill="#991b1b" font-size="12">schema error, drift,</text>
  <text x="335" y="238" fill="#991b1b" font-size="12">validator crash</text>
  <text x="555" y="222" fill="#991b1b" font-size="12">guard timeout, budget,</text>
  <text x="555" y="238" fill="#991b1b" font-size="12">taint without approval</text>
</svg>
