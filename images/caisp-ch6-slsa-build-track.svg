<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">SLSA build track levels</title>
<desc id="d">Build L0 no guarantees, L1 provenance exists, L2 hosted build platform with signed provenance, L3 hardened build platform.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="40" y="46" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">SLSA v1.0 build track</text>
<text x="40" y="72" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">Each level adds a guarantee about HOW the artifact was built. (Check slsa.dev for the current text.)</text>
<rect x="40" y="330" width="265" height="140" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="172.5" y="354" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Build L0</text>
<text x="172" y="388" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">No guarantees</text>
<text x="172" y="414.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">Built on a laptop, no record.</text>
<rect x="325" y="270" width="265" height="200" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="457.5" y="294" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Build L1</text>
<text x="457" y="328" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Provenance exists</text>
<text x="457" y="354.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">A record says what was built, by</text>
<text x="457" y="371.5" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">what, from where.</text>
<rect x="610" y="210" width="265" height="260" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="742.5" y="234" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Build L2</text>
<text x="742" y="268" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Hosted build, signed provenance</text>
<text x="742" y="294.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">A hosted platform builds it and</text>
<text x="742" y="311.5" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">signs the provenance. Forging</text>
<text x="742" y="329.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">needs the platform's key.</text>
<rect x="895" y="150" width="265" height="320" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1027.5" y="174" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Build L3</text>
<text x="1027" y="208" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Hardened build platform</text>
<text x="1027" y="234.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">Builds are isolated from each</text>
<text x="1027" y="251.5" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">other; secrets cannot be reached</text>
<text x="1027" y="269.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">by user build steps.</text>
<text x="40" y="500" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Why it matters for AI: provenance answers "which pipeline, which code and which data produced this model file?"</text>
<text x="40" y="519" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">An attestation (signed statement, in-toto style) carries the provenance. A verifier checks it before deploy.</text>
</svg>
