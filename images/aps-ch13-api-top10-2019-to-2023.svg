<line x1="440" y1="317" x2="758" y2="317" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="440" y1="363" x2="758" y2="230" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/>
<line x1="440" y1="409" x2="758" y2="455" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="440" y1="501" x2="758" y2="501" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="600" font-size="13" fill="#9a3412">Orange: Excessive Data Exposure (read) + Mass Assignment (write) = property-level authorization (BOPLA).</text>
<text x="40" y="622" font-size="13" fill="#475569">Dropped items are still real risks: see the web OWASP Top 10:2025 (A05 Injection, A09 Logging and Alerting Failures).</text>
</svg>
