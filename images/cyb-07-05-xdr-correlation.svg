<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>XDR: one incident from many signals</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1200" height="420" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">XDR: one incident from many signals</text>
<text x="40" y="80" font-size="16" fill="#475569">Separate alerts from separate tools become one story about one user and one device</text>
<rect x="40" y="110" width="280" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="180.0" y="134.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Endpoint</text>
<text x="180.0" y="156.0" text-anchor="middle" font-size="13" fill="#475569">Office spawns PowerShell</text>
<line x1="322" y1="139" x2="430" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="180" width="280" height="58" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="180.0" y="204.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Email</text>
<text x="180.0" y="226.0" text-anchor="middle" font-size="13" fill="#475569">phish with .docm delivered</text>
<line x1="322" y1="209" x2="430" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="250" width="280" height="58" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="180.0" y="274.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Identity</text>
<text x="180.0" y="296.0" text-anchor="middle" font-size="13" fill="#475569">impossible-travel sign-in</text>
<line x1="322" y1="279" x2="430" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="320" width="280" height="58" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="180.0" y="344.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Cloud apps</text>
<text x="180.0" y="366.0" text-anchor="middle" font-size="13" fill="#475569">mass file download</text>
<line x1="322" y1="349" x2="430" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="432" y="170" width="300" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="582.0" y="221.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">XDR correlation engine</text>
<text x="582.0" y="243.0" text-anchor="middle" font-size="13" fill="#475569">join on user + device + time</text>
<text x="582.0" y="261.0" text-anchor="middle" font-size="13" fill="#475569">dedupe, score, map to ATT&amp;CK</text>
<line x1="734" y1="235" x2="820" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="822" y="150" width="338" height="170" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="991.0" y="203.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">ONE incident</text>
<text x="991.0" y="225.0" text-anchor="middle" font-size="13" fill="#475569">user: mlopez   device: WS-ACCT-07</text>
<text x="991.0" y="243.0" text-anchor="middle" font-size="13" fill="#475569">timeline: email &gt; macro &gt; PowerShell</text>
<text x="991.0" y="261.0" text-anchor="middle" font-size="13" fill="#475569">&gt; sign-in from new country &gt; download</text>
<text x="991.0" y="279.0" text-anchor="middle" font-size="13" fill="#475569">auto-actions: isolate, revoke sessions</text>
<text x="40" y="410" text-anchor="start" font-size="13" fill="#475569">Value: fewer tickets, faster triage. Risk: only as good as the connectors and data you turn on.</text>
</svg>