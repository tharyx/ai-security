<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Common supply chain controls automated across CI/CD stages: SCA, secrets, SAST, IaC, container scan, SBOM, signing, DAST, fuzzing</title>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="30" y="40" font-size="26" font-weight="700" fill="#0f172a">Automating the common controls in CI/CD</text>
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="30" y="70" width="170" height="44" rx="8" fill="#334155"/><text x="115" y="98">Commit / PR</text>
    <rect x="230" y="70" width="170" height="44" rx="8" fill="#334155"/><text x="315" y="98">Build</text>
    <rect x="430" y="70" width="170" height="44" rx="8" fill="#334155"/><text x="515" y="98">Test</text>
    <rect x="630" y="70" width="170" height="44" rx="8" fill="#334155"/><text x="715" y="98">Package / publish</text>
    <rect x="830" y="70" width="170" height="44" rx="8" fill="#334155"/><text x="915" y="98">Deploy</text>
    <rect x="1030" y="70" width="140" height="44" rx="8" fill="#334155"/><text x="1100" y="98">Run</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#ar)"><line x1="200" y1="92" x2="228" y2="92"/><line x1="400" y1="92" x2="428" y2="92"/><line x1="600" y1="92" x2="628" y2="92"/><line x1="800" y1="92" x2="828" y2="92"/><line x1="1000" y1="92" x2="1028" y2="92"/></g>
  <g font-size="13" fill="#0f172a">
    <rect x="30" y="140" width="170" height="250" rx="8" fill="#e0f2fe"/><text x="40" y="164" font-weight="700">Pre-merge</text><text x="40" y="188">Secrets scan</text><text x="40" y="208">SAST (code)</text><text x="40" y="228">IaC scan</text><text x="40" y="248">SCA (dependencies)</text><text x="40" y="268">License check</text><text x="40" y="288">Signed commits</text><text x="40" y="308">Protected branch,</text><text x="40" y="326">CODEOWNERS review</text>
    <rect x="230" y="140" width="170" height="250" rx="8" fill="#dcfce7"/><text x="240" y="164" font-weight="700">Build</text><text x="240" y="188">Pinned base image</text><text x="240" y="208">Hash-pinned deps</text><text x="240" y="228">SBOM (Syft)</text><text x="240" y="248">Isolated, ephemeral</text><text x="240" y="266">runner</text><text x="240" y="288">Provenance</text><text x="240" y="308">(SLSA-style)</text>
    <rect x="430" y="140" width="170" height="250" rx="8" fill="#fef9c3"/><text x="440" y="164" font-weight="700">Test</text><text x="440" y="188">Unit and integration</text><text x="440" y="208">Fuzz tests</text><text x="440" y="228">DAST on a test env</text><text x="440" y="248">API scan</text>
    <rect x="630" y="140" width="170" height="250" rx="8" fill="#fae8ff"/><text x="640" y="164" font-weight="700">Package</text><text x="640" y="188">Image vuln scan</text><text x="640" y="208">Malware scan (YARA)</text><text x="640" y="228">Sign (cosign/Notation)</text><text x="640" y="248">Attest SBOM</text><text x="640" y="268">Push to a policy</text><text x="640" y="286">registry (Harbor)</text>
    <rect x="830" y="140" width="170" height="250" rx="8" fill="#ffedd5"/><text x="840" y="164" font-weight="700">Deploy</text><text x="840" y="188">Verify signature and</text><text x="840" y="206">attestation (admission)</text><text x="840" y="228">Manifest / Helm scan</text><text x="840" y="248">Approval for prod</text><text x="840" y="268">Least-privilege</text><text x="840" y="286">deploy identity</text>
    <rect x="1030" y="140" width="140" height="250" rx="8" fill="#fee2e2"/><text x="1040" y="164" font-weight="700">Run</text><text x="1040" y="188">Re-scan SBOMs</text><text x="1040" y="208">with new CVE data</text><text x="1040" y="228">RBAC audit</text><text x="1040" y="248">Runtime detection</text>
  </g>
  <text x="30" y="425" font-size="14" fill="#334155">Gate on severity and on NEW findings, keep an exception file with owner and expiry, and send everything to one findings store (for example DefectDojo).</text>
  <text x="30" y="448" font-size="12" fill="#64748b">Tool names are examples. Each control appears as a lab in chapter 6.</text>
</svg>
