<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>QA automation proxied through ZAP to drive a deep DAST scan</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="460" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a">Let the QA tests teach the scanner your application</text>
  <text x="40" y="70" font-size="15" fill="#475569">A spider only follows links. A browser test logs in, clicks and calls APIs. Route that traffic through ZAP and ZAP learns every page and parameter.</text>

  <rect x="40" y="110" width="230" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">1 QA test</text>
  <text x="155" y="166" text-anchor="middle" font-size="13" fill="#475569">Selenium / Playwright</text>
  <text x="155" y="186" text-anchor="middle" font-size="13" fill="#475569">proxy = localhost:8080</text>

  <rect x="380" y="110" width="230" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="495" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">2 ZAP as proxy</text>
  <text x="495" y="166" text-anchor="middle" font-size="13" fill="#475569">records URLs, forms, cookies,</text>
  <text x="495" y="186" text-anchor="middle" font-size="13" fill="#475569">tokens; passive rules run</text>

  <rect x="720" y="110" width="230" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="835" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">3 App under test</text>
  <text x="835" y="166" text-anchor="middle" font-size="13" fill="#475569">review or staging copy</text>
  <text x="835" y="186" text-anchor="middle" font-size="13" fill="#475569">with test accounts</text>

  <line x1="270" y1="150" x2="378" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="150" x2="718" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="718" y1="196" x2="610" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="378" y1="196" x2="270" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <line x1="495" y1="222" x2="495" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="510" y="262" font-size="13" fill="#475569">site tree + session</text>

  <rect x="330" y="292" width="330" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="495" y="324" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">4 Active scan on the recorded tree</text>
  <text x="495" y="348" text-anchor="middle" font-size="13" fill="#475569">attack every recorded parameter, logged in</text>
  <text x="495" y="368" text-anchor="middle" font-size="13" fill="#475569">report, apply break-build rules</text>

  <rect x="740" y="292" width="420" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="950" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Lab result (zap-selenium-zest-deep-scan)</text>
  <text x="950" y="346" text-anchor="middle" font-size="13" fill="#475569">spider only: 0 testable parameters, 2 High</text>
  <text x="950" y="366" text-anchor="middle" font-size="13" fill="#475569">QA through proxy: 3 parameters, 6 High</text>
  <line x1="660" y1="342" x2="738" y2="342" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="40" y="430" font-size="14" fill="#475569">Loopback only in the lab. In real life keep the proxy and the target inside your own test network, and never record production passwords.</text>
</svg>
