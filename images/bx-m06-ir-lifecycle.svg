<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>NIST SP 800-61 Rev. 2 phases versus Rev. 3 CSF 2.0 functions for an AI incident</title>
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#0f172a">One AI incident, two NIST views (SP 800-61 Rev. 2 vs Rev. 3)</text>
  <text x="600" y="62" text-anchor="middle" font-size="14" fill="#475569">Rev. 3 (Apr 2025) maps incident response onto CSF 2.0 functions. Category codes are our mapping: verify at source.</text>

  <text x="30" y="110" font-size="15" font-weight="bold" fill="#0f172a">Rev. 2 phases</text>
  <rect x="30" y="122" width="250" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Preparation</text>
  <text x="155" y="170" text-anchor="middle" font-size="12" fill="#1e3a8a">playbook lint, watchlists, pins</text>
  <rect x="300" y="122" width="270" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="435" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Detection &amp; Analysis</text>
  <text x="435" y="170" text-anchor="middle" font-size="12" fill="#14532d">alerts, incident declared, enrich, notify</text>
  <rect x="590" y="122" width="350" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="765" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">Containment, Eradication &amp; Recovery</text>
  <text x="765" y="170" text-anchor="middle" font-size="12" fill="#7f1d1d">evidence, revoke, disable, quarantine, roll back, verify</text>
  <rect x="960" y="122" width="210" height="62" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1065" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">Post-Incident Activity</text>
  <text x="1065" y="170" text-anchor="middle" font-size="12" fill="#4c1d95">lessons learned</text>

  <text x="30" y="232" font-size="15" font-weight="bold" fill="#0f172a">Rev. 3 / CSF 2.0</text>
  <rect x="30" y="244" width="250" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Govern / Identify / Protect</text>
  <text x="155" y="292" text-anchor="middle" font-size="12" fill="#1e3a8a">policies, inventory, controls</text>
  <rect x="300" y="244" width="130" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="365" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Detect</text>
  <text x="365" y="292" text-anchor="middle" font-size="12" fill="#14532d">DE.AE</text>
  <rect x="440" y="244" width="380" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="630" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">Respond</text>
  <text x="630" y="292" text-anchor="middle" font-size="12" fill="#7f1d1d">RS.MA manage · RS.AN analyse + evidence · RS.CO report · RS.MI mitigate</text>
  <rect x="830" y="244" width="110" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="885" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">Recover</text>
  <text x="885" y="292" text-anchor="middle" font-size="12" fill="#7c2d12">RC.RP</text>
  <rect x="960" y="244" width="210" height="62" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1065" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">Identify &gt; Improvement</text>
  <text x="1065" y="292" text-anchor="middle" font-size="12" fill="#4c1d95">ID.IM</text>

  <rect x="30" y="340" width="1140" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="368" font-size="15" font-weight="bold" fill="#0f172a">Example: poisoned KB article kb-212 (lab incident INC-005)</text>
  <text x="50" y="394" font-size="13" fill="#334155">10:40 first flagged retrieval · 10:58 alert shared_poisoned_doc (3rd distinct user) · 10:58 incident opened</text>
  <text x="50" y="416" font-size="13" fill="#334155">11:02 evidence: telemetry + document snapshot (SHA-256, hash chain) · 11:03 notify · 11:08 quarantine + re-index (content owner approved)</text>
  <text x="50" y="438" font-size="13" fill="#334155">11:09 verify: kb-212 no longer retrievable · post-incident: who can edit the KB, scan on ingest, tune the rule</text>
  <text x="50" y="468" font-size="13" font-weight="bold" fill="#b91c1c">Time to detect 18 min · time to contain 10 min · one more retrieval happened before containment, one was prevented</text>
</svg>
