<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Ways to reach the Docker daemon, from worst to best</title><desc>Ladder of Docker daemon access methods ranked by risk.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1200" height="520" fill="#ffffff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Ways to reach the Docker daemon, from worst to best</text><rect x="40" y="80" width="360" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="220.0" y="114.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">tcp://0.0.0.0:2375</text><rect x="420" y="80" width="100" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="470.0" y="113.33333333333333" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">CRITICAL</text><text x="540" y="115" font-size="15" fill="#0f172a" text-anchor="start">plain TCP, no TLS: anyone reaching the port is root</text><rect x="40" y="154" width="360" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="220.0" y="188.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">tcp :2376 TLS, server cert only</text><rect x="420" y="154" width="100" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="470.0" y="187.33333333333334" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">HIGH</text><text x="540" y="189" font-size="15" fill="#0f172a" text-anchor="start">encrypted, but clients are not authenticated</text><rect x="40" y="228" width="360" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="220.0" y="262.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">tcp :2376 mutual TLS (--tlsverify)</text><rect x="420" y="228" width="100" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="470.0" y="261.3333333333333" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">MEDIUM</text><text x="540" y="263" font-size="15" fill="#0f172a" text-anchor="start">client certificate required; protect client keys like root keys</text><rect x="40" y="302" width="360" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="220.0" y="336.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">unix socket / fd://</text><rect x="420" y="302" width="100" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="470.0" y="335.3333333333333" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">DEFAULT</text><text x="540" y="337" font-size="15" fill="#0f172a" text-anchor="start">root:docker, mode 0660; systemd passes the socket (docker.socket)</text><rect x="40" y="376" width="360" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="220.0" y="410.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">ssh://user@host</text><rect x="420" y="376" width="100" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="470.0" y="409.3333333333333" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">GOOD</text><text x="540" y="411" font-size="15" fill="#0f172a" text-anchor="start">SSH authenticates and tunnels: simplest remote option</text><rect x="40" y="460" width="1120" height="44" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="600.0" y="487.0" font-size="15" fill="#0f172a" text-anchor="middle">Whoever reaches dockerd can start a privileged container and own the host: the socket is root-as-a-service.</text></svg>