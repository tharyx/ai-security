<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Attack success rate versus false-refusal rate for releases v1, v2, v2b and v3</title>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">The classic trade-off: block more, break more</text>
  <text x="40" y="74" font-size="15" fill="#475569">Real demo.py numbers: 64 attack attempts (62 in v1) and 20 benign prompts per release. Dashed lines: gate limits.</text>

  <rect x="900" y="96" width="18" height="18" fill="#dc2626"/>
  <text x="926" y="110" font-size="14" fill="#1e293b">Attack success rate (lower is safer)</text>
  <rect x="900" y="122" width="18" height="18" fill="#2563eb"/>
  <text x="926" y="136" font-size="14" fill="#1e293b">False-refusal rate (lower is more useful)</text>

  <!-- axes and grid: 0% at y=500, 100% at y=140 (3.6 px per %) -->
  <line x1="120" y1="500" x2="1080" y2="500" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="140" x2="120" y2="500" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="320" x2="1080" y2="320" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="140" x2="1080" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="482" x2="1080" y2="482" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1084" y="486" font-size="12" fill="#b45309">5%</text>
  <line x1="120" y1="464" x2="1080" y2="464" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="1084" y="468" font-size="12" fill="#475569">10%</text>
  <text x="108" y="505" font-size="13" fill="#475569" text-anchor="end">0%</text>
  <text x="108" y="325" font-size="13" fill="#475569" text-anchor="end">50%</text>
  <text x="108" y="145" font-size="13" fill="#475569" text-anchor="end">100%</text>

  <!-- v1 -->
  <rect x="160" y="140" width="70" height="360" fill="#dc2626"/>
  <text x="195" y="132" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">100%</text>
  <rect x="250" y="498" width="70" height="2" fill="#2563eb"/>
  <text x="285" y="490" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">0%</text>
  <text x="240" y="528" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">v1 naive</text>
  <text x="240" y="550" font-size="13" fill="#b91c1c" text-anchor="middle">gate FAIL (5 Critical)</text>

  <!-- v2 -->
  <rect x="400" y="202" width="70" height="298" fill="#dc2626"/>
  <text x="435" y="194" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">82.8%</text>
  <rect x="490" y="498" width="70" height="2" fill="#2563eb"/>
  <text x="525" y="490" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">0%</text>
  <text x="480" y="528" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">v2 prompt + filters</text>
  <text x="480" y="550" font-size="13" fill="#b91c1c" text-anchor="middle">gate FAIL (5 Critical)</text>

  <!-- v2b -->
  <rect x="640" y="365" width="70" height="135" fill="#dc2626"/>
  <text x="675" y="357" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">37.5%</text>
  <rect x="730" y="230" width="70" height="270" fill="#2563eb"/>
  <text x="765" y="222" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">75.0%</text>
  <text x="720" y="528" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">v2b strict blocklist</text>
  <text x="720" y="550" font-size="13" fill="#b91c1c" text-anchor="middle">gate FAIL (Critical, ASR, FRR)</text>

  <!-- v3 -->
  <rect x="880" y="498" width="70" height="2" fill="#dc2626"/>
  <text x="915" y="490" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">0%</text>
  <rect x="970" y="498" width="70" height="2" fill="#2563eb"/>
  <text x="1005" y="490" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">0%</text>
  <text x="960" y="528" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">v3 guardrails + grounding</text>
  <text x="960" y="550" font-size="13" fill="#15803d" text-anchor="middle">gate PASS</text>

  <text x="40" y="592" font-size="13" fill="#475569">0% on a finite test set is not 0% risk: it is "no hits on these 64 attempts". Keep growing the suite and run N times against a real model.</text>
</svg>
