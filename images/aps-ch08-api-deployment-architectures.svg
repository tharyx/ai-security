<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>How APIs are typically deployed: simple vs complex</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">How APIs are typically deployed: simple vs complex</text>
<text x="40" y="74" font-size="15" fill="#475569">Every arrow is a data flow to defend; every dashed box is a trust boundary where you authenticate, validate and encrypt.</text>
<text x="40" y="116" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">SIMPLE ARCHITECTURE</text>
<rect x="30" y="128" width="1140" height="120" rx="14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="42" y="150" text-anchor="start" font-size="13" font-weight="700" fill="#475569"></text>
<rect x="50" y="160" width="200" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="150.0" y="186.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Client</text>
<text x="150.0" y="206.7" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">browser / mobile app</text>
<rect x="330" y="160" width="260" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="460.0" y="186.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">API server (monolith)</text>
<text x="460.0" y="206.7" text-anchor="middle" font-size="14" font-weight="400" fill="#1e3a8a">auth + logic + validation</text>
<rect x="670" y="160" width="200" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="770.0" y="186.7" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Database</text>
<text x="770.0" y="206.7" text-anchor="middle" font-size="14" font-weight="400" fill="#78350f">one schema</text>
<rect x="940" y="160" width="210" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="1045.0" y="186.7" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Risks</text>
<text x="1045.0" y="206.7" text-anchor="middle" font-size="14" font-weight="400" fill="#7f1d1d">one bug = everything</text>
<line x1="250" y1="192" x2="328" y2="192" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="289" y="184" text-anchor="middle" font-size="13" fill="#334155">HTTPS</text>
<line x1="590" y1="192" x2="668" y2="192" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="629" y="184" text-anchor="middle" font-size="13" fill="#334155">SQL</text>
<text x="40" y="290" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">COMPLEX ARCHITECTURE (microservices)</text>
<rect x="30" y="302" width="1140" height="320" rx="14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="42" y="324" text-anchor="start" font-size="13" font-weight="700" fill="#475569"></text>
<rect x="50" y="340" width="150" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="125.0" y="366.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Clients</text>
<text x="125.0" y="385.8" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">web, mobile, partners</text>
<rect x="230" y="340" width="150" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="305.0" y="366.8" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">CDN / WAF</text>
<text x="305.0" y="385.8" text-anchor="middle" font-size="13" font-weight="400" fill="#4c1d95">edge filtering</text>
<rect x="410" y="340" width="160" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="490.0" y="366.8" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Load balancer /</text>
<text x="490.0" y="385.8" text-anchor="middle" font-size="13" font-weight="400" fill="#4c1d95">reverse proxy (TLS)</text>
<rect x="600" y="340" width="170" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="685.0" y="366.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">API gateway</text>
<text x="685.0" y="385.8" text-anchor="middle" font-size="13" font-weight="400" fill="#1e3a8a">authN, rate limits</text>
<rect x="810" y="320" width="160" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="890.0" y="349.3" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Orders service</text>
<rect x="810" y="384" width="160" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="890.0" y="413.3" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Users service</text>
<rect x="810" y="448" width="160" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="890.0" y="477.3" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Payments service</text>
<rect x="1000" y="320" width="150" height="50" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="1075.0" y="349.3" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Orders DB</text>
<rect x="1000" y="384" width="150" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1075.0" y="413.3" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Identity provider</text>
<rect x="810" y="530" width="340" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="980.0" y="556.8" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Message queue / event bus</text>
<text x="980.0" y="575.8" text-anchor="middle" font-size="13" font-weight="400" fill="#78350f">async work, webhooks, workers</text>
<rect x="50" y="450" width="520" height="144" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="64" y="478.8" text-anchor="start" font-size="13" font-weight="700" fill="#14532d">Where to defend</text>
<text x="64" y="497.8" text-anchor="start" font-size="13" font-weight="400" fill="#14532d">edge: WAF, TLS, DDoS protection</text>
<text x="64" y="516.8" text-anchor="start" font-size="13" font-weight="400" fill="#14532d">gateway: authN, quotas, schema checks</text>
<text x="64" y="535.8" text-anchor="start" font-size="13" font-weight="400" fill="#14532d">service: object-level authZ, input validation</text>
<text x="64" y="554.8" text-anchor="start" font-size="13" font-weight="400" fill="#14532d">data: encryption, least-privilege DB users</text>
<text x="64" y="573.8" text-anchor="start" font-size="13" font-weight="400" fill="#14532d">everywhere: logging without secrets</text>
<line x1="200" y1="372" x2="228" y2="372" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="380" y1="372" x2="408" y2="372" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="570" y1="372" x2="598" y2="372" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="770" y1="372" x2="808" y2="345" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="770" y1="372" x2="808" y2="409" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="770" y1="372" x2="808" y2="473" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="970" y1="345" x2="998" y2="345" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="970" y1="409" x2="998" y2="409" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="890" y1="498" x2="890" y2="528" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
</svg>
