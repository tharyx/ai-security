<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Single sign-on with an identity provider</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#475569"/></marker></defs>
<rect width="1200" height="480" fill="#ffffff"/>
<text x="60" y="52" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">Single sign-on with an identity provider</text>
<text x="60" y="82" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">One login, many apps. The app trusts a signed token from the identity provider (IdP)</text>
<rect x="60" y="150" width="220" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="170.0" y="178" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">User + browser</text>
<text x="170.0" y="202" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">opens the app</text>
<rect x="490" y="150" width="220" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="600.0" y="178" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">App (service provider)</text>
<text x="600.0" y="202" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">SAML SP or</text>
<text x="600.0" y="222" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">OIDC relying party</text>
<rect x="920" y="150" width="220" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1030.0" y="178" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Identity provider</text>
<text x="1030.0" y="202" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">password + MFA</text>
<text x="1030.0" y="222" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Conditional Access</text>
<line x1="284" y1="185" x2="486" y2="185" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="385.0" y="177.0" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">1. open app</text>
<line x1="490" y1="225" x2="284" y2="225" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="387.0" y="217.0" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">2. redirect to IdP</text>
<line x1="210" y1="255" x2="920" y2="330" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="565.0" y="284.5" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">3. sign in + MFA</text>
<line x1="920" y1="350" x2="600" y2="262" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="760.0" y="298.0" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">4. signed assertion / ID token</text>
<text x="60" y="400" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">SAML: XML assertion, common in older enterprise apps. OIDC: JSON Web Token on top of OAuth 2.0, common in modern apps.</text>
<text x="60" y="425" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">The app never sees the password. Disable the user at the IdP and access ends everywhere.</text>
</svg>
