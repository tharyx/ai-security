<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Free and open agentic toolchain: local model, cloud router and policy</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">Local first, cloud by policy</text>
  <text x="40" y="74" font-size="16" fill="#475569">One OpenAI-style endpoint in front of both. The policy, not the model, decides where a request may go.</text>

  <rect x="40" y="130" width="200" height="110" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="140" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Agent surfaces</text>
  <text x="140" y="190" text-anchor="middle" font-size="12" fill="#475569">your harness, LibreChat,</text>
  <text x="140" y="208" text-anchor="middle" font-size="12" fill="#475569">Hermes, VS Code agent</text>

  <rect x="300" y="110" width="280" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="440" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Router / proxy (LiteLLM style)</text>
  <text x="440" y="168" text-anchor="middle" font-size="12" fill="#92400e">1 scan prompt for secrets and PII</text>
  <text x="440" y="188" text-anchor="middle" font-size="12" fill="#92400e">2 classify: public ... restricted</text>
  <text x="440" y="208" text-anchor="middle" font-size="12" fill="#92400e">3 size and difficulty of the task</text>
  <text x="440" y="228" text-anchor="middle" font-size="12" fill="#92400e">4 pick target, log decision, cap cost</text>

  <rect x="660" y="100" width="230" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="775" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Local open-weight model</text>
  <text x="775" y="158" text-anchor="middle" font-size="12" fill="#166534">Ollama / llama.cpp, 1B to 7B Q4</text>
  <text x="775" y="178" text-anchor="middle" font-size="12" fill="#166534">data stays on the laptop</text>
  <text x="775" y="196" text-anchor="middle" font-size="12" fill="#166534">free, slower, smaller context</text>

  <rect x="660" y="260" width="230" height="130" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="775" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Cloud or routed API</text>
  <text x="775" y="316" text-anchor="middle" font-size="12" fill="#991b1b">OpenRouter, provider APIs</text>
  <text x="775" y="336" text-anchor="middle" font-size="12" fill="#991b1b">large models, billed, logged</text>
  <text x="775" y="356" text-anchor="middle" font-size="12" fill="#991b1b">data leaves your boundary</text>
  <text x="775" y="376" text-anchor="middle" font-size="12" fill="#991b1b">check: served model = asked model</text>

  <rect x="950" y="150" width="220" height="190" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1060" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Never to the cloud</text>
  <text x="1060" y="208" text-anchor="middle" font-size="12" fill="#475569">confidential or restricted data</text>
  <text x="1060" y="228" text-anchor="middle" font-size="12" fill="#475569">credentials and tokens</text>
  <text x="1060" y="248" text-anchor="middle" font-size="12" fill="#475569">customer personal data</text>
  <text x="1060" y="276" text-anchor="middle" font-size="12" fill="#475569">If it does not fit locally:</text>
  <text x="1060" y="296" text-anchor="middle" font-size="12" fill="#475569">smaller local model or an</text>
  <text x="1060" y="316" text-anchor="middle" font-size="12" fill="#475569">approved private deployment</text>

  <line x1="240" y1="185" x2="298" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="160" x2="658" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="215" x2="658" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="890" y1="325" x2="948" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>

  <rect x="40" y="440" width="1130" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="468" font-size="14" font-weight="700" fill="#1e3a8a">Memory rule of thumb: weights = parameters x bytes per weight (FP16 2.0, Q8 about 1.06, Q4 about 0.58), plus KV cache, plus about 0.5 GB.</text>
  <text x="60" y="492" font-size="13" fill="#1e3a8a">Example: 7B at Q4 is about 4.2 GB of weights and about 6 GB all in at 8k context. With 16 GB RAM, no GPU and about 6 GB kept for the OS, aim for 1B to 7B at Q4.</text>
  <text x="60" y="510" font-size="13" fill="#1e3a8a">Run lab model-sizing-calculator for exact figures.</text>
</svg>
