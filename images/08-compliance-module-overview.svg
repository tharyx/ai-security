<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Module 08 overview: from many obligations to one control set, evidence and audit</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">AI compliance: many duties, one control set, real evidence</text>
  <text x="40" y="76" font-size="16" fill="#475569">Work out what applies, build each control once, collect evidence automatically, be ready to show it.</text>

  <!-- sources -->
  <text x="40" y="112" font-size="15" font-weight="700" fill="#0f172a">Sources of obligations</text>
  <rect x="40" y="124" width="240" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Laws (must)</text>
  <text x="160" y="172" text-anchor="middle" font-size="12" fill="#991b1b">EU AI Act · GDPR · India DPDP</text>
  <rect x="40" y="200" width="240" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="160" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Certifiable standards</text>
  <text x="160" y="248" text-anchor="middle" font-size="12" fill="#92400e">ISO/IEC 42001 · ISO/IEC 27001</text>
  <rect x="40" y="276" width="240" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="160" y="302" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Frameworks, reports</text>
  <text x="160" y="324" text-anchor="middle" font-size="12" fill="#475569">NIST AI RMF · SOC 2 · contracts</text>

  <!-- applicability -->
  <rect x="320" y="150" width="200" height="164" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">1 Applicability</text>
  <text x="420" y="206" text-anchor="middle" font-size="13" fill="#1e3a8a">scope, role, category</text>
  <text x="420" y="226" text-anchor="middle" font-size="13" fill="#1e3a8a">jurisdictions, dates</text>
  <text x="420" y="250" text-anchor="middle" font-size="12" fill="#475569">questionnaire engine</text>
  <text x="420" y="300" text-anchor="middle" font-size="12" fill="#2563eb">Lessons 01-02</text>

  <!-- control set -->
  <rect x="560" y="150" width="200" height="164" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="660" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">2 Control set</text>
  <text x="660" y="206" text-anchor="middle" font-size="13" fill="#166534">one control, mapped</text>
  <text x="660" y="226" text-anchor="middle" font-size="13" fill="#166534">to many frameworks</text>
  <text x="660" y="250" text-anchor="middle" font-size="12" fill="#475569">CTL-LOG, CTL-HO ...</text>
  <text x="660" y="300" text-anchor="middle" font-size="12" fill="#2563eb">Lesson 03</text>

  <!-- evidence -->
  <rect x="800" y="150" width="170" height="164" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="885" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">3 Evidence</text>
  <text x="885" y="206" text-anchor="middle" font-size="13" fill="#475569">fresh, hashed,</text>
  <text x="885" y="226" text-anchor="middle" font-size="13" fill="#475569">automated</text>
  <text x="885" y="250" text-anchor="middle" font-size="12" fill="#475569">gap checker</text>
  <text x="885" y="300" text-anchor="middle" font-size="12" fill="#2563eb">Lessons 03-04</text>

  <!-- audit -->
  <rect x="1010" y="150" width="150" height="164" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1085" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">4 Assurance</text>
  <text x="1085" y="206" text-anchor="middle" font-size="13" fill="#1e3a8a">auditor,</text>
  <text x="1085" y="226" text-anchor="middle" font-size="13" fill="#1e3a8a">regulator,</text>
  <text x="1085" y="246" text-anchor="middle" font-size="13" fill="#1e3a8a">customer</text>
  <text x="1085" y="300" text-anchor="middle" font-size="12" fill="#2563eb">Lesson 04</text>

  <path d="M280 156 L314 200" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M280 232 L314 232" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M280 308 L314 264" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M520 232 L554 232" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M760 232 L794 232" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M970 232 L1004 232" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- privacy band -->
  <rect x="320" y="350" width="440" height="88" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="378" font-size="15" font-weight="700" fill="#92400e">Privacy inside the AI system (Lesson 02)</text>
  <text x="340" y="402" font-size="13" fill="#92400e">lawful basis · DPIA · automated decisions · rights</text>
  <text x="340" y="422" font-size="13" fill="#92400e">erasure: source, index, cache, logs, backups, models</text>

  <!-- incident band -->
  <rect x="800" y="350" width="360" height="88" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="820" y="378" font-size="15" font-weight="700" fill="#991b1b">AI incident (Lesson 04)</text>
  <text x="820" y="402" font-size="13" fill="#991b1b">several reporting clocks start at once:</text>
  <text x="820" y="422" font-size="13" fill="#991b1b">CERT-In 6 h · GDPR 72 h · AI Act 2-15 days</text>

  <rect x="40" y="470" width="1120" height="96" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="500" font-size="16" font-weight="700" fill="#0f172a">Continuous compliance</text>
  <text x="60" y="526" font-size="14" fill="#334155">Pipelines export evidence on a schedule · the checker flags missing, stale, edited or manual-only evidence</text>
  <text x="60" y="550" font-size="14" fill="#334155">findings feed the Module 07 risk register · law or system changes re-run the applicability step. Not legal advice.</text>
</svg>
