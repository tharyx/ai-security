<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Anatomy of an incident report</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#475569"/></marker></defs>
<rect width="1200" height="460" fill="#ffffff"/>
<text x="60" y="52" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">Anatomy of an incident report</text>
<text x="60" y="82" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">Facts first, then meaning. Times in one time zone (UTC), every claim backed by evidence</text>
<rect x="60.0" y="120" width="240" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="180.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Summary</text>
<text x="180.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">what, impact, status</text>
<text x="180.0" y="192" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">(3 lines)</text>
<rect x="340.0" y="120" width="240" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="460.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Timeline</text>
<text x="460.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">time + event + source</text>
<text x="460.0" y="192" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">no opinions</text>
<rect x="620.0" y="120" width="240" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="740.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Analysis</text>
<text x="740.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">root cause, scope,</text>
<text x="740.0" y="192" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">what we know / do not</text>
<rect x="900.0" y="120" width="240" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1020.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Actions</text>
<text x="1020.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">done, next, owner, date</text>
<line x1="304.0" y1="170.0" x2="336.0" y2="170.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="584.0" y1="170.0" x2="616.0" y2="170.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="864.0" y1="170.0" x2="896.0" y2="170.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="60" y="280" width="1080" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="600.0" y="308" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Keep three things apart</text>
<text x="600.0" y="332" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">FACT (what the log shows)  |  INFERENCE (what we think it means)  |  DECISION (what we chose to do and who chose)</text>
<text x="60" y="400" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Write for the person who reads it in 6 months, who was not there, and may need it for a lawyer or an auditor.</text>
</svg>
