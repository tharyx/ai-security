<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>DAST scan cadence: per commit, weekly and monthly</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a">One scanner, three speeds</text>
  <text x="40" y="70" font-size="15" fill="#475569">Fast and safe on every commit; slow and deep on a schedule. Each tier has its own time budget and its own break-build rule.</text>

  <rect x="40" y="100" width="340" height="330" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Per commit / merge request</text>
  <text x="210" y="160" text-anchor="middle" font-size="14" fill="#475569">baseline scan, 2 to 5 minutes</text>
  <text x="60" y="196" font-size="14" fill="#0f172a">Spider + passive rules only</text>
  <text x="60" y="220" font-size="14" fill="#0f172a">No attacks, no data changes</text>
  <text x="60" y="244" font-size="14" fill="#0f172a">Target: ephemeral review app</text>
  <text x="60" y="268" font-size="14" fill="#0f172a">Finds: headers, cookies, leaks</text>
  <rect x="60" y="300" width="300" height="46" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="210" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">GATE: fail on any new High</text>
  <text x="210" y="338" text-anchor="middle" font-size="12" fill="#475569">known debt lives in a baseline file</text>
  <text x="60" y="380" font-size="13" fill="#475569">ZAP baseline / Dastardly / AF "commit" plan</text>

  <rect x="430" y="100" width="340" height="330" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Weekly</text>
  <text x="600" y="160" text-anchor="middle" font-size="14" fill="#475569">full scan, up to an hour or two</text>
  <text x="450" y="196" font-size="14" fill="#0f172a">Spider + AJAX spider + ACTIVE scan</text>
  <text x="450" y="220" font-size="14" fill="#0f172a">Imports the OpenAPI spec</text>
  <text x="450" y="244" font-size="14" fill="#0f172a">Target: staging with test data</text>
  <text x="450" y="268" font-size="14" fill="#0f172a">Finds: XSS, SQLi, misconfigs</text>
  <rect x="450" y="300" width="300" height="46" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="600" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">GATE: fail on High; max 5 Medium</text>
  <text x="600" y="338" text-anchor="middle" font-size="12" fill="#475569">tickets to DefectDojo / backlog</text>
  <text x="450" y="380" font-size="13" fill="#475569">ZAP full scan / AF "weekly" plan</text>

  <rect x="820" y="100" width="340" height="330" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="990" y="134" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Monthly</text>
  <text x="990" y="160" text-anchor="middle" font-size="14" fill="#475569">deep and authenticated, hours</text>
  <text x="840" y="196" font-size="14" fill="#0f172a">Logged-in scan, high-strength rules</text>
  <text x="840" y="220" font-size="14" fill="#0f172a">QA-recorded flows + Zest scripts</text>
  <text x="840" y="244" font-size="14" fill="#0f172a">Roles: user, admin (test accounts)</text>
  <text x="840" y="268" font-size="14" fill="#0f172a">Finds: broken access, deep bugs</text>
  <rect x="840" y="300" width="300" height="46" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="990" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">GATE: fail on Medium and above</text>
  <text x="990" y="338" text-anchor="middle" font-size="12" fill="#475569">plus TLS / server misconfig checks</text>
  <text x="840" y="380" font-size="13" fill="#475569">AF "monthly" plan, authenticated</text>

  <line x1="380" y1="265" x2="428" y2="265" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="770" y1="265" x2="818" y2="265" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="40" y="475" font-size="14" fill="#475569">DBA analogy: a quick health check after every deploy (like a listener ping), a weekly backup test, and a monthly full recovery drill.</text>
  <text x="40" y="497" font-size="14" fill="#475569">Never run active scans against production or against systems you do not own.</text>
</svg>
