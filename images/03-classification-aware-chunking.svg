<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Classification-aware chunking versus fixed-size chunking</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="540" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">Chunking is an access-control decision</text>
  <text x="600" y="70" text-anchor="middle" font-size="16" fill="#475569">Access checks read the chunk's label. If the chunk mixes classes, a correct check gives a wrong answer.</text>

  <!-- Source document -->
  <rect x="40" y="110" width="300" height="300" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="190" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Employee record: Alice</text>
  <rect x="60" y="155" width="260" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="75" y="178" font-size="14" font-weight="bold" fill="#0f172a">Profile · internal</text>
  <text x="75" y="200" font-size="12" fill="#475569">team, job title</text>
  <rect x="60" y="235" width="260" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="75" y="258" font-size="14" font-weight="bold" fill="#0f172a">Compensation · restricted</text>
  <text x="75" y="280" font-size="12" fill="#475569">salary band, base pay</text>
  <rect x="60" y="315" width="260" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="75" y="338" font-size="14" font-weight="bold" fill="#0f172a">Personal · restricted</text>
  <text x="75" y="360" font-size="12" fill="#475569">national ID, emergency contact</text>

  <!-- Fixed size -->
  <text x="420" y="118" font-size="17" font-weight="bold" fill="#dc2626">Fixed-size chunks (vulnerable)</text>
  <rect x="420" y="135" width="320" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="435" y="160" font-size="13" font-weight="bold" fill="#0f172a">chunk 0 · label "internal"</text>
  <text x="435" y="182" font-size="12" fill="#475569">Profile text + START of Compensation</text>
  <text x="435" y="200" font-size="12" fill="#475569">(label taken from the first section)</text>
  <rect x="420" y="225" width="320" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="435" y="250" font-size="13" font-weight="bold" fill="#0f172a">chunk 1 · label "internal"</text>
  <text x="435" y="272" font-size="12" fill="#475569">rest of pay + Personal (national ID)</text>
  <rect x="420" y="315" width="320" height="95" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="435" y="340" font-size="13" fill="#0f172a">Maria (manager) may read "internal"</text>
  <text x="435" y="362" font-size="13" fill="#0f172a">parts of Alice's record, so she gets</text>
  <text x="435" y="384" font-size="13" font-weight="bold" fill="#dc2626">Alice's pay and national ID</text>

  <!-- Section-based -->
  <text x="800" y="118" font-size="17" font-weight="bold" fill="#16a34a">Section-based chunks (secure)</text>
  <rect x="800" y="135" width="360" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="815" y="160" font-size="13" font-weight="bold" fill="#0f172a">Profile · internal</text>
  <text x="815" y="182" font-size="12" fill="#475569">readable: HR, Alice, Maria (named in the ACL)</text>
  <rect x="800" y="207" width="360" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="815" y="232" font-size="13" font-weight="bold" fill="#0f172a">Compensation · restricted</text>
  <text x="815" y="254" font-size="12" fill="#475569">readable: HR role or the subject (Alice) only</text>
  <rect x="800" y="279" width="360" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="815" y="304" font-size="13" font-weight="bold" fill="#0f172a">Personal · restricted</text>
  <text x="815" y="326" font-size="12" fill="#475569">readable: HR role or Alice; ID masked in chat</text>
  <rect x="800" y="351" width="360" height="59" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="815" y="376" font-size="13" fill="#0f172a">Maria gets the profile only.</text>
  <text x="815" y="397" font-size="13" fill="#0f172a">Same access rule; correct labels.</text>

  <line x1="340" y1="200" x2="416" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="160" x2="370" y2="160" stroke="#475569" stroke-width="2"/>
  <line x1="370" y1="160" x2="370" y2="95"  stroke="#475569" stroke-width="2"/>
  <line x1="370" y1="95"  x2="780" y2="95"  stroke="#475569" stroke-width="2"/>
  <line x1="780" y1="95"  x2="780" y2="166" stroke="#475569" stroke-width="2"/>
  <line x1="780" y1="166" x2="796" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Rules -->
  <rect x="40" y="440" width="1120" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="467" font-size="15" font-weight="bold" fill="#0f172a">Rules</text>
  <text x="60" y="491" font-size="13" fill="#475569">1. Never cross a classification or permission boundary.  2. Label = the chunk's own content (or the strictest label in it).  3. No overlap across</text>
  <text x="60" y="511" font-size="13" fill="#475569">boundaries.  4. Labels propagate to vectors, caches, summaries and evaluation sets.  5. Unknown label: don't index (fail closed).</text>
</svg>
