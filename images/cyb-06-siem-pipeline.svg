<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The SIEM pipeline</title>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">The SIEM pipeline</text>
  <text x="40" y="78" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">Every SIEM, from Sentinel to Splunk to this lab's mini SIEM, does the same steps.</text>
  <rect x="30" y="120" width="175" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="117.5" y="146" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Sources</text>
  <text x="117.5" y="170" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Windows, Entra</text>
  <text x="117.5" y="189" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">firewall, Linux</text>
  <line x1="205" y1="170" x2="225" y2="170" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="225" y="120" width="175" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="312.5" y="146" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Collect</text>
  <text x="312.5" y="170" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">agent, syslog, API</text>
  <line x1="400" y1="170" x2="420" y2="170" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="420" y="120" width="175" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="507.5" y="146" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Normalize</text>
  <text x="507.5" y="170" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">parse to common</text>
  <text x="507.5" y="189" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">field names</text>
  <line x1="595" y1="170" x2="615" y2="170" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="615" y="120" width="175" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="702.5" y="146" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Store + index</text>
  <text x="702.5" y="170" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">retention and cost</text>
  <line x1="790" y1="170" x2="810" y2="170" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="810" y="120" width="175" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="897.5" y="146" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Detect</text>
  <text x="897.5" y="170" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">rules, correlation</text>
  <line x1="985" y1="170" x2="1005" y2="170" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="1005" y="120" width="175" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1092.5" y="146" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Alert</text>
  <text x="1092.5" y="170" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">incident, ticket, SOAR</text>
  <rect x="40" y="280" width="530" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="305.0" y="306" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Common problems</text>
  <text x="305.0" y="330" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Missing logs: you cannot detect what you do not collect</text>
  <text x="305.0" y="349" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Wrong time zone or parsing: detections break silently</text>
  <text x="305.0" y="368" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Too much noise: cost grows and analysts stop looking</text>
  <rect x="630" y="280" width="530" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="895.0" y="306" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Good habits</text>
  <text x="895.0" y="330" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Start from use cases (threats), not from log sources</text>
  <text x="895.0" y="349" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Normalize early (ECS / ASIM / CIM)</text>
  <text x="895.0" y="368" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Test every rule with a true positive and a benign case</text>
  <rect x="40" y="420" width="1120" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="600.0" y="446" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Lab: 173 events from 4 sources -&gt; 1 schema -&gt; 6 YAML rules -&gt; 7 alerts</text>
</svg>
