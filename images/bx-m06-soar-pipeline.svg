<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>AI SOC and SOAR pipeline: normalise, detect, score, correlate, respond, report</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">AI SOC + SOAR: from three log formats to an incident timeline</text>
  <text x="600" y="64" text-anchor="middle" font-size="15" fill="#475569">Brightix module 6 lab: ai-soar-playbooks (standard library, offline)</text>

  <!-- sources -->
  <rect x="20" y="100" width="170" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="105" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">LLM app gateway</text>
  <text x="105" y="150" text-anchor="middle" font-size="12" fill="#475569">ISO time, nested JSON</text>
  <rect x="20" y="185" width="170" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="105" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Agent runtime</text>
  <text x="105" y="235" text-anchor="middle" font-size="12" fill="#475569">epoch seconds, spans</text>
  <rect x="20" y="270" width="170" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="105" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">MCP gateway</text>
  <text x="105" y="320" text-anchor="middle" font-size="12" fill="#475569">desc hash vs pin</text>

  <!-- stages -->
  <rect x="230" y="170" width="140" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">1 Normalise</text>
  <text x="300" y="228" text-anchor="middle" font-size="12" fill="#1e3a8a">one Event schema</text>
  <text x="300" y="246" text-anchor="middle" font-size="12" fill="#1e3a8a">hash + length,</text>
  <text x="300" y="264" text-anchor="middle" font-size="12" fill="#1e3a8a">no raw prompts</text>

  <rect x="400" y="120" width="160" height="210" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">2 Detect</text>
  <text x="480" y="174" text-anchor="middle" font-size="12" fill="#14532d">naive: keywords,</text>
  <text x="480" y="192" text-anchor="middle" font-size="12" fill="#14532d">per-event thresholds</text>
  <text x="480" y="210" text-anchor="middle" font-size="12" fill="#b91c1c">P=0.50, missed 2/5</text>
  <text x="480" y="238" text-anchor="middle" font-size="12" fill="#14532d">tuned: allow-lists,</text>
  <text x="480" y="256" text-anchor="middle" font-size="12" fill="#14532d">baselines, pins, canaries</text>
  <text x="480" y="274" text-anchor="middle" font-size="12" fill="#15803d">P=1.00, missed 0/5</text>
  <text x="480" y="302" text-anchor="middle" font-size="11" fill="#475569">tags: ATLAS + OWASP</text>

  <rect x="590" y="120" width="150" height="95" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="665" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#713f12">3 Risk score</text>
  <text x="665" y="173" text-anchor="middle" font-size="12" fill="#713f12">per entity, decays</text>
  <text x="665" y="191" text-anchor="middle" font-size="12" fill="#713f12">half-life 30 min</text>

  <rect x="590" y="235" width="150" height="95" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="665" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#713f12">4 Correlate</text>
  <text x="665" y="288" text-anchor="middle" font-size="12" fill="#713f12">7 alerts -> 5 incidents</text>
  <text x="665" y="306" text-anchor="middle" font-size="12" fill="#713f12">trace, doc, tool, dest</text>

  <rect x="770" y="120" width="200" height="210" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="870" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">5 SOAR playbook</text>
  <text x="870" y="174" text-anchor="middle" font-size="12" fill="#7f1d1d">enrich, notify (auto)</text>
  <text x="870" y="192" text-anchor="middle" font-size="12" fill="#7f1d1d">preserve evidence FIRST</text>
  <text x="870" y="210" text-anchor="middle" font-size="12" fill="#7f1d1d">(hash chain)</text>
  <text x="870" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">approval gate</text>
  <text x="870" y="254" text-anchor="middle" font-size="12" fill="#7f1d1d">revoke agent token</text>
  <text x="870" y="272" text-anchor="middle" font-size="12" fill="#7f1d1d">disable MCP tool</text>
  <text x="870" y="290" text-anchor="middle" font-size="12" fill="#7f1d1d">quarantine doc + re-index</text>
  <text x="870" y="308" text-anchor="middle" font-size="12" fill="#7f1d1d">roll back system prompt</text>

  <rect x="1000" y="170" width="180" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1090" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">6 Report</text>
  <text x="1090" y="225" text-anchor="middle" font-size="12" fill="#4c1d95">timeline mapped to</text>
  <text x="1090" y="243" text-anchor="middle" font-size="12" fill="#4c1d95">SP 800-61 Rev. 2 and</text>
  <text x="1090" y="261" text-anchor="middle" font-size="12" fill="#4c1d95">Rev. 3 / CSF 2.0</text>

  <line x1="190" y1="135" x2="228" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="190" y1="220" x2="228" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="190" y1="305" x2="228" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="225" x2="398" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="560" y1="180" x2="588" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="560" y1="270" x2="588" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="280" x2="768" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="170" x2="768" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="970" y1="225" x2="998" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- incidents strip -->
  <rect x="20" y="380" width="1160" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="408" font-size="15" font-weight="bold" fill="#0f172a">Five incidents hidden in one morning of benign traffic</text>
  <text x="40" y="436" font-size="13" fill="#334155">A  09:12  indirect prompt injection in an email -> agent http_post to an attacker domain  (critical)</text>
  <text x="40" y="458" font-size="13" fill="#334155">B  10:00  cost-DoS: leaked integration key, 60 large requests in 12 minutes</text>
  <text x="40" y="480" font-size="13" fill="#334155">C  10:30  system-prompt leak proven by a canary in the output</text>
  <text x="620" y="436" font-size="13" fill="#334155">D  10:40  poisoned KB article retrieved by five users</text>
  <text x="620" y="458" font-size="13" fill="#334155">E  10:55  MCP rug pull -> bulk CRM read -> exfil  (critical)</text>
  <text x="620" y="480" font-size="13" fill="#334155">Noise: red-team account, partner API, approved MCP update</text>
  <text x="40" y="512" font-size="12" fill="#64748b">Real tools: KQL analytics rule + automation rule/Logic App (Sentinel); SPL search + SOAR playbook (Splunk). Verify product names and syntax.</text>
</svg>
