<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title id="t">Trust zones around an agent</title>
  <desc id="d">Three zones: a trusted zone with the system configuration and authenticated user channel, a semi-trusted zone with approved internal data, and an untrusted zone with web content, mail, uploads, other agents and memory written from tool output. Authority flows only from the trusted zone.</desc>
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Authority comes from the channel, never from the content</text>

  <rect x="30" y="50" width="280" height="290" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="170" y="76" text-anchor="middle" font-weight="600" fill="#14532d">Trusted: carries authority</text>
  <text x="170" y="110" text-anchor="middle" fill="#14532d">system prompt and policy (code)</text>
  <text x="170" y="136" text-anchor="middle" fill="#14532d">authenticated user channel</text>
  <text x="170" y="162" text-anchor="middle" fill="#14532d">signed goal changes</text>
  <text x="170" y="188" text-anchor="middle" fill="#14532d">approval decisions by a human</text>
  <text x="170" y="240" text-anchor="middle" fill="#166534" font-size="12">Can change the goal, grant tools,</text>
  <text x="170" y="258" text-anchor="middle" fill="#166534" font-size="12">approve actions.</text>

  <rect x="340" y="50" width="280" height="290" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="480" y="76" text-anchor="middle" font-weight="600" fill="#78350f">Semi-trusted: data with provenance</text>
  <text x="480" y="110" text-anchor="middle" fill="#78350f">approved internal documents</text>
  <text x="480" y="136" text-anchor="middle" fill="#78350f">user-written memory entries</text>
  <text x="480" y="162" text-anchor="middle" fill="#78350f">results of vetted internal tools</text>
  <text x="480" y="188" text-anchor="middle" fill="#78350f">signed messages from known agents</text>
  <text x="480" y="240" text-anchor="middle" fill="#92400e" font-size="12">May inform answers. May not</text>
  <text x="480" y="258" text-anchor="middle" fill="#92400e" font-size="12">change goals or grant authority.</text>

  <rect x="650" y="50" width="280" height="290" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="790" y="76" text-anchor="middle" font-weight="600" fill="#7f1d1d">Untrusted: data only</text>
  <text x="790" y="110" text-anchor="middle" fill="#7f1d1d">web pages, search results</text>
  <text x="790" y="136" text-anchor="middle" fill="#7f1d1d">e-mail, tickets, chat, uploads</text>
  <text x="790" y="162" text-anchor="middle" fill="#7f1d1d">third-party tool descriptions</text>
  <text x="790" y="188" text-anchor="middle" fill="#7f1d1d">memory written from tool output</text>
  <text x="790" y="214" text-anchor="middle" fill="#7f1d1d">images, files, environment</text>
  <text x="790" y="258" text-anchor="middle" fill="#991b1b" font-size="12">Spotlight, scan, taint. Any side effect</text>
  <text x="790" y="276" text-anchor="middle" fill="#991b1b" font-size="12">after this needs a gate or an approval.</text>
</svg>
