<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">DFD notation for threat modeling</title>
<desc id="d">The five DFD symbols: external entity, process, data store, data flow and trust boundary, with STRIDE letters per symbol.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="40" y="46" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">Data flow diagram (DFD) symbols</text>
<text x="40" y="72" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">Five shapes are enough to draw almost any system. STRIDE-per-element tells you which threats to check on each.</text>
<rect x="60" y="130" width="190" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="155.0" y="154" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">External entity</text>
<text x="155" y="240" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">A person or system outside your control</text>
<text x="155" y="258" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Example: customer, web page, partner API</text>
<text x="155" y="305" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">STRIDE: S  R</text>
<circle cx="425" cy="170" r="55" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="425" y="174" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Process</text>
<text x="425" y="252" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Code that does something with data</text>
<text x="425" y="270" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Example: API, orchestrator, LLM call</text>
<text x="425" y="305" font-size="18" font-weight="bold" fill="#d97706" text-anchor="middle">STRIDE: S T R I D E</text>
<rect x="650" y="140" width="220" height="60" fill="#f8fafc" stroke="none"/>
<line x1="650" y1="140" x2="870" y2="140" stroke="#64748b" stroke-width="3"/>
<line x1="650" y1="200" x2="870" y2="200" stroke="#64748b" stroke-width="3"/>
<text x="760.0" y="175.0" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Data store</text>
<text x="760" y="240" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Data at rest</text>
<text x="760" y="258" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Example: vector DB, logs, model file</text>
<text x="760" y="305" font-size="18" font-weight="bold" fill="#64748b" text-anchor="middle">STRIDE: T  R  I  D</text>
<line x1="960" y1="170" x2="1140" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1013.6" y="159.0" width="72.8" height="16" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="1050.0" y="171.0" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">data flow</text>
<text x="1050" y="240" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Data moving between two shapes</text>
<text x="1050" y="258" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Example: HTTPS request, query</text>
<text x="1050" y="305" font-size="18" font-weight="bold" fill="#334155" text-anchor="middle">STRIDE: T  I  D</text>
<rect x="60" y="350" width="1080" height="150" rx="14" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="12 7"/>
<text x="80" y="378" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="start">Trust boundary (dashed line)</text>
<text x="80" y="404" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">A line where the level of trust changes: Internet to your network, your code to a third-party model,</text>
<text x="80" y="423" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">app tier to data tier. Every data flow that crosses a boundary deserves extra attention.</text>
<text x="80" y="460" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Rules of thumb: data never moves by itself, so every flow has a process at one end (entity to store directly is a mistake).</text>
<text x="80" y="478" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Entities are outside your control: you do not threat-model their insides, only how they reach you.</text>
</svg>
