<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>From training to deployment: what changes, and what can go wrong</title>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">From training to deployment: what changes, and what can go wrong</text>
  <text x="40" y="80" font-size="16" fill="#475569">Each stage changes something different, so each has its own risks. You inherit stages 1 to 3 from the model provider.</text>
  <rect x="40" y="110" width="175" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="54" y="134" font-size="13" font-weight="700" fill="#334155">1. Pre-training</text>
  <text x="54" y="154" font-size="12" fill="#334155">owner: provider</text>
  <rect x="40" y="185" width="175" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="54" y="209" font-size="13" font-weight="700" fill="#1e3a8a">What changes</text>
  <text x="54" y="229" font-size="12" fill="#1e3a8a">all weights,</text>
  <text x="54" y="246" font-size="12" fill="#1e3a8a">web-scale text</text>
  <rect x="40" y="285" width="175" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="54" y="309" font-size="13" font-weight="700" fill="#991b1b">What can go wrong</text>
  <text x="54" y="329" font-size="12" fill="#991b1b">web poisoning,</text>
  <text x="54" y="346" font-size="12" fill="#991b1b">memorized PII,</text>
  <text x="54" y="363" font-size="12" fill="#991b1b">backdoors</text>
  <rect x="40" y="400" width="175" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="54" y="424" font-size="13" font-weight="700" fill="#166534">Hard control</text>
  <text x="54" y="444" font-size="12" fill="#166534">data provenance,</text>
  <text x="54" y="461" font-size="12" fill="#166534">dedup, PII filters</text>
  <line x1="215" y1="140" x2="228" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="230" y="110" width="175" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="244" y="134" font-size="13" font-weight="700" fill="#334155">2. Instruction tuning</text>
  <text x="244" y="154" font-size="12" fill="#334155">owner: provider or you</text>
  <rect x="230" y="185" width="175" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="244" y="209" font-size="13" font-weight="700" fill="#1e3a8a">What changes</text>
  <text x="244" y="229" font-size="12" fill="#1e3a8a">prompt and answer</text>
  <text x="244" y="246" font-size="12" fill="#1e3a8a">pairs (SFT)</text>
  <rect x="230" y="285" width="175" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="244" y="309" font-size="13" font-weight="700" fill="#991b1b">What can go wrong</text>
  <text x="244" y="329" font-size="12" fill="#991b1b">poisoned examples,</text>
  <text x="244" y="346" font-size="12" fill="#991b1b">hidden triggers</text>
  <rect x="230" y="400" width="175" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="244" y="424" font-size="13" font-weight="700" fill="#166534">Hard control</text>
  <text x="244" y="444" font-size="12" fill="#166534">reviewed, versioned</text>
  <text x="244" y="461" font-size="12" fill="#166534">datasets</text>
  <line x1="405" y1="140" x2="418" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="420" y="110" width="175" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="434" y="134" font-size="13" font-weight="700" fill="#334155">3. Preference tuning</text>
  <text x="434" y="154" font-size="12" fill="#334155">owner: provider</text>
  <rect x="420" y="185" width="175" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="434" y="209" font-size="13" font-weight="700" fill="#1e3a8a">What changes</text>
  <text x="434" y="229" font-size="12" fill="#1e3a8a">RLHF or DPO from</text>
  <text x="434" y="246" font-size="12" fill="#1e3a8a">human ratings</text>
  <rect x="420" y="285" width="175" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="434" y="309" font-size="13" font-weight="700" fill="#991b1b">What can go wrong</text>
  <text x="434" y="329" font-size="12" fill="#991b1b">preference poisoning,</text>
  <text x="434" y="346" font-size="12" fill="#991b1b">reward hacking</text>
  <rect x="420" y="400" width="175" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="434" y="424" font-size="13" font-weight="700" fill="#166534">Hard control</text>
  <text x="434" y="444" font-size="12" fill="#166534">rater vetting,</text>
  <text x="434" y="461" font-size="12" fill="#166534">feedback provenance</text>
  <line x1="595" y1="140" x2="608" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="610" y="110" width="175" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="624" y="134" font-size="13" font-weight="700" fill="#92400e">4. Your fine-tune</text>
  <text x="624" y="154" font-size="12" fill="#92400e">owner: you</text>
  <rect x="610" y="185" width="175" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="624" y="209" font-size="13" font-weight="700" fill="#1e3a8a">What changes</text>
  <text x="624" y="229" font-size="12" fill="#1e3a8a">full, LoRA or QLoRA</text>
  <text x="624" y="246" font-size="12" fill="#1e3a8a">adapter on your data</text>
  <rect x="610" y="285" width="175" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="624" y="309" font-size="13" font-weight="700" fill="#991b1b">What can go wrong</text>
  <text x="624" y="329" font-size="12" fill="#991b1b">safety erosion,</text>
  <text x="624" y="346" font-size="12" fill="#991b1b">PII memorized,</text>
  <text x="624" y="363" font-size="12" fill="#991b1b">poisoned adapter</text>
  <rect x="610" y="400" width="175" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="624" y="424" font-size="13" font-weight="700" fill="#166534">Hard control</text>
  <text x="624" y="444" font-size="12" fill="#166534">scrub data, broad</text>
  <text x="624" y="461" font-size="12" fill="#166534">safety evals, sign</text>
  <text x="624" y="478" font-size="12" fill="#166534">the adapter</text>
  <line x1="785" y1="140" x2="798" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="800" y="110" width="175" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="814" y="134" font-size="13" font-weight="700" fill="#92400e">5. Package + test</text>
  <text x="814" y="154" font-size="12" fill="#92400e">owner: you</text>
  <rect x="800" y="185" width="175" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="814" y="209" font-size="13" font-weight="700" fill="#1e3a8a">What changes</text>
  <text x="814" y="229" font-size="12" fill="#1e3a8a">file format, quantize,</text>
  <text x="814" y="246" font-size="12" fill="#1e3a8a">evals, model card</text>
  <rect x="800" y="285" width="175" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="814" y="309" font-size="13" font-weight="700" fill="#991b1b">What can go wrong</text>
  <text x="814" y="329" font-size="12" fill="#991b1b">pickle runs code,</text>
  <text x="814" y="346" font-size="12" fill="#991b1b">quantization drift</text>
  <rect x="800" y="400" width="175" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="814" y="424" font-size="13" font-weight="700" fill="#166534">Hard control</text>
  <text x="814" y="444" font-size="12" fill="#166534">safetensors, hashes,</text>
  <text x="814" y="461" font-size="12" fill="#166534">re-run evals</text>
  <line x1="975" y1="140" x2="988" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="990" y="110" width="175" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1004" y="134" font-size="13" font-weight="700" fill="#92400e">6. Deploy + serve</text>
  <text x="1004" y="154" font-size="12" fill="#92400e">owner: you</text>
  <rect x="990" y="185" width="175" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1004" y="209" font-size="13" font-weight="700" fill="#1e3a8a">What changes</text>
  <text x="1004" y="229" font-size="12" fill="#1e3a8a">API, cloud, self-</text>
  <text x="1004" y="246" font-size="12" fill="#1e3a8a">hosted or edge</text>
  <rect x="990" y="285" width="175" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1004" y="309" font-size="13" font-weight="700" fill="#991b1b">What can go wrong</text>
  <text x="1004" y="329" font-size="12" fill="#991b1b">extraction, abuse,</text>
  <text x="1004" y="346" font-size="12" fill="#991b1b">exposed endpoints</text>
  <rect x="990" y="400" width="175" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1004" y="424" font-size="13" font-weight="700" fill="#166534">Hard control</text>
  <text x="1004" y="444" font-size="12" fill="#166534">gateway, private</text>
  <text x="1004" y="461" font-size="12" fill="#166534">network, monitoring</text>
  <rect x="40" y="515" width="1130" height="110" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="54" y="539" font-size="15" font-weight="700" fill="#334155">Two rules to remember</text>
  <text x="54" y="559" font-size="13" fill="#334155">Data in weights (stages 1 to 4) cannot be filtered per user or reliably deleted. Data in the context (RAG, prompts) can.</text>
  <text x="54" y="576" font-size="13" fill="#334155">LoRA: W' = W + B x A with a small rank r. One 4096 x 4096 matrix: 16.8 M numbers to train fully, 65,536 at r = 8 (0.39%).</text>
  <text x="54" y="593" font-size="13" fill="#334155">QLoRA does the same on a 4-bit base model. The adapter is a small file: easy to share, easy to swap, easy to poison.</text>
</svg>
