<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Defending containers: layers from image to runtime</title><desc>Six stacked layers of container defence: image, registry, daemon, kernel, network, monitoring.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1200" height="600" fill="#ffffff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Defending containers: layers from image to runtime</text><rect x="40" y="80" width="220" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="119.0" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Image</text><rect x="280" y="80" width="880" height="66" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="720.0" y="118.0" font-size="15" fill="#0f172a" text-anchor="middle">minimal base, pinned digest, non-root, no secrets in layers, Hadolint + Trivy + Dockle</text><rect x="40" y="162" width="220" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="201.0" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Registry</text><rect x="280" y="162" width="880" height="66" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="720.0" y="200.0" font-size="15" fill="#0f172a" text-anchor="middle">private, RBAC, immutable tags, scan on push, signature required</text><rect x="40" y="244" width="220" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="150.0" y="283.0" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Daemon and socket</text><rect x="280" y="244" width="880" height="66" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="720.0" y="282.0" font-size="15" fill="#0f172a" text-anchor="middle">userns-remap, fd:// or mutual TLS, no docker.sock mounts, small docker group</text><rect x="40" y="326" width="220" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="150.0" y="365.0" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Kernel</text><rect x="280" y="326" width="880" height="66" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="720.0" y="364.0" font-size="15" fill="#0f172a" text-anchor="middle">namespaces, cgroup limits, capabilities, seccomp, AppArmor/SELinux, gVisor/Kata</text><rect x="40" y="408" width="220" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="150.0" y="447.0" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Network</text><rect x="280" y="408" width="880" height="66" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="720.0" y="446.0" font-size="15" fill="#0f172a" text-anchor="middle">user-defined networks per tier, icc off, egress control, ports bound to 127.0.0.1</text><rect x="40" y="490" width="220" height="66" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="150.0" y="529.0" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Monitoring</text><rect x="280" y="490" width="880" height="66" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="720.0" y="528.0" font-size="15" fill="#0f172a" text-anchor="middle">Docker events, central logs, auditd, Falco/Tracee, Wazuh, IR playbook</text><text x="40" y="585" font-size="14" fill="#475569" text-anchor="start">Each layer assumes the one above can fail. Prevention in rows 1-5, detection and response in row 6.</text></svg>