<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Centralized AI identity and access management with zero trust policy tiers</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="740" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">Centralized AI identity and access: one identity plane</text>
  <text x="600" y="68" text-anchor="middle" font-size="16" fill="#475569">Every principal gets a verified, short-lived identity; every call is checked by identity, not by network location</text>

  <!-- principals -->
  <text x="140" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Principals</text>
  <rect x="30" y="125" width="220" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Humans</text>
  <text x="140" y="174" text-anchor="middle" font-size="12" fill="#475569">SSO, phishing-resistant MFA</text>
  <rect x="30" y="210" width="220" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="237" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Apps and pipelines</text>
  <text x="140" y="259" text-anchor="middle" font-size="12" fill="#475569">workload identity federation</text>
  <rect x="30" y="295" width="220" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">AI agents</text>
  <text x="140" y="344" text-anchor="middle" font-size="12" fill="#475569">agent ID + delegated user</text>
  <rect x="30" y="380" width="220" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="407" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">MCP servers and tools</text>
  <text x="140" y="429" text-anchor="middle" font-size="12" fill="#475569">registered, owned, pinned</text>

  <!-- identity plane -->
  <rect x="290" y="95" width="400" height="370" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Identity plane (trusted core)</text>
  <rect x="310" y="132" width="360" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="157" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">IdP and token service</text>
  <text x="490" y="179" text-anchor="middle" font-size="12" fill="#475569">short-lived, audience-bound tokens; mTLS certificates for services</text>
  <rect x="310" y="206" width="360" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="231" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Token exchange (on-behalf-of)</text>
  <text x="490" y="253" text-anchor="middle" font-size="12" fill="#475569">new token names agent AND user; never pass the user token through</text>
  <rect x="310" y="280" width="360" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Policy decision point (PDP)</text>
  <text x="490" y="327" text-anchor="middle" font-size="12" fill="#475569">policy as code: RBAC, ABAC, relationship rules; per request</text>
  <rect x="310" y="354" width="360" height="94" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="490" y="379" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Identity inventory and lifecycle</text>
  <text x="490" y="401" text-anchor="middle" font-size="12" fill="#475569">owner, purpose, credential type, last used, review date</text>
  <text x="490" y="421" text-anchor="middle" font-size="12" fill="#475569">create, deploy, run, change (approved), retire (revoke)</text>
  <text x="490" y="439" text-anchor="middle" font-size="12" fill="#475569">just-in-time elevation for admins; no standing power</text>

  <line x1="252" y1="245" x2="306" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="252" y1="330" x2="306" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- PEPs -->
  <text x="830" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Enforcement points (PEPs)</text>
  <rect x="730" y="125" width="200" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="830" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Ingress: AI gateway</text>
  <text x="830" y="174" text-anchor="middle" font-size="12" fill="#475569">who is calling, for which tenant</text>
  <rect x="730" y="230" width="200" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="830" y="257" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Sidecar / service mesh</text>
  <text x="830" y="279" text-anchor="middle" font-size="12" fill="#475569">mTLS, service-to-service rules</text>
  <rect x="730" y="335" width="200" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="830" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Egress proxy</text>
  <text x="830" y="384" text-anchor="middle" font-size="12" fill="#475569">allowlisted destinations only</text>
  <line x1="690" y1="311" x2="726" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="690" y1="311" x2="726" y2="265" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="690" y1="311" x2="726" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="708" y="440" text-anchor="middle" font-size="12" fill="#475569">decisions</text>

  <!-- resources -->
  <text x="1065" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Resources</text>
  <rect x="970" y="125" width="200" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1070" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Models</text>
  <rect x="970" y="195" width="200" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1070" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Vector stores, data</text>
  <rect x="970" y="265" width="200" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1070" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Tools and MCP servers</text>
  <rect x="970" y="335" width="200" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1070" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">External APIs</text>
  <line x1="932" y1="160" x2="966" y2="153" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="932" y1="265" x2="966" y2="224" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="932" y1="270" x2="966" y2="293" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="932" y1="370" x2="966" y2="363" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- tiers -->
  <rect x="30" y="495" width="1140" height="150" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="522" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Two policy tiers, used together (multi-tier policy, NIST SP 800-207A)</text>
  <rect x="55" y="538" width="530" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="320" y="562" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Network tier (fairly static)</text>
  <text x="320" y="584" text-anchor="middle" font-size="13" fill="#475569">private endpoints, subnets, firewall and security-group rules,</text>
  <text x="320" y="604" text-anchor="middle" font-size="13" fill="#475569">no public IPs on models, indexes or tool servers</text>
  <rect x="615" y="538" width="530" height="90" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="880" y="562" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Identity tier (dynamic, per request)</text>
  <text x="880" y="584" text-anchor="middle" font-size="13" fill="#475569">"agent X may call GET /metrics on tool Y for user Z",</text>
  <text x="880" y="604" text-anchor="middle" font-size="13" fill="#475569">written once, enforced on every cloud and on-premises</text>

  <text x="600" y="678" text-anchor="middle" font-size="14" fill="#0f172a">Monitoring closes the loop: sign-ins, token use and denials feed the PDP (step-up, revoke) and the SIEM.</text>
  <text x="600" y="704" text-anchor="middle" font-size="13" fill="#475569">Reviewer controls: IAM-01 short-lived, IAM-02 least privilege, IAM-03 one per component, IAM-04 SSO, IAM-05 owner, IAM-06 no passthrough</text>
</svg>
