<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Azure reference deployment for the AI platform</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Azure reference deployment for the AI platform</text>
  <text x="40" y="80" font-size="16" fill="#475569" text-anchor="start">Azure OpenAI behind Private Endpoints, keyless access with managed identities, APIM as the AI gateway.</text>
  <rect x="30" y="100" width="1140" height="90" rx="14" fill="#fff7f7" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="120" font-size="13" font-weight="700" fill="#991b1b" text-anchor="start">Internet</text>
  <rect x="60" y="122" width="230" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="175.0" y="156.0" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">Users (SSO)</text>
  <rect x="330" y="117" width="330" height="66" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="495.0" y="146.75" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Azure Front Door + WAF</text>
  <text x="495.0" y="164.25" font-size="12.5" fill="#166534" text-anchor="middle">API Management (validate-jwt)</text>
  <rect x="700" y="117" width="440" height="66" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="920.0" y="146.75" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Microsoft Entra ID</text>
  <text x="920.0" y="164.25" font-size="12.5" fill="#166534" text-anchor="middle">SSO · Conditional Access · group claims</text>
  <rect x="30" y="205" width="1140" height="330" rx="14" fill="#fbfcfd" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="527" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Management group · subscription · hub-and-spoke VNet</text>
  <rect x="50" y="235" width="560" height="140" rx="14" fill="#fffdf6" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="64" y="255" font-size="13" font-weight="700" fill="#92400e" text-anchor="start">Spoke VNet (Container Apps / AKS)</text>
  <rect x="70" y="268" width="250" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="195.0" y="293.25" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">APIM AI gateway</text>
  <text x="195.0" y="310.75" font-size="12.5" fill="#166534" text-anchor="middle">token limit policies</text>
  <text x="195.0" y="328.25" font-size="12.5" fill="#166534" text-anchor="middle">Prompt Shields calls</text>
  <text x="195.0" y="345.75" font-size="12.5" fill="#166534" text-anchor="middle">managed identity</text>
  <rect x="340" y="268" width="250" height="92" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="465.0" y="293.25" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Agent + RAG services</text>
  <text x="465.0" y="310.75" font-size="12.5" fill="#92400e" text-anchor="middle">one managed identity</text>
  <text x="465.0" y="328.25" font-size="12.5" fill="#92400e" text-anchor="middle">step / cost limits</text>
  <text x="465.0" y="345.75" font-size="12.5" fill="#92400e" text-anchor="middle">App Config kill switch</text>
  <rect x="630" y="235" width="520" height="140" rx="14" fill="#f7faff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="644" y="255" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start">Private Endpoints (Azure Private Link)</text>
  <rect x="650" y="268" width="230" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="765.0" y="293.25" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Azure OpenAI (Foundry)</text>
  <text x="765.0" y="310.75" font-size="12.5" fill="#1e3a8a" text-anchor="middle">public access disabled</text>
  <text x="765.0" y="328.25" font-size="12.5" fill="#1e3a8a" text-anchor="middle">disableLocalAuth (no keys)</text>
  <text x="765.0" y="345.75" font-size="12.5" fill="#1e3a8a" text-anchor="middle">RBAC: OpenAI User</text>
  <rect x="900" y="268" width="230" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1015.0" y="293.25" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">AI Content Safety</text>
  <text x="1015.0" y="310.75" font-size="12.5" fill="#166534" text-anchor="middle">Prompt Shields</text>
  <text x="1015.0" y="328.25" font-size="12.5" fill="#166534" text-anchor="middle">content filters</text>
  <text x="1015.0" y="345.75" font-size="12.5" fill="#166534" text-anchor="middle">groundedness check</text>
  <rect x="70" y="395" width="250" height="120" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="195.0" y="434.25" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Azure AI Search</text>
  <text x="195.0" y="451.75" font-size="12.5" fill="#334155" text-anchor="middle">private endpoint</text>
  <text x="195.0" y="469.25" font-size="12.5" fill="#334155" text-anchor="middle">security filters (groups)</text>
  <text x="195.0" y="486.75" font-size="12.5" fill="#334155" text-anchor="middle">CMK in Key Vault</text>
  <rect x="340" y="395" width="250" height="120" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="465.0" y="434.25" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Blob Storage</text>
  <text x="465.0" y="451.75" font-size="12.5" fill="#334155" text-anchor="middle">private endpoint</text>
  <text x="465.0" y="469.25" font-size="12.5" fill="#334155" text-anchor="middle">shared key disabled</text>
  <text x="465.0" y="486.75" font-size="12.5" fill="#334155" text-anchor="middle">CMK in Key Vault</text>
  <rect x="650" y="395" width="230" height="120" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="765.0" y="434.25" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Tool broker + tools</text>
  <text x="765.0" y="451.75" font-size="12.5" fill="#92400e" text-anchor="middle">registry allowlist</text>
  <text x="765.0" y="469.25" font-size="12.5" fill="#92400e" text-anchor="middle">APIM for tool APIs</text>
  <text x="765.0" y="486.75" font-size="12.5" fill="#92400e" text-anchor="middle">approval for writes</text>
  <rect x="900" y="395" width="230" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1015.0" y="434.25" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Azure Firewall</text>
  <text x="1015.0" y="451.75" font-size="12.5" fill="#166534" text-anchor="middle">FQDN allowlist</text>
  <text x="1015.0" y="469.25" font-size="12.5" fill="#166534" text-anchor="middle">NSGs deny by default</text>
  <text x="1015.0" y="486.75" font-size="12.5" fill="#166534" text-anchor="middle">managed VNet outbound</text>
  <rect x="30" y="550" width="1140" height="130" rx="14" fill="#fbfcfd" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="570" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Shared security services</text>
  <rect x="50" y="580" width="210" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="155.0" y="610.0" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Managed identities</text>
  <text x="155.0" y="627.5" font-size="12.5" fill="#166534" text-anchor="middle">workload identity fed.</text>
  <text x="155.0" y="645.0" font-size="12.5" fill="#166534" text-anchor="middle">PIM for admins</text>
  <rect x="275" y="580" width="210" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="380.0" y="610.0" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Key Vault / M-HSM</text>
  <text x="380.0" y="627.5" font-size="12.5" fill="#166534" text-anchor="middle">customer-managed keys</text>
  <text x="380.0" y="645.0" font-size="12.5" fill="#166534" text-anchor="middle">rotation policy</text>
  <rect x="500" y="580" width="200" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600.0" y="610.0" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Key Vault secrets</text>
  <text x="600.0" y="627.5" font-size="12.5" fill="#166534" text-anchor="middle">RBAC per secret</text>
  <text x="600.0" y="645.0" font-size="12.5" fill="#166534" text-anchor="middle">Key Vault references</text>
  <rect x="715" y="580" width="210" height="84" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="820.0" y="610.0" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Azure Monitor</text>
  <text x="820.0" y="627.5" font-size="12.5" fill="#334155" text-anchor="middle">Activity Log</text>
  <text x="820.0" y="645.0" font-size="12.5" fill="#334155" text-anchor="middle">diagnostic settings</text>
  <rect x="940" y="580" width="210" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1045.0" y="610.0" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Microsoft Sentinel</text>
  <text x="1045.0" y="627.5" font-size="12.5" fill="#166534" text-anchor="middle">Defender for Cloud</text>
  <text x="1045.0" y="645.0" font-size="12.5" fill="#166534" text-anchor="middle">immutable blob archive</text>
