<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Model security: white-box and black-box evasion, model extraction, and the controls - adversarial training, label-only API with budget and monitor, encrypted weights with an ACL</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Model security: adversarial ML and model theft</text>
  <text x="40" y="74" font-size="15" fill="#475569">NIST AI 100-2 attack classes: evasion, poisoning, privacy. This lab covers evasion and extraction on a FAKE phishing detector.</text>

  <rect x="40" y="110" width="250" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="165" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">White-box attacker</text>
  <text x="165" y="164" text-anchor="middle" font-size="13" fill="#991b1b">has the weights file</text>
  <text x="165" y="186" text-anchor="middle" font-size="13" fill="#991b1b">FGSM: one gradient-sign step</text>
  <text x="165" y="208" text-anchor="middle" font-size="13" fill="#991b1b">on features 0-5 only</text>
  <text x="165" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">eps 0.1: 98% of phishing evades</text>

  <rect x="40" y="290" width="250" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="165" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Black-box attacker</text>
  <text x="165" y="344" text-anchor="middle" font-size="13" fill="#991b1b">only the scoring API</text>
  <text x="165" y="366" text-anchor="middle" font-size="13" fill="#991b1b">evasion search: 55 queries/email</text>
  <text x="165" y="388" text-anchor="middle" font-size="13" fill="#991b1b">extraction: 20 score queries</text>
  <text x="165" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">copy agrees 100%</text>

  <rect x="400" y="110" width="300" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Encrypt and restrict weights</text>
  <text x="550" y="164" text-anchor="middle" font-size="13" fill="#166534">file is ciphertext + HMAC</text>
  <text x="550" y="186" text-anchor="middle" font-size="13" fill="#166534">KMS-style ACL: only svc-scoring</text>
  <text x="550" y="208" text-anchor="middle" font-size="13" fill="#166534">every decrypt is audit-logged</text>
  <text x="550" y="234" text-anchor="middle" font-size="13" fill="#166534">pushes attackers to the API path</text>

  <rect x="400" y="290" width="300" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Hardened scoring API</text>
  <text x="550" y="344" text-anchor="middle" font-size="13" fill="#166534">labels, not raw scores</text>
  <text x="550" y="366" text-anchor="middle" font-size="13" fill="#166534">per-client query budget</text>
  <text x="550" y="388" text-anchor="middle" font-size="13" fill="#166534">monitor: probing + off-distribution</text>
  <text x="550" y="414" text-anchor="middle" font-size="13" fill="#166534">copy agreement falls to 0.795</text>

  <line x1="290" y1="185" x2="398" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="290" y1="365" x2="398" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="810" y="110" width="350" height="330" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="985" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Adversarial training</text>
  <text x="985" y="166" text-anchor="middle" font-size="13" fill="#166534">train on clean + FGSM copies</text>
  <text x="985" y="188" text-anchor="middle" font-size="13" fill="#166534">model drops "fragile" features</text>
  <text x="985" y="210" text-anchor="middle" font-size="13" fill="#166534">and leans on gateway signals</text>
  <text x="985" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">robust accuracy at eps 0.1</text>
  <rect x="850" y="262" width="270" height="22" fill="#fee2e2"/>
  <rect x="850" y="262" width="5" height="22" fill="#dc2626"/>
  <text x="860" y="278" font-size="13" fill="#991b1b">naive 0.018</text>
  <rect x="850" y="294" width="270" height="22" fill="#dcfce7"/>
  <rect x="850" y="294" width="259" height="22" fill="#16a34a"/>
  <text x="860" y="310" font-size="13" fill="#ffffff">adv-trained 0.958</text>
  <text x="985" y="346" text-anchor="middle" font-size="13" fill="#166534">clean accuracy 1.000 -&gt; 0.993</text>
  <text x="985" y="370" text-anchor="middle" font-size="13" fill="#166534">stolen-copy transfer attack: 95% -&gt; 0%</text>
  <text x="985" y="404" text-anchor="middle" font-size="12" fill="#475569">robust only inside the trained eps;</text>
  <text x="985" y="422" text-anchor="middle" font-size="12" fill="#475569">at eps 0.15 it drops to 0.890</text>

  <line x1="700" y1="275" x2="808" y2="275" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="480" width="1120" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="508" font-size="14" font-weight="700" fill="#0f172a">Lesson:</text>
  <text x="130" y="508" font-size="14" fill="#334155">API controls slow down theft and searches, but even a rough stolen copy can still transfer an attack to a weak model.</text>
  <text x="60" y="534" font-size="14" fill="#334155">A robust model is what makes the transferred attack fail. Use all three: protected weights, a hardened API, and adversarial training.</text>
  <text x="60" y="558" font-size="12" fill="#64748b">MITRE ATLAS: Craft Adversarial Data (AML.T0043), Exfiltration via AI Inference API (AML.T0024). Verify the IDs at atlas.mitre.org.</text>
</svg>
