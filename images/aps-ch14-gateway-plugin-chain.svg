<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>API gateway plugin chain</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="500" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">A Kong-like gateway: plugins run in priority order</text>
<text x="40" y="76" font-size="15" fill="#475569">Requests that fail a plugin are answered at the edge and never reach the API. Header plugins also run on those error responses.</text>
<rect x="40" y="170" width="140" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="110" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Client</text>
<text x="110" y="228" text-anchor="middle" font-size="13" fill="#475569">apikey header</text>
<rect x="220" y="130" width="740" height="170" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="590" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Gateway (route matched: /orders)</text>
<rect x="240" y="175" width="160" height="90" rx="10" fill="#ffffff" stroke="#2563eb"/>
<text x="320" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">cors</text>
<text x="320" y="228" text-anchor="middle" font-size="12" fill="#475569">priority 2000</text>
<text x="320" y="248" text-anchor="middle" font-size="12" fill="#475569">exact origin list</text>
<rect x="420" y="175" width="160" height="90" rx="10" fill="#ffffff" stroke="#2563eb"/>
<text x="500" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">key-auth</text>
<text x="500" y="228" text-anchor="middle" font-size="12" fill="#475569">priority 1250</text>
<text x="500" y="248" text-anchor="middle" font-size="12" fill="#475569">no key: 401</text>
<rect x="600" y="175" width="160" height="90" rx="10" fill="#ffffff" stroke="#2563eb"/>
<text x="680" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">rate-limiting</text>
<text x="680" y="228" text-anchor="middle" font-size="12" fill="#475569">priority 910</text>
<text x="680" y="248" text-anchor="middle" font-size="12" fill="#475569">empty bucket: 429</text>
<rect x="780" y="175" width="160" height="90" rx="10" fill="#ffffff" stroke="#2563eb"/>
<text x="860" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">response-</text>
<text x="860" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">transformer</text>
<text x="860" y="248" text-anchor="middle" font-size="12" fill="#475569">add/remove headers</text>
<rect x="1010" y="170" width="150" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1085" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Orders API</text>
<text x="1085" y="228" text-anchor="middle" font-size="13" fill="#475569">business rules</text>
<line x1="180" y1="210" x2="236" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="960" y1="210" x2="1006" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="420" y="330" width="340" height="60" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="590" y="356" text-anchor="middle" font-size="14" fill="#7f1d1d">401 / 429 answered at the edge</text>
<text x="590" y="376" text-anchor="middle" font-size="13" fill="#7f1d1d">with Retry-After and the same security headers</text>
<line x1="590" y1="268" x2="590" y2="326" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="440" font-size="14" fill="#1e293b">Gateway: client identity, quotas, headers, CORS, size limits.   Application: per-user object checks, account lockout, business logic.</text>
<text x="40" y="468" font-size="13" fill="#475569">Lab: api-gateway-rate-limiting. Plugin priorities follow Kong's documented defaults (verify for your version).</text>
</svg>
