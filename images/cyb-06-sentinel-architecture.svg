<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Microsoft Sentinel at a glance</title>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">Microsoft Sentinel at a glance</text>
  <text x="40" y="78" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">A cloud-native SIEM and SOAR on top of a Log Analytics workspace.</text>
  <rect x="30" y="110" width="240" height="260" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="150.0" y="136" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Data connectors</text>
  <text x="150.0" y="160" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Entra ID, Azure Activity</text>
  <text x="150.0" y="179" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Microsoft 365, Defender XDR</text>
  <text x="150.0" y="198" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Windows via AMA</text>
  <text x="150.0" y="217" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Syslog / CEF, firewalls</text>
  <text x="150.0" y="236" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">CCP / API connectors</text>
  <line x1="270" y1="240" x2="310" y2="240" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="310" y="110" width="270" height="260" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="445.0" y="136" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Log Analytics workspace</text>
  <text x="445.0" y="160" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Tables: SigninLogs,</text>
  <text x="445.0" y="179" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">SecurityEvent, Syslog,</text>
  <text x="445.0" y="198" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">CommonSecurityLog,</text>
  <text x="445.0" y="217" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">AuditLogs ...</text>
  <text x="445.0" y="236" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">KQL queries it</text>
  <text x="445.0" y="255" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Watchlists, retention</text>
  <line x1="580" y1="240" x2="620" y2="240" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="620" y="110" width="260" height="260" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="750.0" y="136" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Detection</text>
  <text x="750.0" y="160" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Analytics rules (scheduled,</text>
  <text x="750.0" y="179" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">NRT, Fusion, Microsoft)</text>
  <text x="750.0" y="198" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">UEBA anomalies</text>
  <text x="750.0" y="217" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Threat intelligence</text>
  <text x="750.0" y="236" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Hunting queries</text>
  <line x1="880" y1="240" x2="920" y2="240" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="920" y="110" width="250" height="260" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1045.0" y="136" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Response</text>
  <text x="1045.0" y="160" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Incidents (grouped alerts)</text>
  <text x="1045.0" y="179" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Automation rules</text>
  <text x="1045.0" y="198" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Playbooks (Logic Apps)</text>
  <text x="1045.0" y="217" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Workbooks (dashboards)</text>
  <text x="1045.0" y="236" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Defender portal (XDR)</text>
  <rect x="40" y="410" width="1120" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600.0" y="436" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Certification link: Microsoft SC-200 (Security Operations Analyst)</text>
  <text x="600.0" y="460" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Skills: mitigate threats with Defender XDR, configure Sentinel, detect and investigate with KQL.</text>
  <text x="600.0" y="479" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Check the official SC-200 page for the current skills outline before you book.</text>
</svg>
