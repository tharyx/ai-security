<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The N by M integration problem and MCP as the common protocol</title>
  <rect width="1100" height="440" fill="#ffffff"/>
  <text x="30" y="40" font-size="26" font-weight="700" fill="#0f172a">The N x M problem</text>

  <text x="30" y="80" font-size="15" font-weight="700" fill="#991b1b">Before: every app integrates every tool (3 x 3 = 9 connectors)</text>
  <g font-size="13" font-weight="700">
    <rect x="30" y="100" width="120" height="36" rx="6" fill="#fffbeb" stroke="#d97706"/><text x="90" y="123" text-anchor="middle" fill="#92400e">App 1</text>
    <rect x="30" y="170" width="120" height="36" rx="6" fill="#fffbeb" stroke="#d97706"/><text x="90" y="193" text-anchor="middle" fill="#92400e">App 2</text>
    <rect x="30" y="240" width="120" height="36" rx="6" fill="#fffbeb" stroke="#d97706"/><text x="90" y="263" text-anchor="middle" fill="#92400e">App 3</text>
    <rect x="400" y="100" width="120" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="460" y="123" text-anchor="middle" fill="#166534">Tool A</text>
    <rect x="400" y="170" width="120" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="460" y="193" text-anchor="middle" fill="#166534">Tool B</text>
    <rect x="400" y="240" width="120" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="460" y="263" text-anchor="middle" fill="#166534">Tool C</text>
  </g>
  <g stroke="#dc2626" stroke-width="1.5" opacity="0.7">
    <line x1="150" y1="118" x2="400" y2="118"/><line x1="150" y1="118" x2="400" y2="188"/><line x1="150" y1="118" x2="400" y2="258"/>
    <line x1="150" y1="188" x2="400" y2="118"/><line x1="150" y1="188" x2="400" y2="188"/><line x1="150" y1="188" x2="400" y2="258"/>
    <line x1="150" y1="258" x2="400" y2="118"/><line x1="150" y1="258" x2="400" y2="188"/><line x1="150" y1="258" x2="400" y2="258"/>
  </g>
  <text x="30" y="310" font-size="13" fill="#475569">Custom auth, schemas and error handling for each pair.</text>

  <text x="580" y="80" font-size="15" font-weight="700" fill="#166534">After: one protocol (3 + 3 = 6 implementations)</text>
  <g font-size="13" font-weight="700">
    <rect x="580" y="100" width="110" height="36" rx="6" fill="#fffbeb" stroke="#d97706"/><text x="635" y="123" text-anchor="middle" fill="#92400e">App 1</text>
    <rect x="580" y="170" width="110" height="36" rx="6" fill="#fffbeb" stroke="#d97706"/><text x="635" y="193" text-anchor="middle" fill="#92400e">App 2</text>
    <rect x="580" y="240" width="110" height="36" rx="6" fill="#fffbeb" stroke="#d97706"/><text x="635" y="263" text-anchor="middle" fill="#92400e">App 3</text>
    <rect x="750" y="100" width="110" height="176" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="805" y="180" text-anchor="middle" fill="#1e3a8a">MCP</text><text x="805" y="200" text-anchor="middle" fill="#1e3a8a" font-size="11">JSON-RPC 2.0</text>
    <rect x="920" y="100" width="110" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="975" y="123" text-anchor="middle" fill="#166534">Tool A</text>
    <rect x="920" y="170" width="110" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="975" y="193" text-anchor="middle" fill="#166534">Tool B</text>
    <rect x="920" y="240" width="110" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="975" y="263" text-anchor="middle" fill="#166534">Tool C</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.5">
    <line x1="690" y1="118" x2="750" y2="118"/><line x1="690" y1="188" x2="750" y2="188"/><line x1="690" y1="258" x2="750" y2="258"/>
    <line x1="860" y1="118" x2="920" y2="118"/><line x1="860" y1="188" x2="920" y2="188"/><line x1="860" y1="258" x2="920" y2="258"/>
  </g>
  <text x="580" y="310" font-size="13" fill="#475569">Each app and each tool implements MCP once.</text>
  <rect x="30" y="340" width="1000" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="50" y="370" font-size="14" font-weight="700" fill="#991b1b">The security side effect</text>
  <text x="50" y="394" font-size="13" fill="#7f1d1d">A shared protocol also means shared attack patterns: one trick (a poisoned tool description) works against every host that trusts servers.</text>
</svg>
