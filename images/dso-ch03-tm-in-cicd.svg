<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Threat modeling in the CI/CD pipeline</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="430" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Threat modeling as code: the model lives next to the code</text>
<text x="40" y="76" font-size="15" fill="#475569">Annotations in source comments become a report, a diagram and a gate on every merge request.</text>
<rect x="40" y="130" width="190" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="135.0" y="164.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">1 Design</text>
<text x="135.0" y="184.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">Whiteboard or</text>
<text x="135.0" y="204.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">STRIDE session</text>
<rect x="270" y="130" width="190" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="365.0" y="164.0" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">2 Annotate</text>
<text x="365.0" y="184.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">@exposes @mitigates</text>
<text x="365.0" y="204.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">@accepts @connects</text>
<line x1="230" y1="180" x2="270" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="130" width="190" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="595.0" y="164.0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">3 CI job parses</text>
<text x="595.0" y="184.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">pure-Python or</text>
<text x="595.0" y="204.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">pytm / Threagile</text>
<line x1="460" y1="180" x2="500" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="730" y="130" width="190" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="825.0" y="164.0" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">4 Outputs</text>
<text x="825.0" y="184.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">report.md</text>
<text x="825.0" y="204.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">Mermaid DFD</text>
<line x1="690" y1="180" x2="730" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="960" y="130" width="190" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="1055.0" y="164.0" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">5 Gate</text>
<text x="1055.0" y="184.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">unmitigated</text>
<text x="1055.0" y="204.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">exposure = fail</text>
<line x1="920" y1="180" x2="960" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="290" width="530" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="305.0" y="319.5" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Reviewers see the diff</text>
<text x="305.0" y="338.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">A new endpoint with no @mitigates shows up in the merge request, not</text>
<text x="305.0" y="357.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">in next year's audit.</text>
<rect x="640" y="290" width="530" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="905.0" y="319.5" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Keep the model honest</text>
<text x="905.0" y="338.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">Re-run on every change, review the accepted risks on a date, and link</text>
<text x="905.0" y="357.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">each threat to a requirement and a test.</text>
<text x="40" y="410" text-anchor="start" font-size="13" font-weight="400" fill="#475569">ThreatSpec is legacy (little development since about 2020). Current alternatives: OWASP pytm, Threagile, Threat Dragon. Verify at source.</text>
</svg>
