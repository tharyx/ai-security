<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Defense in depth and the incident response cycle</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#475569"/></marker></defs>
<rect width="1200" height="520" fill="#ffffff"/>
<text x="60" y="52" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">Defense in depth and the incident response cycle</text>
<text x="60" y="82" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">Layers that slow the attacker, and the steps when a layer fails</text>
<rect x="60.0" y="120" width="190" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="155.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">People</text>
<text x="155.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">policy, training</text>
<rect x="282.5" y="120" width="190" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="377.5" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Perimeter</text>
<text x="377.5" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">firewall, email gateway</text>
<rect x="505.0" y="120" width="190" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Network</text>
<text x="600.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">segmentation, IDS</text>
<rect x="727.5" y="120" width="190" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="822.5" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Host</text>
<text x="822.5" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">hardening, EDR, patches</text>
<rect x="950.0" y="120" width="190" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="1045.0" y="148" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Data</text>
<text x="1045.0" y="172" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">encryption, backups</text>
<text x="60" y="240" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">An attacker must beat every layer. You need to detect them at any one.</text>
<rect x="60.0" y="280" width="190" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="155.0" y="308" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">1 Prepare</text>
<text x="155.0" y="332" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">plan, tools, contacts</text>
<rect x="282.5" y="280" width="190" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="377.5" y="308" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">2 Detect + analyze</text>
<text x="377.5" y="332" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">alert, triage, scope</text>
<rect x="505.0" y="280" width="190" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="600.0" y="308" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">3 Contain</text>
<text x="600.0" y="332" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">isolate, block</text>
<rect x="727.5" y="280" width="190" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="822.5" y="308" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">4 Eradicate + recover</text>
<text x="822.5" y="332" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">remove, restore</text>
<rect x="950.0" y="280" width="190" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1045.0" y="308" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">5 Lessons learned</text>
<text x="1045.0" y="332" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">review, improve</text>
<line x1="254.0" y1="330.0" x2="278.5" y2="330.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="476.5" y1="330.0" x2="501.0" y2="330.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="699.0" y1="330.0" x2="723.5" y2="330.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="921.5" y1="330.0" x2="946.0" y2="330.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="60" y="430" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Preserve evidence and write down times from the first minute. Declare the incident, then escalate on schedule.</text>
<text x="60" y="455" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">NIST SP 800-61 Rev. 3 (2025) maps incident response onto the CSF 2.0 functions; the ideas above are the same.</text>
</svg>
