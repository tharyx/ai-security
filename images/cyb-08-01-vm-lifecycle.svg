<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>The vulnerability-management lifecycle</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1200" height="460" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">The vulnerability-management lifecycle</text>
<text x="40" y="80" font-size="16" fill="#475569">A loop, not a project. The report feeds the next inventory and scan.</text>
<rect x="40" y="120" width="245" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="162.5" y="160.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">1 Inventory</text>
<text x="162.5" y="182.0" text-anchor="middle" font-size="13" fill="#475569">know every asset</text>
<rect x="325" y="120" width="245" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="447.5" y="160.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">2 Scan</text>
<text x="447.5" y="182.0" text-anchor="middle" font-size="13" fill="#475569">find weaknesses</text>
<rect x="610" y="120" width="245" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="732.5" y="160.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">3 Assess</text>
<text x="732.5" y="182.0" text-anchor="middle" font-size="13" fill="#475569">remove false positives</text>
<rect x="895" y="120" width="245" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="1017.5" y="160.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">4 Prioritize</text>
<text x="1017.5" y="182.0" text-anchor="middle" font-size="13" fill="#475569">risk, not only CVSS</text>
<rect x="895" y="270" width="245" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1017.5" y="310.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">5 Remediate</text>
<text x="1017.5" y="332.0" text-anchor="middle" font-size="13" fill="#475569">patch / config / mitigate</text>
<rect x="610" y="270" width="245" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="732.5" y="310.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">6 Verify</text>
<text x="732.5" y="332.0" text-anchor="middle" font-size="13" fill="#475569">re-scan, confirm closed</text>
<rect x="325" y="270" width="245" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="447.5" y="310.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">7 Report</text>
<text x="447.5" y="332.0" text-anchor="middle" font-size="13" fill="#475569">metrics, exceptions</text>
<line x1="287" y1="165" x2="323" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="572" y1="165" x2="608" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="857" y1="165" x2="893" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="1017" y1="212" x2="1017" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="893" y1="315" x2="857" y2="315" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="608" y1="315" x2="572" y2="315" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="323" y1="315" x2="162" y2="315" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="162" y1="313" x2="162" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="600" y="400" text-anchor="middle" font-size="13" fill="#475569">Report and exceptions feed the next cycle (arrow from 7 back to 1)</text>
</svg>