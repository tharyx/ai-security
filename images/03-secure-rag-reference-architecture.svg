<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Secure RAG reference architecture</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="690" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Secure RAG reference architecture</text>
  <text x="40" y="80" font-size="16" fill="#475569">Identity and ACLs come from systems of record. Similarity ranks results; policy decides access.</text>
  <text x="40" y="114" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">INGESTION (offline)</text>
  <rect x="40" y="125" width="170" height="90" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="125.0" y="155.8" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Source systems</text>
  <text x="125.0" y="175.6" font-size="12.5" fill="#334155" text-anchor="middle">SharePoint · wiki · HR</text>
  <text x="125.0" y="193.7" font-size="12.5" fill="#334155" text-anchor="middle">own the real ACLs</text>
  <rect x="250" y="125" width="210" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="355.0" y="155.8" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Ingestion gate</text>
  <text x="355.0" y="175.6" font-size="12.5" fill="#166534" text-anchor="middle">validate · sanitize</text>
  <text x="355.0" y="193.7" font-size="12.5" fill="#166534" text-anchor="middle">scan · redact PII</text>
  <rect x="500" y="125" width="190" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="595.0" y="155.8" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Chunk + label</text>
  <text x="595.0" y="175.6" font-size="12.5" fill="#166534" text-anchor="middle">tenant · ACL · trust</text>
  <text x="595.0" y="193.7" font-size="12.5" fill="#166534" text-anchor="middle">signed metadata</text>
  <rect x="730" y="125" width="190" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="825.0" y="155.8" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Embedding service</text>
  <text x="825.0" y="175.6" font-size="12.5" fill="#1e3a8a" text-anchor="middle">private endpoint</text>
  <text x="825.0" y="193.7" font-size="12.5" fill="#1e3a8a" text-anchor="middle">no text in logs</text>
  <rect x="960" y="125" width="200" height="90" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1060.0" y="155.8" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Vector store</text>
  <text x="1060.0" y="175.6" font-size="12.5" fill="#334155" text-anchor="middle">namespace per tenant</text>
  <text x="1060.0" y="193.7" font-size="12.5" fill="#334155" text-anchor="middle">encrypted · private net</text>
  <path d="M210 170 L246 170" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M460 170 L496 170" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M690 170 L726 170" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M920 170 L956 170" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="250" y="240" width="210" height="46" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="355.0" y="267.2" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Quarantine + review</text>
  <path d="M355 215 L355 236" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M125 215 L125 330 L420 330 L420 396" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ag)"/>
  <text x="140" y="322" font-size="12" font-weight="700" fill="#166534" text-anchor="start">current source ACLs (re-check)</text>
  <path d="M1060 215 L1060 350 L540 350 L540 396" fill="none" stroke="#334155" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="600" y="343" font-size="12" fill="#334155" text-anchor="start">top-k search inside the caller's namespace and filter</text>
  <text x="40" y="388" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">QUERY (online)</text>
  <rect x="40" y="400" width="110" height="90" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="95.0" y="430.8" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">User</text>
  <text x="95.0" y="450.6" font-size="12.5" fill="#92400e" text-anchor="middle">question</text>
  <text x="95.0" y="468.7" font-size="12.5" fill="#92400e" text-anchor="middle">+ session</text>
  <rect x="180" y="400" width="170" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="265.0" y="430.8" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">API gateway</text>
  <text x="265.0" y="450.6" font-size="12.5" fill="#166534" text-anchor="middle">authenticate</text>
  <text x="265.0" y="468.7" font-size="12.5" fill="#166534" text-anchor="middle">session -&gt; principal</text>
  <rect x="380" y="400" width="200" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="480.0" y="430.8" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Authorized retriever</text>
  <text x="480.0" y="450.6" font-size="12.5" fill="#166534" text-anchor="middle">pre-filter tenant+groups</text>
  <text x="480.0" y="468.7" font-size="12.5" fill="#166534" text-anchor="middle">re-check every chunk</text>
  <rect x="610" y="400" width="170" height="90" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="695.0" y="430.8" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Context builder</text>
  <text x="695.0" y="450.6" font-size="12.5" fill="#92400e" text-anchor="middle">fence untrusted text</text>
  <text x="695.0" y="468.7" font-size="12.5" fill="#92400e" text-anchor="middle">trust labels</text>
  <rect x="810" y="400" width="130" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="875.0" y="430.8" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">LLM</text>
  <text x="875.0" y="450.6" font-size="12.5" fill="#1e3a8a" text-anchor="middle">least privilege</text>
  <text x="875.0" y="468.7" font-size="12.5" fill="#1e3a8a" text-anchor="middle">no tools</text>
  <rect x="970" y="400" width="190" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1065.0" y="430.8" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Output guard</text>
  <text x="1065.0" y="450.6" font-size="12.5" fill="#166534" text-anchor="middle">citation check</text>
  <text x="1065.0" y="468.7" font-size="12.5" fill="#166534" text-anchor="middle">DLP · canary scan</text>
  <path d="M150 445 L176 445" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M350 445 L376 445" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M580 445 L606 445" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M780 445 L806 445" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M940 445 L966 445" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="180" y="530" width="170" height="56" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="265.0" y="552.9" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Identity provider</text>
  <text x="265.0" y="572.6" font-size="12.5" fill="#334155" text-anchor="middle">users · groups</text>
  <path d="M265 530 L265 494" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="380" y="552" font-size="13" fill="#334155" text-anchor="start">Tenant and groups are never read from the request or the prompt.</text>
  <text x="380" y="572" font-size="13" fill="#334155" text-anchor="start">Missing or unknown ACL = deny (fail closed). Changed ACL = use the new one + re-sync.</text>
  <rect x="40" y="612" width="1120" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="636" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="start">Lifecycle and oversight:</text>
  <text x="60" y="657" font-size="14" fill="#1e3a8a" text-anchor="start">deletion ledger (tombstones) · cache invalidation · backup expiry · audit logs · RAG red-team tests in CI</text>
</svg>
