<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>MCP three-tier model: host, clients, servers</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">The three-tier model: Host, Clients, Servers</text>
  <text x="40" y="76" font-size="16" fill="#475569">One host, one client per server (1:1). Servers can be local processes or remote services.</text>

  <rect x="40" y="105" width="470" height="490" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="135" font-size="17" font-weight="700" fill="#92400e">HOST: the AI application (Claude Desktop, an IDE agent, your own agent)</text>
  <rect x="65" y="155" width="200" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">LLM</text>
  <text x="165" y="207" text-anchor="middle" font-size="12" fill="#1e3a8a">reads tool descriptions</text>
  <rect x="285" y="155" width="200" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="385" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">User + approvals</text>
  <text x="385" y="207" text-anchor="middle" font-size="12" fill="#475569">consent, UI, policy</text>
  <rect x="65" y="260" width="420" height="60" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="275" y="287" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">MCP client A (connection to server A)</text>
  <text x="275" y="307" text-anchor="middle" font-size="12" fill="#92400e">holds session, capabilities, protocol version</text>
  <rect x="65" y="345" width="420" height="60" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="275" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">MCP client B (connection to server B)</text>
  <text x="275" y="392" text-anchor="middle" font-size="12" fill="#92400e">isolated from client A by the host</text>
  <rect x="65" y="430" width="420" height="140" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="275" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">The host is the trust anchor</text>
  <text x="275" y="482" text-anchor="middle" font-size="13" fill="#7f1d1d">It decides which servers exist, what the model may see,</text>
  <text x="275" y="502" text-anchor="middle" font-size="13" fill="#7f1d1d">which calls need approval, and what is logged.</text>
  <text x="275" y="530" text-anchor="middle" font-size="13" fill="#7f1d1d">All server output is untrusted input to the model.</text>

  <line x1="485" y1="290" x2="700" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="485" y1="375" x2="700" y2="455" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="595" y="268" text-anchor="middle" font-size="12" fill="#334155">stdio (local child process)</text>
  <text x="620" y="430" text-anchor="middle" font-size="12" fill="#334155">Streamable HTTP (remote)</text>

  <line x1="640" y1="105" x2="640" y2="595" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="652" y="125" font-size="12" font-weight="700" fill="#b91c1c">TRUST BOUNDARY</text>

  <rect x="700" y="245" width="460" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="275" font-size="16" font-weight="700" fill="#166534">Server A (local): files, git, database</text>
  <text x="720" y="299" font-size="13" fill="#166534">Tools (model-controlled) · Resources (app-controlled)</text>
  <text x="720" y="319" font-size="13" fill="#166534">Prompts (user-controlled). Runs with the user's own rights.</text>
  <rect x="700" y="415" width="460" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="445" font-size="16" font-weight="700" fill="#166534">Server B (remote): SaaS API, vendor service</text>
  <text x="720" y="469" font-size="13" fill="#166534">Needs authentication (OAuth 2.1 for HTTP transports).</text>
  <text x="720" y="489" font-size="13" fill="#166534">Third-party code: untrusted until reviewed and pinned.</text>
  <rect x="700" y="105" width="460" height="100" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="720" y="135" font-size="14" font-weight="700" fill="#334155">Client features (server asks the host)</text>
  <text x="720" y="159" font-size="13" fill="#475569">Sampling: server asks the host's LLM to generate text</text>
  <text x="720" y="179" font-size="13" fill="#475569">Roots: which folders to work in · Elicitation: ask the user</text>
</svg>
