<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>MCP security gateway reference architecture</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">MCP security gateway: one place to enforce trust</text>
  <text x="40" y="80" font-size="16" fill="#475569">Every host talks to MCP servers only through the gateway. Decisions are code, not prompt text.</text>

  <!-- Hosts -->
  <text x="130" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">AI hosts / clients</text>
  <rect x="40" y="150" width="180" height="70" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="130" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Desktop assistant</text>
  <text x="130" y="203" text-anchor="middle" font-size="12" fill="#92400e">user: alice</text>
  <rect x="40" y="245" width="180" height="70" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="130" y="277" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">IDE coding agent</text>
  <text x="130" y="298" text-anchor="middle" font-size="12" fill="#92400e">agent identity + user</text>
  <rect x="40" y="340" width="180" height="70" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="130" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Internal chat app</text>
  <text x="130" y="393" text-anchor="middle" font-size="12" fill="#92400e">many users, one app</text>
  <path d="M220 185 L254 230" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M220 280 L254 280" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M220 375 L254 330" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Gateway -->
  <rect x="260" y="115" width="520" height="430" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="520" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">MCP gateway (policy enforcement point)</text>

  <rect x="280" y="165" width="235" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="397" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">1 Server registry</text>
  <text x="397" y="213" text-anchor="middle" font-size="12" fill="#166534">allowlist, version + digest</text>
  <text x="397" y="230" text-anchor="middle" font-size="12" fill="#166534">pinned tool hashes</text>

  <rect x="525" y="165" width="235" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="642" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">2 Authentication</text>
  <text x="642" y="213" text-anchor="middle" font-size="12" fill="#166534">OAuth 2.1 resource server</text>
  <text x="642" y="230" text-anchor="middle" font-size="12" fill="#166534">iss, aud, exp, scope</text>

  <rect x="280" y="255" width="235" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="397" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">3 Policy</text>
  <text x="397" y="303" text-anchor="middle" font-size="12" fill="#166534">user x agent x server x tool</text>
  <text x="397" y="320" text-anchor="middle" font-size="12" fill="#166534">deny by default</text>

  <rect x="525" y="255" width="235" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="642" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">4 Argument checks</text>
  <text x="642" y="303" text-anchor="middle" font-size="12" fill="#166534">strict schema, business rules</text>
  <text x="642" y="320" text-anchor="middle" font-size="12" fill="#166534">approval for side effects</text>

  <rect x="280" y="345" width="235" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="397" y="373" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">5 Credential broker</text>
  <text x="397" y="393" text-anchor="middle" font-size="12" fill="#166534">token exchange, no passthrough</text>
  <text x="397" y="410" text-anchor="middle" font-size="12" fill="#166534">short-lived, per user</text>

  <rect x="525" y="345" width="235" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="642" y="373" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">6 Limits</text>
  <text x="642" y="393" text-anchor="middle" font-size="12" fill="#166534">size, timeout, rate, concurrency</text>
  <text x="642" y="410" text-anchor="middle" font-size="12" fill="#166534">kill switch per server</text>

  <rect x="280" y="435" width="235" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="397" y="463" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">7 Result handling</text>
  <text x="397" y="483" text-anchor="middle" font-size="12" fill="#166534">mark untrusted, taint session</text>
  <text x="397" y="500" text-anchor="middle" font-size="12" fill="#166534">scan for secrets</text>

  <rect x="525" y="435" width="235" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="642" y="463" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">8 Audit</text>
  <text x="642" y="483" text-anchor="middle" font-size="12" fill="#166534">who, which tool, decision</text>
  <text x="642" y="500" text-anchor="middle" font-size="12" fill="#166534">correlation ID, no raw tokens</text>

  <!-- Servers -->
  <text x="905" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">MCP servers</text>
  <rect x="820" y="150" width="170" height="80" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="905" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Approved A</text>
  <text x="905" y="200" text-anchor="middle" font-size="12" fill="#92400e">internal, in a sandbox</text>
  <text x="905" y="217" text-anchor="middle" font-size="12" fill="#92400e">no direct internet</text>
  <rect x="820" y="250" width="170" height="80" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="905" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Approved B</text>
  <text x="905" y="300" text-anchor="middle" font-size="12" fill="#92400e">remote SaaS, HTTPS</text>
  <text x="905" y="317" text-anchor="middle" font-size="12" fill="#92400e">own OAuth audience</text>
  <rect x="820" y="350" width="170" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="905" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Unknown server</text>
  <text x="905" y="400" text-anchor="middle" font-size="12" fill="#991b1b">typosquat, rug pull,</text>
  <text x="905" y="417" text-anchor="middle" font-size="12" fill="#991b1b">shadow IT</text>
  <path d="M780 200 L814 190" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M780 290 L814 290" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M780 380 L814 390" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <text x="797" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#dc2626">X</text>

  <!-- Downstream -->
  <text x="1095" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Downstream</text>
  <rect x="1025" y="150" width="140" height="80" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1095" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Ticket API</text>
  <text x="1095" y="207" text-anchor="middle" font-size="12" fill="#475569">checks owner</text>
  <rect x="1025" y="250" width="140" height="80" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1095" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">SaaS data</text>
  <text x="1095" y="307" text-anchor="middle" font-size="12" fill="#475569">per-user token</text>
  <path d="M990 190 L1019 190" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M990 290 L1019 290" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Support services -->
  <rect x="260" y="590" width="250" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="385" y="622" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Authorization server</text>
  <text x="385" y="644" text-anchor="middle" font-size="12" fill="#1e3a8a">PKCE, resource indicators,</text>
  <text x="385" y="660" text-anchor="middle" font-size="12" fill="#1e3a8a">token exchange</text>
  <rect x="530" y="590" width="250" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="655" y="622" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Secrets vault</text>
  <text x="655" y="644" text-anchor="middle" font-size="12" fill="#1e3a8a">server credentials, rotation;</text>
  <text x="655" y="660" text-anchor="middle" font-size="12" fill="#1e3a8a">never in prompts or configs</text>
  <rect x="820" y="590" width="170" height="80" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="905" y="625" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">SIEM</text>
  <text x="905" y="647" text-anchor="middle" font-size="12" fill="#475569">alerts, investigations</text>
  <rect x="1010" y="590" width="155" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1087" y="618" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Untrusted input</text>
  <text x="1087" y="640" text-anchor="middle" font-size="12" fill="#991b1b">packages, web pages,</text>
  <text x="1087" y="656" text-anchor="middle" font-size="12" fill="#991b1b">tool results</text>
  <path d="M397 545 L397 584" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <path d="M642 545 L642 584" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <path d="M760 500 L900 584" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <path d="M1087 590 L1010 335" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <text x="40" y="720" font-size="15" fill="#0f172a"><tspan font-weight="700">Read it like this:</tspan> hosts never hold server credentials, servers never see user tokens meant for someone else,</text>
  <text x="40" y="745" font-size="15" fill="#0f172a">and every tool call leaves an audit event that names the user, the agent, the server, the tool and the decision.</text>
  <text x="40" y="775" font-size="13" fill="#475569">Green = deterministic security control · Amber = semi-trusted application · Blue = trusted identity services · Red = untrusted</text>
</svg>
