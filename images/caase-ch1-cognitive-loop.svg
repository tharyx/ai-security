<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>An LLM call versus the agent loop: plan, act, observe</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">An LLM call vs the agent loop</text>
  <text x="40" y="74" font-size="16" fill="#475569">A call answers once. An agent keeps going until a stop rule fires, and every observation can steer the next step.</text>

  <!-- single call -->
  <rect x="40" y="110" width="330" height="190" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="140" font-size="17" font-weight="700" fill="#334155">One LLM call (chatbot)</text>
  <rect x="60" y="165" width="100" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="196" text-anchor="middle" font-size="14" fill="#1e3a8a">prompt</text>
  <rect x="250" y="165" width="100" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="196" text-anchor="middle" font-size="14" fill="#1e3a8a">text reply</text>
  <line x1="160" y1="190" x2="248" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="205" y="182" text-anchor="middle" font-size="12" fill="#475569">LLM</text>
  <text x="60" y="250" font-size="13" fill="#475569">No tools, no loop, no side effects.</text>
  <text x="60" y="272" font-size="13" fill="#475569">A fooled model says something wrong.</text>

  <!-- loop -->
  <rect x="410" y="100" width="750" height="480" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="430" y="130" font-size="17" font-weight="700" fill="#92400e">Agent: the cognitive loop, run by the harness</text>

  <rect x="440" y="170" width="150" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="515" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Goal + context</text>
  <text x="515" y="222" text-anchor="middle" font-size="12" fill="#475569">task, memory, rules</text>

  <rect x="650" y="170" width="150" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="725" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">1. PLAN</text>
  <text x="725" y="222" text-anchor="middle" font-size="12" fill="#1e3a8a">model picks next step</text>

  <rect x="860" y="170" width="150" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="935" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">2. ACT</text>
  <text x="935" y="222" text-anchor="middle" font-size="12" fill="#991b1b">tool call, side effect</text>

  <rect x="860" y="330" width="150" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="935" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">3. OBSERVE</text>
  <text x="935" y="382" text-anchor="middle" font-size="12" fill="#166534">result = untrusted data</text>

  <rect x="650" y="330" width="150" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="725" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">4. UPDATE</text>
  <text x="725" y="382" text-anchor="middle" font-size="12" fill="#5b21b6">context and memory</text>

  <line x1="590" y1="205" x2="648" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="800" y1="205" x2="858" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="935" y1="240" x2="935" y2="328" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="365" x2="802" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="725" y1="330" x2="725" y2="242" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="440" y="440" width="700" height="110" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="460" y="468" font-size="15" font-weight="700" fill="#991b1b">Stop rules and checks (code, not model opinion)</text>
  <text x="460" y="494" font-size="13" fill="#334155">Done? final answer produced   |   Step budget, token budget, time budget reached?</text>
  <text x="460" y="516" font-size="13" fill="#334155">Same call repeated (loop)?   |   Policy denied the action?   |   Human approval needed for this ACT?</text>
  <text x="460" y="538" font-size="13" fill="#334155">Danger: the OBSERVE text goes back into PLAN, so a hostile web page or file can change the goal.</text>
  <path d="M935 400 L935 438" stroke="#b91c1c" stroke-width="2" marker-end="url(#r)"/>
</svg>
