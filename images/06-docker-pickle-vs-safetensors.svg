<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Pickle is a program, safetensors is data</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">A pickle file is a program. A safetensors file is data.</text>
  <text x="40" y="76" font-size="16" fill="#475569">pickle.load(), torch.load(weights_only=False) and joblib.load() RUN the program. A scanner can READ it without running it.</text>

  <!-- pickle program -->
  <rect x="40" y="105" width="420" height="300" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="135" font-size="17" font-weight="700" fill="#991b1b">model.pkl (protocol 4), as opcodes</text>
  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#7f1d1d">
    <text x="60" y="168">PROTO 4</text>
    <text x="60" y="194">SHORT_BINUNICODE 'os'</text>
    <text x="60" y="220">SHORT_BINUNICODE 'system'</text>
    <text x="60" y="246" font-weight="700">STACK_GLOBAL</text>
    <text x="60" y="272">SHORT_BINUNICODE 'echo …'</text>
    <text x="60" y="298">TUPLE1</text>
    <text x="60" y="324" font-weight="700">REDUCE</text>
    <text x="60" y="350">STOP</text>
  </g>
  <text x="250" y="246" font-size="13" font-weight="700" fill="#991b1b">← imports os.system</text>
  <text x="250" y="324" font-size="13" font-weight="700" fill="#991b1b">← calls it</text>
  <text x="60" y="388" font-size="13" fill="#991b1b">Also: GLOBAL, INST, OBJ, NEWOBJ, BUILD</text>

  <!-- two readers -->
  <rect x="520" y="105" width="300" height="120" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="670" y="137" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">pickle.load(f)</text>
  <text x="670" y="163" font-size="14" fill="#991b1b" text-anchor="middle">executes every opcode</text>
  <text x="670" y="187" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">→ code runs on your server</text>
  <text x="670" y="209" font-size="12" fill="#991b1b" text-anchor="middle">before you see a single weight</text>

  <rect x="520" y="255" width="300" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="670" y="287" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">pickletools.genops(f)</text>
  <text x="670" y="313" font-size="14" fill="#166534" text-anchor="middle">decodes opcodes only</text>
  <text x="670" y="337" font-size="14" fill="#166534" text-anchor="middle">collects every import</text>
  <text x="670" y="361" font-size="14" fill="#166534" text-anchor="middle">allowlist → SAFE / UNSAFE</text>
  <text x="670" y="385" font-size="12" fill="#166534" text-anchor="middle">nothing is imported or called</text>

  <path d="M460 190 L514 168" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <path d="M460 300 L514 320" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- safetensors -->
  <rect x="870" y="105" width="290" height="300" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="890" y="135" font-size="17" font-weight="700" fill="#334155">model.safetensors</text>
  <rect x="890" y="155" width="250" height="40" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="1015" y="180" font-size="14" fill="#334155" text-anchor="middle">8 bytes: header length</text>
  <rect x="890" y="205" width="250" height="90" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="1015" y="228" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">JSON header</text>
  <text x="1015" y="250" font-size="13" fill="#334155" text-anchor="middle">name → dtype, shape,</text>
  <text x="1015" y="270" font-size="13" fill="#334155" text-anchor="middle">data_offsets</text>
  <rect x="890" y="305" width="250" height="44" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="1015" y="332" font-size="14" fill="#334155" text-anchor="middle">raw tensor bytes</text>
  <text x="1015" y="380" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">parsed, never executed</text>

  <!-- bottom: layered loading -->
  <rect x="40" y="435" width="1120" height="95" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="465" font-size="16" font-weight="700" fill="#166534">Secure loading = layers</text>
  <text x="60" y="491" font-size="14" fill="#166534">1 prefer safetensors (no code path) · 2 static scan with an allowlist · 3 restricted unpickler at load time (find_class allowlist)</text>
  <text x="60" y="515" font-size="14" fill="#166534">4 verify the file digest against the AI-BOM · 5 load in a sandbox with no network and no secrets (the model server's own pod)</text>
</svg>
