<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Attack map: where each attack on agent protocols lands</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Attack map: where each attack on agent protocols lands</text>
<text x="40" y="76" font-size="16" fill="#475569">Numbers match the lessons and labs. Green boxes are the controls that stop them.</text>
<rect x="60" y="110" width="150" height="330" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="135.0" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Attacker</text>
<text x="135.0" y="158" text-anchor="middle" font-size="13" fill="#334155">rogue agent,</text>
<text x="135.0" y="176" text-anchor="middle" font-size="13" fill="#334155">malicious partner,</text>
<text x="135.0" y="194" text-anchor="middle" font-size="13" fill="#334155">network position,</text>
<text x="135.0" y="212" text-anchor="middle" font-size="13" fill="#334155">low-trust writer</text>
<rect x="460" y="110" width="230" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="575.0" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Orchestrator / bridge</text>
<text x="575.0" y="158" text-anchor="middle" font-size="13" fill="#334155">A2A, MCP, UCP-style</text>
<line x1="210" y1="145" x2="460" y2="145" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<text x="335" y="137" text-anchor="middle" font-size="12" fill="#dc2626">1 forged sender or identity</text>
<rect x="460" y="200" width="230" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="575.0" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Agent registry / cards</text>
<text x="575.0" y="248" text-anchor="middle" font-size="13" fill="#334155">Agent Card discovery</text>
<line x1="210" y1="235" x2="460" y2="235" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<text x="335" y="227" text-anchor="middle" font-size="12" fill="#dc2626">2 rogue card wins delegation</text>
<rect x="460" y="290" width="230" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="575.0" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Session service</text>
<text x="575.0" y="338" text-anchor="middle" font-size="13" fill="#334155">ACP-style state</text>
<line x1="210" y1="325" x2="460" y2="325" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<text x="335" y="317" text-anchor="middle" font-size="12" fill="#dc2626">3 fixation / tampered state</text>
<rect x="460" y="380" width="230" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="575.0" y="406" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Shared context store</text>
<text x="575.0" y="428" text-anchor="middle" font-size="13" fill="#334155">UCP-style (course term)</text>
<line x1="210" y1="415" x2="460" y2="415" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<text x="335" y="407" text-anchor="middle" font-size="12" fill="#dc2626">4 poisoned entry</text>
<rect x="900" y="110" width="260" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1030.0" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Worker agents + tools</text>
<text x="1030.0" y="158" text-anchor="middle" font-size="13" fill="#334155">MCP servers, payments</text>
<line x1="690" y1="145" x2="900" y2="145" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<text x="795" y="137" text-anchor="middle" font-size="12" fill="#dc2626">5 replay / downgrade / MITM</text>
<text x="460" y="475" text-anchor="start" font-size="13" fill="#dc2626" font-weight="700">6 cross-protocol confusion at the bridge: trust lost, identity collision, schema mismatch, replay</text>
<rect x="60" y="505" width="350" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="235.0" y="531" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Stops 1, 5</text>
<text x="235.0" y="553" text-anchor="middle" font-size="13" fill="#334155">Signed messages + mutual auth</text>
<rect x="435" y="505" width="350" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="610.0" y="531" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Stops 2</text>
<text x="610.0" y="553" text-anchor="middle" font-size="13" fill="#334155">Signed cards + allow-list</text>
<rect x="810" y="505" width="350" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="985.0" y="531" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Stops 3</text>
<text x="985.0" y="553" text-anchor="middle" font-size="13" fill="#334155">Server-side state + signed tokens</text>
<rect x="60" y="600" width="350" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="235.0" y="626" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Stops 4</text>
<text x="235.0" y="648" text-anchor="middle" font-size="13" fill="#334155">ACL + signed entries + trust tier</text>
<rect x="435" y="600" width="350" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="610.0" y="626" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Stops 5</text>
<text x="610.0" y="648" text-anchor="middle" font-size="13" fill="#334155">Nonce, timestamp, min suite, transcript</text>
<rect x="810" y="600" width="350" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="985.0" y="626" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Stops 6</text>
<text x="985.0" y="648" text-anchor="middle" font-size="13" fill="#334155">Trust carried, one identity map, schemas</text>
<text x="60" y="705" text-anchor="start" font-size="13" fill="#475569">Labs: 3 = attacks 1+2, 4 = attack 3, 5 = attack 4, 6 = attack 6, 7 = attack 5 and the signing defenses.</text>
</svg>