<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Saltzer and Schroeder's eight secure design principles (1975)</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="520" fill="#ffffff"/>
<text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">Saltzer and Schroeder's eight secure design principles (1975)</text>
<text x="40" y="74" font-size="15" fill="#475569">Questions to ask of every design. Each one has a vulnerable vs principled pair in the chapter 07 lab.</text>
<rect x="40" y="110" width="260" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="170.0" y="165.33333333333334" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Economy of mechanism</text>
<text x="170.0" y="184.33333333333334" text-anchor="middle" font-size="13" fill="#1e293b">one small auth path,</text>
<text x="170.0" y="203.33333333333334" text-anchor="middle" font-size="13" fill="#1e293b">not three</text>
<rect x="325" y="110" width="260" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="455.0" y="165.33333333333334" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Fail-safe defaults</text>
<text x="455.0" y="184.33333333333334" text-anchor="middle" font-size="13" fill="#1e293b">deny unless allowed;</text>
<text x="455.0" y="203.33333333333334" text-anchor="middle" font-size="13" fill="#1e293b">errors deny</text>
<rect x="610" y="110" width="260" height="140" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="740.0" y="165.33333333333334" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Complete mediation</text>
<text x="740.0" y="184.33333333333334" text-anchor="middle" font-size="13" fill="#1e293b">check every access</text>
<text x="740.0" y="203.33333333333334" text-anchor="middle" font-size="13" fill="#1e293b">(BOLA = missing check)</text>
<rect x="895" y="110" width="260" height="140" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
<text x="1025.0" y="165.33333333333334" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">Open design</text>
<text x="1025.0" y="184.33333333333334" text-anchor="middle" font-size="13" fill="#1e293b">public algorithm,</text>
<text x="1025.0" y="203.33333333333334" text-anchor="middle" font-size="13" fill="#1e293b">secret key (Kerckhoffs)</text>
<rect x="40" y="280" width="260" height="140" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="170.0" y="335.3333333333333" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Separation of privilege</text>
<text x="170.0" y="354.3333333333333" text-anchor="middle" font-size="13" fill="#1e293b">two people or two</text>
<text x="170.0" y="373.3333333333333" text-anchor="middle" font-size="13" fill="#1e293b">factors for big actions</text>
<rect x="325" y="280" width="260" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="455.0" y="335.3333333333333" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Least privilege</text>
<text x="455.0" y="354.3333333333333" text-anchor="middle" font-size="13" fill="#1e293b">GRANT SELECT, not DBA;</text>
<text x="455.0" y="373.3333333333333" text-anchor="middle" font-size="13" fill="#1e293b">scoped IAM roles</text>
<rect x="610" y="280" width="260" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="740.0" y="335.3333333333333" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Least common mechanism</text>
<text x="740.0" y="354.3333333333333" text-anchor="middle" font-size="13" fill="#1e293b">per-tenant caches,</text>
<text x="740.0" y="373.3333333333333" text-anchor="middle" font-size="13" fill="#1e293b">separate identities</text>
<rect x="895" y="280" width="260" height="140" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="1025.0" y="335.3333333333333" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Psychological acceptability</text>
<text x="1025.0" y="354.3333333333333" text-anchor="middle" font-size="13" fill="#1e293b">passphrases, passkeys,</text>
<text x="1025.0" y="373.3333333333333" text-anchor="middle" font-size="13" fill="#1e293b">secure by default</text>
<text x="40" y="470" text-anchor="start" font-size="13" fill="#475569">Also named in 1975: work factor and compromise recording. Modern additions: defense in depth, zero trust, secure by default.</text>
<text x="40" y="495" text-anchor="start" font-size="13" fill="#475569">Principles trade off against each other and against usability: record the trade-off as a design decision.</text>
</svg>
