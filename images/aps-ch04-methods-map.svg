<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Threat modeling methods map</title>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="40" y="44" font-size="25" font-weight="700" fill="#0f172a">Find threats with one lens (or several), then rate them</text>
<text x="40" y="70" font-size="15" fill="#475569">Finding methods answer "what can go wrong?". Rating methods answer "which first?". Do not confuse the two.</text>

<rect x="40" y="95" width="270" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="175" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">List / library centric</text>
<text x="60" y="158" font-size="14" fill="#1e293b">STRIDE, STRIDE per element</text>
<text x="60" y="184" font-size="14" fill="#1e293b">LINDDUN (privacy)</text>
<text x="60" y="210" font-size="14" fill="#1e293b">OWASP Top 10, CAPEC</text>
<text x="60" y="236" font-size="14" fill="#1e293b">card games (EoP, Cornucopia)</text>
<text x="60" y="270" font-size="13" fill="#475569">"walk a checklist over the DFD"</text>

<rect x="330" y="95" width="270" height="200" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
<text x="465" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#713f12">Asset / goal centric</text>
<text x="350" y="158" font-size="14" fill="#1e293b">attack trees (Schneier)</text>
<text x="350" y="184" font-size="14" fill="#1e293b">crown jewels first</text>
<text x="350" y="210" font-size="14" fill="#1e293b">OCTAVE (organisation)</text>
<text x="350" y="270" font-size="13" fill="#475569">"what do we protect?"</text>

<rect x="620" y="95" width="270" height="200" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
<text x="755" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#831843">Attacker centric</text>
<text x="640" y="158" font-size="14" fill="#1e293b">threat actor personas</text>
<text x="640" y="184" font-size="14" fill="#1e293b">Persona non Grata</text>
<text x="640" y="210" font-size="14" fill="#1e293b">MITRE ATT&amp;CK, ATLAS</text>
<text x="640" y="270" font-size="13" fill="#475569">"who attacks us, and how?"</text>

<rect x="910" y="95" width="250" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1035" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Software centric</text>
<text x="930" y="158" font-size="14" fill="#1e293b">DFD of the design</text>
<text x="930" y="184" font-size="14" fill="#1e293b">STRIDE per element</text>
<text x="930" y="210" font-size="14" fill="#1e293b">threat modeling as code</text>
<text x="930" y="270" font-size="13" fill="#475569">"what are we building?"</text>

<rect x="40" y="315" width="1120" height="90" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="60" y="345" font-size="17" font-weight="700" fill="#4c1d95">Process frameworks that combine lenses</text>
<text x="60" y="375" font-size="14" fill="#1e293b">PASTA (7 stages, risk centric) | VAST (visual, agile, simple; app + operational models) | RTMP (rapid prototyping, DFD based)</text>
<text x="60" y="396" font-size="14" fill="#1e293b">Hybrid (e.g. Security Cards + Persona non Grata + STRIDE) | OCTAVE / OCTAVE Allegro (organisational risk, largely legacy)</text>

<rect x="40" y="425" width="1120" height="110" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="455" font-size="17" font-weight="700" fill="#0f172a">Rating (after finding)</text>
<text x="60" y="485" font-size="14" fill="#1e293b">OWASP Risk Rating (likelihood x impact, 0-9 factors) | CVSS v4.0 (vulnerability severity) | Bug bar (fixed severity table, release gate)</text>
<text x="60" y="510" font-size="14" fill="#1e293b">Mozilla Rapid Risk Assessment (30 minutes, data dictionary, C/I/A impact) | DREAD (subjective, largely abandoned: know why)</text>
</svg>
