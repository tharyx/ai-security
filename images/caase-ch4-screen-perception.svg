<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How a computer-use or browser agent perceives a page: screenshot plus vision model, or DOM and accessibility tree plus text model</title>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Two ways an agent "sees" a page</text>
  <text x="40" y="76" font-size="16" fill="#475569">Each way sees different things, so each is fooled by different tricks.</text>
  <rect x="40" y="100" width="190" height="300" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="56" y="128" font-size="16" font-weight="700" fill="#0f172a">The web page</text>
  <text x="56" y="156" font-size="14" fill="#0f172a">Visible: headline, text,</text>
  <text x="56" y="176" font-size="14" fill="#0f172a">buttons, a pop-up</text>
  <rect x="56" y="196" width="158" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="64" y="216" font-size="13" fill="#991b1b">Hidden in the DOM:</text>
  <text x="64" y="234" font-size="13" fill="#991b1b">white text, alt text</text>
  <rect x="56" y="260" width="158" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="64" y="280" font-size="13" fill="#92400e">Drawn on the pixels:</text>
  <text x="64" y="298" font-size="13" fill="#92400e">fake "Allow" dialog</text>
  <text x="56" y="340" font-size="13" fill="#475569">Both are attacker-</text>
  <text x="56" y="358" font-size="13" fill="#475569">controlled input.</text>
  <line x1="230" y1="170" x2="300" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="230" y1="330" x2="300" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="100" width="560" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="318" y="128" font-size="17" font-weight="700" fill="#0f172a">A. Screenshot + vision model (computer use)</text>
  <text x="318" y="154" font-size="14" fill="#0f172a">1. Take a screenshot  2. Model returns "click at x=412, y=300"  3. OS-level click</text>
  <text x="318" y="178" font-size="14" fill="#0f172a">Sees: what a person sees (pixels). Works with any app.</text>
  <text x="318" y="202" font-size="14" fill="#991b1b">Fooled by: on-screen fake dialogs, text in images, look-alike buttons, clickjacking.</text>
  <text x="318" y="226" font-size="14" fill="#475569">Ignores hidden DOM text (good), but cannot tell a real dialog from a fake one.</text>
  <rect x="300" y="260" width="560" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="318" y="288" font-size="17" font-weight="700" fill="#0f172a">B. DOM / accessibility tree + text model (browser agent)</text>
  <text x="318" y="314" font-size="14" fill="#0f172a">1. Dump DOM or a11y tree  2. Model returns "click element #7"  3. Browser API click</text>
  <text x="318" y="338" font-size="14" fill="#0f172a">Sees: text, links, labels, alt text, even invisible nodes. Precise and cheap.</text>
  <text x="318" y="362" font-size="14" fill="#991b1b">Fooled by: hidden text, off-screen divs, alt and aria-label text, invisible overlays.</text>
  <text x="318" y="386" font-size="14" fill="#475569">Fix: pass only what is visible; drop overlays; treat all page text as data.</text>
  <line x1="860" y1="170" x2="920" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="330" x2="920" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="920" y="200" width="240" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="936" y="228" font-size="16" font-weight="700" fill="#0f172a">The same trusted loop</text>
  <text x="936" y="252" font-size="14" fill="#0f172a">Model proposes an action.</text>
  <text x="936" y="272" font-size="14" fill="#0f172a">Policy, allowlist and a</text>
  <text x="936" y="292" font-size="14" fill="#0f172a">human decide. Not the page.</text>
  <rect x="40" y="440" width="1120" height="86" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="470" font-size="15" font-weight="700" fill="#0f172a">Remember</text>
  <text x="60" y="494" font-size="14" fill="#0f172a">The agent also uses the browser session: cookies, saved passwords and open tabs. Whatever the page tricks it into doing</text>
  <text x="60" y="514" font-size="14" fill="#0f172a">happens with YOUR identity. Use a separate, empty browser profile for agents.</text>
</svg>
