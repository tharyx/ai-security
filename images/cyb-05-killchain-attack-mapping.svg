<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Kill Chain and ATT&amp;CK, side by side</title>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">Kill Chain and ATT&amp;CK, side by side</text>
  <text x="40" y="78" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">Kill Chain is a short story. ATT&amp;CK is the detailed catalog of tactics and techniques.</text>
  <rect x="40" y="110" width="150" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="115.0" y="136" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Recon</text>
  <rect x="200" y="110" width="150" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="275.0" y="136" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Weaponize</text>
  <rect x="360" y="110" width="150" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="435.0" y="136" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Deliver</text>
  <rect x="520" y="110" width="150" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="595.0" y="136" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Exploit</text>
  <rect x="680" y="110" width="150" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="755.0" y="136" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Install</text>
  <rect x="840" y="110" width="150" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="915.0" y="136" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">C2</text>
  <rect x="1000" y="110" width="150" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1075.0" y="136" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Actions</text>
  <text x="40" y="205" font-size="13" font-weight="bold" fill="#475569" text-anchor="start">Lockheed Martin Cyber Kill Chain (7 steps)</text>
  <rect x="40" y="235" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130.0" y="261" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Initial Access</text>
  <rect x="230" y="235" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320.0" y="261" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Execution</text>
  <rect x="420" y="235" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="510.0" y="261" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Persistence</text>
  <rect x="610" y="235" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="700.0" y="261" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Priv. Esc.</text>
  <rect x="800" y="235" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="890.0" y="261" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Defense Evasion</text>
  <rect x="990" y="235" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1080.0" y="261" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Credential Access</text>
  <rect x="40" y="310" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130.0" y="336" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Discovery</text>
  <rect x="230" y="310" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320.0" y="336" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Lateral Move</text>
  <rect x="420" y="310" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="510.0" y="336" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Collection</text>
  <rect x="610" y="310" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="700.0" y="336" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">C2</text>
  <rect x="800" y="310" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="890.0" y="336" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Exfiltration</text>
  <rect x="990" y="310" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1080.0" y="336" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Impact</text>
  <text x="40" y="410" font-size="13" font-weight="bold" fill="#475569" text-anchor="start">MITRE ATT&amp;CK Enterprise tactics (the 'why'); each tactic holds techniques (the 'how'), e.g. T1110.003 Password Spraying.</text>
  <rect x="40" y="430" width="1120" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="600.0" y="456" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Mapping an alert: 1) what happened  2) which tactic (goal)  3) which technique / sub-technique  4) which data source proves it</text>
</svg>
