<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Agent release pipeline with security gates</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect width="1200" height="480" fill="#ffffff"/>
<text x="40" y="48" font-size="28" font-weight="bold" fill="#0f172a">Agent release pipeline with security gates</text>
<text x="40" y="76" font-size="16" fill="#475569">Every stage can break the build. Fail closed.</text>
<rect x="40" y="150" width="160" height="90" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="120.0" y="184.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Commit</text>
<text x="120.0" y="202.0" text-anchor="middle" font-size="12" fill="#475569">secret scan</text>
<text x="120.0" y="218.0" text-anchor="middle" font-size="12" fill="#475569">lint</text>
<line x1="200" y1="195" x2="230" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="230" y="150" width="160" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="310.0" y="184.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">SAST + config</text>
<text x="310.0" y="202.0" text-anchor="middle" font-size="12" fill="#475569">agent code</text>
<text x="310.0" y="218.0" text-anchor="middle" font-size="12" fill="#475569">harness config</text>
<line x1="390" y1="195" x2="420" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="420" y="150" width="160" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="500.0" y="184.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">AIBOM + vet</text>
<text x="500.0" y="202.0" text-anchor="middle" font-size="12" fill="#475569">models, skills,</text>
<text x="500.0" y="218.0" text-anchor="middle" font-size="12" fill="#475569">MCP servers</text>
<line x1="580" y1="195" x2="610" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="610" y="150" width="160" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="690.0" y="184.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Red-team gate</text>
<text x="690.0" y="202.0" text-anchor="middle" font-size="12" fill="#475569">attack suite</text>
<text x="690.0" y="218.0" text-anchor="middle" font-size="12" fill="#475569">ASR threshold</text>
<line x1="770" y1="195" x2="800" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="800" y="150" width="160" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="880.0" y="184.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Sign</text>
<text x="880.0" y="202.0" text-anchor="middle" font-size="12" fill="#475569">manifest +</text>
<text x="880.0" y="218.0" text-anchor="middle" font-size="12" fill="#475569">cosign</text>
<line x1="960" y1="195" x2="990" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="990" y="150" width="160" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="1070.0" y="184.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Deploy + observe</text>
<text x="1070.0" y="202.0" text-anchor="middle" font-size="12" fill="#475569">traces, drift,</text>
<text x="1070.0" y="218.0" text-anchor="middle" font-size="12" fill="#475569">kill switch</text>
<rect x="40" y="300" width="1100" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="590.0" y="344.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Gate policy (policy as code)</text>
<text x="590.0" y="362.0" text-anchor="middle" font-size="12" fill="#475569">critical attack succeeded = FAIL  |  ASR above limit = FAIL  |  suite too small = FAIL</text>
<text x="590.0" y="378.0" text-anchor="middle" font-size="12" fill="#475569">unsigned or modified harness = FAIL  |  unpinned model or skill = FAIL  |  benign tasks must still pass</text>
<text x="40" y="450" text-anchor="start" font-size="13" fill="#475569">See labs/redteam-release-gate, aibom-harness, sign-verify-harness.</text>
</svg>
