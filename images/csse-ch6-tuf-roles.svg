<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The Update Framework (TUF): root, targets, snapshot and timestamp roles with threshold signatures</title>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="30" y="40" font-size="26" font-weight="700" fill="#0f172a">TUF: separate keys for separate jobs</text>
  <text x="30" y="66" font-size="14" fill="#475569">One stolen key must not be enough to push a malicious update. Verification order on the client: timestamp, snapshot, targets, then the file hash.</text>
  <rect x="440" y="90" width="320" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="120" font-size="17" font-weight="700" text-anchor="middle" fill="#7f1d1d">root (offline, rarely used)</text>
  <text x="600" y="144" font-size="13" text-anchor="middle" fill="#0f172a">Lists the keys for the other roles.</text>
  <text x="600" y="164" font-size="13" text-anchor="middle" fill="#0f172a">Threshold example: 3 of 5 signers.</text>
  <line x1="520" y1="180" x2="180" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="570" y1="180" x2="470" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="640" y1="180" x2="760" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="700" y1="180" x2="1040" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="40" y="250" width="280" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="180" y="280" font-size="16" font-weight="700" text-anchor="middle" fill="#075985">targets (offline or HSM)</text>
  <text x="180" y="304" font-size="13" text-anchor="middle" fill="#0f172a">Signs the trusted files: name, size, hash.</text>
  <text x="180" y="324" font-size="13" text-anchor="middle" fill="#0f172a">Can delegate to other roles per path.</text>
  <rect x="340" y="250" width="280" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="480" y="280" font-size="16" font-weight="700" text-anchor="middle" fill="#075985">snapshot</text>
  <text x="480" y="304" font-size="13" text-anchor="middle" fill="#0f172a">Records the version of every metadata file.</text>
  <text x="480" y="324" font-size="13" text-anchor="middle" fill="#0f172a">Stops mix-and-match of old and new files.</text>
  <rect x="640" y="250" width="280" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="780" y="280" font-size="16" font-weight="700" text-anchor="middle" fill="#075985">timestamp (online, frequent)</text>
  <text x="780" y="304" font-size="13" text-anchor="middle" fill="#0f172a">Short expiry; points to the newest snapshot.</text>
  <text x="780" y="324" font-size="13" text-anchor="middle" fill="#0f172a">Stops freeze and replay of stale metadata.</text>
  <rect x="940" y="250" width="230" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1055" y="280" font-size="16" font-weight="700" text-anchor="middle" fill="#334155">Client</text>
  <text x="1055" y="304" font-size="13" text-anchor="middle" fill="#0f172a">Ships with trusted root.</text>
  <text x="1055" y="324" font-size="13" text-anchor="middle" fill="#0f172a">Checks expiry, version, hash.</text>
  <rect x="40" y="390" width="1130" height="140" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="60" y="418" font-size="15" font-weight="700" fill="#9a3412">Threats TUF is designed to resist</text>
  <text x="60" y="444" font-size="13" fill="#0f172a">Arbitrary package (needs targets key) · Rollback to an old vulnerable version · Freeze (client kept on stale metadata) · Mix-and-match of files</text>
  <text x="60" y="466" font-size="13" fill="#0f172a">Endless data / slow retrieval · Key compromise of ONE role (others still protect) · Recovery by rotating keys through root.</text>
  <text x="60" y="492" font-size="13" fill="#334155">Uptane adapts the same ideas to vehicle ECU updates (director and image repositories). Sigstore uses a TUF repository to distribute its own trust root.</text>
  <text x="60" y="516" font-size="12" fill="#64748b">Role details simplified. Read the TUF specification for exact metadata and delegation rules.</text>
</svg>
