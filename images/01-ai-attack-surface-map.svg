<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>AI attack-surface map across six layers</title>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">The AI attack surface: six layers, many entry points</text>
  <text x="40" y="80" font-size="16" fill="#475569">Use it as a checklist when you draw your own system. Attackers enter at one layer and move to another.</text>

  <g font-size="13" text-anchor="middle">
    <!-- People -->
    <rect x="40" y="100" width="1120" height="74" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="60" y="133" text-anchor="start" font-size="16" font-weight="700" fill="#991b1b">People</text>
    <text x="60" y="154" text-anchor="start" font-size="12" fill="#991b1b">users, insiders</text>
    <rect x="230" y="116" width="170" height="42" rx="8" fill="#ffffff" stroke="#dc2626"/><text x="315" y="142" fill="#0f172a">end users and prompts</text>
    <rect x="410" y="116" width="170" height="42" rx="8" fill="#ffffff" stroke="#dc2626"/><text x="495" y="142" fill="#0f172a">insiders and admins</text>
    <rect x="590" y="116" width="170" height="42" rx="8" fill="#ffffff" stroke="#dc2626"/><text x="675" y="142" fill="#0f172a">human approvers</text>
    <rect x="770" y="116" width="170" height="42" rx="8" fill="#ffffff" stroke="#dc2626"/><text x="855" y="142" fill="#0f172a">content authors</text>
    <rect x="950" y="116" width="190" height="42" rx="8" fill="#ffffff" stroke="#dc2626"/><text x="1045" y="142" fill="#0f172a">suppliers, contractors</text>

    <!-- Application -->
    <rect x="40" y="184" width="1120" height="74" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="60" y="217" text-anchor="start" font-size="16" font-weight="700" fill="#92400e">Application</text>
    <text x="60" y="238" text-anchor="start" font-size="12" fill="#92400e">your code</text>
    <rect x="230" y="200" width="170" height="42" rx="8" fill="#ffffff" stroke="#d97706"/><text x="315" y="226" fill="#0f172a">chat UI, markdown</text>
    <rect x="410" y="200" width="170" height="42" rx="8" fill="#ffffff" stroke="#d97706"/><text x="495" y="226" fill="#0f172a">APIs and gateway</text>
    <rect x="590" y="200" width="170" height="42" rx="8" fill="#ffffff" stroke="#d97706"/><text x="675" y="226" fill="#0f172a">prompt templates</text>
    <rect x="770" y="200" width="170" height="42" rx="8" fill="#ffffff" stroke="#d97706"/><text x="855" y="226" fill="#0f172a">sessions and memory</text>
    <rect x="950" y="200" width="190" height="42" rx="8" fill="#ffffff" stroke="#d97706"/><text x="1045" y="226" fill="#0f172a">file upload and parsers</text>

    <!-- Tools and agents -->
    <rect x="40" y="268" width="1120" height="74" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="60" y="301" text-anchor="start" font-size="16" font-weight="700" fill="#92400e">Tools + agents</text>
    <text x="60" y="322" text-anchor="start" font-size="12" fill="#92400e">actions</text>
    <rect x="230" y="284" width="170" height="42" rx="8" fill="#ffffff" stroke="#d97706"/><text x="315" y="310" fill="#0f172a">tool schemas, args</text>
    <rect x="410" y="284" width="170" height="42" rx="8" fill="#ffffff" stroke="#d97706"/><text x="495" y="310" fill="#0f172a">MCP servers</text>
    <rect x="590" y="284" width="170" height="42" rx="8" fill="#ffffff" stroke="#d97706"/><text x="675" y="310" fill="#0f172a">delegated tokens</text>
    <rect x="770" y="284" width="170" height="42" rx="8" fill="#ffffff" stroke="#d97706"/><text x="855" y="310" fill="#0f172a">agent loops, plans</text>
    <rect x="950" y="284" width="190" height="42" rx="8" fill="#ffffff" stroke="#d97706"/><text x="1045" y="310" fill="#0f172a">agent-to-agent messages</text>

    <!-- Model -->
    <rect x="40" y="352" width="1120" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="60" y="385" text-anchor="start" font-size="16" font-weight="700" fill="#1e3a8a">Model</text>
    <text x="60" y="406" text-anchor="start" font-size="12" fill="#1e3a8a">weights, behaviour</text>
    <rect x="230" y="368" width="170" height="42" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="315" y="394" fill="#0f172a">inference API</text>
    <rect x="410" y="368" width="170" height="42" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="495" y="394" fill="#0f172a">system prompt</text>
    <rect x="590" y="368" width="170" height="42" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="675" y="394" fill="#0f172a">weights, adapters</text>
    <rect x="770" y="368" width="170" height="42" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="855" y="394" fill="#0f172a">safety tuning</text>
    <rect x="950" y="368" width="190" height="42" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="1045" y="394" fill="#0f172a">outputs (extraction)</text>

    <!-- Data -->
    <rect x="40" y="436" width="1120" height="74" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="60" y="469" text-anchor="start" font-size="16" font-weight="700" fill="#334155">Data</text>
    <text x="60" y="490" text-anchor="start" font-size="12" fill="#334155">what it learns, reads</text>
    <rect x="230" y="452" width="170" height="42" rx="8" fill="#ffffff" stroke="#64748b"/><text x="315" y="478" fill="#0f172a">training data</text>
    <rect x="410" y="452" width="170" height="42" rx="8" fill="#ffffff" stroke="#64748b"/><text x="495" y="478" fill="#0f172a">RAG documents</text>
    <rect x="590" y="452" width="170" height="42" rx="8" fill="#ffffff" stroke="#64748b"/><text x="675" y="478" fill="#0f172a">vector index</text>
    <rect x="770" y="452" width="170" height="42" rx="8" fill="#ffffff" stroke="#64748b"/><text x="855" y="478" fill="#0f172a">logs and feedback</text>
    <rect x="950" y="452" width="190" height="42" rx="8" fill="#ffffff" stroke="#64748b"/><text x="1045" y="478" fill="#0f172a">evaluation sets</text>

    <!-- Infrastructure -->
    <rect x="40" y="520" width="1120" height="74" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="60" y="553" text-anchor="start" font-size="16" font-weight="700" fill="#334155">Infrastructure</text>
    <text x="60" y="574" text-anchor="start" font-size="12" fill="#334155">where it runs</text>
    <rect x="230" y="536" width="170" height="42" rx="8" fill="#ffffff" stroke="#64748b"/><text x="315" y="562" fill="#0f172a">GPU hosts, clusters</text>
    <rect x="410" y="536" width="170" height="42" rx="8" fill="#ffffff" stroke="#64748b"/><text x="495" y="562" fill="#0f172a">model registry</text>
    <rect x="590" y="536" width="170" height="42" rx="8" fill="#ffffff" stroke="#64748b"/><text x="675" y="562" fill="#0f172a">secrets and keys</text>
    <rect x="770" y="536" width="170" height="42" rx="8" fill="#ffffff" stroke="#64748b"/><text x="855" y="562" fill="#0f172a">CI/CD pipelines</text>
    <rect x="950" y="536" width="190" height="42" rx="8" fill="#ffffff" stroke="#64748b"/><text x="1045" y="562" fill="#0f172a">cloud IAM, network</text>
  </g>
  <text x="40" y="612" font-size="13" fill="#475569">Classic security still applies to every box. The AI-specific parts are mostly in the middle three layers.</text>
</svg>
