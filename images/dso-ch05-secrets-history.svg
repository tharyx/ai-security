<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Secrets live on in git history</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="430" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Deleting a secret from the code does not remove it from the repository</text>
<text x="40" y="76" font-size="15" fill="#475569">Scan every commit on every branch, and rotate anything you find.</text>
<rect x="40" y="120" width="230" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="155.0" y="149.0" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Commit 1</text>
<text x="155.0" y="169.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">adds config.py</text>
<text x="155.0" y="189.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">with a token</text>
<rect x="340" y="120" width="230" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="455.0" y="149.0" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Commit 2</text>
<text x="455.0" y="169.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">moves token to</text>
<text x="455.0" y="189.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">an env variable</text>
<line x1="270" y1="165" x2="340" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="640" y="120" width="230" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="755.0" y="159.0" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">HEAD (commit 3)</text>
<text x="755.0" y="179.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">clean files</text>
<line x1="570" y1="165" x2="640" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="250" width="530" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="305.0" y="284.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">Scan HEAD only: clean. A false sense of safety.</text>
<rect x="40" y="325" width="530" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="305.0" y="359.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">Scan history (git log -p, all refs): token found in commit 1.</text>
<rect x="640" y="120" width="520" height="265" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="900.0" y="206.5" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Response order</text>
<text x="900.0" y="226.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">1  Revoke and rotate the secret now</text>
<text x="900.0" y="246.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">2  Check the logs for use of the old one</text>
<text x="900.0" y="266.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">3  Add a CI scan of the commit range</text>
<text x="900.0" y="286.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">4  Only then think about rewriting history</text>
<text x="900.0" y="306.5" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">A rewrite does not help if the repo was cloned or pushed.</text>
</svg>
