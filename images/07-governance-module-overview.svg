<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Module 07 overview: the AI governance pipeline inside an AI management system</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">AI governance: know it, rate it, control it, prove it</text>
  <text x="40" y="76" font-size="16" fill="#475569">Every AI system passes the same pipeline. Changes send it back to the start.</text>

  <!-- AIMS frame -->
  <rect x="30" y="96" width="1140" height="440" rx="16" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- inputs -->
  <rect x="60" y="112" width="250" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="185" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Shadow AI found</text>
  <text x="185" y="154" text-anchor="middle" font-size="12" fill="#991b1b">egress logs, expenses, surveys</text>
  <rect x="330" y="112" width="250" height="52" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="455" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">New AI use case</text>
  <text x="455" y="154" text-anchor="middle" font-size="12" fill="#92400e">intake form from a team</text>
  <path d="M185 164 L140 196" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M455 164 L170 200" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- pipeline -->
  <rect x="60" y="205" width="180" height="100" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="150" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">1 Inventory</text>
  <text x="150" y="262" text-anchor="middle" font-size="13" fill="#475569">system card, owners,</text>
  <text x="150" y="279" text-anchor="middle" font-size="13" fill="#475569">intended use</text>
  <text x="150" y="297" text-anchor="middle" font-size="12" fill="#2563eb">Lesson 01</text>

  <rect x="280" y="205" width="180" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="370" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">2 Classify</text>
  <text x="370" y="262" text-anchor="middle" font-size="13" fill="#475569">risk tier from facts,</text>
  <text x="370" y="279" text-anchor="middle" font-size="13" fill="#475569">not opinions</text>
  <text x="370" y="297" text-anchor="middle" font-size="12" fill="#2563eb">Lesson 01</text>

  <rect x="500" y="205" width="180" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="590" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">3 Assess risk</text>
  <text x="590" y="262" text-anchor="middle" font-size="13" fill="#475569">likelihood x impact,</text>
  <text x="590" y="279" text-anchor="middle" font-size="13" fill="#475569">treat, accept</text>
  <text x="590" y="297" text-anchor="middle" font-size="12" fill="#2563eb">Lesson 03</text>

  <rect x="720" y="205" width="180" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="810" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">4 Release gate</text>
  <text x="810" y="262" text-anchor="middle" font-size="13" fill="#166534">code in the pipeline</text>
  <text x="810" y="279" text-anchor="middle" font-size="13" fill="#166534">blocks findings</text>
  <text x="810" y="297" text-anchor="middle" font-size="12" fill="#2563eb">Lessons 02-03</text>

  <rect x="940" y="205" width="200" height="100" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1040" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">5 Operate, review</text>
  <text x="1040" y="262" text-anchor="middle" font-size="13" fill="#92400e">monitor, incidents,</text>
  <text x="1040" y="279" text-anchor="middle" font-size="13" fill="#92400e">periodic review, retire</text>
  <text x="1040" y="297" text-anchor="middle" font-size="12" fill="#2563eb">Lessons 02-03</text>

  <path d="M240 255 L274 255" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M460 255 L494 255" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M680 255 L714 255" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M900 255 L934 255" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- loop back -->
  <path d="M1040 305 L1040 360 L150 360 L150 311" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="595" y="385" text-anchor="middle" font-size="14" fill="#475569">change of model, data, tools, users, purpose or region = re-assess (and re-tier)</text>

  <!-- governance band -->
  <rect x="60" y="410" width="640" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="440" font-size="16" font-weight="700" fill="#1e3a8a">Who decides and by which rules (Lesson 02)</text>
  <text x="80" y="465" font-size="14" fill="#1e3a8a">AI governance board · RACI · AI policy and acceptable-use policy</text>
  <text x="80" y="488" font-size="14" fill="#1e3a8a">policy lifecycle · time-limited exceptions · risk acceptance authority</text>

  <rect x="740" y="410" width="400" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="760" y="440" font-size="16" font-weight="700" fill="#166534">Evidence of every step</text>
  <text x="760" y="465" font-size="14" fill="#166534">register export, risk register, approvals,</text>
  <text x="760" y="488" font-size="14" fill="#166534">test reports → Module 08 compliance</text>

  <text x="40" y="566" font-size="14" fill="#1e3a8a">Dashed frame = the AI management system (ISO/IEC 42001, Lesson 04): policy, roles, risk, operation, audit and improvement.</text>
</svg>
