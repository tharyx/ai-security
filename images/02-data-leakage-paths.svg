<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Where sensitive data enters an LLM app, where it leaks to, and the control on each path</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Data leakage paths in an LLM application</text>
  <text x="40" y="80" font-size="16" fill="#475569">Anything in the context can come out. Decide who may see data before it goes in; filter on the way out as a safety net.</text>

  <!-- sources -->
  <text x="40" y="118" font-size="15" font-weight="700" fill="#334155">Where data sits</text>
  <rect x="40" y="130" width="260" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="156" font-size="15" font-weight="700" fill="#0f172a">System prompt</text>
  <text x="56" y="177" font-size="12" fill="#475569">keys, hidden rules (LLM07)</text>
  <rect x="40" y="204" width="260" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="230" font-size="15" font-weight="700" fill="#0f172a">Conversation memory</text>
  <text x="56" y="251" font-size="12" fill="#475569">notes, history, profiles</text>
  <rect x="40" y="278" width="260" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="304" font-size="15" font-weight="700" fill="#0f172a">Response cache</text>
  <text x="56" y="325" font-size="12" fill="#475569">personalized answers</text>
  <rect x="40" y="352" width="260" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="378" font-size="15" font-weight="700" fill="#0f172a">Retrieved docs / tools</text>
  <text x="56" y="399" font-size="12" fill="#475569">RAG chunks, API results (Module 03)</text>
  <rect x="40" y="426" width="260" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="452" font-size="15" font-weight="700" fill="#0f172a">Training data</text>
  <text x="56" y="473" font-size="12" fill="#475569">memorized by the model itself</text>

  <path d="M300 161 L396 250" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M300 235 L396 275" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M300 309 L396 300" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M300 383 L396 325" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M300 457 L396 350" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- app -->
  <rect x="400" y="200" width="240" height="200" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="520" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">LLM app + model</text>
  <text x="520" y="306" text-anchor="middle" font-size="13" fill="#1e3a8a">one context window:</text>
  <text x="520" y="326" text-anchor="middle" font-size="13" fill="#1e3a8a">no access control inside</text>

  <!-- destinations -->
  <text x="880" y="118" font-size="15" font-weight="700" fill="#991b1b">Where it leaks to</text>
  <rect x="880" y="130" width="280" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="896" y="156" font-size="15" font-weight="700" fill="#991b1b">Anyone who asks</text>
  <text x="896" y="177" font-size="12" fill="#991b1b">prompt extraction</text>
  <rect x="880" y="214" width="280" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="896" y="240" font-size="15" font-weight="700" fill="#991b1b">Another user or session</text>
  <text x="896" y="261" font-size="12" fill="#991b1b">shared memory, shared cache</text>
  <rect x="880" y="298" width="280" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="896" y="324" font-size="15" font-weight="700" fill="#991b1b">Attacker's server</text>
  <text x="896" y="345" font-size="12" fill="#991b1b">markdown image, link, tool call</text>
  <rect x="880" y="382" width="280" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="896" y="408" font-size="15" font-weight="700" fill="#991b1b">The victim's browser</text>
  <text x="896" y="429" font-size="12" fill="#991b1b">HTML/script in output (LLM05)</text>
  <rect x="880" y="466" width="280" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="896" y="492" font-size="15" font-weight="700" fill="#991b1b">Log and trace readers</text>
  <text x="896" y="513" font-size="12" fill="#991b1b">ops staff, vendors, breaches</text>

  <!-- leak arrows with control pills -->
  <path d="M640 230 L874 161" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <path d="M640 265 L874 245" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <path d="M640 300 L874 329" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <path d="M640 335 L874 413" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <path d="M640 370 L874 497" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>

  <rect x="672" y="168" width="176" height="24" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">no secrets in prompt</text>
  <rect x="672" y="226" width="176" height="24" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">per-user isolation</text>
  <rect x="672" y="290" width="176" height="24" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">URL/image allowlist</text>
  <rect x="672" y="352" width="176" height="24" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">HTML-escape output</text>
  <rect x="672" y="418" width="176" height="24" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="435" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">redacted logging</text>

  <!-- bottom -->
  <rect x="40" y="548" width="1120" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="580" text-anchor="middle" font-size="15" fill="#166534"><tspan font-weight="700">Output DLP</tspan> (secrets + PII not owned by the asker) covers every red arrow, but regex misses encoded data: a net, not a wall.</text>
</svg>
