  <text x="210.0" y="394.0" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">RAG service</text>
  <text x="210.0" y="411.5" font-size="12.5" fill="#92400e" text-anchor="middle">ACL filter BEFORE ranking</text>
  <text x="210.0" y="429.0" font-size="12.5" fill="#92400e" text-anchor="middle">provenance + trust label per chunk</text>
