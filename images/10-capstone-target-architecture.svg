  <text x="455.0" y="717.25" font-size="12.5" fill="#166534" text-anchor="middle">injection · denials · cost</text>
  <rect x="600" y="672" width="250" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="725.0" y="699.75" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Incident runbooks</text>
  <text x="725.0" y="717.25" font-size="12.5" fill="#166534" text-anchor="middle">kill switch drill</text>
  <rect x="870" y="672" width="270" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1005.0" y="699.75" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Secrets + keys</text>
  <text x="1005.0" y="717.25" font-size="12.5" fill="#166534" text-anchor="middle">manager + KMS, no keys in code</text>
