  <text x="555.0" y="411.5" font-size="12.5" fill="#92400e" text-anchor="middle">own identity · max steps · cost cap</text>
  <text x="555.0" y="429.0" font-size="12.5" fill="#92400e" text-anchor="middle">loop guard · kill switch</text>
  <rect x="750" y="364" width="390" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="945.0" y="394.0" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Tool broker / MCP gateway</text>
  <text x="945.0" y="411.5" font-size="12.5" fill="#166534" text-anchor="middle">approved registry · typed schemas</text>
  <text x="945.0" y="429.0" font-size="12.5" fill="#166534" text-anchor="middle">per-tenant resources · approval for writes</text>
