  <text x="710.0" y="551.0" font-size="12.5" fill="#92400e" text-anchor="middle">read-only</text>
  <text x="710.0" y="568.5" font-size="12.5" fill="#92400e" text-anchor="middle">tenant-scoped</text>
  <rect x="805" y="496" width="160" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="885.0" y="533.5" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Human approval</text>
  <text x="885.0" y="551.0" font-size="12.5" fill="#166534" text-anchor="middle">exact action</text>
  <text x="885.0" y="568.5" font-size="12.5" fill="#166534" text-anchor="middle">+ sources shown</text>
  <rect x="980" y="496" width="170" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1065.0" y="533.5" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Change ticket</text>
  <text x="1065.0" y="551.0" font-size="12.5" fill="#92400e" text-anchor="middle">mock CAB queue</text>
  <text x="1065.0" y="568.5" font-size="12.5" fill="#92400e" text-anchor="middle">never prod write</text>
  <rect x="30" y="650" width="1140" height="100" rx="14" fill="#fbfcfd" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
