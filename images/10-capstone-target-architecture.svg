  <text x="485.0" y="542.25" font-size="12.5" fill="#1e3a8a" text-anchor="middle">private access</text>
  <text x="485.0" y="559.75" font-size="12.5" fill="#1e3a8a" text-anchor="middle">approved model</text>
  <text x="485.0" y="577.25" font-size="12.5" fill="#1e3a8a" text-anchor="middle">no training</text>
  <rect x="610" y="482" width="560" height="150" rx="14" fill="#fffdf6" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="624" y="624" font-size="13" font-weight="700" fill="#92400e" text-anchor="start">Tool zone (read-only by default)</text>
