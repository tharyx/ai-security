  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Capstone target architecture: secure AI operations assistant</text>
  <text x="40" y="80" font-size="16" fill="#475569" text-anchor="start">Multi-tenant. Answers from approved knowledge, reads monitoring data, proposes changes. Never changes production itself.</text>
