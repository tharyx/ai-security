  <text x="730.0" y="165.25" font-size="12.5" fill="#991b1b" text-anchor="middle">anyone can edit = untrusted</text>
  <rect x="880" y="122" width="260" height="58" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1010.0" y="147.75" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">Monitoring data</text>
  <text x="1010.0" y="165.25" font-size="12.5" fill="#991b1b" text-anchor="middle">log lines, alert text</text>
  <rect x="30" y="210" width="1140" height="108" rx="14" fill="#f8fdf9" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="230" font-size="13" font-weight="700" fill="#166534" text-anchor="start">Identity, gateway and policy</text>
  <rect x="60" y="236" width="220" height="66" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="170.0" y="265.75" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Enterprise IdP</text>
  <text x="170.0" y="283.25" font-size="12.5" fill="#166534" text-anchor="middle">OIDC · MFA · groups</text>
  <rect x="310" y="231" width="420" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="520.0" y="258.0" font-size="17" font-weight="700" fill="#166534" text-anchor="middle">AI gateway</text>
  <text x="520.0" y="275.5" font-size="12.5" fill="#166534" text-anchor="middle">verify token · tenant from claims only</text>
  <text x="520.0" y="293.0" font-size="12.5" fill="#166534" text-anchor="middle">rate limits · token budget · guardrails</text>
  <rect x="760" y="236" width="380" height="66" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="950.0" y="265.75" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Policy decision point</text>
  <text x="950.0" y="283.25" font-size="12.5" fill="#166534" text-anchor="middle">role + tenant + tool + data-class rules</text>
  <rect x="30" y="336" width="1140" height="128" rx="14" fill="#fffdf6" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="356" font-size="13" font-weight="700" fill="#92400e" text-anchor="start">Application zone</text>
