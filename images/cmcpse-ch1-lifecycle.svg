<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>MCP lifecycle: initialize, capability negotiation, operation, shutdown</title>
  <defs>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="l" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
  </defs>
  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">MCP lifecycle: one connection, four phases</text>
  <rect x="150" y="70" width="200" height="44" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Client (in host)</text>
  <rect x="750" y="70" width="200" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="850" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Server</text>
  <line x1="250" y1="114" x2="250" y2="730" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="850" y1="114" x2="850" y2="730" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="30" y="130" width="1040" height="30" fill="#eff6ff"/>
  <text x="40" y="151" font-size="14" font-weight="700" fill="#1e3a8a">1. Initialization and capability negotiation</text>
  <line x1="250" y1="195" x2="850" y2="195" stroke="#1d4ed8" stroke-width="2" marker-end="url(#r)"/>
  <text x="550" y="186" text-anchor="middle" font-size="13" fill="#1e3a8a">initialize (protocolVersion, capabilities, clientInfo)</text>
  <line x1="850" y1="240" x2="250" y2="240" stroke="#15803d" stroke-width="2" marker-end="url(#l)"/>
  <text x="550" y="231" text-anchor="middle" font-size="13" fill="#166534">result (agreed version, server capabilities, serverInfo)</text>
  <line x1="250" y1="285" x2="850" y2="285" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="550" y="276" text-anchor="middle" font-size="13" fill="#1e3a8a">notifications/initialized (no reply: no id)</text>

  <rect x="30" y="310" width="1040" height="30" fill="#eff6ff"/>
  <text x="40" y="331" font-size="14" font-weight="700" fill="#1e3a8a">2. Operation: only use what was negotiated</text>
  <line x1="250" y1="375" x2="850" y2="375" stroke="#1d4ed8" stroke-width="2" marker-end="url(#r)"/>
  <text x="550" y="366" text-anchor="middle" font-size="13" fill="#1e3a8a">tools/list</text>
  <line x1="850" y1="415" x2="250" y2="415" stroke="#15803d" stroke-width="2" marker-end="url(#l)"/>
  <text x="550" y="406" text-anchor="middle" font-size="13" fill="#166534">result: tool names, descriptions, inputSchema</text>
  <line x1="250" y1="460" x2="850" y2="460" stroke="#1d4ed8" stroke-width="2" marker-end="url(#r)"/>
  <text x="550" y="451" text-anchor="middle" font-size="13" fill="#1e3a8a">tools/call (name, arguments)</text>
  <line x1="850" y1="500" x2="250" y2="500" stroke="#15803d" stroke-width="2" marker-end="url(#l)"/>
  <text x="550" y="491" text-anchor="middle" font-size="13" fill="#166534">result: content[], isError</text>
  <line x1="850" y1="545" x2="250" y2="545" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#l)"/>
  <text x="550" y="536" text-anchor="middle" font-size="13" fill="#166534">notifications/tools/list_changed (if advertised)</text>

  <rect x="30" y="575" width="1040" height="30" fill="#eff6ff"/>
  <text x="40" y="596" font-size="14" font-weight="700" fill="#1e3a8a">3. Shutdown (no special message)</text>
  <text x="550" y="630" text-anchor="middle" font-size="13" fill="#334155">stdio: client closes the server's stdin, waits, then terminates if needed.</text>
  <text x="550" y="652" text-anchor="middle" font-size="13" fill="#334155">HTTP: client closes the connection (and ends the session if one was used).</text>

  <rect x="30" y="680" width="1040" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="550" y="706" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Security checkpoints</text>
  <text x="550" y="728" text-anchor="middle" font-size="13" fill="#7f1d1d">Pin server identity and version before step 1 · check the agreed version · treat step 2 results as untrusted input · log every message</text>
</svg>
