<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Six ways attackers reach your database</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Six ways attackers reach your database</text>
<text x="40" y="80" font-size="16" fill="#475569">Most of them are not exotic. They use access that already exists.</text>
<rect x="480" y="230" width="240" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="600.0" y="265.0" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Database</text>
<text x="600.0" y="285.0" text-anchor="middle" font-size="13" fill="#475569">sensitive data,</text>
<text x="600.0" y="303.0" text-anchor="middle" font-size="13" fill="#475569">backups, audit trail</text>
<rect x="40" y="130" width="240" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="160.0" y="164.0" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">SQL injection</text>
<text x="160.0" y="184.0" text-anchor="middle" font-size="13" fill="#475569">bad input becomes SQL</text>
<rect x="480" y="110" width="240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="600.0" y="144.0" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Stolen credentials</text>
<text x="600.0" y="164.0" text-anchor="middle" font-size="13" fill="#475569">phished or reused password</text>
<rect x="920" y="130" width="240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="1040.0" y="164.0" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Exposed listener</text>
<text x="1040.0" y="184.0" text-anchor="middle" font-size="13" fill="#475569">1521 open to Internet</text>
<rect x="40" y="380" width="240" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="160.0" y="414.0" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Privilege abuse / insider</text>
<text x="160.0" y="434.0" text-anchor="middle" font-size="13" fill="#475569">too many grants, bulk export</text>
<rect x="480" y="430" width="240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="600.0" y="464.0" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Default accounts</text>
<text x="600.0" y="484.0" text-anchor="middle" font-size="13" fill="#475569">known passwords</text>
<rect x="920" y="380" width="240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="1040.0" y="414.0" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Ransomware</text>
<text x="1040.0" y="434.0" text-anchor="middle" font-size="13" fill="#475569">encrypt data + backups</text>
<line x1="280" y1="170" x2="480" y2="245" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
<line x1="600" y1="190" x2="600" y2="230" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
<line x1="920" y1="170" x2="720" y2="245" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
<line x1="280" y1="420" x2="480" y2="315" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
<line x1="600" y1="430" x2="600" y2="330" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
<line x1="920" y1="420" x2="720" y2="315" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
</svg>