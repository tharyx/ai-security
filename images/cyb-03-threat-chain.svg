<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>From threat actor to impact</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#475569"/></marker></defs>
<rect width="1200" height="440" fill="#ffffff"/>
<text x="60" y="52" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">From threat actor to impact</text>
<text x="60" y="82" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">A simple attack chain, and where each defense fits</text>
<rect x="60.0" y="130" width="240" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="180.0" y="158" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Threat actor</text>
<text x="180.0" y="182" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">criminal, insider,</text>
<text x="180.0" y="202" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">nation-state, hacktivist</text>
<rect x="340.0" y="130" width="240" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="460.0" y="158" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Attack vector</text>
<text x="460.0" y="182" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">phishing, weak password,</text>
<text x="460.0" y="202" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">exposed service</text>
<rect x="620.0" y="130" width="240" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="740.0" y="158" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Vulnerability</text>
<text x="740.0" y="182" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">unpatched software,</text>
<text x="740.0" y="202" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">bad configuration</text>
<rect x="900.0" y="130" width="240" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="1020.0" y="158" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Impact</text>
<text x="1020.0" y="182" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">data theft, ransomware,</text>
<text x="1020.0" y="202" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">downtime, fines</text>
<line x1="304.0" y1="180.0" x2="336.0" y2="180.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="584.0" y1="180.0" x2="616.0" y2="180.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="864.0" y1="180.0" x2="896.0" y2="180.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="60.0" y="300" width="240" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="180.0" y="328" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Awareness + email filter</text>
<text x="180.0" y="352" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">breaks the vector</text>
<rect x="340.0" y="300" width="240" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="460.0" y="328" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">MFA + least privilege</text>
<text x="460.0" y="352" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">limits what stolen</text>
<text x="460.0" y="372" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">credentials can do</text>
<rect x="620.0" y="300" width="240" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="740.0" y="328" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Patching + hardening</text>
<text x="740.0" y="352" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">removes the weakness</text>
<rect x="900.0" y="300" width="240" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1020.0" y="328" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Backups + response plan</text>
<text x="1020.0" y="352" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">reduces the damage</text>
<text x="60" y="420" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Defense in depth: several different controls, so one failure does not mean a breach.</text>
</svg>
