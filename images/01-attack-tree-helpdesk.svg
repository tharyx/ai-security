  <text x="670" y="364" text-anchor="middle" font-size="12" fill="#991b1b">0.20; fix: restrict</text>
  <line x1="745" y1="276" x2="670" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="750" y="320" width="140" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
