  <text x="40" y="80" font-size="16" fill="#475569">OR: any child is enough. AND: every child is needed. Numbers are made-up estimates from attack_tree.py.</text>
  <rect x="380" y="100" width="440" height="66" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
