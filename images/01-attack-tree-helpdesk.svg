  <text x="600" y="144" text-anchor="middle" font-size="12" fill="#991b1b">P = 0.83 with no controls; cheapest path: cross-tenant RAG</text>
  <rect x="40" y="210" width="520" height="66" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="300" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">AND: indirect injection via inbound email</text>
  <text x="300" y="254" text-anchor="middle" font-size="12" fill="#92400e">P = 0.47</text>
