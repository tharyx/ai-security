  <line x1="745" y1="276" x2="820" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="230" y="430" width="160" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="310" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">send_email tool</text>
  <text x="310" y="474" text-anchor="middle" font-size="12" fill="#991b1b">0.90; fix: broker</text>
  <line x1="472" y1="382" x2="310" y2="428" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="400" y="430" width="160" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">markdown image</text>
  <text x="480" y="474" text-anchor="middle" font-size="12" fill="#991b1b">0.80; fix: allowlist</text>
  <line x1="472" y1="382" x2="480" y2="428" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="570" y="430" width="160" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">http_fetch tool</text>
  <text x="650" y="474" text-anchor="middle" font-size="12" fill="#991b1b">0.80; fix: egress</text>
  <line x1="472" y1="382" x2="650" y2="428" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="515" width="1120" height="105" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="54" y="539" font-size="15" font-weight="700" fill="#166534">What the maths says</text>
  <text x="54" y="559" font-size="13" fill="#166534">One hard control: ACL filter 0.83 to 0.57; quarantine the email reader 0.83 to 0.67; block ONE exit channel 0.83 to 0.82.</text>
  <text x="54" y="576" font-size="13" fill="#166534">Soft control only (model follows injection 50% to 10%): 0.83 to 0.70. One hard control per branch (ACL, quarantine, redaction): 0.00.</text>
  <text x="54" y="593" font-size="13" fill="#166534">Lesson: cut an AND branch at its cheapest hard leg; an OR node needs every child closed.</text>
</svg>
