  <text x="122" y="364" text-anchor="middle" font-size="12" fill="#991b1b">0.95; fix: quarantine</text>
  <line x1="300" y1="276" x2="122" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="215" y="320" width="165" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="298" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">model follows injection</text>
  <text x="298" y="364" text-anchor="middle" font-size="12" fill="#334155">0.50; soft controls only</text>
  <line x1="300" y1="276" x2="297" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="390" y="320" width="165" height="62" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="472" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">OR: get the data out</text>
  <text x="472" y="364" text-anchor="middle" font-size="12" fill="#92400e">P = 0.996</text>
