<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Continuous integration, continuous delivery and continuous deployment</title>
<desc>Three rows show how far automation goes: CI stops after tests, delivery waits for a human approval, deployment releases automatically.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect width="1100" height="470" fill="#ffffff"/>
<text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">CI vs continuous delivery vs continuous deployment</text>
<text x="40" y="70" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Same pipeline, different finish line. The only real difference is who presses the production button.</text>
<text x="40" y="148" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="start">Continuous Integration</text>
<text x="40" y="166" font-size="11" font-weight="400" fill="#475569" text-anchor="start">merge often, prove it builds</text>
<rect x="200" y="110" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="259.0" y="145.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Commit</text>
<rect x="330" y="110" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="389.0" y="145.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Build</text>
<line x1="318" y1="141" x2="330" y2="141" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="460" y="110" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="519.0" y="145.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Test + scan</text>
<line x1="448" y1="141" x2="460" y2="141" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="590" y="110" width="118" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="649.0" y="137.55" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Package</text>
<text x="649.0" y="153.55" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">(not automated)</text>
<rect x="720" y="110" width="118" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="779.0" y="137.55" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Deploy staging</text>
<text x="779.0" y="153.55" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">(not automated)</text>
<rect x="850" y="110" width="118" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="909.0" y="137.55" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Release gate</text>
<text x="909.0" y="153.55" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">(not automated)</text>
<rect x="980" y="110" width="118" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1039.0" y="137.55" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Deploy prod</text>
<text x="1039.0" y="153.55" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">(not automated)</text>
<text x="40" y="263" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="start">Continuous Delivery</text>
<text x="40" y="281" font-size="11" font-weight="400" fill="#475569" text-anchor="start">always ready, a person approves</text>
<rect x="200" y="225" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="259.0" y="260.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Commit</text>
<rect x="330" y="225" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="389.0" y="260.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Build</text>
<line x1="318" y1="256" x2="330" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="460" y="225" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="519.0" y="260.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Test + scan</text>
<line x1="448" y1="256" x2="460" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="590" y="225" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="649.0" y="260.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Package</text>
<line x1="578" y1="256" x2="590" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="720" y="225" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="779.0" y="260.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Deploy staging</text>
<line x1="708" y1="256" x2="720" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="850" y="225" width="118" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="909.0" y="252.55" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">Manual approval</text>
<text x="909.0" y="268.55" font-size="13" font-weight="400" fill="#78350f" text-anchor="middle">(a person)</text>
<line x1="838" y1="256" x2="850" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="980" y="225" width="118" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1039.0" y="260.55" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">Deploy prod</text>
<line x1="968" y1="256" x2="980" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<text x="40" y="378" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="start">Continuous Deployment</text>
<text x="40" y="396" font-size="11" font-weight="400" fill="#475569" text-anchor="start">no human step, gates decide</text>
<rect x="200" y="340" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="259.0" y="375.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Commit</text>
<rect x="330" y="340" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="389.0" y="375.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Build</text>
<line x1="318" y1="371" x2="330" y2="371" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="460" y="340" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="519.0" y="375.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Test + scan</text>
<line x1="448" y1="371" x2="460" y2="371" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="590" y="340" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="649.0" y="375.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Package</text>
<line x1="578" y1="371" x2="590" y2="371" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="720" y="340" width="118" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="779.0" y="375.55" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Deploy staging</text>
<line x1="708" y1="371" x2="720" y2="371" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="850" y="340" width="118" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="909.0" y="367.55" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">Auto gates</text>
<text x="909.0" y="383.55" font-size="13" font-weight="400" fill="#064e3b" text-anchor="middle">(policy)</text>
<line x1="838" y1="371" x2="850" y2="371" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="980" y="340" width="118" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1039.0" y="375.55" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">Deploy prod</text>
<line x1="968" y1="371" x2="980" y2="371" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<text x="40" y="450" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Tip: continuous delivery is the usual target for regulated apps (approval = change control); continuous deployment needs strong tests, gates and fast rollback.</text>
</svg>
