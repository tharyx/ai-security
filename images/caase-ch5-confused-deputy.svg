<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Confused deputy in an agent chain</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect width="1200" height="470" fill="#ffffff"/>
<text x="40" y="48" font-size="28" font-weight="bold" fill="#0f172a">Confused deputy in an agent chain</text>
<text x="40" y="76" font-size="16" fill="#475569">The deputy has authority the requester lacks. Check the ORIGIN, not just the caller.</text>
<rect x="40" y="130" width="190" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="135.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Untrusted document</text>
<text x="135.0" y="180.0" text-anchor="middle" font-size="12" fill="#475569">contains hidden instructions</text>
<rect x="300" y="130" width="190" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="395.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Assistant</text>
<text x="395.0" y="180.0" text-anchor="middle" font-size="12" fill="#475569">low privilege, reads docs</text>
<rect x="560" y="130" width="190" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="655.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Researcher</text>
<text x="655.0" y="180.0" text-anchor="middle" font-size="12" fill="#475569">forwards requests</text>
<rect x="820" y="130" width="220" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="930.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Finance agent</text>
<text x="930.0" y="180.0" text-anchor="middle" font-size="12" fill="#475569">can transfer money (deputy)</text>
<line x1="230" y1="165" x2="300" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="265.0" y="155" text-anchor="middle" font-size="12" fill="#475569">injects</text>
<line x1="490" y1="165" x2="560" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="525.0" y="155" text-anchor="middle" font-size="12" fill="#475569">request</text>
<line x1="750" y1="165" x2="820" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="785.0" y="155" text-anchor="middle" font-size="12" fill="#475569">request</text>
<text x="40" y="250" text-anchor="start" font-size="14" fill="#dc2626">Vulnerable: the deputy asks only 'is transfer in MY permissions?' and runs it with its own authority.</text>
<rect x="40" y="280" width="1100" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="590.0" y="350.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Secure: allow only if the action is in the INTERSECTION of three sets</text>
<text x="80" y="380" text-anchor="start" font-size="13" fill="#0f172a">deputy's own permissions</text>
<text x="440" y="380" text-anchor="start" font-size="13" fill="#0f172a">originating principal's permissions</text>
<text x="800" y="380" text-anchor="start" font-size="13" fill="#0f172a">scopes delegated along the chain</text>
<text x="40" y="445" text-anchor="start" font-size="13" fill="#475569">Plus: content-driven (tainted) high-value actions need human approval. See labs/confused-deputy-chain.</text>
</svg>
