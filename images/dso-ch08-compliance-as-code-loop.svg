<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Compliance as code loop: requirement, control as code, scan, report, remediate, evidence, repeat</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a">The compliance-as-code loop</text>
  <text x="40" y="70" font-size="15" fill="#475569">Auditors ask for evidence, not promises. Make the check a program, run it often, keep the output.</text>

  <rect x="40" y="110" width="250" height="100" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="165" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">1. Requirement</text>
  <text x="165" y="162" text-anchor="middle" font-size="13" fill="#0f172a">PCI DSS v4.0.1, CIS, ISO 27001</text>
  <text x="165" y="182" text-anchor="middle" font-size="13" fill="#0f172a">mapped to host settings</text>

  <rect x="475" y="110" width="250" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">2. Control as code</text>
  <text x="600" y="162" text-anchor="middle" font-size="13" fill="#0f172a">InSpec / CINC profile, SSG rules</text>
  <text x="600" y="182" text-anchor="middle" font-size="13" fill="#0f172a">impact, title, tags, in git</text>

  <rect x="910" y="110" width="250" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1035" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">3. Scan at scale</text>
  <text x="1035" y="162" text-anchor="middle" font-size="13" fill="#0f172a">pipeline stage, nightly job, or</text>
  <text x="1035" y="182" text-anchor="middle" font-size="13" fill="#0f172a">agentless over SSH for the fleet</text>

  <rect x="910" y="330" width="250" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1035" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">4. Report and score</text>
  <text x="1035" y="382" text-anchor="middle" font-size="13" fill="#0f172a">per host, per control, by severity</text>
  <text x="1035" y="402" text-anchor="middle" font-size="13" fill="#0f172a">trend over time, exceptions logged</text>

  <rect x="475" y="330" width="250" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">5. Remediate as code</text>
  <text x="600" y="382" text-anchor="middle" font-size="13" fill="#0f172a">Ansible role fix or Packer rebuild</text>
  <text x="600" y="402" text-anchor="middle" font-size="13" fill="#0f172a">reviewed like any change</text>

  <rect x="40" y="330" width="250" height="100" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="165" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">6. Evidence</text>
  <text x="165" y="382" text-anchor="middle" font-size="13" fill="#0f172a">signed reports kept per run</text>
  <text x="165" y="402" text-anchor="middle" font-size="13" fill="#0f172a">answer the assessor with a link</text>

  <path d="M290 160 H473" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M725 160 H908" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1035 210 V328" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M910 380 H727" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M475 380 H292" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M165 330 V212" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="180" y="278" font-size="13" fill="#475569">requirements change (new PCI version): update the controls</text>

  <text x="40" y="470" font-size="14" fill="#0f172a">Drift is the enemy: a host that was compliant on audit day can fail tomorrow. Re-scan on every change and on a schedule.</text>
  <text x="40" y="492" font-size="14" fill="#475569">Compliance is not security: passing the baseline means the baseline is met, not that the host is safe.</text>
</svg>
