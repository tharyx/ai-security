<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Capstone target: multi-agent enterprise assistant with RAG and MCP tools behind a gateway, with trust boundaries and controls</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#0f172a">Capstone target: planner, research and action agents behind one MCP gateway</text>
  <text x="600" y="60" text-anchor="middle" font-size="14" fill="#475569">Dashed red lines = trust boundaries (TB-1..TB-6). Green tags = hard controls. Amber = soft guardrails.</text>

  <!-- user -->
  <rect x="20" y="230" width="130" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="85" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">User</text>
  <text x="85" y="282" text-anchor="middle" font-size="12" fill="#475569">tenant-a / tenant-b</text>
  <text x="85" y="298" text-anchor="middle" font-size="12" fill="#475569">verified identity</text>
  <line x1="175" y1="90" x2="175" y2="560" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="180" y="105" font-size="12" fill="#dc2626">TB-1</text>

  <!-- agents -->
  <rect x="210" y="110" width="200" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Planner agent</text>
  <text x="310" y="162" text-anchor="middle" font-size="12" fill="#1e3a8a">sees tool catalog</text>
  <text x="310" y="180" text-anchor="middle" font-size="12" fill="#1e3a8a">(MCP descriptions)</text>
  <rect x="210" y="230" width="200" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Research agent</text>
  <text x="310" y="282" text-anchor="middle" font-size="12" fill="#1e3a8a">reads retrieved docs</text>
  <rect x="210" y="350" width="200" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Action agent</text>
  <text x="310" y="402" text-anchor="middle" font-size="12" fill="#1e3a8a">reads tool results,</text>
  <text x="310" y="420" text-anchor="middle" font-size="12" fill="#1e3a8a">broad service identity</text>
  <rect x="210" y="470" width="200" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="310" y="497" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">MockLLM (gullible)</text>
  <text x="310" y="516" text-anchor="middle" font-size="12" fill="#7c2d12">TB-2: output is untrusted</text>
  <rect x="20" y="340" width="140" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="90" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">input_guard</text>
  <text x="90" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">output_guard</text>

  <line x1="150" y1="270" x2="208" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="310" y1="200" x2="310" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="310" y1="320" x2="310" y2="348" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <line x1="440" y1="90" x2="440" y2="560" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="445" y="105" font-size="12" fill="#dc2626">TB-3</text>

  <!-- gateway -->
  <rect x="470" y="150" width="230" height="330" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="585" y="182" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">MCP gateway</text>
  <text x="585" y="202" text-anchor="middle" font-size="12" fill="#14532d">policy enforcement + telemetry</text>
  <rect x="490" y="218" width="190" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="585" y="237" text-anchor="middle" font-size="12" fill="#14532d">tool_pinning (allow-list + hash)</text>
  <rect x="490" y="254" width="190" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="585" y="273" text-anchor="middle" font-size="12" fill="#14532d">least_privilege (scope + OBO)</text>
  <rect x="490" y="290" width="190" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="585" y="309" text-anchor="middle" font-size="12" fill="#14532d">retrieval_acl (tenant filter)</text>
  <rect x="490" y="326" width="190" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="585" y="345" text-anchor="middle" font-size="12" fill="#14532d">egress_allowlist</text>
  <rect x="490" y="362" width="190" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="585" y="381" text-anchor="middle" font-size="12" fill="#14532d">hitl_send_email (provenance)</text>
  <rect x="490" y="398" width="190" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="585" y="417" text-anchor="middle" font-size="12" fill="#14532d">output_dlp</text>
  <text x="585" y="458" text-anchor="middle" font-size="12" fill="#14532d">logs: user, agent, tool, args hash,</text>
  <text x="585" y="474" text-anchor="middle" font-size="12" fill="#14532d">provenance, decision</text>

  <line x1="410" y1="155" x2="468" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="275" x2="468" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="395" x2="468" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- tools -->
  <rect x="760" y="110" width="190" height="64" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="855" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">docs-mcp</text>
  <text x="855" y="158" text-anchor="middle" font-size="12" fill="#475569">search_docs</text>
  <rect x="760" y="190" width="190" height="64" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="855" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">crm-mcp</text>
  <text x="855" y="238" text-anchor="middle" font-size="12" fill="#475569">read_crm</text>
  <rect x="760" y="270" width="190" height="64" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="855" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">mail-mcp</text>
  <text x="855" y="318" text-anchor="middle" font-size="12" fill="#475569">send_email</text>
  <line x1="730" y1="355" x2="1180" y2="355" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="1110" y="348" font-size="12" fill="#dc2626">TB-4</text>
  <rect x="760" y="372" width="190" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="855" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">analytics-mcp (3rd party)</text>
  <text x="855" y="420" text-anchor="middle" font-size="12" fill="#7f1d1d">run_report: rug pull</text>
  <rect x="760" y="450" width="190" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="855" y="474" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">helper-mcp (shadow)</text>
  <text x="855" y="492" text-anchor="middle" font-size="12" fill="#7f1d1d">tool poisoning</text>

  <line x1="700" y1="200" x2="758" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="240" x2="758" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="300" x2="758" y2="302" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="400" x2="758" y2="404" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- data -->
  <rect x="1000" y="100" width="180" height="90" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1090" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Doc store</text>
  <text x="1090" y="146" text-anchor="middle" font-size="12" fill="#475569">tenant-a | tenant-b (TB-5)</text>
  <text x="1090" y="166" text-anchor="middle" font-size="12" fill="#b91c1c">poisoned wiki page</text>
  <rect x="1000" y="200" width="180" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1090" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">CRM</text>
  <text x="1090" y="248" text-anchor="middle" font-size="12" fill="#b91c1c">poisoned note in A-7</text>
  <rect x="1000" y="275" width="180" height="62" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1090" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Internet email</text>
  <text x="1090" y="320" text-anchor="middle" font-size="12" fill="#475569">TB-6: egress</text>
  <line x1="950" y1="142" x2="998" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="950" y1="222" x2="998" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="950" y1="302" x2="998" y2="305" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="470" y="530" width="710" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="825" y="556" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">SOC: telemetry -> 7 detection rules -> per-trace incidents -> playbook outputs</text>
  <text x="825" y="578" text-anchor="middle" font-size="12" fill="#4c1d95">baseline: 8 incidents with impact · hardened: 8 blocked attempts, 0 with impact</text>
  <line x1="585" y1="480" x2="585" y2="528" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
</svg>
