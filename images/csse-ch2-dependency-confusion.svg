<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Dependency confusion: a public package with an internal name and a higher version wins</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">Dependency confusion</text>
  <text x="40" y="74" font-size="16" fill="#475569">A resolver that merges a private and a public index and takes the highest version can pick the attacker's copy.</text>

  <rect x="40" y="130" width="280" height="150" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="180" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">PRIVATE index (company)</text>
  <text x="180" y="196" text-anchor="middle" font-size="15" fill="#334155">acme-billing-utils</text>
  <text x="180" y="220" text-anchor="middle" font-size="15" fill="#334155">version 1.2.0 (real)</text>
  <text x="180" y="252" text-anchor="middle" font-size="13" fill="#475569">name is internal, never published</text>

  <rect x="880" y="130" width="280" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1020" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">PUBLIC index (anyone)</text>
  <text x="1020" y="196" text-anchor="middle" font-size="15" fill="#991b1b">acme-billing-utils</text>
  <text x="1020" y="220" text-anchor="middle" font-size="15" fill="#991b1b">version 99.0.0 (attacker)</text>
  <text x="1020" y="252" text-anchor="middle" font-size="13" fill="#991b1b">install script = attacker code</text>

  <rect x="440" y="200" width="320" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">Resolver (pip, npm, CI)</text>
  <text x="600" y="258" text-anchor="middle" font-size="14" fill="#92400e">looks in BOTH indexes</text>
  <text x="600" y="280" text-anchor="middle" font-size="14" fill="#92400e">picks the highest version</text>

  <line x1="320" y1="205" x2="438" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="880" y1="205" x2="762" y2="235" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
  <text x="780" y="180" font-size="13" fill="#991b1b">1. higher version wins</text>

  <line x1="600" y1="310" x2="600" y2="370" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
  <rect x="440" y="372" width="320" height="70" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="402" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Developer laptop or CI build</text>
  <text x="600" y="424" text-anchor="middle" font-size="13" fill="#991b1b">runs the attacker's install script</text>

  <rect x="40" y="470" width="1120" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="498" font-size="16" font-weight="700" fill="#166534">Controls (any one stops this attack; use several)</text>
  <text x="60" y="524" font-size="14" fill="#166534">1. Route each name to one index (a proxy or repository manager with rules).   2. Reserve the internal prefix or scope, and claim the name publicly.</text>
  <text x="60" y="548" font-size="14" fill="#166534">3. Lock files with hashes, so only the expected file installs.   4. Do not use "extra index" settings that merge indexes without rules.</text>
  <text x="60" y="570" font-size="13" fill="#475569">Reported first by Alex Birsan in February 2021. Details vary by tool: verify your package manager's behaviour.</text>
</svg>
