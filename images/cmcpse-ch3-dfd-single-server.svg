<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">DFD of a single-server MCP architecture</title><desc id="d">A user, an AI host with MCP client, a local stdio MCP server, a file store and a hosted LLM, with trust boundaries.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1000" height="520" fill="#ffffff"/>
<text x="30" y="40" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="start">Single-server MCP architecture (DFD)</text>
<text x="30" y="64" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">Dashed boxes are trust boundaries. Numbers are data flows. Dashed arrows cross a boundary.</text>
<rect x="20" y="90" width="200" height="380" rx="14" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="10 6"/>
<text x="32" y="110" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">Desktop: user</text>
<rect x="250" y="90" width="330" height="380" rx="14" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="10 6"/>
<text x="262" y="110" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">Desktop: host process</text>
<rect x="610" y="90" width="370" height="200" rx="14" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="10 6"/>
<text x="622" y="110" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">Local server process (semi-trusted)</text>
<rect x="610" y="310" width="370" height="160" rx="14" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="10 6"/>
<text x="622" y="330" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">LLM provider (third party)</text>
<rect x="45" y="230" width="150" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="120.0" y="269.0" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Developer</text>
<circle cx="415" cy="250" r="80" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="415" y="246" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">AI host +</text>
<text x="415" y="262" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">MCP client</text>
<circle cx="790" cy="190" r="62" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="790" y="186" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">files server</text>
<text x="790" y="202" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">(stdio)</text>
<line x1="720" y1="250" x2="920" y2="250" stroke="#334155" stroke-width="2.5"/><line x1="720" y1="284" x2="920" y2="284" stroke="#334155" stroke-width="2.5"/>
<rect x="720" y="250" width="200" height="34" fill="#eff6ff" opacity="0.6"/>
