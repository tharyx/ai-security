<text x="593.8" y="337.1" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">6</text>
<text x="30" y="500" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">1 prompts and approvals  2 tools/call  3 tools/list and results  4 file read/write  5 context (prompt + tool defs + results)  6 model output</text>
