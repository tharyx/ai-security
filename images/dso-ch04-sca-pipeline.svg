<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>SCA in the pipeline</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="440" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Software component analysis, step by step</text>
<text x="40" y="76" font-size="15" fill="#475569">Inventory what you use, match it to known vulnerabilities, triage, then gate and fix.</text>
<rect x="40" y="120" width="190" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="135.0" y="154.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Manifests</text>
<text x="135.0" y="174.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">package-lock.json</text>
<text x="135.0" y="194.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">requirements.txt</text>
<text x="135.0" y="214.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">pom.xml</text>
<rect x="270" y="120" width="190" height="120" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="365.0" y="154.0" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Inventory</text>
<text x="365.0" y="174.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">name + version</text>
<text x="365.0" y="194.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">direct and</text>
<text x="365.0" y="214.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">transitive</text>
<line x1="230" y1="180" x2="270" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="120" width="190" height="120" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="595.0" y="154.0" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Match</text>
<text x="595.0" y="174.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">advisory DB:</text>
<text x="595.0" y="194.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">OSV, NVD, GHSA</text>
<text x="595.0" y="214.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">vendor feed</text>
<line x1="460" y1="180" x2="500" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="730" y="120" width="190" height="120" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="825.0" y="154.0" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Triage</text>
<text x="825.0" y="174.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">reachable?</text>
<text x="825.0" y="194.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">dev only?</text>
<text x="825.0" y="214.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">ignore + expiry</text>
<line x1="690" y1="180" x2="730" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="960" y="120" width="190" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="1055.0" y="154.0" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Gate</text>
<text x="1055.0" y="174.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">severity or</text>
<text x="1055.0" y="194.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">CVSS threshold</text>
<text x="1055.0" y="214.0" text-anchor="middle" font-size="14" font-weight="400" fill="#1e293b">break the build</text>
<line x1="920" y1="180" x2="960" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="290" width="530" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="305.0" y="324.5" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">When to run it</text>
<text x="305.0" y="343.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">On every pull request (fast, from the lock file) AND on a schedule,</text>
<text x="305.0" y="362.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">because new CVEs appear after you ship.</text>
<rect x="640" y="290" width="530" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="905.0" y="324.5" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Why it is noisy</text>
<text x="905.0" y="343.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">Matching by NAME gives false positives, transitive paths hide owners,</text>
<text x="905.0" y="362.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1e293b">and most flaws are in code you never call.</text>
</svg>
