<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">DFD of the LLM application with trust boundaries</title>
<desc id="d">Data flow diagram of the chatbot: entities, processes, data stores, numbered flows F1 to F13 and four trust zones.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="740" fill="#ffffff"/>
<text x="40" y="46" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="start">DFD for the LLM application</text>
<text x="40" y="72" font-size="16" font-weight="normal" fill="#475569" text-anchor="start">Same system as the lab file dfd.yaml. Dashed boxes are trust boundaries. Flow ids F1-F13 match the lab.</text>
<rect x="20" y="90" width="220" height="500" rx="14" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="10 6"/>
<text x="32" y="110" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">Internet (untrusted)</text>
<rect x="262" y="90" width="570" height="500" rx="14" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="10 6"/>
<text x="274" y="110" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">Our application network (semi-trusted)</text>
<rect x="852" y="90" width="330" height="190" rx="14" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="10 6"/>
<text x="864" y="110" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">LLM provider (third party)</text>
<rect x="852" y="300" width="330" height="290" rx="14" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="10 6"/>
<text x="864" y="320" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">Data tier (trusted)</text>
<rect x="45" y="160" width="170" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="130.0" y="184" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Customer</text>
<rect x="45" y="470" width="170" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
