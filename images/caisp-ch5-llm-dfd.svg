<text x="430" y="516" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Ingestion</text>
<text x="430" y="532" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">pipeline</text>
<circle cx="1010" cy="190" r="58" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="1010" y="194" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Hosted LLM</text>
