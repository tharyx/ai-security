<text x="430" y="196" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Chat API and</text>
<text x="430" y="212" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">orchestrator</text>
<circle cx="430" cy="380" r="52" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="430" y="384" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Retriever</text>
