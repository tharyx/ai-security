<rect x="770.2" y="439" width="29.6" height="16" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="785" y="451" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">F13</text>
<text x="40" y="626" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">F1 user prompt   F2 model answer   F3 search query   F4 embedding query   F5 retrieved chunks   F6 context chunks   F7 prompt + context</text>
<text x="40" y="644" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">F8 completion or tool call   F9 tool arguments   F10 new ticket   F11 raw documents   F12 chunks + embeddings   F13 conversation record</text>
<text x="40" y="676" font-size="13" font-weight="normal" fill="#7c3aed" text-anchor="start">Boundary crossings worth a close look: F1/F2 (Internet to app), F7/F8 (app to third-party model), F11 (untrusted content into the pipeline),</text>
<text x="40" y="694" font-size="13" font-weight="normal" fill="#7c3aed" text-anchor="start">F6 (retrieved text re-enters the prompt: indirect prompt injection), F9 (model output turns into a tool call).</text>
</svg>
