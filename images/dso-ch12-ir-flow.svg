<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Container incident response: order matters</title><desc>Five-step container incident response flow with a warning not to remove the container first.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1200" height="380" fill="#ffffff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Container incident response: order matters</text><rect x="40" y="110" width="205" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="142.5" y="155.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">1 Preserve</text><text x="142.5" y="174.5" font-size="15" fill="#475569" text-anchor="middle">inspect, top, logs, diff</text><line x1="245" y1="160" x2="268" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="268" y="110" width="205" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="370.5" y="155.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">2 Snapshot</text><text x="370.5" y="174.5" font-size="15" fill="#475569" text-anchor="middle">commit, export</text><line x1="473" y1="160" x2="496" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="496" y="110" width="205" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="598.5" y="155.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">3 Isolate</text><text x="598.5" y="174.5" font-size="15" fill="#475569" text-anchor="middle">pause, network disconnect</text><line x1="701" y1="160" x2="724" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="724" y="110" width="205" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="826.5" y="155.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">4 Collect</text><text x="826.5" y="174.5" font-size="15" fill="#475569" text-anchor="middle">hash, record, host conns</text><line x1="929" y1="160" x2="952" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="952" y="110" width="205" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1054.5" y="155.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">5 Redeploy clean</text><text x="1054.5" y="174.5" font-size="15" fill="#475569" text-anchor="middle">new digest, rotate secrets</text><rect x="40" y="250" width="1120" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="600.0" y="285.3333333333333" font-size="16" fill="#0f172a" text-anchor="middle">Do NOT docker stop or docker rm first: the process list and writable layer are the evidence.</text><text x="40" y="345" font-size="15" fill="#475569" text-anchor="start">Never redeploy the compromised image digest. Find the root cause (image, socket, token) before you declare it fixed.</text></svg>