<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="100%" height="100%" fill="#f8fafc"/><text x="45" y="55" font-family="Arial" font-size="30" font-weight="bold" fill="#0f172a">Secure RAG Architecture</text><text x="45" y="85" font-family="Arial" font-size="16" fill="#475569">Authorization-aware retrieval; vector similarity never substitutes for access control</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect x="40" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="122" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">User</text><path d="M205 273 L222 273" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="230" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="312" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">API + Policy</text><path d="M395 273 L442 273" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="450" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="532" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Authorized Retriever</text><path d="M615 273 L692 273" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="700" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="782" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Vector Store</text><path d="M865 273 L942 273" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="950" y="230" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="1032" y="279" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">LLM</text><path d="M1032 316 L524 420" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="450" y="420" width="165" height="86" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="532" y="469" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#0f172a">Secure Ingestion</text><text x="45" y="585" font-family="Arial" font-size="13" fill="#64748b">Enforce identity, authorization and validation in deterministic services, not prompt instructions alone.</text></svg>