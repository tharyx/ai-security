<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>The model proposes, the policy decides</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<rect width="1200" height="690" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">The model proposes, the policy decides</text>
<text x="40" y="80" font-size="16" fill="#475569">Every proposed tool call passes budgets, schema and an attribute-based policy before anything runs</text>
<rect x="40" y="130" width="160" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="120.0" y="167" font-size="16" font-weight="700" text-anchor="middle" fill="#991b1b">Untrusted doc</text>
<text x="120.0" y="189" font-size="13" text-anchor="middle" fill="#991b1b">CALL_TOOL send_email</text>
<text x="120.0" y="208" font-size="13" text-anchor="middle" fill="#991b1b">to attacker</text>
<rect x="235" y="130" width="170" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
<text x="320.0" y="167" font-size="16" font-weight="700" text-anchor="middle" fill="#334155">Planner (LLM)</text>
<text x="320.0" y="189" font-size="13" text-anchor="middle" fill="#334155">proposes a call</text>
<text x="320.0" y="208" font-size="13" text-anchor="middle" fill="#334155">fooled? assume yes</text>
<rect x="440" y="130" width="170" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="525.0" y="167" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">Budgets + loop</text>
<text x="525.0" y="189" font-size="13" text-anchor="middle" fill="#166534">steps, tool calls,</text>
<text x="525.0" y="208" font-size="13" text-anchor="middle" fill="#166534">cost, time, repeats</text>
<rect x="645" y="130" width="170" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="730.0" y="167" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">Schema check</text>
<text x="730.0" y="189" font-size="13" text-anchor="middle" fill="#166534">typed args,</text>
<text x="730.0" y="208" font-size="13" text-anchor="middle" fill="#166534">no extra fields</text>
<rect x="850" y="110" width="310" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="864" y="159" font-size="16" font-weight="700" fill="#166534">Policy engine (ABAC)</text>
<text x="864" y="181" font-size="13" fill="#166534">R1 unknown tool -&gt; deny</text>
<text x="864" y="200" font-size="13" fill="#166534">R2 not granted to agent -&gt; deny</text>
<text x="864" y="219" font-size="13" fill="#166534">R3 tier 4 (bulk/destructive) -&gt; deny</text>
<text x="864" y="238" font-size="13" fill="#166534">R4 email outside acme -&gt; deny</text>
<text x="864" y="257" font-size="13" fill="#166534">R5 tier 2+ and tainted -&gt; approval</text>
<text x="864" y="276" font-size="13" fill="#166534">R7 granted -&gt; allow; else deny</text>
<polyline points="200,180 235,180" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<polyline points="405,180 440,180" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="610,180 645,180" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="815,180 850,180" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="640" y="380" width="160" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="720.0" y="416" font-size="16" font-weight="700" text-anchor="middle" fill="#991b1b">deny</text>
<text x="720.0" y="438" font-size="13" text-anchor="middle" fill="#991b1b">blocked + logged</text>
<rect x="830" y="380" width="160" height="80" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="910.0" y="416" font-size="15" font-weight="700" text-anchor="middle" fill="#92400e">require approval</text>
<text x="910.0" y="437" font-size="13" text-anchor="middle" fill="#92400e">human decides</text>
<rect x="1020" y="380" width="140" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1090.0" y="416" font-size="16" font-weight="700" text-anchor="middle" fill="#166534">allow</text>
<text x="1090.0" y="438" font-size="13" text-anchor="middle" fill="#166534">run it</text>
<polyline points="900,310 720,380" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>
<polyline points="1005,310 910,380" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="1110,310 1090,380" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="640" y="500" width="380" height="110" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="654" y="532" font-size="16" font-weight="700" fill="#334155">Approval card (exact action)</text>
<text x="654" y="554" font-size="13" fill="#334155">send_email  to = &#x27;finance@acme.example&#x27;</text>
<text x="654" y="574" font-size="13" fill="#334155">body = &#x27;Please pay invoice 7781 today.&#x27;</text>
<text x="654" y="592" font-size="13" fill="#334155">rule R5, tainted session   [y/N]</text>
<polyline points="910,460 870,500" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="1050" y="500" width="110" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1105.0" y="551" font-size="15" font-weight="700" text-anchor="middle" fill="#166534">Execute</text>
<text x="1105.0" y="572" font-size="13" text-anchor="middle" fill="#166534">tool broker</text>
<polyline points="1090,460 1100,500" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<polyline points="1020,555 1050,555" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
<polyline points="1105,610 1105,650 620,650 620,255 320,255 320,230" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#r)"/>
<text x="630" y="674" font-size="13" fill="#991b1b">tool result returns as untrusted data: the session is now tainted</text>
<rect x="40" y="300" width="560" height="160" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="54" y="338" font-size="16" font-weight="700" fill="#334155">Why this order?</text>
<text x="54" y="360" font-size="13" fill="#334155">Cheap, hard checks first: budgets and schema never call a model.</text>
<text x="54" y="380" font-size="13" fill="#334155">The policy sees attributes the model cannot change: agent,</text>
<text x="54" y="398" font-size="13" fill="#334155">tool tier, recipient domain, taint. The rules are code (YAML),</text>
<text x="54" y="418" font-size="13" fill="#334155">versioned and tested. No rule matches -&gt; deny.</text>
<text x="54" y="436" font-size="13" fill="#334155">Approval only for what policy cannot decide alone.</text>
</svg>
