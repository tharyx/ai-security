<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>CSPM, CWPP, CIEM, IaC scanning: one picture</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1200" height="540" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">CSPM, CWPP, CIEM, IaC scanning: one picture</text>
<text x="40" y="80" font-size="16" fill="#475569">CNAPP means a platform that joins these checks, from code to runtime, with one risk view.</text>
<rect x="40" y="150" width="200" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="140.0" y="180.0" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Code and IaC</text>
<text x="140.0" y="200.0" text-anchor="middle" font-size="13" fill="#475569">Terraform, Bicep,</text>
<text x="140.0" y="218.0" text-anchor="middle" font-size="13" fill="#475569">Checkov, Trivy</text>
<rect x="300" y="150" width="200" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="400.0" y="180.0" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Build / registry</text>
<text x="400.0" y="200.0" text-anchor="middle" font-size="13" fill="#475569">image scanning,</text>
<text x="400.0" y="218.0" text-anchor="middle" font-size="13" fill="#475569">SBOM, secrets</text>
<rect x="560" y="150" width="200" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="660.0" y="180.0" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Cloud account</text>
<text x="660.0" y="200.0" text-anchor="middle" font-size="13" fill="#475569">config of every</text>
<text x="660.0" y="218.0" text-anchor="middle" font-size="13" fill="#475569">resource</text>
<rect x="820" y="150" width="200" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="920.0" y="180.0" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Workloads</text>
<text x="920.0" y="200.0" text-anchor="middle" font-size="13" fill="#475569">VMs, containers,</text>
<text x="920.0" y="218.0" text-anchor="middle" font-size="13" fill="#475569">functions</text>
<line x1="240" y1="195" x2="300" y2="195" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="500" y1="195" x2="560" y2="195" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="760" y1="195" x2="820" y2="195" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="40" y="330" width="200" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="140.0" y="364.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">IaC scanning</text>
<text x="140.0" y="384.0" text-anchor="middle" font-size="13" fill="#475569">shift left, block in PR</text>
<rect x="300" y="330" width="200" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="400.0" y="364.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Image / SCA scan</text>
<text x="400.0" y="384.0" text-anchor="middle" font-size="13" fill="#475569">CVEs before deploy</text>
<rect x="560" y="330" width="200" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="660.0" y="355.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">CSPM + CIEM</text>
<text x="660.0" y="375.0" text-anchor="middle" font-size="13" fill="#475569">drift, public data,</text>
<text x="660.0" y="393.0" text-anchor="middle" font-size="13" fill="#475569">excess permissions</text>
<rect x="820" y="330" width="200" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="920.0" y="355.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">CWPP</text>
<text x="920.0" y="375.0" text-anchor="middle" font-size="13" fill="#475569">runtime: agent or</text>
<text x="920.0" y="393.0" text-anchor="middle" font-size="13" fill="#475569">agentless</text>
<line x1="140" y1="240" x2="140" y2="330" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="400" y1="240" x2="400" y2="330" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="660" y1="240" x2="660" y2="330" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="920" y1="240" x2="920" y2="330" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="300" y="455" width="600" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="491.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">CNAPP: one graph of risk (exposed + vulnerable + powerful identity)</text>
</svg>