<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Anatomy of an agent harness: what it wraps around the model</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">Anatomy of an agent harness</text>
  <text x="40" y="74" font-size="16" fill="#475569">The model only turns text into text. The harness is the code that makes it an agent, and it is where security controls live.</text>

  <rect x="40" y="110" width="170" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="125" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">User / trigger</text>
  <text x="125" y="162" text-anchor="middle" font-size="12" fill="#475569">chat, schedule, webhook</text>

  <rect x="250" y="100" width="720" height="470" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="270" y="130" font-size="17" font-weight="700" fill="#92400e">HARNESS (agent runtime): Hermes, OpenClaw gateway, Claude Code, your own loop</text>

  <rect x="275" y="150" width="200" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="375" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Prompt assembly</text>
  <text x="375" y="202" text-anchor="middle" font-size="12" fill="#1e3a8a">system rules, goal, memory,</text>
  <text x="375" y="218" text-anchor="middle" font-size="12" fill="#1e3a8a">tool list, tool results</text>

  <rect x="500" y="150" width="200" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Model client</text>
  <text x="600" y="202" text-anchor="middle" font-size="12" fill="#1e3a8a">provider, retries, parsing</text>
  <text x="600" y="218" text-anchor="middle" font-size="12" fill="#1e3a8a">of tool-call output</text>

  <rect x="725" y="150" width="220" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="835" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Tool registry + MCP client</text>
  <text x="835" y="202" text-anchor="middle" font-size="12" fill="#166534">schemas, built-in tools,</text>
  <text x="835" y="218" text-anchor="middle" font-size="12" fill="#166534">skills, MCP servers</text>

  <rect x="275" y="260" width="200" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="375" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Memory</text>
  <text x="375" y="312" text-anchor="middle" font-size="12" fill="#5b21b6">context window, notes,</text>
  <text x="375" y="328" text-anchor="middle" font-size="12" fill="#5b21b6">vector store, summaries</text>

  <rect x="500" y="260" width="200" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Policy + approval</text>
  <text x="600" y="312" text-anchor="middle" font-size="12" fill="#991b1b">allow / deny / ask a human,</text>
  <text x="600" y="328" text-anchor="middle" font-size="12" fill="#991b1b">argument checks</text>

  <rect x="725" y="260" width="220" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="835" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Loop control + budgets</text>
  <text x="835" y="312" text-anchor="middle" font-size="12" fill="#991b1b">max steps, tokens, time,</text>
  <text x="835" y="328" text-anchor="middle" font-size="12" fill="#991b1b">loop detection, kill switch</text>

  <rect x="275" y="370" width="670" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="610" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Logging and tracing (written outside the model's reach)</text>
  <text x="610" y="422" text-anchor="middle" font-size="12" fill="#475569">every prompt hash, proposed call, decision, result, cost; redact secrets</text>

  <rect x="275" y="470" width="670" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="295" y="498" font-size="14" font-weight="700" fill="#334155">Process and identity around it</text>
  <text x="295" y="520" font-size="12" fill="#475569">OS user, sandbox or container, secrets store, network egress rules, config files, update channel.</text>
  <text x="295" y="538" font-size="12" fill="#475569">A harness with a gateway port and plain-text keys inherits all of these weaknesses.</text>

  <rect x="1010" y="130" width="160" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1090" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">The LLM</text>
  <text x="1090" y="186" text-anchor="middle" font-size="12" fill="#1e3a8a">local (Ollama, llama.cpp)</text>
  <text x="1090" y="204" text-anchor="middle" font-size="12" fill="#1e3a8a">or cloud / routed API</text>

  <rect x="1010" y="300" width="160" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1090" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">MCP servers</text>
  <text x="1090" y="356" text-anchor="middle" font-size="12" fill="#166534">separate processes or</text>
  <text x="1090" y="374" text-anchor="middle" font-size="12" fill="#166534">remote services</text>

  <rect x="1010" y="450" width="160" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1090" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">The world</text>
  <text x="1090" y="506" text-anchor="middle" font-size="12" fill="#991b1b">files, mail, web, APIs,</text>
  <text x="1090" y="524" text-anchor="middle" font-size="12" fill="#991b1b">shell, other agents</text>

  <line x1="210" y1="145" x2="248" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="190" x2="1008" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="945" y1="215" x2="1008" y2="335" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1090" y1="390" x2="1090" y2="448" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <text x="40" y="620" font-size="14" fill="#475569">Rule: the model proposes; the harness decides. Put authorization, limits and logging in the harness, never in the prompt.</text>
</svg>
