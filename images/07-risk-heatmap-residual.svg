<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Risk heat map: inherent versus residual risk after verified controls</title>
  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Inherent risk, residual risk, and what really moves it</text>
  <text x="40" y="76" font-size="16" fill="#475569">Residual risk only drops for controls that exist and are tested. Hard controls move it most.</text>

  <rect x="130" y="120" width="84" height="66" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/>
  <text x="138" y="138" font-size="12" fill="#475569">5</text>
  <rect x="214" y="120" width="84" height="66" fill="#fed7aa" stroke="#ffffff" stroke-width="2"/>
  <text x="222" y="138" font-size="12" fill="#475569">10</text>
  <rect x="298" y="120" width="84" height="66" fill="#fecaca" stroke="#ffffff" stroke-width="2"/>
  <text x="306" y="138" font-size="12" fill="#475569">15</text>
  <rect x="382" y="120" width="84" height="66" fill="#fecaca" stroke="#ffffff" stroke-width="2"/>
  <text x="390" y="138" font-size="12" fill="#475569">20</text>
  <rect x="466" y="120" width="84" height="66" fill="#fecaca" stroke="#ffffff" stroke-width="2"/>
  <text x="474" y="138" font-size="12" fill="#475569">25</text>
  <rect x="130" y="186" width="84" height="66" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="138" y="204" font-size="12" fill="#475569">4</text>
  <rect x="214" y="186" width="84" height="66" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/>
  <text x="222" y="204" font-size="12" fill="#475569">8</text>
  <rect x="298" y="186" width="84" height="66" fill="#fed7aa" stroke="#ffffff" stroke-width="2"/>
  <text x="306" y="204" font-size="12" fill="#475569">12</text>
  <rect x="382" y="186" width="84" height="66" fill="#fecaca" stroke="#ffffff" stroke-width="2"/>
  <text x="390" y="204" font-size="12" fill="#475569">16</text>
  <rect x="466" y="186" width="84" height="66" fill="#fecaca" stroke="#ffffff" stroke-width="2"/>
  <text x="474" y="204" font-size="12" fill="#475569">20</text>
  <rect x="130" y="252" width="84" height="66" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="138" y="270" font-size="12" fill="#475569">3</text>
  <rect x="214" y="252" width="84" height="66" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/>
  <text x="222" y="270" font-size="12" fill="#475569">6</text>
  <rect x="298" y="252" width="84" height="66" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/>
  <text x="306" y="270" font-size="12" fill="#475569">9</text>
  <rect x="382" y="252" width="84" height="66" fill="#fed7aa" stroke="#ffffff" stroke-width="2"/>
  <text x="390" y="270" font-size="12" fill="#475569">12</text>
  <rect x="466" y="252" width="84" height="66" fill="#fecaca" stroke="#ffffff" stroke-width="2"/>
  <text x="474" y="270" font-size="12" fill="#475569">15</text>
  <rect x="130" y="318" width="84" height="66" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="138" y="336" font-size="12" fill="#475569">2</text>
  <rect x="214" y="318" width="84" height="66" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="222" y="336" font-size="12" fill="#475569">4</text>
  <rect x="298" y="318" width="84" height="66" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/>
  <text x="306" y="336" font-size="12" fill="#475569">6</text>
  <rect x="382" y="318" width="84" height="66" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/>
  <text x="390" y="336" font-size="12" fill="#475569">8</text>
  <rect x="466" y="318" width="84" height="66" fill="#fed7aa" stroke="#ffffff" stroke-width="2"/>
  <text x="474" y="336" font-size="12" fill="#475569">10</text>
  <rect x="130" y="384" width="84" height="66" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="138" y="402" font-size="12" fill="#475569">1</text>
  <rect x="214" y="384" width="84" height="66" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="222" y="402" font-size="12" fill="#475569">2</text>
  <rect x="298" y="384" width="84" height="66" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="306" y="402" font-size="12" fill="#475569">3</text>
  <rect x="382" y="384" width="84" height="66" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="390" y="402" font-size="12" fill="#475569">4</text>
  <rect x="466" y="384" width="84" height="66" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/>
  <text x="474" y="402" font-size="12" fill="#475569">5</text>

  <text x="340" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Impact (1 = minor ... 5 = severe)</text>
  <text x="90" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform="rotate(-90 90 285)">Likelihood (1 = rare ... 5 = almost certain)</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="172" y="464">1</text><text x="256" y="464">2</text><text x="340" y="464">3</text><text x="424" y="464">4</text><text x="508" y="464">5</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="end">
    <text x="122" y="157">5</text><text x="122" y="223">4</text><text x="122" y="289">3</text><text x="122" y="355">2</text><text x="122" y="421">1</text>
  </g>

  <!-- R-001: hard controls -->
  <circle cx="508" cy="219" r="13" fill="#dc2626"/>
  <text x="508" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">R1</text>
  <path d="M506 233 C 500 390, 380 420, 274 418" stroke="#16a34a" stroke-width="3" fill="none" stroke-dasharray="8 5" marker-end="url(#g)"/>
  <circle cx="256" cy="417" r="13" fill="#16a34a"/>
  <text x="256" y="422" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">R1</text>

  <!-- R-006: soft control only -->
  <circle cx="424" cy="219" r="13" fill="#dc2626"/>
  <text x="424" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">R6</text>
  <path d="M424 233 L424 270" stroke="#d97706" stroke-width="3" marker-end="url(#o)"/>
  <circle cx="424" cy="285" r="13" fill="#d97706"/>
  <text x="424" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">R6</text>

  <g font-size="12">
    <rect x="130" y="496" width="16" height="16" fill="#fecaca"/><text x="152" y="509" fill="#334155">Critical 15-25</text>
    <rect x="250" y="496" width="16" height="16" fill="#fed7aa"/><text x="272" y="509" fill="#334155">High 10-14</text>
    <rect x="360" y="496" width="16" height="16" fill="#fef3c7"/><text x="382" y="509" fill="#334155">Medium 5-9</text>
    <rect x="470" y="496" width="16" height="16" fill="#dcfce7"/><text x="492" y="509" fill="#334155">Low 1-4</text>
  </g>
  <text x="130" y="540" font-size="13" fill="#475569">R1 = prompt injection sends data out: 20 → 2.4 (two hard + one soft control, all tested)</text>
  <text x="130" y="560" font-size="13" fill="#475569">R6 = jailbreak harmful content: 16 → 12 (one soft control only; still above appetite)</text>

  <!-- explanation panel -->
  <rect x="620" y="110" width="540" height="420" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="640" y="140" font-size="17" font-weight="700" fill="#0f172a">How the lab scores it (teaching weights)</text>
  <text x="640" y="170" font-size="14" fill="#334155">inherent = likelihood x impact</text>
  <text x="640" y="194" font-size="14" fill="#334155">residual = inherent x product of (1 - effect x credit)</text>
  <text x="640" y="230" font-size="14" font-weight="700" fill="#166534">effect: hard 0.60 · process 0.30 · soft 0.25</text>
  <text x="640" y="254" font-size="14" font-weight="700" fill="#1e3a8a">credit: tested 1.0 · implemented 0.5 · planned 0</text>
  <text x="640" y="292" font-size="15" font-weight="700" fill="#0f172a">Rules the register enforces</text>
  <g font-size="13" fill="#334155">
    <text x="640" y="318">• residual above appetite (9): dated plan or valid acceptance</text>
    <text x="640" y="342">• acceptance needs authority: High → CISO or board; Critical → board</text>
    <text x="640" y="366">• acceptance expires; expired = finding (RISK-04)</text>
    <text x="640" y="390">• open treatment past its due date = finding (RISK-02)</text>
    <text x="640" y="414">• every risk has a named owner (RISK-01)</text>
    <text x="640" y="438">• "closed" on a planned control = finding (RISK-05)</text>
  </g>
  <rect x="640" y="458" width="500" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="890" y="481" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">A spreadsheet that marks every risk "Low" once a control</text>
  <text x="890" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">is listed is the most common risk-register failure.</text>
</svg>
