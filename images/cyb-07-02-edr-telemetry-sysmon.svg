<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>What EDR collects, and Sysmon as free telemetry</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1200" height="420" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">What EDR collects, and Sysmon as free telemetry</text>
<text x="40" y="80" font-size="16" fill="#475569">Five kinds of endpoint events, with the Sysmon event IDs you will see in the SIEM</text>
<rect x="40" y="120" width="206" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="143.0" y="151.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Process</text>
<text x="143.0" y="173.0" text-anchor="middle" font-size="13" fill="#475569">who started what</text>
<text x="143.0" y="191.0" text-anchor="middle" font-size="13" fill="#475569">Sysmon 1, 5</text>
<line x1="143" y1="212" x2="143" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="266" y="120" width="206" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="369.0" y="151.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">File</text>
<text x="369.0" y="173.0" text-anchor="middle" font-size="13" fill="#475569">created / changed</text>
<text x="369.0" y="191.0" text-anchor="middle" font-size="13" fill="#475569">Sysmon 11, 23</text>
<line x1="369" y1="212" x2="369" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="492" y="120" width="206" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="595.0" y="151.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Registry</text>
<text x="595.0" y="173.0" text-anchor="middle" font-size="13" fill="#475569">keys and values</text>
<text x="595.0" y="191.0" text-anchor="middle" font-size="13" fill="#475569">Sysmon 12, 13, 14</text>
<line x1="595" y1="212" x2="595" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="718" y="120" width="206" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="821.0" y="151.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Network</text>
<text x="821.0" y="173.0" text-anchor="middle" font-size="13" fill="#475569">connections</text>
<text x="821.0" y="191.0" text-anchor="middle" font-size="13" fill="#475569">Sysmon 3, 22 (DNS)</text>
<line x1="821" y1="212" x2="821" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="944" y="120" width="206" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1047.0" y="151.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Modules / access</text>
<text x="1047.0" y="173.0" text-anchor="middle" font-size="13" fill="#475569">DLL loads, process access</text>
<text x="1047.0" y="191.0" text-anchor="middle" font-size="13" fill="#475569">Sysmon 7, 10</text>
<line x1="1047" y1="212" x2="1047" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="265" width="1120" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="600.0" y="290.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Agent (EDR sensor or Sysmon service) on the endpoint</text>
<text x="600.0" y="312.0" text-anchor="middle" font-size="13" fill="#475569">filters, enriches with process GUID and hashes</text>
<line x1="600" y1="327" x2="600" y2="362" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="365" width="540" height="40" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="310.0" y="389.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">EDR cloud / console</text>
<rect x="620" y="365" width="540" height="40" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="890.0" y="389.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Windows event log -&gt; SIEM (Sentinel, Splunk)</text>
</svg>