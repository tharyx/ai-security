<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Where Linux security events are written</title>
  <defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="450" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="bold" fill="#0f172a">Where Linux security events are written</text>
  <text x="40" y="76" font-size="16" fill="#475569">Same story as Windows: an action, a log, a collector, a SIEM.</text>
  <rect x="40" y="110" width="240" height="180" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="160.0" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Actions</text>
  <text x="160.0" y="156" text-anchor="middle" font-size="13" fill="#475569">ssh login</text>
  <text x="160.0" y="174" text-anchor="middle" font-size="13" fill="#475569">sudo command</text>
  <text x="160.0" y="192" text-anchor="middle" font-size="13" fill="#475569">useradd</text>
  <text x="160.0" y="210" text-anchor="middle" font-size="13" fill="#475569">cron job</text>
  <text x="160.0" y="228" text-anchor="middle" font-size="13" fill="#475569">systemd service</text>
  <rect x="340" y="110" width="270" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="475.0" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Local logs</text>
  <text x="475.0" y="156" text-anchor="middle" font-size="13" fill="#475569">/var/log/auth.log (Debian)</text>
  <text x="475.0" y="174" text-anchor="middle" font-size="13" fill="#475569">/var/log/secure (RHEL)</text>
  <text x="475.0" y="192" text-anchor="middle" font-size="13" fill="#475569">journalctl (systemd)</text>
  <text x="475.0" y="210" text-anchor="middle" font-size="13" fill="#475569">/var/log/audit (auditd)</text>
  <rect x="670" y="110" width="230" height="180" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="785.0" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Forwarder</text>
  <text x="785.0" y="156" text-anchor="middle" font-size="13" fill="#475569">rsyslog</text>
  <text x="785.0" y="174" text-anchor="middle" font-size="13" fill="#475569">Azure Monitor Agent</text>
  <text x="785.0" y="192" text-anchor="middle" font-size="13" fill="#475569">Splunk forwarder</text>
  <rect x="960" y="110" width="200" height="180" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1060.0" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">SIEM</text>
  <text x="1060.0" y="156" text-anchor="middle" font-size="13" fill="#475569">parse, search</text>
  <text x="1060.0" y="174" text-anchor="middle" font-size="13" fill="#475569">detect, alert</text>
  <line x1="282" y1="200" x2="338" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="612" y1="200" x2="668" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="902" y1="200" x2="958" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="40" y="330" text-anchor="start" font-size="14" fill="#475569">A bridge from your DBA life: auth.log is to Linux what the Oracle audit trail is to the database.</text>
  <text x="40" y="354" text-anchor="start" font-size="14" fill="#475569">Attackers who get root often clear logs. Forwarding logs off the host in real time protects the evidence.</text>
</svg>
