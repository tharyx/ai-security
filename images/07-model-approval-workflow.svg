<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Model approval workflow: a request for one pinned model artifact passes eight gates, is recorded in the model registry with an expiry, and the deployment pipeline runs only the exact approved hash</title>
  <rect width="1200" height="580" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Model approval: approve an artifact, not a name</text>
  <text x="40" y="76" font-size="16" fill="#475569">Every new model, version, fine-tune or provider change goes through the same gates (lab: model_approval.py).</text>

  <rect x="40" y="110" width="220" height="200" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="140" font-size="17" font-weight="700" fill="#92400e">Request</text>
  <g font-size="13" fill="#0f172a">
    <text x="60" y="166">model + version</text>
    <text x="60" y="188">artifact SHA-256</text>
    <text x="60" y="210">system ID and tier</text>
    <text x="60" y="232">model card, eval report</text>
    <text x="60" y="254">risk entry, vendor review</text>
    <text x="60" y="276">rollback plan</text>
  </g>

  <path d="M 260 210 L 300 210" stroke="#334155" stroke-width="3"/>
  <path d="M 300 210 L 290 203 L 290 217 Z" fill="#334155"/>

  <rect x="310" y="100" width="560" height="220" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="130" font-size="17" font-weight="700" fill="#166534">Gates (all must pass)</text>
  <g font-size="13" fill="#0f172a">
    <text x="330" y="158">MA-01 pinned: no "latest", valid hash</text>
    <text x="330" y="182">MA-02 model card has 0 validator findings</text>
    <text x="330" y="206">MA-03 evals pass: quality / security / fairness</text>
    <text x="330" y="230">MA-04 high+: owned, accepted risk entry</text>
    <text x="610" y="158">MA-05 vendor assessed &lt; 12 months</text>
    <text x="610" y="182">MA-06 approvers by tier</text>
    <text x="610" y="206">MA-07 requester is not the overseer</text>
    <text x="610" y="230">MA-08 high+: rollback tested</text>
  </g>
  <text x="330" y="266" font-size="13" fill="#166534">Approvers: low = technical owner; medium + security;</text>
  <text x="330" y="288" font-size="13" fill="#166534">high + risk owner; critical + AI governance board. Unknown tier = critical.</text>

  <path d="M 870 210 L 910 210" stroke="#334155" stroke-width="3"/>
  <path d="M 910 210 L 900 203 L 900 217 Z" fill="#334155"/>

  <rect x="920" y="110" width="240" height="200" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="940" y="140" font-size="17" font-weight="700" fill="#0f172a">Model registry</text>
  <g font-size="13" fill="#0f172a">
    <text x="940" y="166">system AI-002</text>
    <text x="940" y="188">cv-summarizer 2.3.0</text>
    <text x="940" y="210">sha256 4f9a...4f30</text>
    <text x="940" y="232">APPROVED by 3 roles</text>
    <text x="940" y="254">valid until (high):</text>
    <text x="940" y="276">+180 days</text>
  </g>

  <path d="M 1040 310 L 1040 360" stroke="#334155" stroke-width="3"/>
  <path d="M 1040 360 L 1033 350 L 1047 350 Z" fill="#334155"/>

  <rect x="620" y="370" width="540" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="640" y="400" font-size="17" font-weight="700" fill="#1e3a8a">Deployment pipeline: can_deploy(system, model, hash)</text>
  <text x="640" y="426" font-size="13" fill="#0f172a">Runs only if the hash matches an unexpired approval for this system.</text>
  <text x="640" y="448" font-size="13" fill="#0f172a">Same name and version but a different file = blocked.</text>

  <rect x="40" y="370" width="540" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="400" font-size="17" font-weight="700" fill="#991b1b">What the naive process approves</text>
  <text x="60" y="426" font-size="13" fill="#0f172a">"Someone said yes in the ticket" + "the name is on the list":</text>
  <text x="60" y="448" font-size="13" fill="#0f172a">self-approval, "latest", no evals, and a silently swapped model.</text>

  <rect x="40" y="482" width="1120" height="76" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="510" font-size="15" font-weight="700" fill="#0f172a">Re-approval triggers</text>
  <text x="60" y="536" font-size="13" fill="#475569">new artifact hash · provider model update · new fine-tune · tier change · approval expiry · major incident · drift alert · retirement (disable endpoints and keys)</text>
</svg>
