<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Backups that survive ransomware</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1200" height="520" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Backups that survive ransomware</text>
<text x="40" y="80" font-size="16" fill="#475569">Ransomware tries to delete or encrypt your backups first. Keep a copy it cannot touch.</text>
<rect x="40" y="190" width="180" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="130.0" y="229.0" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Production DB</text>
<text x="130.0" y="249.0" text-anchor="middle" font-size="13" fill="#475569">data files</text>
<rect x="300" y="190" width="200" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="400.0" y="229.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">RMAN backup</text>
<text x="400.0" y="249.0" text-anchor="middle" font-size="13" fill="#475569">local, encrypted</text>
<rect x="580" y="190" width="200" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="680.0" y="229.0" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Offsite copy</text>
<text x="680.0" y="249.0" text-anchor="middle" font-size="13" fill="#475569">other account / site</text>
<rect x="860" y="190" width="300" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1010.0" y="220.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Immutable copy</text>
<text x="1010.0" y="240.0" text-anchor="middle" font-size="13" fill="#475569">object lock / WORM,</text>
<text x="1010.0" y="258.0" text-anchor="middle" font-size="13" fill="#475569">separate credentials</text>
<line x1="220" y1="235" x2="300" y2="235" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="500" y1="235" x2="580" y2="235" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="780" y1="235" x2="860" y2="235" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="380" y="380" width="440" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="600.0" y="409.0" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Restore test on a schedule</text>
<text x="600.0" y="429.0" text-anchor="middle" font-size="13" fill="#475569">a backup is real only after a restore works</text>
<line x1="960" y1="280" x2="700" y2="380" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="40" y="360" width="240" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="160.0" y="390.0" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Attacker goal</text>
<text x="160.0" y="410.0" text-anchor="middle" font-size="13" fill="#475569">delete backups,</text>
<text x="160.0" y="428.0" text-anchor="middle" font-size="13" fill="#475569">then encrypt data</text>
<line x1="160" y1="360" x2="160" y2="285" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
</svg>