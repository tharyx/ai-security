<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Container monitoring: from events to action</title><desc>Four sources feed a collector, a SIEM and alerts that trigger an incident response playbook.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1200" height="480" fill="#ffffff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Container monitoring: from events to action</text><rect x="40" y="90" width="240" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="120.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Docker events</text><text x="160.0" y="139.5" font-size="15" fill="#475569" text-anchor="middle">start, exec_create, die, oom</text><line x1="280" y1="125" x2="380" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="180" width="240" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="210.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Container logs</text><text x="160.0" y="229.5" font-size="15" fill="#475569" text-anchor="middle">logging driver</text><line x1="280" y1="215" x2="380" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="270" width="240" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="300.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">auditd</text><text x="160.0" y="319.5" font-size="15" fill="#475569" text-anchor="middle">docker files and socket</text><line x1="280" y1="305" x2="380" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="360" width="240" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="390.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Falco / Tracee</text><text x="160.0" y="409.5" font-size="15" fill="#475569" text-anchor="middle">eBPF syscalls</text><line x1="280" y1="395" x2="380" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="380" y="200" width="220" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="490.0" y="245.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Collector</text><text x="490.0" y="264.5" font-size="15" fill="#475569" text-anchor="middle">Wazuh agent, Fluent Bit</text><line x1="600" y1="250" x2="700" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="700" y="200" width="220" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="810.0" y="245.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">SIEM / manager</text><text x="810.0" y="264.5" font-size="15" fill="#475569" text-anchor="middle">rules, levels, correlation</text><line x1="920" y1="250" x2="980" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><rect x="980" y="200" width="190" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1075.0" y="245.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Alert</text><text x="1075.0" y="264.5" font-size="15" fill="#475569" text-anchor="middle">triage, page</text><rect x="380" y="380" width="790" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="775.0" y="415.0" font-size="15" fill="#0f172a" text-anchor="middle">Playbook: preserve, snapshot, isolate, collect, redeploy clean</text><line x1="1075" y1="300" x2="1075" y2="380" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/></svg>