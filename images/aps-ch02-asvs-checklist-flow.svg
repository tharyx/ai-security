<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>From the ASVS catalogue to an app checklist and a CI gate</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="520" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Using OWASP ASVS: catalogue, tailor, verify, gate</text>
<text x="40" y="76" font-size="15" fill="#475569">ASVS 5.0.0 (May 2025) has 17 chapters and three levels. Verify chapter names and requirement IDs at the OWASP ASVS project.</text>

<rect x="40" y="110" width="240" height="250" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="160" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">ASVS catalogue</text>
<text x="56" y="168" font-size="13" fill="#1e293b">V1 Encoding, Sanitization</text>
<text x="56" y="188" font-size="13" fill="#1e293b">V2 Validation, Business Logic</text>
<text x="56" y="208" font-size="13" fill="#1e293b">V3 Web Frontend</text>
<text x="56" y="228" font-size="13" fill="#1e293b">V4 API and Web Service</text>
<text x="56" y="248" font-size="13" fill="#1e293b">V6 Authentication</text>
<text x="56" y="268" font-size="13" fill="#1e293b">V7 Session Management</text>
<text x="56" y="288" font-size="13" fill="#1e293b">V8 Authorization</text>
<text x="56" y="308" font-size="13" fill="#1e293b">... V13 Configuration ...</text>
<text x="56" y="328" font-size="13" fill="#1e293b">V16 Logging, Errors; V17 WebRTC</text>

<rect x="330" y="110" width="240" height="250" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="450" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">Tailor</text>
<text x="346" y="170" font-size="14" fill="#1e293b">Level: L1 baseline,</text>
<text x="346" y="192" font-size="14" fill="#1e293b">L2 most apps with</text>
<text x="346" y="214" font-size="14" fill="#1e293b">sensitive data, L3 critical</text>
<text x="346" y="246" font-size="14" fill="#1e293b">Features: web, API,</text>
<text x="346" y="268" font-size="14" fill="#1e293b">cookies, tokens, OAuth,</text>
<text x="346" y="290" font-size="14" fill="#1e293b">files, passwords</text>
<text x="346" y="322" font-size="13" fill="#475569">drop what does not apply,</text>
<text x="346" y="340" font-size="13" fill="#475569">record why (n/a)</text>

<rect x="620" y="110" width="250" height="250" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="745" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">App checklist</text>
<text x="636" y="172" font-family="Consolas, monospace" font-size="13" fill="#1e293b">APS-V1-S1  [x] pass</text>
<text x="636" y="194" font-family="Consolas, monospace" font-size="13" fill="#1e293b">APS-V6-S2  [ ] FAIL</text>
<text x="636" y="216" font-family="Consolas, monospace" font-size="13" fill="#1e293b">APS-V7-S1  [ ] untested</text>
<text x="636" y="238" font-family="Consolas, monospace" font-size="13" fill="#1e293b">APS-V5-S1  [-] n/a</text>
<text x="636" y="274" font-size="13" fill="#1e293b">stable internal id, mapped</text>
<text x="636" y="294" font-size="13" fill="#1e293b">to the ASVS id in a column;</text>
<text x="636" y="314" font-size="13" fill="#1e293b">survives the next ASVS</text>
<text x="636" y="334" font-size="13" fill="#1e293b">renumbering</text>

<rect x="920" y="110" width="240" height="110" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1040" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">Evidence</text>
<text x="936" y="168" font-size="13" fill="#1e293b">unit and security tests,</text>
<text x="936" y="188" font-size="13" fill="#1e293b">SAST/DAST reports,</text>
<text x="936" y="208" font-size="13" fill="#1e293b">code review notes</text>
<rect x="920" y="250" width="240" height="110" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="1040" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">CI gate</text>
<text x="936" y="308" font-size="13" fill="#1e293b">fail on any FAIL, or on</text>
<text x="936" y="328" font-size="13" fill="#1e293b">an untested L1 item</text>

<line x1="280" y1="235" x2="326" y2="235" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="570" y1="235" x2="616" y2="235" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="870" y1="180" x2="916" y2="170" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="870" y1="290" x2="916" y2="300" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

<rect x="40" y="400" width="1120" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="60" y="430" font-size="15" fill="#1e293b">Three uses of the same list: a DESIGN checklist (requirements before coding), a REVIEW checklist (what a reviewer verifies),</text>
<text x="60" y="454" font-size="15" fill="#1e293b">and a TEST/AUDIT checklist (evidence for each item). Lab: asvs-checklist-generator in chapter 02.</text>
<text x="60" y="478" font-size="13" fill="#475569">The lab uses a small ASVS-5-like sample with paraphrased texts; import the official CSV for real work.</text>
</svg>
