<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Attack surface of the container ecosystem, with the lab that covers each part</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a">Where an attacker can get in: the container ecosystem</text>
  <text x="40" y="70" font-size="15" fill="#475569">Recon asks one question per box: what is here, and what is its security state?</text>

  <rect x="40" y="100" width="340" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="60" y="130" font-size="18" font-weight="700" fill="#9a3412">1. Images and Dockerfiles</text>
  <g font-size="14" fill="#9a3412"><text x="60" y="156">old base, vulnerable packages</text><text x="60" y="176">secrets in layers, ENV</text><text x="60" y="196">backdoored or typosquatted image</text>
  <text x="60" y="228" font-weight="700">Labs: recon-third-party, image-based-attacks</text></g>

  <rect x="430" y="100" width="340" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="450" y="130" font-size="18" font-weight="700" fill="#991b1b">2. Registries</text>
  <g font-size="14" fill="#991b1b"><text x="450" y="156">open catalog, no auth, no RBAC</text><text x="450" y="176">mutable tags, push over a tag</text><text x="450" y="196">secrets in published configs</text>
  <text x="450" y="228" font-weight="700">Lab: registry-attacks</text></g>

  <rect x="820" y="100" width="340" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="840" y="130" font-size="18" font-weight="700" fill="#4c1d95">3. Management tools</text>
  <g font-size="14" fill="#4c1d95"><text x="840" y="156">Portainer-style UI, default creds</text><text x="840" y="176">first-run admin takeover</text><text x="840" y="196">holds the docker.sock</text>
  <text x="840" y="228" font-weight="700">Lab: portainer-attack</text></g>

  <rect x="40" y="300" width="340" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="60" y="330" font-size="18" font-weight="700" fill="#1e3a8a">4. Docker daemon and API</text>
  <g font-size="14" fill="#1e3a8a"><text x="60" y="356">tcp://0.0.0.0:2375, no TLS</text><text x="60" y="376">docker group = root</text><text x="60" y="396">no userns, no limits</text>
  <text x="60" y="428" font-weight="700">Labs: remote-docker-api-scan, daemon-..., privesc</text></g>

  <rect x="430" y="300" width="340" height="150" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="450" y="330" font-size="18" font-weight="700" fill="#065f46">5. Running containers</text>
  <g font-size="14" fill="#065f46"><text x="450" y="356">privileged, host mounts, docker.sock</text><text x="450" y="376">SetUID, shared PID/NET/IPC</text><text x="450" y="396">SYS_ADMIN, SYS_PTRACE, DAC_READ_SEARCH</text>
  <text x="450" y="428" font-weight="700">Labs: container-escapes, deepce-exploitation</text></g>

  <rect x="820" y="300" width="340" height="150" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
  <text x="840" y="330" font-size="18" font-weight="700" fill="#0f172a">6. Host and shared kernel</text>
  <g font-size="14" fill="#0f172a"><text x="840" y="356">kernel CVEs hit every container</text><text x="840" y="376">cloud metadata service (SSRF)</text><text x="840" y="396">flat networks, no resource limits</text>
  <text x="840" y="428" font-weight="700">Labs: daemon-and-kernel, owasp-top10</text></g>

  <g stroke="#334155" stroke-width="2.5" marker-end="url(#a)" fill="none">
    <path d="M380,175 L428,175"/><path d="M770,175 L818,175"/><path d="M210,252 L210,298"/><path d="M600,252 L600,298"/><path d="M380,375 L428,375"/><path d="M770,375 L818,375"/>
  </g>

  <rect x="40" y="490" width="1120" height="76" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="60" y="518" font-size="15" font-weight="700" fill="#713f12">Recon workflow (CCSE 2)</text>
  <text x="60" y="542" font-size="14" fill="#713f12">inventory (ps, inspect, info) -> images and history -> env and volumes -> networks and ports -> registries -> namespaces, cgroups, caps -> score and rank.</text>
</svg>
