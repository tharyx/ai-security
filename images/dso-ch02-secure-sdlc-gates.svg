<text x="40" y="428" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Row labels (top to bottom): phase, security activity, gate, example tools.</text>
<line x1="1160" y1="470" x2="60" y2="470" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="600" y="462" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">feedback loop: incidents and findings become new requirements and tests</text>
<text x="40" y="510" font-size="13" font-weight="400" fill="#475569" text-anchor="start">A gate = a rule that can stop the pipeline. If nothing can stop it, it is a report, not a gate.</text>
