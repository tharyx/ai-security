<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Secure SDLC activities and security gates</title>
<desc>Six SDLC phases, the security activity in each, the pipeline gate, and the tool.</desc>
