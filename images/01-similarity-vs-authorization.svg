<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Similarity is not authorization: filter by identity before ranking</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Similarity is not authorization</text>
  <text x="40" y="80" font-size="16" fill="#475569">A vector search returns what is close in meaning. It does not know who is asking or what they may read.</text>

  <!-- left: vector space sketch -->
  <rect x="40" y="105" width="520" height="305" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="58" y="130" font-size="15" font-weight="700" fill="#334155">Embedding space (2-D sketch)</text>
  <circle cx="260" cy="255" r="95" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="260" y="372" text-anchor="middle" font-size="12" fill="#1e3a8a">nearest neighbours = top-k</text>
  <polygon points="260,241 274,255 260,269 246,255" fill="#2563eb"/>
  <text paint-order="stroke" stroke="#f8fafc" stroke-width="5" x="200" y="250" text-anchor="end" font-size="13" font-weight="700" fill="#1e3a8a">query</text>
  <text paint-order="stroke" stroke="#f8fafc" stroke-width="5" x="200" y="266" text-anchor="end" font-size="12" fill="#1e3a8a">"salary range?"</text>
  <circle cx="305" cy="212" r="9" fill="#dc2626"/>
  <text paint-order="stroke" stroke="#f8fafc" stroke-width="5" x="320" y="208" font-size="12" font-weight="700" fill="#991b1b">salary-bands</text>
  <text paint-order="stroke" stroke="#f8fafc" stroke-width="5" x="320" y="223" font-size="12" fill="#991b1b">HR only</text>
  <circle cx="300" cy="310" r="9" fill="#dc2626"/>
  <text paint-order="stroke" stroke="#f8fafc" stroke-width="5" x="315" y="306" font-size="12" font-weight="700" fill="#991b1b">globex-pricing</text>
  <text paint-order="stroke" stroke="#f8fafc" stroke-width="5" x="315" y="321" font-size="12" fill="#991b1b">other tenant</text>
  <circle cx="100" cy="160" r="9" fill="#64748b"/>
  <text x="115" y="164" font-size="12" fill="#334155">leave-policy</text>
  <circle cx="455" cy="150" r="9" fill="#64748b"/>
  <text x="440" y="178" font-size="12" fill="#334155">password-reset</text>
  <circle cx="480" cy="330" r="9" fill="#dc2626" fill-opacity="0.5"/>
  <text x="470" y="356" font-size="12" fill="#991b1b">poisoned-faq</text>
  <text x="58" y="398" font-size="14" font-weight="700" fill="#0f172a">Close in meaning is not the same as allowed to read.</text>

  <!-- right: naive pipeline -->
  <text x="600" y="128" font-size="15" font-weight="700" fill="#991b1b">Naive: rank first</text>
  <rect x="600" y="140" width="120" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="660" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Query</text>
  <rect x="745" y="140" width="150" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="820" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Rank ALL</text>
  <text x="820" y="184" text-anchor="middle" font-size="12" fill="#334155">every tenant, every doc</text>
  <rect x="920" y="140" width="90" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="965" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Top-k</text>
  <rect x="1035" y="140" width="125" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1097" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">LLM context</text>
  <path d="M720 168 L739 168" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M895 168 L914 168" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1010 168 L1029 168" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="600" y="224" font-size="13" fill="#991b1b">Result: the intern's answer is built from HR-only and other-tenant chunks.</text>

  <!-- right: secure pipeline -->
  <text x="600" y="276" font-size="15" font-weight="700" fill="#166534">Secure: filter first, then rank</text>
  <rect x="600" y="288" width="120" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="660" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Query</text>
  <text x="660" y="331" text-anchor="middle" font-size="12" fill="#92400e">+ verified user</text>
  <rect x="745" y="288" width="150" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="820" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Filter FIRST</text>
  <text x="820" y="331" text-anchor="middle" font-size="12" fill="#166534">tenant · ACL · source</text>
  <rect x="920" y="288" width="90" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="965" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Rank</text>
  <text x="965" y="331" text-anchor="middle" font-size="12" fill="#334155">the rest</text>
  <rect x="1035" y="288" width="125" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1097" y="321" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">LLM context</text>
  <path d="M720 316 L739 316" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M895 316 L914 316" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1010 316 L1029 316" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="600" y="372" font-size="13" fill="#166534">Result: restricted chunks never reach the model, so they cannot leak.</text>

  <!-- rules -->
  <rect x="40" y="435" width="1120" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="464" font-size="14" fill="#0f172a"><tspan font-weight="700">1.</tspan> The user's identity comes from the authenticated session, never from the prompt or the model.</text>
  <text x="60" y="490" font-size="14" fill="#0f172a"><tspan font-weight="700">2.</tspan> Put the filter inside the database query (pre-filter). Filtering after top-k loses results and leaks through scores and counts.</text>
  <text x="60" y="516" font-size="14" fill="#0f172a"><tspan font-weight="700">3.</tspan> Embeddings are sensitive data too: research shows text can be largely rebuilt from its vectors.</text>
</svg>
