<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Multi-agent topologies and delegation chain</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="40" y="48" font-size="28" font-weight="bold" fill="#0f172a">Multi-agent topologies and delegation chain</text>
<text x="40" y="76" font-size="16" fill="#475569">Orchestrator/sub-agent, swarm, and a delegation chain where authority must only shrink</text>
<text x="40" y="112" text-anchor="start" font-size="16" fill="#0f172a" font-weight="bold">Orchestrator / sub-agent (hub and spoke)</text>
<rect x="230" y="130" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="305.0" y="160.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Orchestrator</text>
<rect x="60" y="240" width="130" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="125.0" y="268.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Worker A</text>
<line x1="305" y1="180" x2="125" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="240" y="240" width="130" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="305.0" y="268.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Worker B</text>
<line x1="305" y1="180" x2="305" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="420" y="240" width="130" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="485.0" y="268.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Worker C</text>
<line x1="305" y1="180" x2="485" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="320" text-anchor="start" font-size="13" fill="#475569">One trust point: the orchestrator. Compromise it and every worker follows.</text>
<text x="660" y="112" text-anchor="start" font-size="16" fill="#0f172a" font-weight="bold">Swarm (peer to peer)</text>
<line x1="760" y1="170" x2="920" y2="150" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
<line x1="760" y1="170" x2="1050" y2="230" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
<line x1="760" y1="170" x2="880" y2="290" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
<line x1="760" y1="170" x2="730" y2="270" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
<line x1="920" y1="150" x2="1050" y2="230" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
<line x1="920" y1="150" x2="880" y2="290" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
<line x1="920" y1="150" x2="730" y2="270" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
<line x1="1050" y1="230" x2="880" y2="290" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
<line x1="1050" y1="230" x2="730" y2="270" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
<line x1="880" y1="290" x2="730" y2="270" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
<circle cx="760" cy="170" r="22" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="920" cy="150" r="22" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="1050" cy="230" r="22" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="880" cy="290" r="22" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="730" cy="270" r="22" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="660" y="340" text-anchor="start" font-size="13" fill="#475569">No hub: any peer can message any peer. Bad messages spread.</text>
<text x="40" y="380" text-anchor="start" font-size="16" fill="#0f172a" font-weight="bold">Delegation chain: scope and lifetime shrink at every hop</text>
<rect x="40" y="400" width="200" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="140.0" y="432.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">User</text>
<text x="140.0" y="450.0" text-anchor="middle" font-size="12" fill="#475569">scope: A B C D</text>
<line x1="240" y1="435" x2="330" y2="435" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<text x="285.0" y="425" text-anchor="middle" font-size="12" fill="#16a34a">token exchange</text>
<rect x="330" y="400" width="200" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="430.0" y="432.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Agent 1</text>
<text x="430.0" y="450.0" text-anchor="middle" font-size="12" fill="#475569">scope: A B C</text>
<line x1="530" y1="435" x2="620" y2="435" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<text x="575.0" y="425" text-anchor="middle" font-size="12" fill="#16a34a">token exchange</text>
<rect x="620" y="400" width="200" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="720.0" y="432.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Agent 2</text>
<text x="720.0" y="450.0" text-anchor="middle" font-size="12" fill="#475569">scope: A B</text>
<line x1="820" y1="435" x2="910" y2="435" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<text x="865.0" y="425" text-anchor="middle" font-size="12" fill="#16a34a">token exchange</text>
<rect x="910" y="400" width="200" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="1010.0" y="432.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Agent 3</text>
<text x="1010.0" y="450.0" text-anchor="middle" font-size="12" fill="#475569">scope: A</text>
<text x="40" y="510" text-anchor="start" font-size="13" fill="#475569">Each hop: new audience, narrower scope, shorter expiry, longer act chain. See labs/delegated-token-scoping.</text>
</svg>
