<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Web app testing with an intercepting proxy (Burp-style)</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1200" height="420" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Web app testing with an intercepting proxy (Burp-style)</text>
<text x="40" y="80" font-size="16" fill="#475569">The proxy sits between your browser and the app, so you can see and edit each request.</text>
<rect x="40" y="130" width="220" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="150.0" y="170.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Browser</text>
<text x="150.0" y="192.0" text-anchor="middle" font-size="13" fill="#475569">test account</text>
<rect x="340" y="130" width="260" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="470.0" y="170.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Intercepting proxy</text>
<text x="470.0" y="192.0" text-anchor="middle" font-size="13" fill="#475569">Proxy / Repeater / Intruder</text>
<rect x="680" y="130" width="220" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="790.0" y="170.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Web app</text>
<text x="790.0" y="192.0" text-anchor="middle" font-size="13" fill="#475569">authorised lab target</text>
<rect x="960" y="130" width="200" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1060.0" y="170.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Database</text>
<text x="1060.0" y="192.0" text-anchor="middle" font-size="13" fill="#475569">queries from inputs</text>
<line x1="262" y1="175" x2="338" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="300.0" y="167.0" text-anchor="middle" font-size="12" fill="#475569">request</text>
<line x1="602" y1="175" x2="678" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="640.0" y="167.0" text-anchor="middle" font-size="12" fill="#475569">edited</text>
<line x1="902" y1="175" x2="958" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="270" width="1120" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="600.0" y="311.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">What the tester checks at each input</text>
<text x="600.0" y="333.0" text-anchor="middle" font-size="13" fill="#475569">Injection: is input treated as code? (SQL, command)   XSS: is output encoded?   Access control: can I change the ID in the URL?</text>
<text x="600.0" y="351.0" text-anchor="middle" font-size="13" fill="#475569">Authentication: lockout, error messages, session cookies flags   Misconfiguration: headers, debug pages, default files</text>
</svg>