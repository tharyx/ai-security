# ACME's top AI risks, linked to the control set in controls.yaml. Synthetic data for the lab.
# OWASP IDs use the 2026 LLM Top 10 numbering; ASI = OWASP Top 10 for Agentic Applications;
# MCP = OWASP MCP Top 10 (beta). An empty control list is a design gap, on purpose.
